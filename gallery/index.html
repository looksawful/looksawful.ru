<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>галерея</title>
  <link href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3e%3ccircle cx='16' cy='16' r='14' fill='black'/%3e%3c/svg%3e" rel="icon" />
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
  <link as="style" href="/src/styles/index.css" rel="preload" />
  <link href="/src/styles/index.css" rel="stylesheet" />
  <link as="style" href="/src/styles/modules/asset-gallery.css" rel="preload" />
  <link href="/src/styles/modules/asset-gallery.css" rel="stylesheet" />
  <script src="/src/main.js" type="module"></script>
  <script src="/src/visuals/dom/asset-gallery.js" type="module"></script>
</head>
<body>
<header aria-label="навигация по странице" class="site-header" data-site-header="">
  <div class="site-header__island is-expanded" data-nav-island="">
    <nav aria-label="разделы сайта" class="site-header__chips" data-nav-chips="">
      <span class="site-header__chip-slot"><a class="site-header__chip" data-nav-chip="" data-nav-state="default" href="/">главная</a></span>
      <span class="site-header__chip-slot"><a class="site-header__chip is-active" data-nav-chip="" data-nav-state="active" href="/gallery/">галерея</a></span>
      <span class="site-header__chip-slot"><a class="site-header__chip" data-nav-chip="" data-nav-state="default" href="/resume/">резюме</a></span>
    </nav>
  </div>
</header>
<main class="asset-page" id="gallery">
<div class="asset-page__inner">
<nav aria-label="хлебные крошки" class="asset-crumbs"><a href="/">главная</a><span>галерея</span></nav>
<div class="asset-controls"><section aria-label="фильтр ассетов" class="asset-filter" data-asset-filter="" id="filter">
<div class="asset-filter__groups">
<div class="asset-filter__group" data-filter-row="">
<h3 class="asset-filter__label">проект</h3>
<div aria-label="проект" class="asset-filter__chips" role="group">
<button aria-pressed="true" class="asset-filter__chip" data-filter-group="project" data-filter-value="*" type="button">все</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="project" data-filter-value="jesteipool" type="button">джести пул</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="project" data-filter-value="styx" type="button">стикс</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="project" data-filter-value="shootings" type="button">съёмки</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="project" data-filter-value="pets" type="button">петы</button>
</div>
</div>
<div class="asset-filter__group" data-filter-row="">
<h3 class="asset-filter__label">тип</h3>
<div aria-label="тип" class="asset-filter__chips" role="group">
<button aria-pressed="true" class="asset-filter__chip" data-filter-group="type" data-filter-value="*" type="button">все</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="type" data-filter-value="image" type="button">изображение</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="type" data-filter-value="video" type="button">видео</button>
</div>
</div>
<div class="asset-filter__group" data-filter-row="">
<h3 class="asset-filter__label">категория</h3>
<div aria-label="категория" class="asset-filter__chips" role="group">
<button aria-pressed="true" class="asset-filter__chip" data-filter-group="category" data-filter-value="*" type="button">все</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="category" data-filter-value="photo" type="button">фотография</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="category" data-filter-value="illustration" type="button">иллюстрация</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="category" data-filter-value="ad" type="button">реклама</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="category" data-filter-value="banner" type="button">баннер</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="category" data-filter-value="poster" type="button">плакат</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="category" data-filter-value="social" type="button">пост</button>
</div>
</div>
<div class="asset-filter__group" data-filter-row="">
<h3 class="asset-filter__label">теги</h3>
<div aria-label="теги" class="asset-filter__chips" role="group">
<button aria-pressed="true" class="asset-filter__chip" data-filter-group="tags" data-filter-value="*" type="button">все</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="tags" data-filter-value="ai" type="button">нейросети</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="tags" data-filter-value="3d" type="button">3d-графика</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="tags" data-filter-value="motion" type="button">анимация</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="tags" data-filter-value="color" type="button">цвет</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="tags" data-filter-value="landing" type="button">лендинг</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="tags" data-filter-value="editorial" type="button">редактура</button>
<button aria-pressed="false" class="asset-filter__chip" data-filter-group="tags" data-filter-value="event" type="button">мероприятие</button>
</div>
</div>
<div class="asset-filter__group" data-filter-row="">
<h3 class="asset-filter__label">порядок</h3>
<div aria-label="порядок" class="asset-filter__chips" role="group">
<button aria-pressed="true" class="asset-filter__chip" data-sort-value="default" type="button">по умолчанию</button>
<button aria-pressed="false" class="asset-filter__chip" data-sort-value="video" type="button">сначала видео</button>
<button aria-pressed="false" class="asset-filter__chip" data-sort-value="tall" type="button">сначала вертикали</button>
</div>
</div>
</div>
</section><div class="asset-filter-actions"><button class="button asset-filter__reset" data-filter-reset="" type="button">сбросить</button></div><section aria-label="состояние галереи" class="asset-status"><p class="asset-status__text" data-filter-summary=""></p><div aria-hidden="true" class="asset-status__tags" data-filter-tags=""></div></section></div>

<section aria-label="галерея" id="assets">
<div class="asset-grid" data-asset-grid="" data-asset-manifest="/assets/gallery/manifest.json"></div>
<p class="empty-state" data-empty-state="">под выбранные параметры ничего не найдено. сбрось часть чипов.</p>
</section>
</div>
</main>
</body>
</html>
