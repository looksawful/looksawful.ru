name: Nightly Full E2E Verify Once

on:
  push:
    branches:
      - agent/nightly-quality-fix-v2-20260905
    paths:
      - '.github/workflows/nightly-full-e2e-verify-once.yml'

permissions:
  contents: read

concurrency:
  group: nightly-full-e2e-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      fingerprint: ${{ steps.media.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Rebuild and validate generated media once
        run: |
          npm run media:sync
          node tools/media-dev-state.mjs --cache-verify
          git diff --exit-code
      - name: Save exact nightly generated media cache
        uses: actions/cache/save@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}

  full-e2e:
    needs: prepare-media
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Restore exact prepared media
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ needs.prepare-media.outputs.fingerprint }}
          fail-on-cache-miss: true
      - name: Verify prepared generated media
        run: node tools/media-dev-state.mjs --cache-verify
      - run: npm run typecheck
      - name: Hide temporary workflow from canonical workflow-set contract
        run: rm .github/workflows/nightly-full-e2e-verify-once.yml
      - run: npm run test:core
      - run: npm run media:dedupe:check
      - run: npm run build:site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full browser regression
        run: npm run test:e2e:full
