name: Agent Verify

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string
      suite:
        description: Finite verification profile
        required: true
        type: choice
        default: fast
        options:
          - fast
          - browser-smoke
          - responsive
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve finite verification request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.target_sha }}
          MANUAL_SUITE: ${{ inputs.suite }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            target_sha="$MANUAL_SHA"
            suite="$MANUAL_SUITE"
          elif [[ "$COMMENT_BODY" =~ ^/verify[[:space:]]+(fast|browser-smoke|responsive)[[:space:]]+([0-9a-fA-F]{40})$ ]]; then
            suite="${BASH_REMATCH[1]}"
            target_sha="${BASH_REMATCH[2]}"
          else
            echo "Expected: /verify <fast|browser-smoke|responsive> <40-char SHA>" >&2
            exit 1
          fi

          if [[ ! "$target_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be an exact 40-character commit SHA" >&2
            exit 1
          fi

          printf 'target_sha=%s\n' "${target_sha,,}" >> "$GITHUB_OUTPUT"
          printf 'suite=%s\n' "$suite" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out SHA
        shell: bash
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$TARGET_SHA" ]]; then
            echo "Expected $TARGET_SHA but checked out $actual" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report toolchain
        run: npm run toolchain:doctor -- --json

      - name: Fast verification
        if: ${{ steps.request.outputs.suite == 'fast' }}
        run: |
          npm run typecheck
          npm run test:fast
          npm run build:vite

      - name: Build browser target
        if: ${{ steps.request.outputs.suite == 'browser-smoke' || steps.request.outputs.suite == 'responsive' }}
        run: npm run build:vite

      - name: Setup pinned headless browser
        if: ${{ steps.request.outputs.suite != 'fast' }}
        uses: ./.github/actions/setup-browser

      - name: Browser smoke
        if: ${{ steps.request.outputs.suite == 'browser-smoke' }}
        run: npm run test:e2e:smoke

      - name: Responsive UI
        if: ${{ steps.request.outputs.suite == 'responsive' }}
        run: npm run test:ui:responsive
