name: tmp-css-462-before-after-executor

on:
  push:
    branches: [refactor/css-462-before-after-owner]

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply exact Wave6A ownership move
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const componentsPath = 'src/styles/components.css';
          const ownerPath = 'src/styles/before-after.css';
          const indexPath = 'src/styles/index.css';
          const startMarker = `/* ==================================================\n   Before / after\n   ================================================== */`;
          const endMarker = `/* ==================================================\n   Device mockups\n   ================================================== */`;
          const componentsImport = '@import "./components.css" layer(components);';
          const ownerImport = '@import "./before-after.css" layer(components);';

          if (fs.existsSync(ownerPath)) throw new Error('before-after.css already exists');

          let components = fs.readFileSync(componentsPath, 'utf8');
          const start = components.indexOf(startMarker);
          const end = components.indexOf(endMarker);
          if (start < 0 || end <= start) throw new Error('Wave6A markers missing or out of order');
          if (components.indexOf(startMarker, start + 1) !== -1) throw new Error('duplicate start marker');
          if (components.indexOf(endMarker, end + 1) !== -1) throw new Error('duplicate end marker');

          const owner = components.slice(start, end).trimEnd() + '\n';
          components = components.slice(0, start) + components.slice(end);
          fs.writeFileSync(ownerPath, owner);
          fs.writeFileSync(componentsPath, components);

          let index = fs.readFileSync(indexPath, 'utf8');
          if (index.includes(ownerImport)) throw new Error('before-after import already present');
          const matches = index.split(componentsImport).length - 1;
          if (matches !== 1) throw new Error(`components import count=${matches}`);
          index = index.replace(componentsImport, `${componentsImport}\n${ownerImport}`);
          fs.writeFileSync(indexPath, index);
          NODE

          node --test test/css-refactor-wave6a-before-after.test.mjs
          git diff --check

      - name: Commit durable product tree and remove executor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-css-462-before-after-executor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/components.css src/styles/before-after.css src/styles/index.css .github/workflows/tmp-css-462-before-after-executor.yml
          git commit -m 'refactor(css): extract Wave6A before-after owner'
          git push origin HEAD:refactor/css-462-before-after-owner
