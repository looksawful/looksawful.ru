name: Remove Sensetique watermarks

on:
  push:
    branches:
      - prod
    paths:
      - tools/remove-sensetique-watermarks.mjs
      - .github/workflows/remove-sensetique-watermarks.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prod
        uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove Sensetique watermarks
        run: node tools/remove-sensetique-watermarks.mjs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/components/sensetique-case/sensetique-case.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Remove Sensetique background watermarks"
          git push origin prod
