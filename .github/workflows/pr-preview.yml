name: PR Preview

on:
  pull_request:
    branches: [dev, prod]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact repository commit SHA to preview
        required: true
        type: string
      preview_number:
        description: Numeric PR/release identifier used for the preview alias and comment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.preview_number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT: looksawful-ru-preview

jobs:
  build:
    name: Build exact preview artifact
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      target_sha: ${{ steps.meta.outputs.target_sha }}
      preview_number: ${{ steps.meta.outputs.preview_number }}
      qa_ref: ${{ steps.meta.outputs.qa_ref }}
    env:
      PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.preview_number }}
      PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.target_sha }}
      QA_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Validate exact preview identity
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Preview number must be numeric." >&2; exit 1; }
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Preview target must be an exact 40-character commit SHA." >&2; exit 1; }
          [[ "$QA_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "QA harness ref must be an exact trusted 40-character commit SHA." >&2; exit 1; }
          printf 'target_sha=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'preview_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'qa_ref=%s\n' "$QA_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout exact preview target SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore exact generated media cache
        id: media-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}

      - name: Install media tooling on exact cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Regenerate exact media cache on miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: npm run media:sync

      - name: Write canonical generated-media cache marker on miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: node tools/media-dev-state.mjs --cache-write

      - name: Verify exact generated media cache
        run: node tools/media-dev-state.mjs --cache-verify

      - name: Require clean tracked tree after cache recovery
        if: steps.media-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code --; then
            echo "Preview media cache recovery changed tracked repository state." >&2
            exit 1
          fi

      - name: Save exact generated media cache on miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}

      - name: Typecheck
        run: npm run typecheck

      - name: Fast tests
        run: npm run test:fast

      - name: Preview Access contract
        run: node --test test/pr-preview-access-contract.test.mjs

      - name: Build preview without production analytics
        run: npm run build:site

      - name: Stamp exact preview identity
        shell: bash
        run: |
          printf 'commit=%s\n' "$PR_HEAD_SHA" > dist/preview-version.txt
          printf 'pull_request=%s\n' "$PR_NUMBER" >> dist/preview-version.txt
          printf 'source=cloudflare-pr-preview\n' >> dist/preview-version.txt

      - name: Ensure ffmpeg for generated preview-video surrogates
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Prepare Cloudflare-compatible preview media without deleting sources
        run: node tools/preview/prepare-cloudflare-pages.mjs dist

      - name: Enforce Cloudflare Pages asset limits after preview packaging
        shell: bash
        run: |
          set -euo pipefail
          file_count="$(find dist -type f | wc -l | tr -d ' ')"
          largest="$(find dist -type f -printf '%s %p\n' | sort -nr | sed -n '1p')"
          {
            echo "### Cloudflare Pages preflight"
            echo "- files: ${file_count} / 20000"
            echo "- largest: ${largest:-none}"
            echo "- oversized tracked sources: kept in Git and exposed through exact-SHA redirects"
            echo "- oversized generated web video: preview-only surrogate, source untouched"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( file_count > 20000 )); then
            echo "Preview has ${file_count} files; Cloudflare Pages Direct Upload supports at most 20,000 files." >&2
            exit 1
          fi

          oversized="$(find dist -type f -size +26214400c -print)"
          if [[ -n "$oversized" ]]; then
            echo "Preview packaging left files larger than 25 MiB:" >&2
            printf '%s\n' "$oversized" >&2
            exit 1
          fi

      - name: Upload exact preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-preview-${{ env.PR_NUMBER }}-${{ env.PR_HEAD_SHA }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy private Cloudflare preview
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      preview_url: ${{ steps.deploy.outputs.deployment-url }}
      preview_alias_url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    env:
      PR_NUMBER: ${{ needs.build.outputs.preview_number }}
      PR_HEAD_SHA: ${{ needs.build.outputs.target_sha }}
    steps:
      - name: Require Cloudflare preview credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN" >&2; exit 1; }

      - name: Require Cloudflare Access service credentials
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCESS_CLIENT_ID:-}" || { echo "Missing GitHub Actions secret: CF_ACCESS_CLIENT_ID" >&2; exit 1; }
          test -n "${CF_ACCESS_CLIENT_SECRET:-}" || { echo "Missing GitHub Actions secret: CF_ACCESS_CLIENT_SECRET" >&2; exit 1; }

      - name: Download exact preview artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-preview-${{ env.PR_NUMBER }}-${{ env.PR_HEAD_SHA }}
          path: dist

      - name: Verify artifact identity before Cloudflare access
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq "commit=$PR_HEAD_SHA" dist/preview-version.txt
          grep -Fxq "pull_request=$PR_NUMBER" dist/preview-version.txt

      - name: Require existing Cloudflare Pages preview project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}"
          status="$(curl --silent --show-error --output /tmp/cf-pages-project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$api")"
          if [[ "$status" != "200" ]]; then
            echo "Protected Cloudflare Pages preview project must already exist; lookup returned HTTP ${status}." >&2
            jq '{success, errors}' /tmp/cf-pages-project.json >&2 || true
            exit 1
          fi
          jq -e '.success == true' /tmp/cf-pages-project.json >/dev/null

      - name: Verify shared preview Access before deploy
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          probe="https://lab.looksawful-ru-preview.pages.dev/lab/"
          status="$(curl --silent --show-error --max-redirs 0 \
            --dump-header /tmp/preview-access-anon.txt --output /dev/null --write-out '%{http_code}' "$probe")"
          case "$status" in
            401|403) ;;
            301|302|303|307|308)
              grep -Eqi '^location:[[:space:]]*https://[^/]+\.cloudflareaccess\.com/cdn-cgi/access/' /tmp/preview-access-anon.txt || {
                echo "Preview is redirecting, but not to Cloudflare Access." >&2
                exit 1
              }
              ;;
            *)
              echo "Refusing to publish: anonymous preview probe returned HTTP $status instead of an Access challenge." >&2
              exit 1
              ;;
          esac
          curl --fail --silent --show-error --location \
            --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            --output /tmp/preview-access-auth.html "$probe"
          grep -qi '<title>looksawful lab</title>' /tmp/preview-access-auth.html

      - name: Deploy exact artifact to Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=looksawful-ru-preview --branch=pr-${{ env.PR_NUMBER }}

      - name: Verify Access-protected immutable deployment identity and noindex
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL"
          case "$PREVIEW_URL" in
            https://*) ;;
            *) echo "Unexpected immutable Cloudflare deployment URL: $PREVIEW_URL" >&2; exit 1 ;;
          esac

          anonymous_status="$(curl --silent --show-error --max-redirs 0 \
            --dump-header /tmp/preview-anon-headers.txt --output /dev/null --write-out '%{http_code}' \
            "$PREVIEW_URL/preview-version.txt?sha=$PR_HEAD_SHA")"
          case "$anonymous_status" in
            401|403) ;;
            301|302|303|307|308)
              grep -Eqi '^location:[[:space:]]*https://[^/]+\.cloudflareaccess\.com/cdn-cgi/access/' /tmp/preview-anon-headers.txt
              ;;
            *) echo "Anonymous immutable preview is public (HTTP $anonymous_status)." >&2; exit 1 ;;
          esac

          access_headers=(
            --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
            --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
          )
          curl --fail --silent --show-error --location \
            "${access_headers[@]}" --retry 10 --retry-delay 3 --retry-all-errors \
            "$PREVIEW_URL/preview-version.txt?sha=$PR_HEAD_SHA" > /tmp/preview-version.txt
          grep -Fxq "commit=$PR_HEAD_SHA" /tmp/preview-version.txt
          grep -Fxq "pull_request=$PR_NUMBER" /tmp/preview-version.txt

          curl --fail --silent --show-error --location \
            "${access_headers[@]}" --retry 10 --retry-delay 3 --retry-all-errors \
            --dump-header /tmp/preview-headers.txt --output /dev/null "$PREVIEW_URL/?sha=$PR_HEAD_SHA"
          grep -Eqi '^x-robots-tag:[[:space:]]*noindex' /tmp/preview-headers.txt

      - name: Verify oversized preview media routes remain reachable
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const manifest = JSON.parse(await readFile("dist/preview-media-manifest.json", "utf8"));
          const base = new URL(process.env.PREVIEW_URL);
          const accessHeaders = {
            "CF-Access-Client-Id": process.env.CF_ACCESS_CLIENT_ID,
            "CF-Access-Client-Secret": process.env.CF_ACCESS_CLIENT_SECRET,
          };

          async function reachable(initialUrl) {
            let current = initialUrl;
            for (let redirect = 0; redirect < 8; redirect += 1) {
              const samePreviewOrigin = current.origin === base.origin;
              const response = await fetch(current, {
                method: "HEAD",
                redirect: "manual",
                headers: samePreviewOrigin ? accessHeaders : {},
              });
              if ([301, 302, 303, 307, 308].includes(response.status)) {
                const location = response.headers.get("location");
                if (!location) throw new Error(`redirect ${response.status} without Location`);
                current = new URL(location, current);
                continue;
              }
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              return;
            }
            throw new Error("too many redirects");
          }

          for (const record of manifest.records) {
            const encodedPath = record.path.split("/").map(encodeURIComponent).join("/");
            const url = new URL(encodedPath, `${base.origin}/`);
            let lastError;
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              try {
                await reachable(url);
                console.log(`[preview-media] reachable: ${record.path} (${record.handling})`);
                lastError = undefined;
                break;
              } catch (error) {
                lastError = error;
              }
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }
            if (lastError) {
              throw new Error(`oversized preview media route failed: ${record.path}: ${lastError.message}`);
            }
          }
          NODE

      - name: Wait for protected human preview alias to converge
        env:
          PREVIEW_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -uo pipefail
          if [[ -z "${PREVIEW_ALIAS_URL:-}" ]]; then
            echo "::warning::Cloudflare did not return a preview alias URL. Immutable deployment remains verified."
            exit 0
          fi

          for attempt in {1..20}; do
            if curl --fail --silent --show-error --location \
              --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
              "$PREVIEW_ALIAS_URL/preview-version.txt?sha=$PR_HEAD_SHA" > /tmp/preview-alias-version.txt 2>/dev/null \
              && grep -Fxq "commit=$PR_HEAD_SHA" /tmp/preview-alias-version.txt; then
              echo "Protected preview alias now serves exact SHA $PR_HEAD_SHA."
              exit 0
            fi
            sleep 3
          done

          echo "::warning::Cloudflare branch alias has not converged yet. Exact protected immutable deployment is already verified and remains the CI source of truth."

  remote-qa:
    name: Remote browser QA through Access
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ needs.build.outputs.preview_number }}
      PR_HEAD_SHA: ${{ needs.build.outputs.target_sha }}
      QA_REF: ${{ needs.build.outputs.qa_ref }}
      PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
      PREVIEW_ALIAS_URL: ${{ needs.deploy.outputs.preview_alias_url }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout trusted base QA harness, never candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QA_REF }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install trusted QA dependencies
        run: npm ci

      - name: Install Chromium for remote preview QA
        run: npx playwright install --with-deps chromium

      - name: Run trusted browser smoke against Access-protected immutable deployment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import { runProductionE2E } from "./tools/e2e/run-production.mjs";

          const rawBaseUrl = process.env.PREVIEW_URL?.trim() ?? "";
          if (!rawBaseUrl) throw new Error("PREVIEW_URL is required.");
          const url = new URL(rawBaseUrl);
          if (url.protocol !== "https:") throw new Error(`Remote preview must use HTTPS: ${url.href}`);

          const accessHeaders = {
            "CF-Access-Client-Id": process.env.CF_ACCESS_CLIENT_ID,
            "CF-Access-Client-Secret": process.env.CF_ACCESS_CLIENT_SECRET,
          };

          async function addAccessRoute(target) {
            await target.route("**/*", async (route) => {
              const request = route.request();
              let samePreviewOrigin = false;
              try {
                samePreviewOrigin = new URL(request.url()).origin === url.origin;
              } catch {
                samePreviewOrigin = false;
              }
              await route.continue({
                headers: samePreviewOrigin
                  ? { ...request.headers(), ...accessHeaders }
                  : request.headers(),
              });
            });
            return target;
          }

          function wrapBrowserWithAccess(browser) {
            return new Proxy(browser, {
              get(target, property) {
                if (property === "newPage") {
                  return async (options) => addAccessRoute(await target.newPage(options));
                }
                if (property === "newContext") {
                  return async (options) => addAccessRoute(await target.newContext(options));
                }
                const value = Reflect.get(target, property, target);
                return typeof value === "function" ? value.bind(target) : value;
              },
            });
          }

          const rawBrowser = await chromium.launch({ headless: true });
          const browser = wrapBrowserWithAccess(rawBrowser);
          try {
            await runProductionE2E({ browser, baseUrl: url.origin });
          } finally {
            await rawBrowser.close();
          }
          NODE

      - name: Publish preview URLs in job summary
        shell: bash
        run: |
          {
            echo "### Verified private browser preview"
            echo "- exact SHA: \`$PR_HEAD_SHA\`"
            echo "- stable human preview: ${PREVIEW_ALIAS_URL:-not available yet}"
            echo "- verified immutable deployment: $PREVIEW_URL"
            echo "- access: Cloudflare Access required"
            echo "- release gate: manual visual approval is still required before merge/deploy"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish verified preview URL in PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          PREVIEW_SHA: ${{ env.PR_HEAD_SHA }}
        with:
          script: |
            const marker = '<!-- looksawful-cloudflare-pr-preview -->';
            const immutableUrl = process.env.PREVIEW_URL;
            const aliasUrl = process.env.PREVIEW_ALIAS_URL || immutableUrl;
            const sha = process.env.PREVIEW_SHA;
            const issueNumber = Number(process.env.PREVIEW_PR_NUMBER);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.setFailed('Invalid preview PR number.');
              return;
            }
            const body = `${marker}\n## Private browser preview\n\n✅ Published exact target \`${sha}\`\n✅ Anonymous access denied by Cloudflare Access\n✅ Authenticated immutable identity/noindex check passed\n✅ Oversized preview media routes verified without leaking Access credentials to external origins\n✅ Trusted Playwright browser smoke passed against the Access-protected immutable deployment\n\n**Preview:** ${aliasUrl}\n\nVerified immutable deployment: ${immutableUrl}\n\nProduction \`looksawful.ru\` was not changed.\n\n**Release rule:** this preview is evidence only. Merge/deploy still requires explicit manual visual approval.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
