name: PR Preview

on:
  pull_request:
    branches: [dev, prod]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact repository commit SHA to preview
        required: true
        type: string
      preview_number:
        description: Numeric PR/release identifier used for the preview alias and comment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.preview_number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT: looksawful-ru-preview

jobs:
  build:
    name: Build exact preview artifact
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      target_sha: ${{ steps.meta.outputs.target_sha }}
      preview_number: ${{ steps.meta.outputs.preview_number }}
    env:
      PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.preview_number }}
      PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.target_sha }}
    steps:
      - name: Validate exact preview identity
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Preview number must be numeric." >&2; exit 1; }
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Preview target must be an exact 40-character commit SHA." >&2; exit 1; }
          printf 'target_sha=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'preview_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout exact preview target SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore exact generated media cache
        id: media-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}

      - name: Install media tooling on exact cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Regenerate exact media cache on miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: npm run media:sync

      - name: Write canonical generated-media cache marker on miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: node tools/media-dev-state.mjs --cache-write

      - name: Verify exact generated media cache
        run: node tools/media-dev-state.mjs --cache-verify

      - name: Require clean tracked tree after cache recovery
        if: steps.media-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code --; then
            echo "Preview media cache recovery changed tracked repository state." >&2
            exit 1
          fi

      - name: Save exact generated media cache on miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}

      - name: Typecheck
        run: npm run typecheck

      - name: Fast tests
        run: npm run test:fast

      - name: Build preview without production analytics
        run: npm run build:site

      - name: Stamp exact preview identity
        shell: bash
        run: |
          printf 'commit=%s\n' "$PR_HEAD_SHA" > dist/preview-version.txt
          printf 'pull_request=%s\n' "$PR_NUMBER" >> dist/preview-version.txt
          printf 'source=cloudflare-pr-preview\n' >> dist/preview-version.txt

      - name: Enforce Cloudflare Pages asset limits before upload
        shell: bash
        run: |
          set -euo pipefail
          file_count="$(find dist -type f | wc -l | tr -d ' ')"
          largest="$(find dist -type f -printf '%s %p\n' | sort -nr | head -n 1 || true)"
          {
            echo "### Cloudflare Pages preflight"
            echo "- files: ${file_count} / 20000"
            echo "- largest: ${largest:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( file_count > 20000 )); then
            echo "Preview has ${file_count} files; Cloudflare Pages Direct Upload supports at most 20,000 files." >&2
            exit 1
          fi

          oversized="$(find dist -type f -size +26214400c -print)"
          if [[ -n "$oversized" ]]; then
            echo "Cloudflare Pages cannot upload files larger than 25 MiB:" >&2
            printf '%s\n' "$oversized" >&2
            exit 1
          fi

      - name: Upload exact preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-preview-${{ env.PR_NUMBER }}-${{ env.PR_HEAD_SHA }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy isolated Cloudflare preview
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      preview_url: ${{ steps.deploy.outputs.deployment-url }}
      preview_alias_url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    env:
      PR_NUMBER: ${{ needs.build.outputs.preview_number }}
      PR_HEAD_SHA: ${{ needs.build.outputs.target_sha }}
    steps:
      - name: Require Cloudflare preview credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN" >&2; exit 1; }

      - name: Download exact preview artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-preview-${{ env.PR_NUMBER }}-${{ env.PR_HEAD_SHA }}
          path: dist

      - name: Verify artifact identity before Cloudflare access
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq "commit=$PR_HEAD_SHA" dist/preview-version.txt
          grep -Fxq "pull_request=$PR_NUMBER" dist/preview-version.txt

      - name: Ensure isolated Cloudflare Pages preview project exists
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}"
          status="$(curl --silent --show-error --output /tmp/cf-pages-project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$api")"

          if [[ "$status" == "200" ]]; then
            jq -e '.success == true' /tmp/cf-pages-project.json >/dev/null
            exit 0
          fi

          if [[ "$status" != "404" ]]; then
            echo "Cloudflare Pages project lookup failed with HTTP ${status}." >&2
            jq '{success, errors}' /tmp/cf-pages-project.json >&2 || true
            exit 1
          fi

          payload="$(jq -n \
            --arg name "$CLOUDFLARE_PAGES_PROJECT" \
            '{name: $name, production_branch: "prod"}')"
          create_status="$(curl --silent --show-error --output /tmp/cf-pages-create.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")"

          if [[ "$create_status" != "200" ]]; then
            echo "Cloudflare Pages project creation failed with HTTP ${create_status}." >&2
            jq '{success, errors}' /tmp/cf-pages-create.json >&2 || true
            exit 1
          fi
          jq -e '.success == true' /tmp/cf-pages-create.json >/dev/null

      - name: Deploy exact artifact to Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=looksawful-ru-preview --branch=pr-${{ env.PR_NUMBER }}

      - name: Verify published preview identity and noindex
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL"
          case "$PREVIEW_URL" in
            https://*) ;;
            *) echo "Unexpected Cloudflare deployment URL: $PREVIEW_URL" >&2; exit 1 ;;
          esac

          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            "$PREVIEW_URL/preview-version.txt?sha=$PR_HEAD_SHA" > /tmp/preview-version.txt
          grep -Fxq "commit=$PR_HEAD_SHA" /tmp/preview-version.txt
          grep -Fxq "pull_request=$PR_NUMBER" /tmp/preview-version.txt

          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            --dump-header /tmp/preview-headers.txt --output /dev/null "$PREVIEW_URL/?sha=$PR_HEAD_SHA"
          grep -Eqi '^x-robots-tag:[[:space:]]*noindex' /tmp/preview-headers.txt

  remote-qa:
    name: Remote browser QA
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      PR_NUMBER: ${{ needs.build.outputs.preview_number }}
      PR_HEAD_SHA: ${{ needs.build.outputs.target_sha }}
      PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
      PREVIEW_ALIAS_URL: ${{ needs.deploy.outputs.preview_alias_url }}
    steps:
      - name: Checkout exact preview target SHA without Cloudflare credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for remote preview QA
        run: npx playwright install --with-deps chromium

      - name: Run candidate browser smoke against published internet preview
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import { runProductionE2E } from "./tools/e2e/run-production.mjs";

          const rawBaseUrl = process.env.PREVIEW_URL?.trim() ?? "";
          if (!rawBaseUrl) throw new Error("PREVIEW_URL is required.");
          const url = new URL(rawBaseUrl);
          if (url.protocol !== "https:") throw new Error(`Remote preview must use HTTPS: ${url.href}`);

          const browser = await chromium.launch({ headless: true });
          try {
            await runProductionE2E({ browser, baseUrl: url.origin });
          } finally {
            await browser.close();
          }
          NODE

      - name: Publish verified preview URL in PR
        uses: actions/github-script@v9
        env:
          PREVIEW_PR_NUMBER: ${{ env.PR_NUMBER }}
          PREVIEW_SHA: ${{ env.PR_HEAD_SHA }}
        with:
          script: |
            const marker = '<!-- looksawful-cloudflare-pr-preview -->';
            const immutableUrl = process.env.PREVIEW_URL;
            const aliasUrl = process.env.PREVIEW_ALIAS_URL || immutableUrl;
            const sha = process.env.PREVIEW_SHA;
            const issueNumber = Number(process.env.PREVIEW_PR_NUMBER);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.setFailed('Invalid preview PR number.');
              return;
            }
            const body = `${marker}\n## Browser preview\n\n✅ Published exact target \`${sha}\`\n✅ Remote HTTP identity/noindex check passed\n✅ Playwright browser smoke passed against the public internet deployment\n\n**Preview:** ${aliasUrl}\n\nImmutable deployment: ${immutableUrl}\n\nProduction \`looksawful.ru\` was not changed.\n\n**Release rule:** this preview is evidence only. Merge/deploy still requires explicit manual visual approval.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
