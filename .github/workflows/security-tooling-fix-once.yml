name: Security tooling fix once

on:
  push:
    branches:
      - fix/security-tooling-cleanup-20260905
    paths:
      - '.github/workflows/security-tooling-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/security-tooling-cleanup-20260905
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Show vulnerable dev dependency ancestry
        run: npm ls extract-zip tmp uuid || true

      - name: Apply narrow CodeQL fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function edit(path, transform) {
            const before = fs.readFileSync(path, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`No change made to ${path}`);
            fs.writeFileSync(path, after);
          }

          edit('tools/site-html-utils.mjs', (source) => {
            const oldDecode = `export function decodeEntities(value) {\n  return value\n    .replaceAll("&amp;", "&")\n    .replaceAll("&lt;", "<")\n    .replaceAll("&gt;", ">")\n    .replaceAll("&quot;", '\"')\n    .replaceAll("&#39;", "'")\n    .replaceAll("&apos;", "'");\n}\n`;
            const newDecode = `const DECODED_ENTITIES = Object.freeze({\n  "&amp;": "&",\n  "&lt;": "<",\n  "&gt;": ">",\n  "&quot;": '\"',\n  "&#34;": '\"',\n  "&#39;": "'",\n  "&apos;": "'",\n});\n\nexport function decodeEntities(value) {\n  return String(value).replace(\n    /&(amp|lt|gt|quot|#34|#39|apos);/g,\n    (entity) => DECODED_ENTITIES[entity],\n  );\n}\n`;
            if (!source.includes(oldDecode)) throw new Error('decodeEntities source drifted');
            source = source.replace(oldDecode, newDecode);

            const oldJsonLd = `export function extractJsonLdBlocks(html) {\n  const blocks = [];\n  const pattern = /<script\\b([^>]*)>([\\s\\S]*?)<\\/script>/gi;\n  let match;\n  while ((match = pattern.exec(html)) !== null) {\n    const attrs = parseAttributes(\`<script\${match[1]}>\`);\n    if ((attrs.type ?? "").toLowerCase() === "application/ld+json") {\n      blocks.push(match[2].trim());\n    }\n  }\n  return blocks;\n}\n`;
            const newJsonLd = `function findHtmlTagEnd(html, start) {\n  let quote = null;\n  for (let index = start; index < html.length; index += 1) {\n    const char = html[index];\n    if (quote) {\n      if (char === quote) quote = null;\n      continue;\n    }\n    if (char === '"' || char === "'") {\n      quote = char;\n      continue;\n    }\n    if (char === ">") return index;\n  }\n  return -1;\n}\n\nfunction isTagBoundary(char) {\n  return !char || char === ">" || char === "/" || /\\s/u.test(char);\n}\n\nexport function extractJsonLdBlocks(html) {\n  const blocks = [];\n  const lower = html.toLowerCase();\n  let cursor = 0;\n\n  while (cursor < html.length) {\n    const start = lower.indexOf("<script", cursor);\n    if (start === -1) break;\n    const boundary = lower[start + "<script".length];\n    if (!isTagBoundary(boundary)) {\n      cursor = start + "<script".length;\n      continue;\n    }\n\n    const openEnd = findHtmlTagEnd(html, start);\n    if (openEnd === -1) break;\n    const closeStart = lower.indexOf("</script>", openEnd + 1);\n    if (closeStart === -1) break;\n\n    const openingTag = html.slice(start, openEnd + 1);\n    const attrs = parseAttributes(openingTag);\n    if ((attrs.type ?? "").toLowerCase() === "application/ld+json") {\n      blocks.push(html.slice(openEnd + 1, closeStart).trim());\n    }\n    cursor = closeStart + "</script>".length;\n  }\n\n  return blocks;\n}\n`;
            if (!source.includes(oldJsonLd)) throw new Error('extractJsonLdBlocks source drifted');
            return source.replace(oldJsonLd, newJsonLd);
          });

          edit('tools/import-behance-shootings.mjs', (source) => {
            source = source.replace(
              'import sharp from "sharp";\n',
              'import sharp from "sharp";\n\nimport { decodeEntities } from "./site-html-utils.mjs";\n',
            );
            const oldEscape = `const escapeTs = (value) =>\n  JSON.stringify(value)\n    .replaceAll("\\\\u2028", "\\\\u2028")\n    .replaceAll("\\\\u2029", "\\\\u2029");\n\nfunction htmlEntityDecode(value) {\n  return value\n    .replaceAll("&quot;", '\"')\n    .replaceAll("&#34;", '\"')\n    .replaceAll("&amp;", "&")\n    .replaceAll("&lt;", "<")\n    .replaceAll("&gt;", ">");\n}\n`;
            const replacement = `const escapeTs = (value) => JSON.stringify(value);\n\nfunction htmlEntityDecode(value) {\n  return decodeEntities(value);\n}\n`;
            if (!source.includes(oldEscape)) throw new Error('Behance helper source drifted');
            return source.replace(oldEscape, replacement);
          });

          edit('tools/check-site-meta.mjs', (source) => {
            source = source.replace(
              '  collectHtmlFiles,\n',
              '  collectHtmlFiles,\n  decodeEntities,\n',
            );
            const old = `  return [...xml.matchAll(/<loc>([\\s\\S]*?)<\\/loc>/gi)].map((match) =>\n    match[1]\n      .replaceAll("&amp;", "&")\n      .replaceAll("&lt;", "<")\n      .replaceAll("&gt;", ">")\n      .replaceAll("&quot;", '\"')\n      .replaceAll("&apos;", "'")\n      .trim(),\n  );`;
            const replacement = `  return [...xml.matchAll(/<loc>([\\s\\S]*?)<\\/loc>/gi)].map((match) =>\n    decodeEntities(match[1]).trim(),\n  );`;
            if (!source.includes(old)) throw new Error('check-site-meta decoder source drifted');
            return source.replace(old, replacement);
          });

          edit('tools/check-production.mjs', (source) => {
            source = source.replace(
              'import path from "node:path";\n',
              'import path from "node:path";\n\nimport { decodeEntities } from "./site-html-utils.mjs";\n',
            );
            const old = `function decodeXml(value) {\n  return value\n    .replaceAll("&amp;", "&")\n    .replaceAll("&lt;", "<")\n    .replaceAll("&gt;", ">")\n    .replaceAll("&quot;", '\"')\n    .replaceAll("&apos;", "'");\n}\n`;
            const replacement = `function decodeXml(value) {\n  return decodeEntities(value);\n}\n`;
            if (!source.includes(old)) throw new Error('check-production decoder source drifted');
            return source.replace(old, replacement);
          });

          edit('lighthouserc.cjs', (source) => {
            const old = `function decodeXml(value) {\n  return value\n    .replaceAll("&amp;", "&")\n    .replaceAll("&lt;", "<")\n    .replaceAll("&gt;", ">")\n    .replaceAll("&quot;", '\"')\n    .replaceAll("&apos;", "'");\n}\n`;
            const replacement = `const DECODED_XML_ENTITIES = Object.freeze({\n  "&amp;": "&",\n  "&lt;": "<",\n  "&gt;": ">",\n  "&quot;": '\"',\n  "&apos;": "'",\n});\n\nfunction decodeXml(value) {\n  return String(value).replace(\n    /&(amp|lt|gt|quot|apos);/g,\n    (entity) => DECODED_XML_ENTITIES[entity],\n  );\n}\n`;
            if (!source.includes(old)) throw new Error('Lighthouse decoder source drifted');
            return source.replace(old, replacement);
          });
          NODE

      - name: Verify targeted security contracts
        run: node --test test/security-tooling.test.mjs test/lighthouse-ci-config.test.mjs

      - name: Commit GREEN tooling fixes
        shell: bash
        run: |
          git config user.name "looksawful"
          git config user.email "118225585+looksawful@users.noreply.github.com"
          git add tools/site-html-utils.mjs tools/import-behance-shootings.mjs tools/check-site-meta.mjs tools/check-production.mjs lighthouserc.cjs
          git commit -m "fix(security): harden tooling parsers"
          git push origin HEAD:fix/security-tooling-cleanup-20260905
