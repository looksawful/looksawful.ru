name: Deploy GitHub Pages

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "github-pages/production",
              description: "Cleaning and validating gallery assets",
              target_url: "https://www.looksawful.ru/"
            });

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Run cleanup and validation with diagnostics
        id: cleanup
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            git fetch origin audit/gallery-inventory-20260713
            git show origin/audit/gallery-inventory-20260713:_reports/gallery-inventory/duplicate-reclaim-plan.json > /tmp/duplicate-reclaim-plan.json
            node scripts/cleanup-gallery-safe.mjs /tmp/duplicate-reclaim-plan.json
            git show 7764a131d7b1bc2728b2323ae94f7cdc73c4032a:.github/workflows/pages.yml > .github/workflows/pages.yml
            rm -f .github/workflows/gallery-cleanup-once.yml
            npm run build
            npm run check:portfolio
          } 2>&1 | tee /tmp/gallery-cleanup.log

      - name: Publish cleanup diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'audit/gallery-inventory-20260713';
            const target = '_reports/gallery-inventory/gallery-cleanup.log';
            const content = fs.readFileSync('/tmp/gallery-cleanup.log').toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: target, ref: branch });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: target,
              branch,
              message: 'audit: capture gallery cleanup diagnostics [skip ci]',
              content,
              ...(sha ? { sha } : {})
            });

      - name: Stop when cleanup failed
        if: steps.cleanup.outcome != 'success'
        run: exit 1

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(gallery): remove exact duplicates and empty placeholders"
          git push origin HEAD:prod

      - name: Stamp deployment
        run: |
          printf 'commit=%s\n' "$GITHUB_SHA" > dist/deploy-version.txt
          printf 'deployed-from=prod\n' >> dist/deploy-version.txt

      - name: Add nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    if: always()
    steps:
      - name: Report deployment status
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const success = process.env.BUILD_RESULT === "success" && process.env.DEPLOY_RESULT === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "github-pages/production",
              description: success ? "Published cleaned gallery" : `Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`,
              target_url: "https://www.looksawful.ru/"
            });
            if (!success) core.setFailed(`Gallery cleanup failed. Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`);
