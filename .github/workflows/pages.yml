name: Deploy GitHub Pages

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
      VITE_CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: "pending", context: "github-pages/production", description: "Building and testing GitHub Pages deployment", target_url: runUrl });
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect CV copy-only deployment
        id: change-scope
        shell: bash
        run: |
          set -euo pipefail
          cv_copy_only=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            parent="$(git rev-parse "${GITHUB_SHA}^")"
            changed="$(git diff --name-only "$parent" "$GITHUB_SHA")"
            allowed='^(public/cv/index\.html|src/content/cv\.json|test/cv-(education|experience-copy|profile|skills)-cms\.test\.mjs)$'
            if [[ -n "$changed" ]] && ! grep -Evq "$allowed" <<<"$changed"; then
              cv_copy_only=true
            fi
          fi
          printf 'cv_copy_only=%s\n' "$cv_copy_only" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Restore generated media
        id: media-cache
        uses: actions/cache@v4
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
          key: generated-media-v4-${{ runner.os }}-${{ hashFiles('public/media/**/*', '!public/media/generated/**', 'src/content/projects.json', 'src/content/media-catalog/**/*.json', 'src/data/media/assets/**/*.ts', 'src/data/media/catalog*.ts', 'src/data/media/responsive.ts', 'src/data/media/responsive-policy.ts', 'tools/sync-media-catalog.mjs', 'tools/build-responsive-media.mjs', 'tools/build-video-media.mjs', 'package-lock.json') }}
          restore-keys: |
            generated-media-v4-${{ runner.os }}-
      - name: Ensure media tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Check CMS media catalog
        run: npm run media:catalog:check
      - name: Sync generated media
        run: npm run media:sync
      - name: Check tracked media metadata
        run: git diff --exit-code -- src/content/media-catalog src/data/media/catalog-records.generated.ts public/media/generated/responsive-manifest.json public/media/generated/video-inventory.json src/data/media/responsive-generated.ts
      - name: Core tests
        run: npm run test:core
      - name: Build site
        run: npm run build:site
      - name: Prepare production CV
        run: node tools/prepare-cv-production.mjs dist/cv/index.html
      - name: Install browser for smoke tests
        if: steps.change-scope.outputs.cv_copy_only != 'true'
        run: npx playwright install --with-deps chromium
      - name: Final production browser verification
        if: steps.change-scope.outputs.cv_copy_only != 'true'
        run: npm run test:e2e:production
      - name: Upload caption QA
        if: steps.change-scope.outputs.cv_copy_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: caption-qa
          path: artifacts/caption-qa
          if-no-files-found: error
      - name: Stamp deployment
        run: |
          printf 'commit=%s\n' "$GITHUB_SHA" > dist/deploy-version.txt
          printf 'deployed-from=prod\n' >> dist/deploy-version.txt
      - name: Add nojekyll
        run: touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify production commit
        shell: bash
        run: |
          set -euo pipefail
          expected="commit=${GITHUB_SHA}"
          version_url="https://www.looksawful.ru/deploy-version.txt?sha=${GITHUB_SHA}"
          index_url="https://www.looksawful.ru/?sha=${GITHUB_SHA}"
          cv_url="https://www.looksawful.ru/cv/?sha=${GITHUB_SHA}"
          delays=(0 5 5 10 10 15 15 20 20 30 30 45 60)
          for i in "${!delays[@]}"; do
            delay="${delays[$i]}"
            if (( delay > 0 )); then
              sleep "$delay"
            fi
            attempt=$((i + 1))
            body="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "${version_url}&attempt=${attempt}" || true)"
            index_file="$(mktemp)"
            cv_file="$(mktemp)"
            curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "${index_url}&attempt=${attempt}" --output "${index_file}" || true
            curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "${cv_url}&attempt=${attempt}" --output "${cv_file}" || true
            if grep -Fxq "$expected" <<<"$body" \
              && grep -Eq 'href="/assets/[^"]+\.css"' "${index_file}" \
              && grep -Eq 'src="/assets/[^"]+\.js"' "${index_file}" \
              && ! grep -Eq '\./src/[^"]+\.(css|js)' "${index_file}" \
              && grep -Fq '<main class="resume">' "${cv_file}" \
              && ! grep -Eqi '<article[^>]*class="[^"]*experience-card[^"]*"[^>]*hidden|<article[^>]*hidden[^>]*class="[^"]*experience-card' "${cv_file}"; then
              printf '%s\n' "$body"
              rm -f "${index_file}" "${cv_file}"
              exit 0
            fi
            rm -f "${index_file}" "${cv_file}"
          done
          echo "Production did not expose ${expected} with built assets and a sanitized CV" >&2
          exit 1

  report:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Report deployment status
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const success = process.env.BUILD_RESULT === "success" && process.env.DEPLOY_RESULT === "success";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: success ? "success" : "failure", context: "github-pages/production", description: success ? "Published and verified on www.looksawful.ru" : `Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`, target_url: runUrl });
            if (!success) core.setFailed(`GitHub Pages deployment failed. Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`);
