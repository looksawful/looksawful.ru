name: Deploy GitHub Pages

# GitHub Pages is the only production deployment target.
on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "github-pages/production",
              description: "Building GitHub Pages production deployment",
              target_url: "https://www.looksawful.ru/"
            });

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        id: site-build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/gallery-audit-build.log

      - name: Publish complete one-time gallery inventory through GitHub API
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const branch = 'audit/gallery-inventory-20260713';
            const reportRoot = 'public/_audit-gallery-inventory';

            function walk(dir) {
              if (!fs.existsSync(dir)) return [];
              return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
                const absolute = path.join(dir, entry.name);
                return entry.isDirectory() ? walk(absolute) : [absolute];
              });
            }

            const entries = [];
            if (fs.existsSync('/tmp/gallery-audit-build.log')) {
              entries.push(['/tmp/gallery-audit-build.log', '_reports/gallery-inventory/build.log']);
            }
            for (const source of walk(reportRoot)) {
              const relative = path.relative(reportRoot, source).split(path.sep).join('/');
              if (relative === 'site-assets-inventory.json') continue;
              entries.push([source, `_reports/gallery-inventory/${relative}`]);
            }

            for (const [source, target] of entries) {
              const size = fs.statSync(source).size;
              if (size > 25 * 1024 * 1024) {
                core.warning(`Skipping oversized report ${source}: ${size} bytes`);
                continue;
              }
              const content = fs.readFileSync(source).toString('base64');
              let sha;
              try {
                const existing = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: target,
                  ref: branch
                });
                if (!Array.isArray(existing.data)) sha = existing.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: target,
                branch,
                message: `audit: publish ${path.basename(target)} [skip ci]`,
                content,
                ...(sha ? { sha } : {})
              });
            }

      - name: Stop when build failed
        if: steps.site-build.outcome != 'success'
        run: exit 1

      - name: Stamp deployment
        run: |
          printf 'commit=%s\n' "$GITHUB_SHA" > dist/deploy-version.txt
          printf 'deployed-from=prod\n' >> dist/deploy-version.txt

      - name: Add nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production commit
        shell: bash
        run: |
          set -euo pipefail
          expected="commit=${GITHUB_SHA}"
          base_url="https://www.looksawful.ru/deploy-version.txt?sha=${GITHUB_SHA}"

          for attempt in $(seq 1 30); do
            body="$(curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${base_url}&attempt=${attempt}" || true)"

            if grep -Fxq "$expected" <<<"$body"; then
              printf '%s\n' "$body"
              exit 0
            fi

            sleep 10
          done

          echo "Production did not expose ${expected}" >&2
          exit 1

  report:
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    if: always()
    steps:
      - name: Report deployment status
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const success = process.env.BUILD_RESULT === "success" && process.env.DEPLOY_RESULT === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "github-pages/production",
              description: success
                ? "Published and verified on www.looksawful.ru"
                : `Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`,
              target_url: "https://www.looksawful.ru/"
            });

            if (!success) {
              core.setFailed(`GitHub Pages deployment failed. Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`);
            }
