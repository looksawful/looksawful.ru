name: Deploy GitHub Pages

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "github-pages/production",
              description: "Cleaning and validating gallery assets",
              target_url: "https://www.looksawful.ru/"
            });

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Load verified duplicate plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin audit/gallery-inventory-20260713
          git show origin/audit/gallery-inventory-20260713:_reports/gallery-inventory/duplicate-reclaim-plan.json > /tmp/duplicate-reclaim-plan.json

      - name: Remove safe exact duplicates and unused placeholders
        run: node scripts/cleanup-gallery-safe.mjs /tmp/duplicate-reclaim-plan.json

      - name: Restore normal workflows before commit
        shell: bash
        run: |
          set -euo pipefail
          git show "${GITHUB_SHA}^:.github/workflows/pages.yml" > .github/workflows/pages.yml
          rm -f .github/workflows/gallery-cleanup-once.yml

      - name: Build and validate cleaned site
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run check:portfolio

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(gallery): remove exact duplicates and empty placeholders"
          git push origin HEAD:prod

      - name: Stamp deployment
        run: |
          printf 'commit=%s\n' "$GITHUB_SHA" > dist/deploy-version.txt
          printf 'deployed-from=prod\n' >> dist/deploy-version.txt

      - name: Add nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    if: always()
    steps:
      - name: Report deployment status
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const success = process.env.BUILD_RESULT === "success" && process.env.DEPLOY_RESULT === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "github-pages/production",
              description: success ? "Published cleaned gallery" : `Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`,
              target_url: "https://www.looksawful.ru/"
            });
            if (!success) core.setFailed(`Gallery cleanup failed. Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`);
