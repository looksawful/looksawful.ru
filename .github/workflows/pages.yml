name: Deploy GitHub Pages

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
      VITE_CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: "pending", context: "github-pages/production", description: "Building exact production SHA", target_url: runUrl });
      - name: Checkout exact production SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Restore generated media
        uses: actions/cache@v4
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
          key: generated-media-v4-${{ runner.os }}-${{ hashFiles('public/media/**/*', '!public/media/generated/**', 'src/content/projects.json', 'src/content/media-catalog/**/*.json', 'src/data/media/assets/**/*.ts', 'src/data/media/catalog*.ts', 'src/data/media/responsive.ts', 'src/data/media/responsive-policy.ts', 'tools/sync-media-catalog.mjs', 'tools/build-responsive-media.mjs', 'tools/build-video-media.mjs', 'package-lock.json') }}
          restore-keys: |
            generated-media-v4-${{ runner.os }}-
      - name: Build site
        run: npm run build:site
      - name: Prepare production CV
        run: node tools/prepare-cv-production.mjs
      - name: Stamp deployment
        shell: bash
        run: |
          printf 'commit=%s\n' "$GITHUB_SHA" > dist/deploy-version.txt
          printf 'deployed-from=prod\n' >> dist/deploy-version.txt
      - name: Add nojekyll
        run: touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published SHA and assets
        shell: bash
        run: |
          set -euo pipefail
          expected="commit=${GITHUB_SHA}"
          for delay in 0 5 10 20 30; do
            if (( delay > 0 )); then sleep "$delay"; fi
            version="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://www.looksawful.ru/deploy-version.txt?sha=${GITHUB_SHA}" || true)"
            if ! grep -Fxq "$expected" <<< "$version"; then continue; fi
            curl --fail --silent --show-error --location --max-time 20 "https://www.looksawful.ru/?sha=${GITHUB_SHA}" > /tmp/index.html
            curl --fail --silent --show-error --location --max-time 20 "https://www.looksawful.ru/cv/?sha=${GITHUB_SHA}" > /dev/null
            assets="$(grep -Eo '/assets/[^\" ]+\.(css|js)' /tmp/index.html | sort -u)"
            test -n "$assets"
            while IFS= read -r asset; do
              test -z "$asset" && continue
              curl --fail --silent --show-error --location --max-time 20 "https://www.looksawful.ru${asset}?sha=${GITHUB_SHA}" > /dev/null
            done <<< "$assets"
            exit 0
          done
          echo "Production did not expose expected SHA: ${GITHUB_SHA}" >&2
          exit 1

  report:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Report deployment status
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const success = process.env.BUILD_RESULT === "success" && process.env.DEPLOY_RESULT === "success";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: success ? "success" : "failure", context: "github-pages/production", description: success ? "Published exact production SHA" : `Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`, target_url: runUrl });
            if (!success) core.setFailed(`GitHub Pages deployment failed. Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`);
