name: Deploy GitHub Pages

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
      VITE_YANDEX_METRIKA_COUNTER_ID: "112065623"
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: "pending", context: "github-pages/production", description: "Building exact production SHA", target_url: runUrl });
      - name: Checkout exact production SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore exact generated media cache
        id: media-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}
      - name: Install media tooling on exact cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Regenerate exact media cache on miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: npm run media:sync
      - name: Write canonical generated-media cache marker on miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: node tools/media-dev-state.mjs --cache-write
      - name: Verify exact generated media cache
        run: node tools/media-dev-state.mjs --cache-verify
      - name: Require clean tracked tree after cache recovery
        if: steps.media-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code --; then
            echo "Production media cache recovery changed tracked repository state." >&2
            echo "Generated metadata in the exact production tree must already be canonical before deployment." >&2
            exit 1
          fi
      - name: Save exact generated media cache on miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}
      - name: Typecheck
        run: npm run typecheck
      - name: Fast tests
        run: npm run test:fast
      - name: Build site
        run: npm run build:site
      - name: Prepare production CV
        run: npm run cv:prod:prepare
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for compact production sanity
        run: npx playwright install --with-deps chromium
      - name: Compact production browser sanity
        run: npm run test:e2e:production
      - name: Verify production CV artifact
        run: npm run cv:prod:verify
      - name: Stamp exact deployment SHA
        shell: bash
        run: |
          printf 'commit=%s\n' "$GITHUB_SHA" > dist/deploy-version.txt
          printf 'deployed-from=prod\n' >> dist/deploy-version.txt
      - name: Add nojekyll
        run: touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published SHA, root, CV and built assets
        shell: bash
        run: |
          set -euo pipefail
          expected="commit=${GITHUB_SHA}"
          for delay in 0 5 10 20 30; do
            if (( delay > 0 )); then sleep "$delay"; fi
            version="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://www.looksawful.ru/deploy-version.txt?sha=${GITHUB_SHA}" || true)"
            if ! grep -Fxq "$expected" <<< "$version"; then continue; fi
            curl --fail --silent --show-error --location --max-time 20 "https://www.looksawful.ru/?sha=${GITHUB_SHA}" > /tmp/index.html
            curl --fail --silent --show-error --location --max-time 20 "https://www.looksawful.ru/cv/?sha=${GITHUB_SHA}" > /dev/null
            assets="$(grep -Eo '/assets/[^\" ]+\.(css|js)' /tmp/index.html | sort -u)"
            test -n "$assets"
            while IFS= read -r asset; do
              test -z "$asset" && continue
              curl --fail --silent --show-error --location --max-time 20 "https://www.looksawful.ru${asset}?sha=${GITHUB_SHA}" > /dev/null
            done <<< "$assets"
            exit 0
          done
          echo "Production did not expose expected SHA: ${GITHUB_SHA}" >&2
          exit 1

  report:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Report deployment status
        uses: actions/github-script@v9
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const success = process.env.BUILD_RESULT === "success" && process.env.DEPLOY_RESULT === "success";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: success ? "success" : "failure", context: "github-pages/production", description: success ? "Published exact production SHA" : `Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`, target_url: runUrl });
            if (!success) core.setFailed(`GitHub Pages deployment failed. Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`);
