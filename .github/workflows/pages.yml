name: Deploy GitHub Pages

# GitHub Pages is the only production deployment target.
on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "github-pages/production",
              description: "Building and testing GitHub Pages deployment",
              target_url: runUrl
            });

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CV runtime migration
        run: python .github/scripts/migrate_cv_runtime.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit CV runtime migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes" >&2
            exit 1
          fi
          git commit -m "Refactor CV runtime and Jestei"
          git push origin HEAD:prod

      - name: Stamp deployment
        run: |
          printf 'commit=%s\n' "$GITHUB_SHA" > dist/deploy-version.txt
          printf 'deployed-from=prod\n' >> dist/deploy-version.txt

      - name: Add nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production commit
        shell: bash
        run: |
          set -euo pipefail
          expected="commit=${GITHUB_SHA}"
          base_url="https://www.looksawful.ru/deploy-version.txt?sha=${GITHUB_SHA}"

          for attempt in $(seq 1 30); do
            body="$(curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${base_url}&attempt=${attempt}" || true)"

            if grep -Fxq "$expected" <<<"$body"; then
              printf '%s\n' "$body"
              exit 0
            fi

            sleep 10
          done

          echo "Production did not expose ${expected}" >&2
          exit 1

  report:
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    if: always()
    steps:
      - name: Report deployment status
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const success = process.env.BUILD_RESULT === "success" && process.env.DEPLOY_RESULT === "success";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "github-pages/production",
              description: success
                ? "Published and verified on www.looksawful.ru"
                : `Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`,
              target_url: runUrl
            });

            if (!success) {
              core.setFailed(`GitHub Pages deployment failed. Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`);
            }
