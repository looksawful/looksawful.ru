name: Deploy GitHub Pages

# GitHub Pages is the only production deployment target.
on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "github-pages/production",
              description: "Building and testing GitHub Pages deployment",
              target_url: runUrl
            });

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Stamp deployment
        run: |
          printf 'commit=%s\n' "$GITHUB_SHA" > dist/deploy-version.txt
          printf 'deployed-from=prod\n' >> dist/deploy-version.txt

      - name: Add nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production commit
        shell: bash
        run: |
          set -euo pipefail
          expected="commit=${GITHUB_SHA}"
          version_url="https://www.looksawful.ru/deploy-version.txt?sha=${GITHUB_SHA}"
          index_url="https://www.looksawful.ru/?sha=${GITHUB_SHA}"

          for attempt in $(seq 1 60); do
            body="$(curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${version_url}&attempt=${attempt}" || true)"

            index_file="$(mktemp)"
            curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${index_url}&attempt=${attempt}" \
              --output "${index_file}" || true

            if grep -Fxq "$expected" <<<"$body" \
              && grep -Eq 'href="/assets/[^"]+\.css"' "${index_file}" \
              && grep -Eq 'src="/assets/[^"]+\.js"' "${index_file}" \
              && ! grep -Eq '\./src/[^"]+\.(css|js)' "${index_file}"; then
              printf '%s\n' "$body"
              rm -f "${index_file}"
              exit 0
            fi

            rm -f "${index_file}"
            sleep 10
          done

          echo "Production did not expose ${expected} with built CSS/JS assets" >&2
          exit 1

  report:
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    if: always()
    steps:
      - name: Report deployment status
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const success = process.env.BUILD_RESULT === "success" && process.env.DEPLOY_RESULT === "success";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "github-pages/production",
              description: success
                ? "Published and verified on www.looksawful.ru"
                : `Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`,
              target_url: runUrl
            });

            if (!success) {
              core.setFailed(`GitHub Pages deployment failed. Build: ${process.env.BUILD_RESULT}; deploy: ${process.env.DEPLOY_RESULT}`);
            }
