name: Temporary CSpell #335 round 2

on:
  push:
    branches:
      - fix/335-cspell-glossary-round2

permissions:
  contents: read

jobs:
  cspell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run broad CSpell diagnostic
        shell: bash
        run: |
          set +e
          npm run spell > /tmp/cspell.log 2>&1
          status=$?
          cat /tmp/cspell.log
          echo "CSPELL_EXIT=$status"
          exit 0
