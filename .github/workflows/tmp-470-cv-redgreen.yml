name: Temporary CV 470 RED-GREEN

on:
  push:
    branches:
      - fix/470-cv-hierarchy-tools-dedup

permissions:
  contents: read

jobs:
  cv-targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run CV hierarchy/tool ownership contract
        run: node --experimental-strip-types --test test/cv-skills-cms.test.mjs
