name: Blog targeted CMS contract test

on:
  push:
    branches:
      - feat/blog-v1-editorial
    paths:
      - .github/workflows/blog-targeted-cms-test.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/blog-v1-editorial
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch blog CMS contract
        shell: python
        run: |
          from pathlib import Path

          path = Path('.pages.yml')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    format: yaml-frontmatter\n    filename:\n',
                  '    format: yaml-frontmatter\n    exclude: [".gitkeep"]\n    filename:\n',
              ),
              (
                  '    view:\n      primary: title\n      fields: [kind, published, publishedAt]\n      sort: publishedAt\n      order: desc\n',
                  '    view:\n      primary: title\n      fields: [kind, published, publishedAt]\n      sort: [publishedAt, title]\n      default:\n        sort: publishedAt\n        order: desc\n',
              ),
              (
                  '      - name: publishedAt\n        label: Дата публикации\n        type: date\n        required: true\n',
                  '      - name: publishedAt\n        label: Дата публикации\n        type: date\n        required: true\n        options:\n          format: yyyy-MM-dd\n',
              ),
              (
                  '      - name: updatedAt\n        label: Дата обновления\n        type: date\n        required: false\n',
                  '      - name: updatedAt\n        label: Дата обновления\n        type: date\n        required: false\n        default: ""\n        options:\n          format: yyyy-MM-dd\n',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one CMS contract block, found {count}: {old!r}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
      - name: Install
        run: npm ci
      - name: Run blog CMS contract test
        run: node --test test/blog-integration-contract.test.mjs
      - name: Commit CMS contract fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages.yml
          git diff --cached --check
          git commit -m "fix(blog): align Pages CMS authoring contract"
          git push origin HEAD:feat/blog-v1-editorial
