name: Publish CMS changes

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: pages-cms-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate CMS source and trusted workflow ref
        env:
          CMS_PAYLOAD: ${{ inputs.payload }}
          WORKFLOW_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$(node --input-type=module <<'NODE'
          const payload = JSON.parse(process.env.CMS_PAYLOAD || "{}");
          process.stdout.write(payload?.repository?.ref ?? "");
          NODE
          )"

          echo "Pages CMS source ref: ${source_ref:-<missing>}"
          echo "Trusted workflow ref: ${WORKFLOW_REF}"

          if [[ "$source_ref" != "dev" ]]; then
            echo "CMS publication is allowed only for content saved on dev." >&2
            echo "Open dev in Pages CMS, save the changes there, then publish again." >&2
            exit 1
          fi

          if [[ "$WORKFLOW_REF" != "prod" ]]; then
            echo "CMS publication authorization must execute from the trusted prod workflow." >&2
            exit 1
          fi

      - name: Checkout trusted publication policy
        uses: actions/checkout@v7
        with:
          ref: prod
          fetch-depth: 0
          persist-credentials: false

      - name: Validate branch topology
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/prod:refs/remotes/origin/prod \
            +refs/heads/dev:refs/remotes/origin/dev
          node tools/cms-publication-topology.mjs \
            --prod origin/prod \
            --dev origin/dev
          echo "prod_sha=$(git rev-parse origin/prod)" >> "$GITHUB_OUTPUT"
          echo "dev_sha=$(git rev-parse origin/dev)" >> "$GITHUB_OUTPUT"

      - name: Authorize CMS publication scope
        if: steps.topology.outputs.nothing_to_publish != 'true'
        env:
          CMS_CHANGED_FILES: ${{ runner.temp }}/cms-publication-files.json
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/prod..origin/dev
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { writeFileSync } from "node:fs";

          const diff = execFileSync(
            "git",
            ["diff", "--name-only", "--no-renames", "-z", "origin/prod..origin/dev"],
            { encoding: "utf8" },
          );
          const files = diff.split("\0").filter(Boolean);
          writeFileSync(process.env.CMS_CHANGED_FILES, JSON.stringify(files));
          NODE
          node tools/cms-publication-scope.mjs --files "$CMS_CHANGED_FILES"

      - name: Create or reuse dev to prod pull request
        id: pr
        if: steps.topology.outputs.nothing_to_publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          existing_json="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base prod \
            --head dev \
            --state open \
            --json number,url \
            --jq '.[0] // {}')"
          existing_number="$(jq -r '.number // empty' <<< "$existing_json")"
          existing_url="$(jq -r '.url // empty' <<< "$existing_json")"

          if [[ -n "$existing_number" ]]; then
            pr_number="$existing_number"
            pr_url="$existing_url"
            echo "Publication pull request already exists and the current diff is authorized: $pr_url"
          else
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base prod \
              --head dev \
              --title "Publish verified CMS changes" \
              --body $'Prepared from Pages CMS after trusted production policy authorized the current `prod..dev` diff.\n\nCMS source: `dev`\nAuthorization workflow: `prod`\nTarget: `prod`\n\nThe publication workflow waits for PR checks, requires the exact authorized dev SHA, then merges. Production deployment remains fail-closed in `pages.yml`.')"
            pr_number="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"
            echo "Created publication pull request: $pr_url"
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "### Publication PR" >> "$GITHUB_STEP_SUMMARY"
          echo "$pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for publication verification
        if: steps.topology.outputs.nothing_to_publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_DEV_SHA: ${{ steps.topology.outputs.dev_sha }}
        shell: bash
        run: |
          set -euo pipefail

          checks_json="${RUNNER_TEMP}/publication-checks.json"
          found_checks=false
          for _ in {1..18}; do
            if gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json name,state > "$checks_json" 2>/dev/null; then
              if [[ "$(jq 'length' "$checks_json")" -gt 0 ]]; then
                found_checks=true
                break
              fi
            fi
            sleep 5
          done

          if [[ "$found_checks" != true ]]; then
            echo "No verification checks appeared for publication PR #${PR_NUMBER}." >&2
            exit 1
          fi

          gh pr checks "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --watch \
            --interval 10 \
            --fail-fast

          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          if [[ "$current_head" != "$EXPECTED_DEV_SHA" ]]; then
            echo "dev changed during publication verification; refusing to merge unverified content." >&2
            echo "Expected: $EXPECTED_DEV_SHA" >&2
            echo "Current:  $current_head" >&2
            exit 1
          fi

      - name: Merge verified CMS publication
        if: steps.topology.outputs.nothing_to_publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_DEV_SHA: ${{ steps.topology.outputs.dev_sha }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=merge \
            -f sha="$EXPECTED_DEV_SHA")"
          if [[ "$(jq -r '.merged // false' <<< "$response")" != "true" ]]; then
            echo "$response" >&2
            exit 1
          fi
          merge_sha="$(jq -r '.sha' <<< "$response")"
          echo "Merged verified CMS publication at $merge_sha"
          echo "### Publication merged" >> "$GITHUB_STEP_SUMMARY"
          echo "Production deployment will run from exact prod SHA: $merge_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to publish
        if: steps.topology.outputs.nothing_to_publish == 'true'
        run: echo "dev and prod already contain the same publishable content."
