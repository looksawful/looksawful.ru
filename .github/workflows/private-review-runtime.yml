name: Private Review Runtime

on:
  pull_request:
    branches: [dev]
    paths:
      - "tools/review/**"
      - "test/private-review-runtime-*.test.mjs"
      - ".github/workflows/private-review-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-review-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Review runtime contracts
        run: node --test test/private-review-runtime-matrix.test.mjs test/private-review-runtime-stabilization.test.mjs

      - name: Install pinned Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install pinned WebKit
        run: npx playwright install --with-deps webkit

      - name: Cross-engine runtime smoke
        run: node tools/review/smoke-runtime-matrix.mjs
