name: Reviewed stale branch cleanup (one-time)

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/branch-cleanup-once.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: reviewed-stale-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact dev cleanup commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Delete only revalidated stale branches
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          gh pr list --state open --limit 100 --json headRefName,baseRefName > /tmp/open-prs.json

          ancestry_safe=(
            agent/media-normalization-foundation-20260903
            agent/media-normalization-data-20260903
            agent/media-normalization-consumers-20260903
            agent/media-normalization-dedupe-20260903
            agent/media-normalization-dedupe-exec-20260904
            agent/media-normalization-dedupe-wave1-preapply-20260904
            agent/media-normalization-dedupe-wave1-preapply-fix-20260904
            agent/media-normalization-dedupe-wave1-finalize-20260904
            agent/media-normalization-dedupe-wave1-apply-final-20260904
            agent/minimal-ci-migration-20260902
            agent/reviewed-stale-branch-cleanup-20260905
          )

          declare -A superseded_safe=(
            [agent/media-normalization-dedupe-gates-20260904]=0055d33396ccb9209ad87e5220907324f6385bd9
            [agent/media-normalization-dedupe-wave1-apply-20260904]=f0cb7507e6fb938358faaa12cca9ae498f13fc68
            [agent/minimal-ci-media-routing-20260902]=df9873005b60422bff88f5cb3bb86f2cb2f38eea
            [agent/minimal-ci-prod-cache-20260902]=3b22b43ff3fa613e9272ab09479d2a2388f10d10
          )

          is_open_pr_ref() {
            local branch="$1"
            jq -e --arg branch "$branch" 'any(.[]; .headRefName == $branch or .baseRefName == $branch)' /tmp/open-prs.json >/dev/null
          }

          delete_ref() {
            local branch="$1"
            if is_open_pr_ref "$branch"; then
              echo "SKIP open-PR ref: $branch"
              return 0
            fi
            echo "DELETE reviewed stale branch: $branch"
            git push origin --delete "$branch"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deletion verification failed: $branch still exists" >&2
              exit 1
            fi
          }

          for branch in "${ancestry_safe[@]}"; do
            ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$ref"; then
              echo "SKIP already absent: $branch"
              continue
            fi
            if ! git merge-base --is-ancestor "origin/$branch" "$GITHUB_SHA"; then
              echo "SKIP ancestry changed: $branch" >&2
              continue
            fi
            delete_ref "$branch"
          done

          for branch in "${!superseded_safe[@]}"; do
            ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$ref"; then
              echo "SKIP already absent: $branch"
              continue
            fi
            expected="${superseded_safe[$branch]}"
            actual="$(git rev-parse "origin/$branch")"
            if [[ "$actual" != "$expected" ]]; then
              echo "SKIP reviewed superseded ref changed: $branch expected=$expected actual=$actual" >&2
              continue
            fi
            delete_ref "$branch"
          done

          echo "Remaining open PR refs:"
          cat /tmp/open-prs.json
