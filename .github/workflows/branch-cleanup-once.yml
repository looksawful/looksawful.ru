name: One-time branch cleanup

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/branch-cleanup-once.yml'

permissions:
  contents: write

concurrency:
  group: one-time-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor == 'looksawful'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dev with repository credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Delete every temporary remote branch
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            git ls-remote --heads origin |
              awk '{sub("refs/heads/", "", $2); print $2}' |
              sort
          )

          deleted=0
          raced=0
          for branch in "${branches[@]}"; do
            case "$branch" in
              dev|prod)
                echo "Keeping protected permanent branch: $branch"
                continue
                ;;
            esac

            echo "Deleting temporary branch: $branch"
            if git push origin --delete "$branch"; then
              deleted=$((deleted + 1))
            else
              echo "Deletion raced or branch already disappeared: $branch"
              raced=$((raced + 1))
            fi
          done

          mapfile -t remaining < <(
            git ls-remote --heads origin |
              awk '{sub("refs/heads/", "", $2); print $2}' |
              sort
          )

          printf 'Deleted %d temporary branches; %d delete races. Remaining refs:\n' "$deleted" "$raced"
          printf '  %s\n' "${remaining[@]}"

          unexpected=()
          for branch in "${remaining[@]}"; do
            case "$branch" in
              dev|prod) ;;
              *) unexpected+=("$branch") ;;
            esac
          done

          if (( ${#unexpected[@]} > 0 )); then
            printf 'Unexpected branches remain:\n' >&2
            printf '  %s\n' "${unexpected[@]}" >&2
            exit 1
          fi
