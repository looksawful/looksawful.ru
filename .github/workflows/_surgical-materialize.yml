name: Surgical materialization

on:
  push:
    branches:
      - agent/minimal-ci-migration-20260902
    paths:
      - .github/workflows/_surgical-materialize.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact source rewrites
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          async function exactReplace(file, from, to) {
            const source = await readFile(file, 'utf8');
            if (!source.includes(from)) throw new Error(`${file}: expected source marker not found`);
            const next = source.replace(from, to);
            if (next === source) throw new Error(`${file}: replacement produced no change`);
            await writeFile(file, next, 'utf8');
          }

          await exactReplace(
            'src/data/cv.ts',
            'import cvJson from "../content/cv.json" with { type: "json" };',
            'import { cvSourceJson as cvJson } from "./cv-source.ts";',
          );
          await exactReplace(
            'tools/media-dev-state.mjs',
            '  "src/data/media/media-catalog.json",',
            '  "src/data/media/catalog-records.generated.ts",',
          );
          NODE
          git rm -f .github/workflows/_surgical-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cv.ts tools/media-dev-state.mjs
          git status --short
          git commit -m "fix: wire split CV and canonical media inputs"
          git push origin HEAD:agent/minimal-ci-migration-20260902
