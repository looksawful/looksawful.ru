name: Apply tooling codemod

on:
  push:
    branches: [perf/tooling-pipeline-production]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/tooling-pipeline-production
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact lifecycle codemod
        run: node tools/refactor-smoke-site-runtime.mjs
      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "tools/smoke-site.mjs"
          git diff --check
          git diff -- tools/smoke-site.mjs
      - name: Commit codemod result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/smoke-site.mjs
          git commit -m "refactor: share site smoke runtime [tooling-codemod]"
          git push origin HEAD:perf/tooling-pipeline-production
