name: Awful contact hub migration

on:
  push:
    branches: [contact-hub-frontend-current]
    paths: [.github/workflows/awful-contact-hub-migration.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical Awful UX migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import os, pathlib, subprocess

          def replace_file(path, replacements):
              p = pathlib.Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if old not in text:
                      print(f'WARN missing pattern in {path}: {old[:80]!r}')
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')

          # 1. Canonical naming in every tracked UTF-8 file.
          for path in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if not path:
                  continue
              p = pathlib.Path(path)
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              new = text.replace('VENUS','AWFUL').replace('Venus','Awful').replace('venus','awful')
              if new != text:
                  p.write_text(new, encoding='utf-8')

          # Rename tracked paths containing venus/Awful legacy token, including binary assets.
          tracked = [p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          for old in sorted(tracked, key=lambda x: (x.count('/'), len(x)), reverse=True):
              new = old.replace('VENUS','AWFUL').replace('Venus','Awful').replace('venus','awful')
              if new == old or not os.path.exists(old):
                  continue
              pathlib.Path(new).parent.mkdir(parents=True, exist_ok=True)
              os.replace(old, new)

          # 2. Contact Hub: no AI/form mode switch, neutral follow-up composer.
          replace_file('src/components/contact-hub.ts', [
              ('''  const modes = documentRef.createElement("div");\n  modes.className = "contact-hub__modes";\n  const aiModeButton = createTextButton(documentRef, "AI");\n  aiModeButton.dataset.contactHubMode = "ai";\n  const formModeButton = createTextButton(documentRef, "написать");\n  formModeButton.dataset.contactHubMode = "form";\n  modes.append(aiModeButton, formModeButton);\n\n''', ''),
              ('  header.append(modes, collapseButton, closeButton);', '  header.append(collapseButton, closeButton);'),
              ('    aiModeButton,\n    formModeButton,\n', ''),
              ('    hub, collapsedLauncher, collapseButton, closeButton, aiModeButton, formModeButton,\n', '    hub, collapsedLauncher, collapseButton, closeButton,\n'),
              ('    aiModeButton.setAttribute("aria-current", state.mode === "ai" ? "page" : "false");\n    formModeButton.setAttribute("aria-current", state.mode === "form" ? "page" : "false");\n', ''),
              ('  const openAiMode = (): void => setMode("ai");\n  const openFormMode = (): void => setMode("form");\n\n', ''),
              ('  aiModeButton.addEventListener("click", openAiMode);\n  formModeButton.addEventListener("click", openFormMode);\n', ''),
              ('    aiModeButton.removeEventListener("click", openAiMode);\n    formModeButton.removeEventListener("click", openFormMode);\n', ''),
              ('composerInput.placeholder = "спросить Awful";', 'composerInput.placeholder = "follow up";'),
              ('Можно переключиться на «написать» и связаться напрямую.', 'Можно связаться напрямую через форму контакта.'),
              ('Можно переключиться на «написать» и связаться напрямую.', 'Можно связаться напрямую через форму контакта.'),
          ])

          # 3. Awful pet: separate close control + small side restore arrow.
          replace_file('src/components/portfolio-pet.ts', [
              ('  launcher.setAttribute("aria-label", "Открыть чат с Awful");\n', '  launcher.setAttribute("aria-label", "Открыть чат с Awful");\n\n  const dismissButton = root.createElement("button");\n  dismissButton.type = "button";\n  dismissButton.className = "portfolio-pet__dismiss";\n  dismissButton.dataset.portfolioPetDismiss = "";\n  dismissButton.setAttribute("aria-label", "Скрыть Awful");\n  dismissButton.textContent = "×";\n\n  const restoreButton = root.createElement("button");\n  restoreButton.type = "button";\n  restoreButton.className = "portfolio-pet__restore";\n  restoreButton.dataset.portfolioPetRestore = "";\n  restoreButton.setAttribute("aria-label", "Показать Awful");\n  restoreButton.textContent = "→";\n  restoreButton.hidden = true;\n'),
              ('  root.body.append(launcher);\n', '  root.body.append(launcher, dismissButton, restoreButton);\n'),
              ('  let observedConsent: HTMLElement | null = null;\n', '  let observedConsent: HTMLElement | null = null;\n\n  const syncPetControls = (): void => {\n    if (launcher.hidden) return;\n    const rect = launcher.getBoundingClientRect();\n    dismissButton.style.left = `${Math.round(rect.right - 26)}px`;\n    dismissButton.style.top = `${Math.round(rect.top + 8)}px`;\n  };\n\n  const hidePet = (): void => {\n    const rect = launcher.getBoundingClientRect();\n    launcher.hidden = true;\n    dismissButton.hidden = true;\n    restoreButton.style.top = `${Math.round(Math.max(16, Math.min(rect.top + rect.height / 2 - 18, (view?.innerHeight ?? 800) - 52)))}px`;\n    restoreButton.hidden = false;\n    restoreButton.focus({ preventScroll: true });\n  };\n\n  const restorePet = (): void => {\n    restoreButton.hidden = true;\n    launcher.hidden = false;\n    dismissButton.hidden = false;\n    updateConsentOffset();\n    requestAnimationFrame(() => {\n      syncPetControls();\n      launcher.focus({ preventScroll: true });\n    });\n  };\n'),
              ('function dispatchMoved(root: Document, launcher: HTMLElement): void {', 'function dispatchMoved(root: Document, launcher: HTMLElement): void {'),
              ('    detail: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },\n  }));\n}', '    detail: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },\n  }));\n}'),
              ('      dispatchMoved(root, launcher);\n    });\n', '      dispatchMoved(root, launcher);\n      syncPetControls();\n    });\n'),
              ('    dispatchMoved(root, launcher);\n  };\n\n  const finishPointer', '    dispatchMoved(root, launcher);\n    syncPetControls();\n  };\n\n  const finishPointer'),
              ('    if (gesture === "hide") {\n      launcher.hidden = true;\n      return;\n    }', '    if (gesture === "hide") {\n      hidePet();\n      return;\n    }'),
              ('    dispatchMoved(root, launcher);\n  };\n\n  const onClickCapture', '    dispatchMoved(root, launcher);\n    syncPetControls();\n  };\n\n  const onClickCapture'),
              ('      updateConsentOffset();\n      return;\n', '      updateConsentOffset();\n      syncPetControls();\n      return;\n'),
              ('    dispatchMoved(root, launcher);\n  };\n\n  const onPointerEnter', '    dispatchMoved(root, launcher);\n    syncPetControls();\n  };\n\n  const onPointerEnter'),
              ('  launcher.addEventListener("pointerenter", onPointerEnter);', '  dismissButton.addEventListener("click", hidePet);\n  restoreButton.addEventListener("click", restorePet);\n  launcher.addEventListener("pointerenter", onPointerEnter);'),
              ('    launcher.removeEventListener("pointerenter", onPointerEnter);', '    dismissButton.removeEventListener("click", hidePet);\n    restoreButton.removeEventListener("click", restorePet);\n    launcher.removeEventListener("pointerenter", onPointerEnter);'),
              ('    launcher.remove();\n', '    launcher.remove();\n    dismissButton.remove();\n    restoreButton.remove();\n'),
              ('  view?.requestAnimationFrame(() => updateConsentOffset());\n', '  view?.requestAnimationFrame(() => { updateConsentOffset(); syncPetControls(); });\n'),
          ])

          # 4. Control styling: compact close button and left-edge restore arrow.
          css = pathlib.Path('src/styles/portfolio-pet.css')
          text = css.read_text(encoding='utf-8')
          marker = '@media (width <= 42.5rem) {'
          controls = '''\n.portfolio-pet__dismiss,\n.portfolio-pet__restore {\n  position: fixed;\n  z-index: var(--layer-assistant-pet);\n  display: grid;\n  place-items: center;\n  border: 0;\n  background: var(--clr-bg, #fff);\n  color: var(--clr-text, #000);\n  font: inherit;\n  cursor: pointer;\n  -webkit-tap-highlight-color: transparent;\n}\n\n.portfolio-pet__dismiss {\n  inline-size: 28px;\n  block-size: 28px;\n  border-radius: 999px;\n  box-shadow: 0 1px 8px rgb(0 0 0 / 0.12);\n}\n\n.portfolio-pet__restore {\n  inset-inline-start: 0;\n  inline-size: 32px;\n  block-size: 44px;\n  border-radius: 0 999px 999px 0;\n  box-shadow: 1px 1px 8px rgb(0 0 0 / 0.12);\n}\n\n.portfolio-pet__dismiss:focus-visible,\n.portfolio-pet__restore:focus-visible {\n  outline: var(--border-width-200) solid currentColor;\n  outline-offset: 2px;\n}\n\n'''
          if '.portfolio-pet__restore {' not in text:
              text = text.replace(marker, controls + marker)
              css.write_text(text, encoding='utf-8')

          # Remove obsolete mode-control CSS if present.
          hub_css = pathlib.Path('src/styles/contact-hub.css')
          if hub_css.exists():
              text = hub_css.read_text(encoding='utf-8')
              text = text.replace('.contact-hub__modes {\n  display: flex;\n  gap: 8px;\n}\n\n', '')
              hub_css.write_text(text, encoding='utf-8')

          # Remove this one-shot workflow from the resulting tree.
          pathlib.Path('.github/workflows/awful-contact-hub-migration.yml').unlink(missing_ok=True)
          PY

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor(pet): canonical Awful naming and simplified controls"
          git push origin HEAD:contact-hub-frontend-current
