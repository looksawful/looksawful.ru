name: Quality

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/quality.yml"
      - ".github/workflows/production-health.yml"
      - "test/ci-pipeline.test.mjs"
      - "test/ci-minimal-pipeline.test.mjs"
  workflow_dispatch:
    inputs:
      suite:
        description: Quality suite to run
        required: true
        default: all
        type: choice
        options: [all, full-e2e, media-physical, lighthouse, dependency-audit, external-links]
      target:
        description: Branch/ref for manual quality jobs
        required: true
        default: dev
        type: choice
        options: [dev, prod]
  schedule:
    # Nightly broad quality suite.
    - cron: "37 1 * * *"
    # Weekly physical duplicate audit. Keep the expensive disk scan out of nightly.
    - cron: "53 2 * * 0"

permissions:
  contents: read

# Heavy manual/scheduled runs serialize under one group. Tiny PR contract runs
# get their own PR-scoped group and are cancelled when superseded.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'heavy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify Quality schedule contracts
        run: >-
          node --test
          test/ci-pipeline.test.mjs
          test/ci-minimal-pipeline.test.mjs

  resolve-target:
    if: github.event.schedule == '37 1 * * *' || github.event.schedule == '53 2 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target-sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout quality target
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || inputs.target }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve exact target SHA
        id: target
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  dependency-audit:
    needs: resolve-target
    if: github.event.schedule == '37 1 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'dependency-audit'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-target.outputs.target-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:deps

  external-links:
    needs: resolve-target
    if: github.event.schedule == '37 1 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'external-links'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-target.outputs.target-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:vite
      - run: npm run check:external-links
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-links
          path: artifacts/external-links
          if-no-files-found: warn

  media-physical:
    needs: resolve-target
    if: github.event.schedule == '53 2 * * 0' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'media-physical'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-target.outputs.target-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit physical media duplicates
        run: npm run media:dedupe:physical

  prepare-media:
    needs: resolve-target
    if: github.event.schedule == '37 1 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'full-e2e' || inputs.suite == 'lighthouse'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      fingerprint: ${{ steps.media.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-target.outputs.target-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Rebuild and validate generated media once
        run: |
          npm run media:sync
          node tools/media-dev-state.mjs --cache-verify
          git diff --exit-code
      - name: Save exact nightly generated media cache
        uses: actions/cache/save@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}

  full-e2e:
    needs: [resolve-target, prepare-media]
    if: github.event.schedule == '37 1 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'full-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-target.outputs.target-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Restore exact prepared media
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ needs.prepare-media.outputs.fingerprint }}
          fail-on-cache-miss: true
      - name: Verify prepared generated media
        run: node tools/media-dev-state.mjs --cache-verify
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run media:dedupe:check
      - run: npm run build:site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full browser regression
        run: npm run test:e2e:full

  lighthouse:
    needs: [resolve-target, prepare-media]
    if: github.event.schedule == '37 1 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'lighthouse'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-target.outputs.target-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore exact prepared media
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ needs.prepare-media.outputs.fingerprint }}
          fail-on-cache-miss: true
      - name: Verify prepared generated media
        run: node tools/media-dev-state.mjs --cache-verify
      - run: npm run build:site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lighthouse CI
        shell: bash
        run: |
          export CHROME_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; process.stdout.write(chromium.executablePath())")"
          npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: artifacts/lighthouse
          if-no-files-found: warn
