name: Quality

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Quality suite to run
        required: true
        default: all
        type: choice
        options: [all, full-e2e, media-physical, lighthouse, dependency-audit, external-links, health]
      target:
        description: Branch/ref for manual quality jobs
        required: true
        default: dev
        type: choice
        options: [dev, prod]
  schedule:
    # Production health stays lightweight and frequent.
    - cron: "17 */6 * * *"
    # Nightly full quality suite. GitHub cron is UTC: 01:37 UTC = 04:37 Moscow.
    - cron: "37 1 * * *"

permissions:
  contents: read

# Never run two expensive Quality workflows at once. Jobs inside one run still
# execute in parallel, but a manual run cannot collide with a scheduled run.
concurrency:
  group: quality-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  resolve-target:
    if: github.event.schedule == '37 1 * * *' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'health')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target-sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout quality target
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || inputs.target }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve exact target SHA
        id: target
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  health:
    if: github.event.schedule == '17 */6 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'health'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: prod
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify production health and published SHA
        shell: bash
        run: |
          export EXPECTED_PROD_SHA="$(git rev-parse HEAD)"
          node tools/check-production.mjs

  dependency-audit:
    needs: resolve-target
    if: github.event.schedule == '37 1 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'dependency-audit'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-target.outputs.target-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:deps

  external-links:
    needs: resolve-target
    if: github.event.schedule == '37 1 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'external-links'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-target.outputs.target-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:vite
      - run: npm run cv:content:apply
      - run: npm run check:external-links
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-links
          path: artifacts/external-links
          if-no-files-found: warn

  media-physical:
    needs: resolve-target
    if: github.event.schedule == '37 1 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'media-physical'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-target.outputs.target-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit physical media duplicates
        run: npm run media:dedupe:physical

  prepare-media:
    needs: resolve-target
    if: github.event.schedule == '37 1 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'full-e2e' || inputs.suite == 'lighthouse'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      fingerprint: ${{ steps.media.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-target.outputs.target-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Rebuild and validate generated media once
        run: |
          npm run media:sync
          node tools/media-dev-state.mjs --cache-verify
          git diff --exit-code
      - name: Save exact nightly generated media cache
        uses: actions/cache/save@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}

  full-e2e:
    needs: [resolve-target, prepare-media]
    if: github.event.schedule == '37 1 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'full-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-target.outputs.target-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Restore exact prepared media
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ needs.prepare-media.outputs.fingerprint }}
          fail-on-cache-miss: true
      - name: Verify prepared generated media
        run: node tools/media-dev-state.mjs --cache-verify
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run media:dedupe:check
      - run: npm run build:site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full browser regression
        run: npm run test:e2e:full

  lighthouse:
    needs: [resolve-target, prepare-media]
    if: github.event.schedule == '37 1 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'lighthouse'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-target.outputs.target-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore exact prepared media
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ needs.prepare-media.outputs.fingerprint }}
          fail-on-cache-miss: true
      - name: Verify prepared generated media
        run: node tools/media-dev-state.mjs --cache-verify
      - run: npm run build:site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lighthouse CI
        shell: bash
        run: |
          export CHROME_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; process.stdout.write(chromium.executablePath())")"
          npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: artifacts/lighthouse
          if-no-files-found: warn
