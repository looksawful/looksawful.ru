name: tmp-css-606-wave6c-slider-executor

on:
  push:
    branches:
      - refactor/css-462-wave6c-slider
    paths:
      - .github/workflows/tmp-css-606-wave6c-slider-executor.yml

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded Slider branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 5

      - name: Verify RED ancestor and unchanged dev base
        shell: bash
        env:
          EXPECTED_RED_HEAD: 3d997ab971cf0d177929864fa516c80d47e013b1
          EXPECTED_BASE: 9c10a23cbf1413346955a9b3f01439f99f399a9e
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$EXPECTED_RED_HEAD" "$EXPECTED_BASE" dev
          git merge-base --is-ancestor "$EXPECTED_RED_HEAD" HEAD
          test "$(git rev-parse origin/dev)" = "$EXPECTED_BASE"

      - name: Apply declaration-preserving Slider ownership move
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          components_path = Path("src/styles/components.css")
          slider_path = Path("src/styles/slider.css")
          index_path = Path("src/styles/index.css")
          harsh_path = Path("test/harsh-light-slider-width.test.mjs")
          wave5k_path = Path("test/css-refactor-wave5k-infinite-reel.test.mjs")

          components = components_path.read_text()
          index = index_path.read_text()
          harsh = harsh_path.read_text()
          wave5k = wave5k_path.read_text()

          slider_marker = "/* ==================================================\n   Slider and magazine — interaction without motion\n   ================================================== */"
          composite_marker = "/* ==================================================\n   Composite layouts\n   ================================================== */"

          if components.count(slider_marker) != 1:
              raise SystemExit(f"expected one Slider marker, got {components.count(slider_marker)}")
          if components.count(composite_marker) != 1:
              raise SystemExit(f"expected one Composite layouts marker, got {components.count(composite_marker)}")
          if slider_path.exists():
              raise SystemExit("src/styles/slider.css already exists")

          start = components.index(slider_marker)
          end = components.index(composite_marker, start)
          slider_source = components[start:end].rstrip() + "\n"

          if slider_source.count("\n.slider {") != 1:
              raise SystemExit("expected exactly one generic .slider block")
          if slider_source.count("\n.slider-controls {") != 1:
              raise SystemExit("expected exactly one generic .slider-controls block")
          if "!important" in slider_source:
              raise SystemExit("generic Slider source unexpectedly contains !important")

          components_path.write_text(components[:start] + components[end:])
          slider_path.write_text(slider_source)

          old_imports = '@import "./page-flip.css" layer(components);\n@import "../components/jestei-theme-organism/jestei-theme-organism.css";'
          new_imports = '@import "./page-flip.css" layer(components);\n@import "./slider.css" layer(components);\n@import "../components/jestei-theme-organism/jestei-theme-organism.css";'
          if index.count(old_imports) != 1:
              raise SystemExit("PageFlip/Jestei import boundary did not match exactly once")
          index_path.write_text(index.replace(old_imports, new_imports, 1))

          old_css_path = 'new URL("../src/styles/components.css", import.meta.url)'
          new_css_path = 'new URL("../src/styles/slider.css", import.meta.url)'
          if harsh.count(old_css_path) != 1:
              raise SystemExit("HARSH LIGHT Slider owner path did not match exactly once")
          harsh_path.write_text(harsh.replace(old_css_path, new_css_path, 1))

          old_wave5k = '''test("Wave5K stops before Slider ownership", () => {
            assert.match(components, /Slider and magazine — interaction without motion/);
            assert.match(components, /(?:^|\\n)\\.slider\\s*\\{/);
            assert.doesNotMatch(media, /(?:^|\\n)\\.slider\\s*\\{/);
          });'''
          old_wave5k = "\n".join(line[10:] if line.startswith("          ") else line for line in old_wave5k.splitlines())
          new_wave5k = '''test("Wave5K media ownership remains isolated from Slider", () => {
            assert.doesNotMatch(media, /(?:^|\\n)\\.slider\\s*\\{/);
          });'''
          new_wave5k = "\n".join(line[10:] if line.startswith("          ") else line for line in new_wave5k.splitlines())
          if wave5k.count(old_wave5k) != 1:
              raise SystemExit("Wave5K historical Slider boundary did not match exactly once")
          wave5k_path.write_text(wave5k.replace(old_wave5k, new_wave5k, 1))
          PY

      - name: Focused Slider architecture and behavior contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/css-tooling-check.test.mjs \
            test/harsh-light-slider-width.test.mjs \
            test/css-refactor-wave5k-infinite-reel.test.mjs \
            test/caption-lightbox-contract.test.mjs
          node tools/css/check.mjs

      - name: Stylelint and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          npm run lint:style
          git diff --check
          test "$(grep -c '^\.slider {$' src/styles/slider.css)" -eq 1
          test "$(grep -c '^\.slider {$' src/styles/components.css || true)" -eq 0
          test "$(grep -c '^\.slider-controls {$' src/styles/slider.css)" -eq 1
          test "$(grep -c '^\.slider-controls {$' src/styles/components.css || true)" -eq 0

      - name: Remove executor and commit durable Slider tree
        shell: bash
        env:
          BRANCH: refactor/css-462-wave6c-slider
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-css-606-wave6c-slider-executor.yml
          git add \
            src/styles/components.css \
            src/styles/slider.css \
            src/styles/index.css \
            tools/css/check.mjs \
            test/harsh-light-slider-width.test.mjs \
            test/css-refactor-wave5k-infinite-reel.test.mjs
          git commit -m "refactor(css): extract Slider style ownership"
          git push origin "HEAD:$BRANCH"
