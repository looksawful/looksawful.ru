name: Patch pet code source GREEN

on:
  push:
    branches:
      - agent/pets-code-primitives-270
    paths:
      - .github/workflows/patch-pet-code-source-green.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/pets-code-primitives-270
          fetch-depth: 1
      - name: Replace literal snippets with skin-owned mount points
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_code(path, code_id, source_id):
              html = path.read_text(encoding='utf-8')
              pattern = re.compile(rf'<code id="{re.escape(code_id)}"[^>]*>.*?</code>', re.S)
              replacement = f'<code id="{code_id}" data-pet-code-source="{source_id}"></code>'
              html, count = pattern.subn(replacement, html, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: expected one {code_id} code surface, replaced {count}')
              path.write_text(html, encoding='utf-8')

          awful = Path('public/pets/awful-cases/index.html')
          replace_code(awful, 'install-code', 'awful-cases:install')
          replace_code(awful, 'run-code', 'awful-cases:run')

          berserk = Path('public/pets/berserk-timer/index.html')
          replace_code(berserk, 'install-code', 'berserk-timer:install')
          replace_code(berserk, 'usage-code', 'berserk-timer:usage')
          PY
      - name: Verify targeted source contract
        run: node --test test/pet-code-primitives.test.mjs
      - name: Commit single-source mounts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pets/awful-cases/index.html public/pets/berserk-timer/index.html
          git diff --cached --check
          git commit -m "refactor: make pet HTML code surfaces build-owned mounts"
          git push origin HEAD:agent/pets-code-primitives-270
