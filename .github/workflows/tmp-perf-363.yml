name: Tmp perf 363

on:
  push:
    branches:
      - agent/home-images-mainthread-363

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect hero source
        run: node --input-type=module -e "import sharp from 'sharp'; console.log(JSON.stringify(await sharp('public/media/hero/hero-portrait.webp').metadata()))"
