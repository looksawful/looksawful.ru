name: Page Architecture Contract (temporary)

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: page-architecture-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Page architecture contract
        run: node --test test/site-composition.test.mjs
