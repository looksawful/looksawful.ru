name: Checks

on:
  push:
    branches:
      - dev
      - preprod
  pull_request:
    branches:
      - dev
      - preprod
      - prod

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Jestei process animation
        run: npm run check:jestei-process

      - name: Verify HTML contract
        run: npm run check:html

      - name: Verify architecture budget
        run: npm run check:architecture

      - name: Prepare DOM baseline
        run: node scripts/capture-dev-baseline.mjs --no-screenshots

      - name: Verify DOM regression
        run: node scripts/dom-regression.mjs
