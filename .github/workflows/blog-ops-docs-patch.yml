name: Patch blog operations docs

on:
  push:
    branches:
      - feat/blog-v1-editorial
    paths:
      - .github/workflows/blog-ops-docs-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/blog-v1-editorial
          fetch-depth: 1

      - name: Patch site operations
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/site-operations.md')
          source = path.read_text(encoding='utf-8')

          anchor_one = '''This protects the fixed card-to-route contract.\n\n## 4. Project-card fields\n'''
          replacement_one = '''This protects the fixed card-to-route contract.\n\nThe blog is a separate typed CMS scope. Its entries live in `src/content/blog/*.md`, its media source is scoped to `public/media/blog`, and its public routes remain code-owned. Blog-specific editorial rules are documented in [`docs/blog-authoring.md`](./blog-authoring.md).\n\n## 4. Project-card fields\n'''
          if source.count(anchor_one) != 1:
              raise SystemExit('section 3 insertion anchor is not unique')
          source = source.replace(anchor_one, replacement_one, 1)

          anchor_two = '''Future expansion should happen only after the relevant content model has a stable typed contract.\n\nRecommended order:\n'''
          replacement_two = '''Future expansion should happen only after the relevant content model has a stable typed contract.\n\nThe blog follows this rule: CMS authoring was added only after its typed frontmatter schema, build-time validation, content-derived routes and dedicated renderer/runtime boundary were defined. Do not use the blog collection as a generic escape hatch for unrelated site architecture.\n\nRecommended order:\n'''
          if source.count(anchor_two) != 1:
              raise SystemExit('section 20 insertion anchor is not unique')
          source = source.replace(anchor_two, replacement_two, 1)

          anchor_three = '''For a new external-service configuration:\n\n```text\n'''
          replacement_three = '''For blog authoring, use the dedicated checklist and validation rules in [`docs/blog-authoring.md`](./blog-authoring.md).\n\nFor a new external-service configuration:\n\n```text\n'''
          if source.count(anchor_three) != 1:
              raise SystemExit('routine checklist insertion anchor is not unique')
          source = source.replace(anchor_three, replacement_three, 1)

          path.write_text(source.rstrip() + '\n', encoding='utf-8')

      - name: Commit scoped operations update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/site-operations.md
          git diff --cached --check
          git commit -m "docs(blog): connect blog authoring to site operations"
          git push origin HEAD:feat/blog-v1-editorial
