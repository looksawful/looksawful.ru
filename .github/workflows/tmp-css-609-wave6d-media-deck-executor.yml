name: tmp-css-609-wave6d-media-deck-executor

on:
  push:
    branches:
      - refactor/css-462-wave6d-media-deck
    paths:
      - .github/workflows/tmp-css-609-wave6d-media-deck-executor.yml

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded MediaDeck branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 5

      - name: Verify RED ancestor and unchanged dev base
        shell: bash
        env:
          EXPECTED_RED_HEAD: c07b5ba6db981524ae97702cc8ddb27a0be24044
          EXPECTED_BASE: 12236483061bcb8ff397a607961773ae98a870f8
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$EXPECTED_RED_HEAD" "$EXPECTED_BASE" dev
          git merge-base --is-ancestor "$EXPECTED_RED_HEAD" HEAD
          test "$(git rev-parse origin/dev)" = "$EXPECTED_BASE"

      - name: Apply declaration-preserving MediaDeck ownership move
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          components_path = Path("src/styles/components.css")
          owner_path = Path("src/styles/media-deck.css")
          index_path = Path("src/styles/index.css")
          responsive_test_path = Path("test/css-fixes/responsive-css.test.mjs")

          components = components_path.read_text()
          index = index_path.read_text()
          responsive = responsive_test_path.read_text()

          media_deck_marker = "/* --- media-deck --- */"
          lightbox_marker = "/* --- media-lightbox --- */"

          if components.count(media_deck_marker) != 1:
              raise SystemExit(f"expected one MediaDeck marker, got {components.count(media_deck_marker)}")
          if components.count(lightbox_marker) != 1:
              raise SystemExit(f"expected one MediaLightbox marker, got {components.count(lightbox_marker)}")
          if owner_path.exists():
              raise SystemExit("src/styles/media-deck.css already exists")

          start = components.index(media_deck_marker)
          end = components.index(lightbox_marker, start)
          owner_source = components[start:end].rstrip() + "\n"

          for required in [
              "\n[data-media-deck] {",
              "\n.media-deck {",
              "\n[data-deck-dragging] .media-deck__track {",
              "\n[data-deck-fit-viewport] {",
              "\n[data-deck-fit] {",
              "\n@container media-deck (width > 48rem) {",
          ]:
              if owner_source.count(required) != 1:
                  raise SystemExit(f"expected exactly one MediaDeck contract fragment: {required!r}")
          if "media-lightbox" in owner_source:
              raise SystemExit("MediaLightbox boundary leaked into MediaDeck owner")
          if "!important" in owner_source:
              raise SystemExit("MediaDeck move unexpectedly contains !important")

          components_path.write_text(components[:start] + components[end:])
          owner_path.write_text(owner_source)

          old_imports = '@import "./slider.css" layer(components);\n@import "../components/jestei-theme-organism/jestei-theme-organism.css";'
          new_imports = '@import "./slider.css" layer(components);\n@import "./media-deck.css" layer(components);\n@import "../components/jestei-theme-organism/jestei-theme-organism.css";'
          if index.count(old_imports) != 1:
              raise SystemExit("Slider/Jestei import boundary did not match exactly once")
          index_path.write_text(index.replace(old_imports, new_imports, 1))

          old_reader = 'const css = await readFile(new URL("../../src/styles/components.css", import.meta.url), "utf8");'
          new_reader = old_reader + '\nconst mediaDeckCss = await readFile(new URL("../../src/styles/media-deck.css", import.meta.url), "utf8");'
          if responsive.count(old_reader) != 1:
              raise SystemExit("responsive CSS components reader did not match exactly once")
          responsive = responsive.replace(old_reader, new_reader, 1)

          old_test = '''test("media deck dots keep small visual dots on larger hit targets", () => {
            assert.match(css, /\\.media-deck__dot\\s*{[^}]*inline-size:\\s*1\\.5rem;[^}]*block-size:\\s*1\\.5rem;/s);
            assert.match(css, /\\.media-deck__dot\\s*{[^}]*&::before\\s*{[^}]*inline-size:\\s*0\\.45rem;[^}]*block-size:\\s*0\\.45rem;/s);
            assert.match(css, /&\\[data-active\\],[^}]*&\\[aria-current="true"\\]\\s*{\\s*&::before\\s*{[^}]*background:\\s*currentColor;/s);
          });'''
          old_test = "\n".join(line[10:] if line.startswith("          ") else line for line in old_test.splitlines())
          new_test = old_test.replace("assert.match(css,", "assert.match(mediaDeckCss,")
          if responsive.count(old_test) != 1:
              raise SystemExit("MediaDeck responsive assertion block did not match exactly once")
          responsive_test_path.write_text(responsive.replace(old_test, new_test, 1))
          PY

      - name: Focused MediaDeck architecture and behavior contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/css-tooling-check.test.mjs \
            test/caption-lightbox-contract.test.mjs
          node --test \
            --test-name-pattern="media deck dots keep small visual dots on larger hit targets" \
            test/css-fixes/responsive-css.test.mjs
          node tools/css/check.mjs

      - name: Stylelint and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          npm run lint:style
          git diff --check
          test "$(grep -c '^\[data-media-deck\] {$' src/styles/media-deck.css)" -eq 1
          test "$(grep -c '^\[data-media-deck\] {$' src/styles/components.css || true)" -eq 0
          test "$(grep -c '^\.media-deck {$' src/styles/media-deck.css)" -eq 1
          test "$(grep -c '^\.media-deck {$' src/styles/components.css || true)" -eq 0
          ! grep -q 'media-lightbox' src/styles/media-deck.css

      - name: Remove executor and commit durable MediaDeck tree
        shell: bash
        env:
          BRANCH: refactor/css-462-wave6d-media-deck
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-css-609-wave6d-media-deck-executor.yml
          git add \
            src/styles/components.css \
            src/styles/media-deck.css \
            src/styles/index.css \
            tools/css/check.mjs \
            test/css-fixes/responsive-css.test.mjs
          git commit -m "refactor(css): extract MediaDeck style ownership"
          git push origin "HEAD:$BRANCH"
