name: tmp-wave2b-event-cover

on:
  push:
    branches: [refactor/css-wave2b-event-cover]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply exact ownership move
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("src/styles/components.css"); s=p.read_text(); old="object-fit: contain;"; anchor=".jestei-event-video-deck"; start=s.index(anchor); pos=s.index(old,start); assert s.find(old,pos+1)==-1 or s.find(old,pos+1)>s.index("/* ==================================================",pos); p.write_text(s[:pos]+"object-fit: cover;"+s[pos+len(old):])'
          python -c 'from pathlib import Path; p=Path("src/styles/index.css"); s=p.read_text(); old="  /* The Jestei landing sequence is presentation media: every slide fills the authored surface. */\n  .jestei-event-video-deck .slider__slide > video {\n    object-fit: cover;\n  }\n"; assert s.count(old)==1; p.write_text(s.replace(old,"",1))'
      - name: Focused GREEN contract
        run: node --test test/jestei-event-migration.test.mjs
      - name: Style architecture checks
        run: |
          npm run lint:style
          npm run css:check
      - name: Commit clean durable diff
        run: |
          rm .github/workflows/tmp-wave2b-event-cover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/components.css src/styles/index.css test/jestei-event-migration.test.mjs .github/workflows/tmp-wave2b-event-cover.yml
          git diff --cached --check
          git commit -m 'refactor(css): canonicalize Jestei Event cover ownership'
          git push origin HEAD:refactor/css-wave2b-event-cover
