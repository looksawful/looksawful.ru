name: Migration stage A apply

on:
  push:
    branches: [agent/minimal-ci-migration-20260902]
    paths:
      - 'tools/_apply-ci-migration-stage-a.mjs'
      - '.github/workflows/_apply-ci-migration-stage-a.yml'

permissions:
  contents: write

concurrency:
  group: migration-stage-a-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'looksawful/looksawful.ru'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v7
        with:
          ref: agent/minimal-ci-migration-20260902
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply deterministic stage A corrections
        run: node tools/_apply-ci-migration-stage-a.mjs
      - name: Ensure migration is content-preserving
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- src/content/cv.json src/content/editorial/cv.json src/content/projects.json src/content/editorial/home-project-cards.json
      - name: Commit corrected contracts and remove migration helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .pages.yml src/data/cv-source.ts tools/lib/cv-content.mjs test tools/_apply-ci-migration-stage-a.mjs .github/workflows/_apply-ci-migration-stage-a.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: align CMS schema with split content sources'
          git fetch origin agent/minimal-ci-migration-20260902
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/agent/minimal-ci-migration-20260902)"
          git push origin HEAD:agent/minimal-ci-migration-20260902
