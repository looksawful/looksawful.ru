name: Temporary quality tooling audit

on:
  push:
    branches:
      - audit/quality-tooling-335-339

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Measure quality tools
        shell: bash
        run: |
          set -u
          FILES=(src/site/renderers/home/home-image-deferral.ts test/home-image-deferral-canvas.test.mjs)
          mkdir -p /tmp/qcache
          measure() {
            label="$1"; shift
            start=$(date +%s%N)
            set +e
            "$@" >"/tmp/${label}.log" 2>&1
            status=$?
            set -e
            end=$(date +%s%N)
            ms=$(( (end-start)/1000000 ))
            printf '%s\t%s\t%s\n' "$label" "$ms" "$status"
            sed -n '1,80p' "/tmp/${label}.log"
          }
          echo '=== exact dev / changed files ==='
          git rev-parse HEAD
          printf '%s\n' "${FILES[@]}"
          echo '=== timings ms / exit ==='
          export npm_config_cache=/tmp/qcache/oxlint
          rm -rf "$npm_config_cache"
          measure oxlint_changed_cold npx --yes oxlint@1.80.0 "${FILES[@]}"
          measure oxlint_changed_warm npx --yes oxlint@1.80.0 "${FILES[@]}"
          measure oxlint_broad_warm npx --yes oxlint@1.80.0 src tools

          export npm_config_cache=/tmp/qcache/cspell
          rm -rf "$npm_config_cache" .cspellcache
          measure cspell_changed_cold npx --yes --package=cspell@10.2.1 --package=@cspell/dict-ru_ru@2.3.2 cspell --config cspell.json --cache --no-progress "${FILES[@]}"
          measure cspell_changed_warm npx --yes --package=cspell@10.2.1 --package=@cspell/dict-ru_ru@2.3.2 cspell --config cspell.json --cache --no-progress "${FILES[@]}"
          measure cspell_broad_warm npm run spell

          export npm_config_cache=/tmp/qcache/oxfmt
          rm -rf "$npm_config_cache"
          measure oxfmt_changed_cold npx --yes oxfmt@0.66.0 --check "${FILES[@]}"
          measure oxfmt_changed_warm npx --yes oxfmt@0.66.0 --check "${FILES[@]}"
          measure oxfmt_smallset_warm npx --yes oxfmt@0.66.0 --check tools/quality/format.mjs cspell.json package.json "${FILES[@]}"

          echo '=== cspell current glossary / scope ==='
          wc -l cspell-words.txt || true
          sed -n '1,220p' cspell-words.txt || true
          echo '=== direct cspell scan of representative editorial/config surfaces ==='
          export npm_config_cache=/tmp/qcache/cspell
          measure cspell_representative_warm npx --yes --package=cspell@10.2.1 --package=@cspell/dict-ru_ru@2.3.2 cspell --config cspell.json --no-cache --no-progress src/content src/data tools docs '*.md'
