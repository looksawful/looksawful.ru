name: E2E CV Preview Verify Once

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: e2e-cv-preview-once-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore exact generated media cache
        id: media-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}
      - name: Verify restored generated media
        if: steps.media-cache.outputs.cache-hit == 'true'
        run: node tools/media-dev-state.mjs --cache-verify
      - name: Install recovery video tooling on cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Recover generated media on cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          npm run media:sync
          node tools/media-dev-state.mjs --cache-verify
          git diff --exit-code
      - run: npm run build:site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full browser regression
        run: npm run test:e2e:full
