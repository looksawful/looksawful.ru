name: Temporary caption trust 347 RED-GREEN

on:
  push:
    branches:
      - test/caption-trust-boundary-347

permissions:
  contents: write

jobs:
  contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: test/caption-trust-boundary-347
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Apply minimal trust-boundary implementation
        run: |
          cat > src/components/caption-trust.ts <<'EOF'
          /**
           * Normalize authored caption copy while preserving plain-text semantics.
           * Consumers must place the returned value through textContent, never innerHTML.
           */
          export function normalizeCaptionText(
            value: string | null | undefined,
          ): string {
            return value?.replace(/\s+/g, " ").trim() || "";
          }
          EOF
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/media-lightbox.ts")
          source = path.read_text()

          source = source.replace(
              '} from "./photoswipe-lightbox.ts";\n',
              '} from "./photoswipe-lightbox.ts";\nimport { normalizeCaptionText } from "./caption-trust.ts";\n',
              1,
          )
          source = source.replace(
              '  const text = supplemental?.textContent?.replace(/\\s+/g, " ").trim() || "";\n',
              '  const text = normalizeCaptionText(supplemental?.textContent);\n',
              1,
          )
          source = source.replace(
              '      const text = line.textContent?.replace(/\\s+/g, " ").trim() || "";\n',
              '      const text = normalizeCaptionText(line.textContent);\n',
              1,
          )

          path.write_text(source)
          PY
      - name: Caption trust contract
        run: node --test test/caption-trust-boundary.test.mjs
      - name: Existing caption/lightbox contract
        run: node --test test/caption-lightbox-contract.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Fast tests
        run: npm run test:fast
      - name: Commit GREEN implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/caption-trust.ts src/components/media-lightbox.ts
          git diff --cached --quiet && exit 0
          git commit -m "security: make caption text trust boundary explicit"
          git push origin HEAD:test/caption-trust-boundary-347
