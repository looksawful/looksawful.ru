name: tmp-css-458-wave2a

on:
  push:
    branches:
      - refactor/css-458-ownership-cleanup-a

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Confirm RED for the intended ownership reason
        shell: bash
        run: |
          set +e
          node --test test/css-refactor-wave2a.test.mjs > /tmp/css458-red.log 2>&1
          status=$?
          set -e
          cat /tmp/css458-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected Wave 2A ownership contract to be RED before the CSS transform."
            exit 1
          fi
          grep -F "expertise component details have exactly one dedicated owner" /tmp/css458-red.log
          grep -F "experience component details have exactly one dedicated owner" /tmp/css458-red.log

      - name: Apply deterministic CSS-only transform
        run: node tools/tmp-css-458-wave2a.mjs

      - name: Confirm GREEN focused contracts
        run: |
          node --test test/css-refactor-wave2a.test.mjs test/experience-component.test.mjs
          git diff --check

      - name: Commit GREEN CSS change
        shell: bash
        run: |
          test -n "$(git status --short src/styles/components.css)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/components.css
          git commit -m "refactor(css): GREEN remove duplicate expertise and experience owners (#458)"
          git push origin HEAD:refactor/css-458-ownership-cleanup-a
