name: tmp-css-495-verify

on:
  push:
    branches:
      - fix/css-refactor-eof-whitespace-495

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: 72751d54d4228e7ff301d430c9699077741422b0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prove remediation diff is clean
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --check "$BASE_SHA" HEAD
          changed="$(git diff --name-only "$BASE_SHA" HEAD -- ':!.github/workflows/tmp-css-495-verify.yml')"
          expected=$'src/styles/code-block.css\nsrc/styles/site-navigation.css'
          test "$changed" = "$expected"
          git diff --numstat "$BASE_SHA" HEAD -- src/styles/code-block.css src/styles/site-navigation.css
      - name: Scoped formatter
        run: npm run format:check -- src/styles/code-block.css src/styles/site-navigation.css
      - name: Static and focused contracts
        run: |
          npm run lint
          npm run typecheck
          node --test test/code-block-contract.test.mjs test/css-refactor-wave3-code-block.test.mjs test/site-navigation-style.test.mjs
      - name: Fast regression tier
        run: npm run test:fast
