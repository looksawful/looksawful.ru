name: Temporary Full Speed Audit

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: temporary-full-speed-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-with-media-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: npm ci
        run: npm ci
      - name: install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: canonical media sync
        run: npm run media:sync
      - name: install Chromium
        run: npx playwright install --with-deps chromium
      - name: build site
        run: npm run build:site
      - name: e2e smoke aggregate
        continue-on-error: true
        run: npm run test:e2e:smoke
      - name: e2e site
        continue-on-error: true
        run: npm run test:e2e
      - name: e2e navigation
        continue-on-error: true
        run: npm run test:e2e:navigation
      - name: e2e mpa
        continue-on-error: true
        run: npm run test:e2e:mpa
      - name: e2e projects
        continue-on-error: true
        run: npm run test:e2e:projects
      - name: e2e cv
        continue-on-error: true
        run: npm run test:e2e:cv
      - name: e2e full
        continue-on-error: true
        run: npm run test:e2e:full
      - name: e2e affected forced full
        continue-on-error: true
        env:
          E2E_AFFECTED_SUITES: full
        run: npm run test:e2e:affected
      - name: e2e media desk
        continue-on-error: true
        run: npm run test:e2e:media-desk
      - name: responsive UI
        continue-on-error: true
        run: npm run test:ui:responsive
