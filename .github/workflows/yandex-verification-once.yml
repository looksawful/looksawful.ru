name: Add Yandex Webmaster verification

on:
  push:
    branches: [prod]
    paths:
      - .github/workflows/yandex-verification-once.yml

permissions:
  contents: write

jobs:
  add-verification-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prod
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: Add Yandex verification meta
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          tag = '    <meta name="yandex-verification" content="cc027279813a09f5" />'
          if tag in text:
              raise SystemExit(0)

          needle = '    <meta content="width=device-width, initial-scale=1.0" name="viewport">\n'
          if needle not in text:
              raise SystemExit("viewport meta not found in index.html")

          path.write_text(text.replace(needle, needle + tag + "\n", 1), encoding="utf-8")
          PY

      - name: Commit to prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: add Yandex Webmaster verification"
          git push origin HEAD:prod
