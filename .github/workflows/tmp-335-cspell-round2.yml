name: tmp-335-cspell-round2

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Measure current and candidate spelling scopes
        shell: bash
        run: |
          set -u
          export npm_config_cache=/tmp/qcache/cspell
          rm -rf "$npm_config_cache" .cspellcache

          measure() {
            label="$1"; shift
            start=$(date +%s%N)
            set +e
            "$@" >"/tmp/${label}.log" 2>&1
            status=$?
            set -e
            end=$(date +%s%N)
            ms=$(( (end-start)/1000000 ))
            printf '\n=== %s: %sms exit=%s ===\n' "$label" "$ms" "$status"
            sed -n '1,260p' "/tmp/${label}.log"
          }

          echo "HEAD=$(git rev-parse HEAD)"
          echo "BASE=$(git rev-parse HEAD^ 2>/dev/null || true)"

          measure broad npm run spell -- --no-cache

          jq '.ignorePaths = [
            "node_modules/**",
            "dist/**",
            "archive/**",
            "public/media/**",
            "public/vendor/**",
            ".cache/**",
            "package-lock.json",
            ".pages.yml",
            "**/*.min.*",
            "**/*.generated.*",
            "**/generated/**",
            "**/fixtures/**",
            "**/*.{png,jpg,jpeg,webp,avif,gif,svg,mp4,webm,mov,mp3,wav,woff,woff2,ttf,otf}"
          ]' cspell.json > cspell-public.tmp.json

          CSPELL=(npx --yes --package=cspell@10.2.1 --package=@cspell/dict-ru_ru@2.3.2 cspell --config cspell-public.tmp.json --no-cache --no-progress)
          measure public_privacy "${CSPELL[@]}" "public/privacy/**/*.html"
          measure public_docs "${CSPELL[@]}" "public/docs/**/*.html"
          measure public_cv "${CSPELL[@]}" "public/cv/**/*.{html,js,json,md}"

          rm -f cspell-public.tmp.json
          git status --short
