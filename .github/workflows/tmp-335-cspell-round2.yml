name: tmp-335-cspell-round2

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Measure current and candidate spelling scopes
        shell: bash
        run: |
          set -u
          export npm_config_cache=/tmp/qcache/cspell
          rm -rf "$npm_config_cache" .cspellcache

          measure() {
            label="$1"; shift
            start=$(date +%s%N)
            set +e
            "$@" >"/tmp/${label}.log" 2>&1
            status=$?
            set -e
            end=$(date +%s%N)
            ms=$(( (end-start)/1000000 ))
            printf '\n=== %s: %sms exit=%s ===\n' "$label" "$ms" "$status"
            sed -n '1,360p' "/tmp/${label}.log"
          }

          echo "HEAD=$(git rev-parse HEAD)"
          echo "BASE=$(git rev-parse HEAD^ 2>/dev/null || true)"

          measure broad npm run spell -- --no-cache

          echo '\n=== broad unique unknown words ==='
          set +e
          npx --yes --package=cspell@10.2.1 --package=@cspell/dict-ru_ru@2.3.2 \
            cspell --config cspell.json --no-cache --no-progress --words-only --unique \
            "src/**/*.{ts,js,mjs,cjs,html,css,json,md}" \
            "tools/**/*.{ts,js,mjs,cjs,json,md}" \
            "docs/**/*.md" "*.md" 2>/dev/null | sort -fu
          set -e

          cp cspell.json /tmp/cspell-original.json
          jq '.useGitignore = false | .ignorePaths = [
            "node_modules/**",
            "dist/**",
            "archive/**",
            "public/media/**",
            "public/vendor/**",
            ".cache/**",
            "package-lock.json",
            ".pages.yml",
            "**/*.min.*",
            "**/*.generated.*",
            "**/generated/**",
            "**/fixtures/**",
            "**/*.{png,jpg,jpeg,webp,avif,gif,svg,mp4,webm,mov,mp3,wav,woff,woff2,ttf,otf}"
          ]' /tmp/cspell-original.json > cspell.json

          CSPELL=(npx --yes --package=cspell@10.2.1 --package=@cspell/dict-ru_ru@2.3.2 cspell --config cspell.json --no-gitignore --no-cache --no-progress --verbose)
          measure public_privacy "${CSPELL[@]}" public/privacy/index.html
          measure public_docs "${CSPELL[@]}" "public/docs/*.html"
          measure public_cv "${CSPELL[@]}" public/cv/index.html

          cp /tmp/cspell-original.json cspell.json
          git status --short
