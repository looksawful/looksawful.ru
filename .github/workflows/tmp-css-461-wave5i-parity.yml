name: tmp-css-461-wave5i-parity
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  parity:
    if: github.head_ref == 'refactor/css-461-wave5i-masonry'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refactor/css-461-wave5i-masonry
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare exact base to masonry candidate
        shell: bash
        run: |
          git worktree add --detach /tmp/wave5i-base 8d73b4660565de68ea02233afa4a2e60df5f4e18
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/wave5i-base/node_modules
          ./node_modules/.bin/vite . --host 127.0.0.1 --port 4173 > /tmp/wave5i-candidate.log 2>&1 &
          CANDIDATE_PID=$!
          ./node_modules/.bin/vite /tmp/wave5i-base --host 127.0.0.1 --port 4174 > /tmp/wave5i-base.log 2>&1 &
          BASE_PID=$!
          trap 'kill $CANDIDATE_PID $BASE_PID 2>/dev/null || true' EXIT
          for PORT in 4173 4174; do
            READY=0
            for i in {1..30}; do
              if curl -fsS "http://127.0.0.1:$PORT/work/styx/" >/dev/null; then READY=1; break; fi
              sleep 1
            done
            test "$READY" = 1
          done
          cat > "$GITHUB_WORKSPACE/.tmp-wave5i-parity.mjs" <<'NODE'
          import { chromium } from "playwright";
          import { writeFileSync } from "node:fs";

          const cases = [
            { route: "/work/styx/", widths: [390, 900, 1728] },
            { route: "/shootings/", widths: [390, 900, 1728] },
          ];
          const tolerance = 0.25;
          const browser = await chromium.launch({ headless: true });
          const round = (value) => Math.round(value * 1000) / 1000;
          const relativeRect = (rect, origin) => ({
            x: round(rect.x - origin.x), y: round(rect.y - origin.y),
            width: round(rect.width), height: round(rect.height),
          });

          async function capture(port) {
            const page = await browser.newPage({ reducedMotion: "reduce" });
            page.setDefaultTimeout(12000);
            page.setDefaultNavigationTimeout(15000);
            const output = [];
            for (const testCase of cases) {
              for (const width of testCase.widths) {
                await page.setViewportSize({ width, height: 1000 });
                await page.goto(`http://127.0.0.1:${port}${testCase.route}`, { waitUntil: "domcontentloaded" });
                await page.evaluate(() => document.fonts?.ready);
                const groups = page.locator('.media-group[data-layout="masonry"]');
                const count = await groups.count();
                if (!count) throw new Error(`no masonry groups: ${testCase.route} @ ${width}`);
                for (let index = 0; index < count; index += 1) {
                  const group = groups.nth(index);
                  const box = await group.boundingBox();
                  if (!box || box.width === 0) continue;
                  await group.scrollIntoViewIfNeeded();
                  await group.evaluate(async (node) => {
                    const waits = [...node.querySelectorAll("img")].map((img) =>
                      Promise.race([
                        img.decode?.().catch(() => undefined) ?? Promise.resolve(),
                        new Promise((resolve) => setTimeout(resolve, 800)),
                      ]),
                    );
                    await Promise.all(waits);
                    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                  });
                  output.push(await group.evaluate((node, meta) => {
                    const items = node.querySelector(':scope > .media-group__items');
                    if (!items) throw new Error('masonry group missing items');
                    const itemsRect = items.getBoundingClientRect();
                    const style = getComputedStyle(items);
                    return {
                      ...meta,
                      index,
                      groupClass: node.className,
                      groupColumnsInput: getComputedStyle(node).getPropertyValue('--masonry-columns').trim(),
                      groupMobileColumnsInput: getComputedStyle(node).getPropertyValue('--masonry-mobile-columns').trim(),
                      columns: style.columns,
                      columnCount: style.columnCount,
                      columnWidth: style.columnWidth,
                      columnGap: style.columnGap,
                      itemsRect: { x: itemsRect.x, y: itemsRect.y, width: itemsRect.width, height: itemsRect.height },
                      children: [...items.children].map((child) => {
                        const rect = child.getBoundingClientRect();
                        const cs = getComputedStyle(child);
                        const surface = child.querySelector('.media__surface');
                        const surfaceRect = surface?.getBoundingClientRect() ?? null;
                        const ss = surface ? getComputedStyle(surface) : null;
                        const media = surface?.querySelector(':scope > img, :scope > video, :scope > picture > img') ?? null;
                        const ms = media ? getComputedStyle(media) : null;
                        return {
                          rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
                          surfaceRect: surfaceRect ? { x: surfaceRect.x, y: surfaceRect.y, width: surfaceRect.width, height: surfaceRect.height } : null,
                          breakInside: cs.breakInside,
                          marginBlockEnd: cs.marginBlockEnd,
                          transform: cs.transform,
                          aspectRatio: ss?.aspectRatio ?? null,
                          mediaRatio: ss?.getPropertyValue('--media-ratio').trim() ?? null,
                          mediaFit: ss?.getPropertyValue('--media-fit').trim() ?? null,
                          objectFit: ms?.objectFit ?? null,
                          objectPosition: ms?.objectPosition ?? null,
                        };
                      }),
                    };
                  }, { route: testCase.route, width }));
                }
              }
            }
            await page.close();
            return output;
          }

          const base = await capture(4174);
          const candidate = await capture(4173);
          const failures = [];
          const groupStrings = ['route','width','index','groupClass','groupColumnsInput','groupMobileColumnsInput','columns','columnCount','columnWidth','columnGap'];
          const childStrings = ['breakInside','marginBlockEnd','transform','aspectRatio','mediaRatio','mediaFit','objectFit','objectPosition'];
          if (base.length !== candidate.length) failures.push(`group count ${base.length} != ${candidate.length}`);
          for (let i = 0; i < Math.min(base.length, candidate.length); i += 1) {
            const a = base[i], b = candidate[i];
            for (const key of groupStrings) if (a[key] !== b[key]) failures.push(`group ${i} ${key}: ${a[key]} != ${b[key]}`);
            if (a.children.length !== b.children.length) failures.push(`group ${i} child count: ${a.children.length} != ${b.children.length}`);
            for (let j = 0; j < Math.min(a.children.length, b.children.length); j += 1) {
              const ac = a.children[j], bc = b.children[j];
              for (const key of childStrings) if (ac[key] !== bc[key]) failures.push(`group ${i} child ${j} ${key}: ${ac[key]} != ${bc[key]}`);
              for (const rectName of ['rect','surfaceRect']) {
                if (!ac[rectName] || !bc[rectName]) {
                  if (Boolean(ac[rectName]) !== Boolean(bc[rectName])) failures.push(`group ${i} child ${j} ${rectName}: presence mismatch`);
                  continue;
                }
                const ar = relativeRect(ac[rectName], a.itemsRect);
                const br = relativeRect(bc[rectName], b.itemsRect);
                for (const key of ['x','y','width','height']) {
                  if (Math.abs(ar[key] - br[key]) > tolerance) failures.push(`group ${i} child ${j} ${rectName}.${key}: ${ar[key]} != ${br[key]}`);
                }
              }
            }
          }
          const report = { baseSha: '8d73b4660565de68ea02233afa4a2e60df5f4e18', candidateSha: process.env.GITHUB_SHA, tolerance, base, candidate, failures };
          writeFileSync('wave5i-masonry-parity.json', JSON.stringify(report, null, 2));
          console.log(`Wave5I masonry parity: groups=${base.length}, failures=${failures.length}`);
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exitCode = 1;
          }
          await browser.close();
          NODE
          node "$GITHUB_WORKSPACE/.tmp-wave5i-parity.mjs"
          rm "$GITHUB_WORKSPACE/.tmp-wave5i-parity.mjs"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wave5i-masonry-parity
          path: wave5i-masonry-parity.json
