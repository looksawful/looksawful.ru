name: Refresh blog dependency lockfile

on:
  push:
    branches:
      - feat/blog-v1-editorial
    paths:
      - package.json
      - .github/workflows/blog-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/blog-v1-editorial
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(blog): refresh dependency lockfile"
          git push origin HEAD:feat/blog-v1-editorial
