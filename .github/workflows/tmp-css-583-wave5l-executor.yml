name: tmp-css-583-wave5l-executor

on:
  push:
    branches:
      - refactor/css-461-wave5l-media-group-base
    paths:
      - .github/workflows/tmp-css-583-wave5l-executor.yml

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16

      - name: Refresh from fresh dev with overlap guard
        shell: bash
        env:
          EXPECTED_PREP_HEAD: 26cd512ac297f426c9e5d3218a3ca3defc4d7ff1
          ORIGINAL_BASE: 3e36f9e860d898b7de78564d8ac745819d37abab
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_PREP_HEAD" HEAD
          git fetch --no-tags --depth=64 origin dev
          CURRENT_DEV="$(git rev-parse FETCH_HEAD)"
          git merge-base --is-ancestor "$ORIGINAL_BASE" "$CURRENT_DEV"

          if git diff --name-only "$ORIGINAL_BASE" "$CURRENT_DEV" -- \
            src/styles/index.css \
            src/styles/components.css \
            src/styles/media.css \
            test/css-refactor-wave5b-media-group-foundation.test.mjs \
            test/css-refactor-wave5c-grid-compact.test.mjs \
            test/css-refactor-wave5l-media-group-base.test.mjs \
            test/run-fast-tests.mjs | grep -q .; then
            echo "Fresh dev overlaps Wave5L scope; refusing automatic refresh."
            git diff --name-only "$ORIGINAL_BASE" "$CURRENT_DEV" -- \
              src/styles/index.css \
              src/styles/components.css \
              src/styles/media.css \
              test/css-refactor-wave5b-media-group-foundation.test.mjs \
              test/css-refactor-wave5c-grid-compact.test.mjs \
              test/css-refactor-wave5l-media-group-base.test.mjs \
              test/run-fast-tests.mjs
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "$CURRENT_DEV"
          echo "Refreshed Wave5L from dev $CURRENT_DEV"

      - name: Apply declaration-preserving Wave5L ownership move
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          components_path = Path('src/styles/components.css')
          media_path = Path('src/styles/media.css')
          wave5c_path = Path('test/css-refactor-wave5c-grid-compact.test.mjs')

          components = components_path.read_text()
          media = media_path.read_text()
          wave5c = wave5c_path.read_text()

          block = '''.media-group {
            /* Resolve authored component inputs before project and system fallbacks. */
            --group-gap: var(--media-group-gap, var(--project-media-gap, var(--size-300)));
            --group-row-gap: var(--media-group-row-gap, var(--project-media-row-gap, var(--group-gap)));
            --group-columns: 2;
            --group-mobile-columns: 2;

            container: media-group / inline-size;
            display: grid;
            gap: clamp(0.9rem, 1.6cqi, 1.5rem);
            inline-size: min(100%, var(--group-max, var(--project-media-max)));
            margin-inline: auto;
            min-inline-size: 0;
          }'''.replace('          ', '')

          if components.count(block) != 1:
              raise SystemExit(f'expected one generic media-group base in components.css, got {components.count(block)}')
          if block in media:
              raise SystemExit('generic media-group base already exists in media.css')
          if media.count('.media-group__head {') != 1:
              raise SystemExit('expected one media-group__head anchor in media.css')

          components = components.replace(block + '\n\n', '', 1)
          media = media.replace('.media-group__head {', block + '\n\n.media-group__head {', 1)

          old_test = re.compile(
              r'test\("generic media-group base keeps the explicit spacing resolver outside Wave5C", \(\) => \{\n'
              r'[\s\S]*?\n\}\);\n?$',
          )
          new_test = '''test("generic media-group base now shares the canonical media owner with Wave5C", () => {
            assert.match(
              media,
              /\\.media-group\\s*\\{[\\s\\S]*?--group-gap:\\s*var\\(--media-group-gap,\\s*var\\(--project-media-gap,\\s*var\\(--size-300\\)\\)\\);[\\s\\S]*?--group-row-gap:\\s*var\\(--media-group-row-gap,\\s*var\\(--project-media-row-gap,\\s*var\\(--group-gap\\)\\)\\);[\\s\\S]*?container:\\s*media-group\\s*\\/\\s*inline-size;/,
            );
            assert.doesNotMatch(components, /(?:^|\\n)\\.media-group\\s*\\{/);
          });
          '''.replace('          ', '')
          wave5c, count = old_test.subn(new_test, wave5c)
          if count != 1:
              raise SystemExit(f'expected one historical Wave5C base-owner test, got {count}')

          components_path.write_text(components)
          media_path.write_text(media)
          wave5c_path.write_text(wave5c)
          PY

      - name: Focused Wave5 ownership contracts
        run: >-
          node --test
          test/css-refactor-wave5b-media-group-foundation.test.mjs
          test/css-refactor-wave5c-grid-compact.test.mjs
          test/css-refactor-wave5l-media-group-base.test.mjs

      - name: Diff hygiene and exact ownership proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(grep -c '^\.media-group {$' src/styles/media.css)" -eq 1
          test "$(grep -c '^\.media-group {$' src/styles/components.css || true)" -eq 0
          git diff -- src/styles/media.css src/styles/components.css test/css-refactor-wave5c-grid-compact.test.mjs

      - name: Remove one-shot executor and commit product tree
        shell: bash
        env:
          BRANCH: refactor/css-461-wave5l-media-group-base
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-css-583-wave5l-executor.yml
          git add src/styles/components.css src/styles/media.css test/css-refactor-wave5c-grid-compact.test.mjs
          git commit -m "refactor(css): finish generic media-group ownership"
          git push origin "HEAD:$BRANCH"
