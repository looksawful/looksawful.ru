name: TEMP Nav 393 Visual Cycle

on:
  push:
    branches:
      - fix/site-nav-legacy-border-393

permissions:
  contents: write

jobs:
  visual-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium Firefox WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: RED ownership contract
        shell: bash
        run: |
          set -euo pipefail
          python tools/tmp-nav-393-patch.py contracts
          if node --test test/site-navigation-style.test.mjs; then
            echo 'ERROR: expected ownership contract RED before cleanup' >&2
            exit 1
          fi
          echo 'RED_CONFIRMED: legacy .site-nav ownership is caught'
      - name: Cross-browser visual baseline
        run: node tools/tmp-nav-393-matrix.mjs before present
      - name: Apply deletion-only CSS cleanup
        shell: bash
        run: |
          set -euo pipefail
          python tools/tmp-nav-393-patch.py fix
          node --test test/site-navigation-style.test.mjs
          if git diff -- src/styles/site-navigation.css | grep -q .; then
            echo 'ERROR: site-navigation.css changed; #393 must not add an override' >&2
            exit 1
          fi
      - name: Cross-browser visual GREEN
        run: node tools/tmp-nav-393-matrix.mjs after absent
      - name: Existing Chromium navigation smoke
        run: npm run test:e2e:navigation
      - name: Upload before and after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav-393-cross-browser-visuals
          path: tmp-nav-393-artifacts
          if-no-files-found: warn
      - name: Commit only permanent files and delete temporary harness
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-nav-393-visual-cycle.yml tools/tmp-nav-393-matrix.mjs tools/tmp-nav-393-patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/components.css test/site-navigation-style.test.mjs tools/smoke-site-navigation.mjs
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' 'src/styles/components.css' 'test/site-navigation-style.test.mjs' 'tools/smoke-site-navigation.mjs' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'ERROR: final staged diff is not exactly the three permanent files' >&2
            printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
            exit 1
          fi
          echo 'FINAL_DIFF:'
          git diff --cached --stat
          git commit -m 'fix(ui): remove legacy site-nav border (#393)'
          git push origin HEAD:fix/site-nav-legacy-border-393
