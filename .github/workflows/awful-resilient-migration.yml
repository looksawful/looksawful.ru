name: Awful resilient migration

on:
  push:
    branches: [contact-hub-frontend-current]
    paths:
      - tools/migrate-awful-canonical.py
      - .github/workflows/awful-resilient-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical Awful migration
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: contact-hub-frontend-current
        run: python tools/migrate-awful-canonical.py
