name: Browser Setup Proof 594

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:vite
      - uses: ./.github/actions/setup-browser
      - run: npm run test:ui:responsive
