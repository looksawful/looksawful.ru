name: Temporary Page Architecture Index Cleanup

on:
  push:
    branches:
      - agent/page-architecture-wave2-render-pipeline-20260904
    paths:
      - .github/workflows/page-architecture-index-cleanup-temp.yml

permissions:
  contents: write

concurrency:
  group: page-architecture-index-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact feature revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify expected RED before cleanup
        shell: bash
        run: |
          set +e
          node --test test/site-rendering.test.mjs > /tmp/source-shell-red.log 2>&1
          status=$?
          set -e
          cat /tmp/source-shell-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected source-shell contract to be RED before cleanup"
            exit 1
          fi
          grep -F 'project-jestei still carries legacy source-template body' /tmp/source-shell-red.log
      - name: Collapse canonical entity source bodies
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const targets = [
            ['project-jestei', 'JESTEI_'],
            ['project-styx', 'STYX_'],
            ['project-sensetique', 'SENSETIQUE_'],
            ['project-shootings', 'SHOOTINGS_'],
          ];

          let source = readFileSync('index.html', 'utf8');

          function collapseArticleBody(html, id, markerPrefix) {
            const openingPattern = new RegExp(`<article\\b(?=[^>]*\\bid=["']${id}["'])[^>]*>`, 'g');
            const openings = [...html.matchAll(openingPattern)];
            if (openings.length !== 1) {
              throw new Error(`${id}: expected exactly one opening article, found ${openings.length}`);
            }

            const opening = openings[0];
            const start = opening.index;
            if (typeof start !== 'number') throw new Error(`${id}: missing article offset`);
            const innerStart = start + opening[0].length;

            const tags = /<article\\b[^>]*>|<\\/article>/gi;
            tags.lastIndex = start;
            let depth = 0;
            let closeStart = -1;
            for (let match = tags.exec(html); match; match = tags.exec(html)) {
              if (/^<\\/article/i.test(match[0])) {
                depth -= 1;
                if (depth === 0) {
                  closeStart = match.index;
                  break;
                }
              } else {
                depth += 1;
              }
            }
            if (closeStart < 0) throw new Error(`${id}: missing matching closing article`);

            const body = html.slice(innerStart, closeStart);
            if (!body.includes(`<!-- ${markerPrefix}`)) {
              throw new Error(`${id}: expected legacy ${markerPrefix} marker before cleanup`);
            }

            return html.slice(0, innerStart) + '\n        ' + html.slice(closeStart);
          }

          for (const [id, markerPrefix] of targets) {
            source = collapseArticleBody(source, id, markerPrefix);
          }

          for (const prefix of ['JESTEI_', 'STYX_', 'SENSETIQUE_', 'SHOOTINGS_']) {
            if (source.includes(`<!-- ${prefix}`)) {
              throw new Error(`Legacy ${prefix} marker remains after cleanup`);
            }
          }

          writeFileSync('index.html', source);
          NODE
      - name: Verify GREEN after cleanup
        run: node --test test/site-rendering.test.mjs test/site-composition.test.mjs
      - name: Verify diff scope
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "index.html"
      - name: Commit cleaned source shell
        shell: bash
        run: |
          remote_head="$(git ls-remote origin refs/heads/agent/page-architecture-wave2-render-pipeline-20260904 | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Feature head moved: expected $GITHUB_SHA, got $remote_head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor(page-architecture): remove legacy entity source bodies"
          git push origin HEAD:agent/page-architecture-wave2-render-pipeline-20260904
