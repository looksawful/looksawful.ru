name: tmp-css-461-wave5b-narrow

on:
  push:
    branches:
      - test/css-461-wave5b-media-group-owner-red

permissions:
  contents: write

jobs:
  narrow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/css-461-wave5b-media-group-owner-red
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore generic base while keeping safe substructure in media owner
        shell: python
        run: |
          from pathlib import Path
          components_path = Path('src/styles/components.css')
          media_path = Path('src/styles/media.css')
          components = components_path.read_text(encoding='utf-8')
          media = media_path.read_text(encoding='utf-8')

          marker = "/* ==================================================\n   Media groups\n   ================================================== */\n\n"
          head_marker = ".media-group__head {"
          plain_marker = "/* Plain grid. */"
          m = media.find(marker)
          h = media.find(head_marker, m if m >= 0 else 0)
          p = components.find(plain_marker)
          if m < 0 or h < 0 or p < 0:
              raise SystemExit('guard failed: expected narrowed transform markers missing')
          if media.find(marker, m + 1) >= 0:
              raise SystemExit('guard failed: duplicate media-group marker in media.css')
          base_block = media[m:h]
          if '.media-group {' not in base_block or 'container: media-group / inline-size;' not in base_block:
              raise SystemExit('guard failed: generic media-group base not found in exact block')
          if '.media-group__head {' in base_block:
              raise SystemExit('guard failed: base block includes moved substructure')
          if '.media-group {' in components:
              raise SystemExit('guard failed: components already contains generic media-group base')

          # Keep the family marker and substructure in media.css, but restore the
          # generic base immediately before Plain grid, matching its historical
          # relative position against early portfolio specializations.
          new_media = media[:m] + marker + media[h:]
          base_rule = base_block[len(marker):].rstrip() + '\n\n'
          new_components = components[:p] + base_rule + components[p:]
          media_path.write_text(new_media, encoding='utf-8')
          components_path.write_text(new_components, encoding='utf-8')
      - name: Focused contracts
        run: |
          node --test test/css-refactor-wave5a-media-core.test.mjs test/css-refactor-wave5b-media-group-foundation.test.mjs test/css-refactor-wave4d-project-shell.test.mjs
      - name: Commit narrowed move
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/styles/components.css src/styles/media.css
          git commit -m "refactor(css): narrow Wave5B to media-group substructure"
          git push origin HEAD:test/css-461-wave5b-media-group-owner-red
