name: Gallery media sync (temporary)

on:
  push:
    branches: [feature/gallery-prerelease]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Gallery feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/gallery-prerelease
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Synchronize Media Catalog import index
        run: npm run media:catalog:sync
      - name: Verify deterministic catalog
        run: npm run media:catalog:check
      - name: Commit generated catalog metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/media/catalog-records.generated.ts src/content/media-catalog/registered
          git diff --cached --quiet && exit 0
          git commit -m 'chore(media): sync Gallery catalog metadata'
          git push origin HEAD:feature/gallery-prerelease
