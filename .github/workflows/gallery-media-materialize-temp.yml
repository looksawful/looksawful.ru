name: Gallery media materialize (temporary)

on:
  push:
    branches: [feature/gallery-prerelease]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Gallery feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/gallery-prerelease
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Materialize canonical media state
        run: npm run media:sync
      - name: Verify canonical media state
        run: node tools/media-dev-state.mjs --cache-verify
      - name: Commit tracked generated media metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/data/media/catalog-records.generated.ts \
            src/data/media/responsive-generated.ts \
            public/media/generated/responsive-manifest.json \
            public/media/generated/video-inventory.json \
            src/content/media-catalog/registered \
            src/content/media-catalog/uploads
          git diff --cached --quiet && exit 0
          git commit -m 'chore(media): materialize Gallery responsive metadata'
          git push origin HEAD:feature/gallery-prerelease
