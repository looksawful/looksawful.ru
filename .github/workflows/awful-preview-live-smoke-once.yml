name: Awful Preview Live Smoke Once

on:
  push:
    branches: [contact-hub-frontend-current]
    paths:
      - ".github/workflows/awful-preview-live-smoke-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask deployed Awful about Styx once
        shell: bash
        env:
          PREVIEW_API: https://7c5fa9ef.looksawful-ru-preview.pages.dev/api/portfolio-chat
        run: |
          set -euo pipefail
          payload='{"message":"Расскажи про Styx","locale":"ru","sessionId":"one-time-live-smoke","context":{"sourceIds":["project.styx"],"page":"/"}}'
          code="$(curl --silent --show-error --connect-timeout 10 --max-time 45 \
            --output "$RUNNER_TEMP/awful-chat-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$PREVIEW_API")"

          if [ "$code" != "200" ]; then
            echo "Awful preview chat returned HTTP $code"
            jq '{kind, sources}' "$RUNNER_TEMP/awful-chat-response.json" 2>/dev/null || true
            exit 1
          fi

          jq -e '.kind == "answer" and (.text | type == "string" and length > 0) and (.sources | index("project.styx") != null)' \
            "$RUNNER_TEMP/awful-chat-response.json" >/dev/null

          answer="$(jq -r '.text' "$RUNNER_TEMP/awful-chat-response.json")"
          if printf '%s' "$answer" | grep -Eq '\+7[[:space:]-]*999[[:space:]-]*113'; then
            echo "Phone leakage guard failed."
            exit 1
          fi

          echo "Awful deployed preview chat: OK"
          printf 'Answer: %s\n' "$answer"
