name: tmp-css-461-fast-ci-registration

on:
  push:
    branches:
      - fix/css-461-strip-justify-contract

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prove missing Fast CI registration is RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --test test/css-refactor-wave5d-strip-justify-contract.test.mjs > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'expected missing Fast CI registration to fail before implementation' >&2
            exit 1
          fi
          grep -F 'Wave5C and Wave5D ownership contracts are mandatory Fast CI tests' /tmp/red.log
      - name: Register Wave5C and Wave5D in Fast CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/ci/run-tests.mjs')
          text = path.read_text()
          anchor = '  "test/css-refactor-wave5b-media-group-foundation.test.mjs",\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one Wave5B Fast CI anchor, found {text.count(anchor)}')
          for target in (
              'test/css-refactor-wave5c-grid-compact.test.mjs',
              'test/css-refactor-wave5d-strip-justify-contract.test.mjs',
          ):
              if target in text:
                  raise SystemExit(f'{target} is already registered unexpectedly')
          insertion = anchor + '  "test/css-refactor-wave5c-grid-compact.test.mjs",\n  "test/css-refactor-wave5d-strip-justify-contract.test.mjs",\n'
          path.write_text(text.replace(anchor, insertion, 1))
          PY
      - name: Prove registration and focused contracts GREEN
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/test-groups.test.mjs \
            test/css-refactor-wave5b-media-group-foundation.test.mjs \
            test/css-refactor-wave5c-grid-compact.test.mjs \
            test/css-refactor-wave5d-strip-justify-contract.test.mjs
          node tools/ci/run-tests.mjs fast
          git diff --check
      - name: Remove temporary workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-css-461-fast-ci-registration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/ci/run-tests.mjs test/css-refactor-wave5d-strip-justify-contract.test.mjs
          git commit -m 'test(ci): gate Wave5C and Wave5D ownership contracts'
          git push origin HEAD:fix/css-461-strip-justify-contract
