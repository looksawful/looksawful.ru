name: Temporary E2E Decode Diagnostics RED

on:
  pull_request:
    branches: [dev]
    paths:
      - "tools/e2e/run-smoke.mjs"
      - "test/e2e-production-pipeline.test.mjs"
      - ".github/workflows/tmp-e2e-decode-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test test/e2e-production-pipeline.test.mjs
