name: tmp-css-574-fade-browser
on:
  push:
    branches: [fix/css-574-infinite-reel-fade-input]
permissions:
  contents: read
jobs:
  browser:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/css-574-infinite-reel-fade-input
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Vite source server
        shell: bash
        run: |
          npx vite --host 127.0.0.1 --port 4173 > /tmp/css574-vite.log 2>&1 &
          echo $! > /tmp/css574-vite.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/css574-vite.log
          exit 1
      - name: Compare candidate with historical generic fade winner
        shell: bash
        run: |
          cat > css574-browser.mjs <<'NODE'
          import { chromium } from 'playwright';

          const routes = ['/', '/work/jestei-pool/', '/shootings/', '/work/sensetique/'];
          const viewports = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 900, height: 1000 },
            { name: 'desktop', width: 1728, height: 1000 },
          ];
          const browser = await chromium.launch({ headless: true });
          const failures = [];
          const results = [];
          const round = (n) => Math.round(n * 1000) / 1000;
          const geometry = (r) => r && ({ x: round(r.x), y: round(r.y), width: round(r.width), height: round(r.height) });
          const equalGeometry = (a, b, tolerance = 0.05) => {
            if (!a || !b) return a === b;
            return ['x','y','width','height'].every((key) => Math.abs(a[key] - b[key]) <= tolerance);
          };

          for (const viewport of viewports) {
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height }, reducedMotion: 'no-preference' });
            const page = await context.newPage();
            for (const route of routes) {
              await page.goto(`http://127.0.0.1:4173${route}`, { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(250);
              const reelCount = await page.locator('[data-infinite-reel]').count();
              for (let index = 0; index < reelCount; index++) {
                const reel = page.locator('[data-infinite-reel]').nth(index);
                if (!(await reel.isVisible())) continue;
                await reel.scrollIntoViewIfNeeded().catch(() => {});
                await page.waitForTimeout(120);
                const record = await reel.evaluate((root) => {
                  const track = root.querySelector(':scope > [data-infinite-reel-track]');
                  if (track instanceof HTMLElement) track.style.animationPlayState = 'paused';
                  const style = getComputedStyle(root);
                  const trackStyle = track instanceof HTMLElement ? getComputedStyle(track) : null;
                  const rect = root.getBoundingClientRect();
                  const trackRect = track instanceof HTMLElement ? track.getBoundingClientRect() : null;
                  return {
                    specialized: root.classList.contains('portfolio-logo-wall'),
                    className: root.className,
                    rawFade: style.getPropertyValue('--infinite-reel-fade-size').trim(),
                    mask: style.maskImage,
                    webkitMask: style.webkitMaskImage,
                    overflowX: style.overflowX,
                    overflowY: style.overflowY,
                    duration: style.getPropertyValue('--infinite-reel-duration').trim(),
                    gap: trackStyle?.columnGap ?? '',
                    animationName: trackStyle?.animationName ?? '',
                    animationDuration: trackStyle?.animationDuration ?? '',
                    animationPlayState: trackStyle?.animationPlayState ?? '',
                    rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
                    trackRect: trackRect ? { x: trackRect.x, y: trackRect.y, width: trackRect.width, height: trackRect.height } : null,
                    scrollWidth: track instanceof HTMLElement ? track.scrollWidth : null,
                    childCount: track instanceof HTMLElement ? track.children.length : null,
                  };
                });

                const styleId = 'css574-historical-winner';
                await page.evaluate((id) => {
                  document.getElementById(id)?.remove();
                  const style = document.createElement('style');
                  style.id = id;
                  style.textContent = '[data-infinite-reel]{--infinite-reel-fade-size:clamp(2rem,7cqi,6rem);}';
                  document.head.append(style);
                }, styleId);
                const historical = await reel.evaluate((root) => {
                  const track = root.querySelector(':scope > [data-infinite-reel-track]');
                  const style = getComputedStyle(root);
                  const trackStyle = track instanceof HTMLElement ? getComputedStyle(track) : null;
                  const rect = root.getBoundingClientRect();
                  const trackRect = track instanceof HTMLElement ? track.getBoundingClientRect() : null;
                  return {
                    rawFade: style.getPropertyValue('--infinite-reel-fade-size').trim(),
                    mask: style.maskImage,
                    webkitMask: style.webkitMaskImage,
                    overflowX: style.overflowX,
                    overflowY: style.overflowY,
                    duration: style.getPropertyValue('--infinite-reel-duration').trim(),
                    gap: trackStyle?.columnGap ?? '',
                    animationName: trackStyle?.animationName ?? '',
                    animationDuration: trackStyle?.animationDuration ?? '',
                    animationPlayState: trackStyle?.animationPlayState ?? '',
                    rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
                    trackRect: trackRect ? { x: trackRect.x, y: trackRect.y, width: trackRect.width, height: trackRect.height } : null,
                    scrollWidth: track instanceof HTMLElement ? track.scrollWidth : null,
                    childCount: track instanceof HTMLElement ? track.children.length : null,
                  };
                });
                await page.evaluate((id) => document.getElementById(id)?.remove(), styleId);

                const currentRect = geometry(record.rect);
                const historicalRect = geometry(historical.rect);
                const currentTrackRect = geometry(record.trackRect);
                const historicalTrackRect = geometry(historical.trackRect);
                const geometryStable = equalGeometry(currentRect, historicalRect) && equalGeometry(currentTrackRect, historicalTrackRect) && record.scrollWidth === historical.scrollWidth && record.childCount === historical.childCount;
                const mechanicsStable = record.overflowX === historical.overflowX && record.overflowY === historical.overflowY && record.duration === historical.duration && record.gap === historical.gap && record.animationName === historical.animationName && record.animationDuration === historical.animationDuration;
                const maskChanged = record.mask !== historical.mask || record.webkitMask !== historical.webkitMask;

                if (!geometryStable) failures.push(`${viewport.name} ${route} reel ${index}: geometry changed`);
                if (!mechanicsStable) failures.push(`${viewport.name} ${route} reel ${index}: non-fade mechanics changed`);
                if (record.specialized) {
                  if (!record.rawFade.includes('1.5rem') || !record.rawFade.includes('4cqi')) failures.push(`${viewport.name} ${route} reel ${index}: specialized authored fade not effective (${record.rawFade})`);
                  if (viewport.width > 768 && !maskChanged) failures.push(`${viewport.name} ${route} reel ${index}: specialized animated mask did not change from historical generic winner`);
                } else {
                  if (record.rawFade !== '') failures.push(`${viewport.name} ${route} reel ${index}: generic reel still has authored raw fade (${record.rawFade})`);
                  if (record.mask !== historical.mask || record.webkitMask !== historical.webkitMask) failures.push(`${viewport.name} ${route} reel ${index}: generic effective mask changed`);
                }
                results.push({ viewport: viewport.name, route, index, specialized: record.specialized, rawFade: record.rawFade, historicalRawFade: historical.rawFade, maskChanged, geometryStable, mechanicsStable, rect: currentRect, trackRect: currentTrackRect });
              }
            }
            await context.close();
          }
          await browser.close();
          console.log(JSON.stringify({ failures, count: results.length, results }, null, 2));
          if (failures.length) process.exit(1);
          NODE
          node css574-browser.mjs | tee css574-browser-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: css574-fade-browser-evidence
          path: css574-browser-result.json
          retention-days: 14
