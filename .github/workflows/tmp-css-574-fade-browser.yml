name: tmp-css-574-fade-browser
on:
  push:
    branches: [fix/css-574-infinite-reel-fade-input]
permissions:
  contents: read
jobs:
  browser:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/css-574-infinite-reel-fade-input
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Vite source server
        shell: bash
        run: |
          npx vite --host 127.0.0.1 --port 4173 > /tmp/css574-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/css574-vite.log
          exit 1
      - name: Compare candidate with historical generic fade winner
        shell: bash
        run: |
          cat > css574-browser.mjs <<'NODE'
          import { chromium } from 'playwright';

          const routes = ['/', '/work/jestei-pool/', '/shootings/', '/work/sensetique/'];
          const viewports = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 900, height: 1000 },
            { name: 'desktop', width: 1728, height: 1000 },
          ];
          const browser = await chromium.launch({ headless: true });
          const failures = [];
          const results = [];
          const round = (n) => Math.round(n * 1000) / 1000;
          const close = (a, b, tolerance = 0.05) => Math.abs(a - b) <= tolerance;
          const sameSize = (a, b) => Boolean(a && b) && close(a.width, b.width) && close(a.height, b.height);

          const capture = async (reel) => reel.evaluate((root) => {
            const track = root.querySelector(':scope > [data-infinite-reel-track]');
            const style = getComputedStyle(root);
            const trackStyle = track instanceof HTMLElement ? getComputedStyle(track) : null;
            const rect = root.getBoundingClientRect();
            const trackRect = track instanceof HTMLElement ? track.getBoundingClientRect() : null;
            const childSizes = track instanceof HTMLElement
              ? [...track.children].slice(0, 8).map((child) => {
                  const childRect = child.getBoundingClientRect();
                  return { width: childRect.width, height: childRect.height };
                })
              : [];
            return {
              rawFade: style.getPropertyValue('--infinite-reel-fade-size').trim(),
              mask: style.maskImage,
              webkitMask: style.webkitMaskImage,
              overflowX: style.overflowX,
              overflowY: style.overflowY,
              duration: style.getPropertyValue('--infinite-reel-duration').trim(),
              gap: trackStyle?.columnGap ?? '',
              animationName: trackStyle?.animationName ?? '',
              animationDuration: trackStyle?.animationDuration ?? '',
              rect: { width: rect.width, height: rect.height },
              trackRect: trackRect ? { width: trackRect.width, height: trackRect.height } : null,
              scrollWidth: track instanceof HTMLElement ? track.scrollWidth : null,
              scrollHeight: track instanceof HTMLElement ? track.scrollHeight : null,
              childCount: track instanceof HTMLElement ? track.children.length : null,
              childSizes,
            };
          });

          for (const viewport of viewports) {
            const context = await browser.newContext({
              viewport: { width: viewport.width, height: viewport.height },
              reducedMotion: 'no-preference',
            });
            const page = await context.newPage();
            for (const route of routes) {
              await page.goto(`http://127.0.0.1:4173${route}`, { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(250);
              const reelCount = await page.locator('[data-infinite-reel]').count();
              for (let index = 0; index < reelCount; index++) {
                const reel = page.locator('[data-infinite-reel]').nth(index);
                if (!(await reel.isVisible())) continue;
                await reel.scrollIntoViewIfNeeded().catch(() => {});
                await page.waitForTimeout(120);

                const specialized = await reel.evaluate((root) => root.classList.contains('portfolio-logo-wall'));
                const current = await capture(reel);

                const styleId = 'css574-historical-winner';
                await page.evaluate((id) => {
                  document.getElementById(id)?.remove();
                  const style = document.createElement('style');
                  style.id = id;
                  style.textContent = '[data-infinite-reel]{--infinite-reel-fade-size:clamp(2rem,7cqi,6rem);}';
                  document.head.append(style);
                }, styleId);
                const historical = await capture(reel);
                await page.evaluate((id) => document.getElementById(id)?.remove(), styleId);

                const childSizesStable = current.childSizes.length === historical.childSizes.length && current.childSizes.every((size, childIndex) => sameSize(size, historical.childSizes[childIndex]));
                const geometryStable = sameSize(current.rect, historical.rect)
                  && sameSize(current.trackRect, historical.trackRect)
                  && current.scrollWidth === historical.scrollWidth
                  && current.scrollHeight === historical.scrollHeight
                  && current.childCount === historical.childCount
                  && childSizesStable;
                const mechanicsStable = current.overflowX === historical.overflowX
                  && current.overflowY === historical.overflowY
                  && current.duration === historical.duration
                  && current.gap === historical.gap
                  && current.animationName === historical.animationName
                  && current.animationDuration === historical.animationDuration;
                const maskChanged = current.mask !== historical.mask || current.webkitMask !== historical.webkitMask;

                if (!geometryStable) failures.push(`${viewport.name} ${route} reel ${index}: transform-invariant geometry changed`);
                if (!mechanicsStable) failures.push(`${viewport.name} ${route} reel ${index}: non-fade mechanics changed`);
                if (specialized) {
                  if (!current.rawFade.includes('1.5rem') || !current.rawFade.includes('4cqi')) failures.push(`${viewport.name} ${route} reel ${index}: specialized authored fade not effective (${current.rawFade})`);
                  if (viewport.width > 768 && !maskChanged) failures.push(`${viewport.name} ${route} reel ${index}: specialized animated mask did not change from historical generic winner`);
                } else {
                  if (current.rawFade !== '') failures.push(`${viewport.name} ${route} reel ${index}: generic reel still has authored raw fade (${current.rawFade})`);
                  if (maskChanged) failures.push(`${viewport.name} ${route} reel ${index}: generic effective mask changed`);
                }

                results.push({
                  viewport: viewport.name,
                  route,
                  index,
                  specialized,
                  rawFade: current.rawFade,
                  historicalRawFade: historical.rawFade,
                  maskChanged,
                  geometryStable,
                  mechanicsStable,
                  rootSize: { width: round(current.rect.width), height: round(current.rect.height) },
                  trackSize: current.trackRect ? { width: round(current.trackRect.width), height: round(current.trackRect.height) } : null,
                  scrollWidth: current.scrollWidth,
                  childCount: current.childCount,
                });
              }
            }
            await context.close();
          }
          await browser.close();
          console.log(JSON.stringify({ failures, count: results.length, results }, null, 2));
          if (failures.length) process.exit(1);
          NODE
          node css574-browser.mjs | tee css574-browser-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: css574-fade-browser-evidence-v2
          path: css574-browser-result.json
          retention-days: 14
