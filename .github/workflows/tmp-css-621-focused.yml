name: tmp css 621 focused contract

on:
  push:
    branches:
      - fix/css-621-experience-hidden-owner

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run focused Experience contract
        run: node --test test/experience-component.test.mjs
