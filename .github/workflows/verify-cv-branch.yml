name: Verify CV branch

on:
  push:
    branches: [feat/cv-page]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-cv-branch
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Restore generated media
        id: media-cache
        uses: actions/cache@v4
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
          key: generated-media-v3-${{ runner.os }}-${{ hashFiles('public/media/**/*', '!public/media/generated/**', 'src/data/media/assets/**/*.ts', 'src/data/media/responsive.ts', 'src/data/media/responsive-policy.ts', 'tools/build-responsive-media.mjs', 'tools/build-video-media.mjs', 'package-lock.json') }}
          restore-keys: |
            generated-media-v3-${{ runner.os }}-
      - name: Ensure media tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Sync generated media
        run: npm run media:sync
      - name: Core tests
        run: npm run test:core
      - name: Build site
        run: npm run build:site
      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Authored browser smoke
        env:
          CV_SMOKE_CAPTURE_DIR: artifacts/cv-smoke
        run: npm run test:e2e:all
      - name: Prepare production CV
        run: node tools/prepare-cv-production.mjs dist/cv/index.html
      - name: Production CV smoke
        run: npm run test:e2e:cv:production
      - name: Upload CV visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-smoke
          path: artifacts/cv-smoke
          if-no-files-found: warn
