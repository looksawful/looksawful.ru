name: Verify CV branch

on:
  push:
    branches: [feat/cv-page]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-cv-branch
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changes
        id: change-scope
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_DIFF_HEAD: ${{ github.sha }}
        run: node tools/ci/change-scope.mjs
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Fast tests
        run: npm run test:cv
      - name: Restore generated media
        id: media-cache
        uses: actions/cache@v4
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
          key: generated-media-v4-${{ runner.os }}-${{ hashFiles('public/media/**/*', '!public/media/generated/**', 'src/content/projects.json', 'src/content/media-catalog/**/*.json', 'src/data/media/assets/**/*.ts', 'src/data/media/catalog*.ts', 'src/data/media/responsive.ts', 'src/data/media/responsive-policy.ts', 'tools/sync-media-catalog.mjs', 'tools/build-responsive-media.mjs', 'tools/build-video-media.mjs', 'package-lock.json') }}
          restore-keys: |
            generated-media-v4-${{ runner.os }}-
      - name: Check CMS media catalog
        run: npm run media:catalog:check
      - name: Inspect cached media
        id: media-scope
        env:
          MEDIA_INPUTS_CHANGED: ${{ steps.change-scope.outputs.media_inputs_changed }}
          MEDIA_CACHE_HIT: ${{ steps.media-cache.outputs.cache-hit }}
        run: node tools/ci/media-scope.mjs
      - name: Ensure media tooling
        if: steps.media-scope.outputs.needs_sync == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
      - name: Sync generated media
        if: steps.media-scope.outputs.needs_sync == 'true'
        run: npm run media:sync
      - name: Check tracked media metadata
        run: git diff --exit-code -- src/content/media-catalog src/data/media/catalog-records.generated.ts public/media/generated/responsive-manifest.json public/media/generated/video-inventory.json src/data/media/responsive-generated.ts
      - name: Media contracts
        run: npm run test:media:contract
      - name: Media tooling tests
        if: steps.media-scope.outputs.needs_sync == 'true'
        run: npm run test:media:checks
      - name: Build site
        run: npm run build:site
      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Authored browser smoke
        env:
          CV_SMOKE_CAPTURE_DIR: artifacts/cv-smoke
        run: npm run test:e2e:cv
      - name: Prepare production CV
        run: node tools/prepare-cv-production.mjs dist/cv/index.html
      - name: Production CV smoke
        run: npm run test:e2e:cv:production
      - name: Upload CV visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-smoke
          path: artifacts/cv-smoke
          if-no-files-found: warn
