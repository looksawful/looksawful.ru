name: Verify CV branch

on:
  push:
    branches: [feat/cv-page]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-cv-branch
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install
        run: npm ci
      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Verify
        run: npm run verify
