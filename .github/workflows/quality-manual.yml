name: Quality manual

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Optional Pages CMS payload
        required: false
        type: string
      suite:
        description: Quality suite
        required: false
        default: browser-smoke
        type: choice
        options:
          - browser-smoke
          - browser-affected
          - e2e-full
          - media-full
          - lighthouse
          - dependencies
          - external-links
          - production-health
          - cv-production
          - all

permissions:
  contents: read

concurrency:
  group: quality-manual-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  browser:
    if: inputs.suite == 'browser-smoke' || inputs.suite == 'browser-affected' || inputs.suite == 'e2e-full' || inputs.suite == 'cv-production' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore generated media
        uses: actions/cache@v4
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
          key: generated-media-v4-${{ runner.os }}-${{ hashFiles('public/media/**/*', '!public/media/generated/**', 'src/content/projects.json', 'src/content/media-catalog/**/*.json', 'src/data/media/assets/**/*.ts', 'src/data/media/catalog*.ts', 'src/data/media/responsive.ts', 'src/data/media/responsive-policy.ts', 'tools/sync-media-catalog.mjs', 'tools/build-responsive-media.mjs', 'tools/build-video-media.mjs', 'package-lock.json') }}
          restore-keys: |
            generated-media-v4-${{ runner.os }}-
      - run: npm run build:site
      - run: npx playwright install --with-deps chromium
      - if: inputs.suite == 'browser-smoke'
        run: npm run test:e2e:smoke
      - if: inputs.suite == 'browser-affected'
        run: npm run test:e2e:affected
      - if: inputs.suite == 'e2e-full' || inputs.suite == 'all'
        run: npm run test:e2e:full
      - if: inputs.suite == 'cv-production'
        run: npm run test:e2e:cv:production

  media:
    if: inputs.suite == 'media-full' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm run media:sync
      - run: npm run test:media:checks

  lighthouse:
    if: inputs.suite == 'lighthouse' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - run: npm run lighthouse

  dependencies:
    if: inputs.suite == 'dependencies' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:deps

  external-links:
    if: inputs.suite == 'external-links' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - run: npm run check:external-links

  production-health:
    if: inputs.suite == 'production-health' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: prod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:production
