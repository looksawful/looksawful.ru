name: Gallery CMS materialize (temporary)

on:
  push:
    branches: [feature/gallery-prerelease]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Gallery feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/gallery-prerelease
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Materialize canonical Pages CMS options
        run: npm run cms:generate
      - name: Commit deterministic CMS options
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pages.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore(cms): materialize Gallery project options'
          git push origin HEAD:feature/gallery-prerelease
