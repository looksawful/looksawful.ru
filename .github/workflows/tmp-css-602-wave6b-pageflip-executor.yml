name: tmp-css-602-wave6b-pageflip-executor

on:
  push:
    branches:
      - refactor/css-462-wave6b-pageflip
    paths:
      - .github/workflows/tmp-css-602-wave6b-pageflip-executor.yml

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact RED branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4

      - name: Verify exact RED ancestry and unchanged dev base
        shell: bash
        env:
          EXPECTED_RED_HEAD: e022cd1df11d0071dcf4e7c19d3287df31e298b1
          EXPECTED_BASE: 603c8647d35fe0c22b7d4f3529d1cc2758c60cef
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_RED_HEAD" HEAD
          git fetch --no-tags --depth=1 origin dev
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_BASE"

      - name: Apply declaration-preserving PageFlip ownership move
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          components_path = Path('src/styles/components.css')
          owner_path = Path('src/styles/page-flip.css')
          index_path = Path('src/styles/index.css')

          components = components_path.read_text()
          index = index_path.read_text()

          start_marker = '/* --- page-flip --- */'
          end_marker = '/* --- berserk-audio-player --- */'

          if components.count(start_marker) != 1:
              raise SystemExit(f'expected one PageFlip section marker, got {components.count(start_marker)}')
          if components.count(end_marker) != 1:
              raise SystemExit(f'expected one Berserk boundary marker, got {components.count(end_marker)}')
          if owner_path.exists():
              raise SystemExit('src/styles/page-flip.css already exists')

          start = components.index(start_marker)
          end = components.index(end_marker, start)
          owner_source = components[start:end].rstrip() + '\n'

          if owner_source.count('\n.page-flip {') != 1:
              raise SystemExit('expected exactly one generic .page-flip root in extracted source')
          if '.page-flip__book .stf__item' not in owner_source:
              raise SystemExit('PageFlip third-party stf compatibility boundary is missing')
          if owner_source.count('!important') != 3:
              raise SystemExit(f'expected three preserved third-party !important declarations, got {owner_source.count("!important")}')

          components = components[:start] + components[end:]
          components_path.write_text(components)
          owner_path.write_text(owner_source)

          old_imports = '@import "./components.css" layer(components);\n@import "./before-after.css" layer(components);'
          new_imports = '@import "./components.css" layer(components);\n@import "./page-flip.css" layer(components);\n@import "./before-after.css" layer(components);'
          if index.count(old_imports) != 1:
              raise SystemExit('components/before-after import anchor did not match exactly once')
          index = index.replace(old_imports, new_imports, 1)
          index_path.write_text(index)
          PY

      - name: Focused architecture and PageFlip contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/css-tooling-check.test.mjs \
            test/page-flip.test.mjs \
            test/page-flip-migration.test.mjs \
            test/caption-lightbox-contract.test.mjs

      - name: Stylelint and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          npm run lint:style
          git diff --check
          test "$(grep -c '^\.page-flip {$' src/styles/page-flip.css)" -eq 1
          test "$(grep -c '^\.page-flip {$' src/styles/components.css || true)" -eq 0
          test "$(grep -c '!important' src/styles/page-flip.css)" -eq 3
          node tools/css/check.mjs

      - name: Remove one-shot executor and commit durable product tree
        shell: bash
        env:
          BRANCH: refactor/css-462-wave6b-pageflip
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-css-602-wave6b-pageflip-executor.yml
          git add src/styles/components.css src/styles/page-flip.css src/styles/index.css
          git commit -m "refactor(css): extract PageFlip style ownership"
          git push origin "HEAD:$BRANCH"
