name: tmp-project-nav-height-characterization
on:
  push:
    branches: [test/project-nav-bottom-sticky-diagnostic]
permissions:
  contents: read
jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Vite
        shell: bash
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/project-nav-height.log" 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Characterize nav height
        shell: bash
        run: |
          cat > project-nav-height.mjs <<'NODE'
          import { chromium } from 'playwright';
          const widths = [390, 640, 641, 768, 900, 1200, 1536];
          const browser = await chromium.launch({headless:true});
          try {
            for (const width of widths) {
              const context = await browser.newContext({viewport:{width,height:900},isMobile:width<=640,hasTouch:width<=640});
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
              const result = await page.evaluate(()=>{
                const nav=document.querySelector('[data-projects-navigation]');
                const inner=nav?.querySelector('.project-nav__inner');
                const list=nav?.querySelector('.project-nav__list');
                const first=nav?.querySelector('.project-nav__link');
                const current=nav?.querySelector('.project-nav__link[aria-current="location"]');
                const top=nav?.querySelector('.project-nav__top');
                if (!(nav instanceof HTMLElement) || !(inner instanceof HTMLElement)) throw new Error('missing nav');
                const rect = (el) => el instanceof HTMLElement ? ({height:el.getBoundingClientRect().height,width:el.getBoundingClientRect().width}) : null;
                const style = (el) => el instanceof HTMLElement ? ({fontSize:getComputedStyle(el).fontSize,lineHeight:getComputedStyle(el).lineHeight,minHeight:getComputedStyle(el).minHeight,paddingTop:getComputedStyle(el).paddingTop,paddingBottom:getComputedStyle(el).paddingBottom}) : null;
                return {
                  nav: {...rect(nav), ...style(nav)},
                  inner: {...rect(inner), ...style(inner)},
                  list: list instanceof HTMLElement ? {...rect(list), ...style(list)} : null,
                  first: first instanceof HTMLElement ? {...rect(first), ...style(first)} : null,
                  current: current instanceof HTMLElement ? {...rect(current), ...style(current)} : null,
                  top: top instanceof HTMLElement ? {...rect(top), ...style(top)} : null,
                };
              });
              console.log(width, JSON.stringify(result));
              await context.close();
            }
          } finally { await browser.close(); }
          NODE
          node project-nav-height.mjs
