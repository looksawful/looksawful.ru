name: Contact Email Discovery Once

on:
  push:
    branches: [contact-hub-frontend-current]
    paths:
      - .github/workflows/contact-email-discovery-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect existing email configuration without mutations
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'account_secret=missing'; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'token_secret=missing'; exit 1; }
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          base='https://api.cloudflare.com/client/v4'

          addresses_status="$(curl -sS -o /tmp/addresses.json -w '%{http_code}' "${auth[@]}" "${base}/accounts/${CLOUDFLARE_ACCOUNT_ID}/email/routing/addresses?verified=true&per_page=50")"
          echo "verified_destinations_http=${addresses_status}"
          if [[ "$addresses_status" == 200 ]]; then
            echo "verified_destinations_count=$(jq '[.result[] | select(.verified != null)] | length' /tmp/addresses.json)"
            echo "i_at_lookawful_verified=$(jq -r '[.result[] | select(.email == "i@lookawful.ru" and .verified != null)] | length > 0' /tmp/addresses.json)"
          else
            jq -r '"verified_destinations_error=" + ((.errors[0].message // "unknown")|tostring)' /tmp/addresses.json || true
          fi

          zones_status="$(curl -sS -o /tmp/zones.json -w '%{http_code}' "${auth[@]}" "${base}/zones?name=looksawful.ru&account.id=${CLOUDFLARE_ACCOUNT_ID}")"
          echo "zone_lookup_http=${zones_status}"
          zone_id=''
          if [[ "$zones_status" == 200 ]]; then
            zone_id="$(jq -r '.result[0].id // empty' /tmp/zones.json)"
            echo "zone_found=$([[ -n "$zone_id" ]] && echo true || echo false)"
          else
            jq -r '"zone_lookup_error=" + ((.errors[0].message // "unknown")|tostring)' /tmp/zones.json || true
          fi

          if [[ -n "$zone_id" ]]; then
            routing_status="$(curl -sS -o /tmp/routing.json -w '%{http_code}' "${auth[@]}" "${base}/zones/${zone_id}/email/routing")"
            echo "routing_http=${routing_status}"
            if [[ "$routing_status" == 200 ]]; then
              echo "routing_enabled=$(jq -r '.result.enabled // false' /tmp/routing.json)"
              echo "routing_status=$(jq -r '.result.status // "unknown"' /tmp/routing.json)"
            else
              jq -r '"routing_error=" + ((.errors[0].message // "unknown")|tostring)' /tmp/routing.json || true
            fi

            send_status="$(curl -sS -o /tmp/senddomains.json -w '%{http_code}' "${auth[@]}" "${base}/zones/${zone_id}/email/sending/subdomains")"
            echo "sending_subdomains_http=${send_status}"
            if [[ "$send_status" == 200 ]]; then
              echo "sending_subdomains_count=$(jq '.result | length' /tmp/senddomains.json)"
              echo "sending_enabled_for_root=$(jq -r '[.result[] | select(.name == "looksawful.ru" and .enabled == true)] | length > 0' /tmp/senddomains.json)"
            else
              jq -r '"sending_subdomains_error=" + ((.errors[0].message // "unknown")|tostring)' /tmp/senddomains.json || true
            fi
          fi
