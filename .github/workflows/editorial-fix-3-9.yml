name: Editorial audit fixes 3-9

on:
  push:
    branches:
      - fix/editorial-audit-3-9
    paths:
      - .github/workflows/editorial-fix-3-9.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editorial-audit-3-9
          fetch-depth: 0

      - name: Apply audited copy corrections
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"Expected at least {minimum} occurrence(s) in {path}: {old!r}; got {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")
              print(f"{path}: {count} replacement(s): {old!r}")

          cv_path = Path("src/content/editorial/cv.json")
          cv = json.loads(cv_path.read_text(encoding="utf-8"))
          old = "сократили время производства контента"
          new = "снизили стоимость производства баннеров в 2,5 раза"
          description = cv["experience"]["jestei"]["description"]
          if old not in description:
              raise SystemExit("Expected Jestei production-time wording was not found")
          cv["experience"]["jestei"]["description"] = description.replace(old, new)
          cv_path.write_text(json.dumps(cv, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          media_path = "src/data/media/entries/sensetique.ts"
          replacements = [
              ("Young-pioneer — эдиториал-фотосъёмка для Kaltblut Magazine, 2027.", "Young-pioneer — эдиториал-фотосъёмка для Kaltblut Magazine."),
              ("Young-pioneer — эдиториал-фотосъёмка для Kaltblut Magazine, 2027", "Young-pioneer — эдиториал-фотосъёмка для Kaltblut Magazine"),
              ("АНдрей", "Андрей"),
              ("фотосъемка", "фотосъёмка"),
              ("фотосхемка", "фотосъёмка"),
              ("Фотограф Андрей Рапуто,стилист Мария Жукова,продюсер Иван Крушинский", "Фотограф Андрей Рапуто, Стилист Мария Жукова, Продюсер Иван Крушинский."),
          ]
          for old, new in replacements:
              replace(media_path, old, new)

          presentation_path = "src/data/content/sensetique.ts"
          replace(
              presentation_path,
              "Фотограф Андрей Рапуто,стилист Мария Жукова,продюсер Иван Крушинский",
              "Фотограф Андрей Рапуто, Стилист Мария Жукова, Продюсер Иван Крушинский.",
          )
          replace(
              presentation_path,
              "Фотограф Татьяна Никишина стилист Мария Жукова продюсер Иван Крушинский",
              "Фотограф Татьяна Никишина, Стилист Мария Жукова, Продюсер Иван Крушинский.",
          )

          catalog_root = Path("src/content/media-catalog/registered")
          for p in catalog_root.glob("sensetique-*.json"):
              text = p.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  p.write_text(updated, encoding="utf-8")

      - name: Run focused regression test and capture output
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test test/editorial-audit-regressions.test.mjs 2>&1 | tee editorial-regression-output.txt

      - name: Check stale Sensetique strings and capture output
        id: stale
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if rg -n 'Young-pioneer.*2027|АНдрей|фотсъемка|фотосхемка|Рапуто,стилист|Жукова,продюсер' \
            src/data/media/entries/sensetique.ts \
            src/data/content/sensetique.ts \
            src/content/media-catalog/registered | tee editorial-stale-output.txt; then
            echo "Stale Sensetique copy remains" | tee -a editorial-stale-output.txt
            exit 1
          else
            echo "No targeted stale Sensetique strings found." | tee editorial-stale-output.txt
          fi

      - name: Commit corrected sources, diagnostics and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/editorial-fix-3-9.yml
          git add src/content/editorial/cv.json \
                  src/data/media/entries/sensetique.ts \
                  src/data/content/sensetique.ts \
                  src/content/media-catalog/registered \
                  editorial-regression-output.txt \
                  editorial-stale-output.txt
          git commit -m "fix(copy): resolve audited Jestei and Sensetique conflicts"
          git push origin HEAD:fix/editorial-audit-3-9

      - name: Preserve test failure as workflow failure
        if: steps.regression.outcome != 'success' || steps.stale.outcome != 'success'
        run: exit 1
