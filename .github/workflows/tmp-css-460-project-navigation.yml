name: tmp-css-460-project-navigation

on:
  push:
    branches:
      - refactor/css-460-project-navigation-owner

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Characterize existing split-owner behavior
        run: |
          node --test \
            test/project-navigation-mobile-viewport.test.mjs \
            test/project-navigation-back-to-top.test.mjs \
            test/project-navigation-fallback.test.mjs

      - name: Confirm RED canonical ownership contract
        shell: bash
        run: |
          set +e
          node --test test/css-refactor-wave4b-project-navigation.test.mjs > /tmp/css460b-red.log 2>&1
          status=$?
          set -e
          cat /tmp/css460b-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected project navigation ownership contract to be RED before consolidation."
            exit 1
          fi
          grep -F "✖ project navigation has one canonical stylesheet owner at the existing import slot" /tmp/css460b-red.log
          grep -F "✖ components aggregate no longer owns project navigation presentation" /tmp/css460b-red.log
          grep -F "✖ canonical owner preserves base-before-extension cascade order" /tmp/css460b-red.log

      - name: Apply byte-for-byte project navigation consolidation
        run: node tools/tmp-css-460-project-navigation.mjs

      - name: Confirm GREEN behavior and ownership contracts
        run: |
          node --test \
            test/css-refactor-wave4b-project-navigation.test.mjs \
            test/project-navigation-mobile-viewport.test.mjs \
            test/project-navigation-back-to-top.test.mjs \
            test/project-navigation-fallback.test.mjs \
            test/site-navigation-style.test.mjs
          git diff --check

      - name: Commit GREEN consolidation
        shell: bash
        run: |
          git status --short
          test -n "$(git status --short src/styles/components.css)"
          test -n "$(git status --short src/styles/project-navigation.css)"
          test -n "$(git status --short src/styles/project-navigation-top.css)"
          test -n "$(git status --short src/styles/index.css)"
          test -n "$(git status --short test/project-navigation-mobile-viewport.test.mjs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/components.css src/styles/project-navigation.css src/styles/project-navigation-top.css src/styles/index.css test/project-navigation-mobile-viewport.test.mjs
          git commit -m "refactor(css): GREEN consolidate project navigation stylesheet owner (#460)"
          git push origin HEAD:refactor/css-460-project-navigation-owner
