name: Private Lab Verify

on:
  pull_request:
    branches: [dev]
    paths:
      - "lab/**"
      - "src/lab/**"
      - "tools/lab/**"
      - "docs/storybook/**"
      - "package.json"
      - "vite.lab.config.ts"
      - "test/private-admin-github-oauth.test.mjs"
      - "test/private-lab-shell.test.mjs"
      - "test/lab-*.test.mjs"
      - "test/model-viewer-lab-media-shell.test.mjs"
      - "tools/ci/run-tests.mjs"
      - ".github/workflows/private-lab-verify.yml"
      - "docs/private-lab.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Protected Admin/Lab contracts
        run: node --test test/private-lab-shell.test.mjs test/private-admin-github-oauth.test.mjs test/private-lab-storybook-integration.test.mjs

      - name: Build isolated Lab
        env:
          LAB_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
          LAB_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          LAB_BUILD_TIME: ${{ github.event.pull_request.updated_at || github.event.repository.updated_at }}
        run: npx vite build --config vite.lab.config.ts

      - name: Prepare production media for Storybook
        run: npm run media:ensure

      - name: Build private Storybook design system
        run: npm run lab:system

      - name: Generate Storybook inventory
        run: npm run lab:inventory

      - name: Storybook contracts
        run: node --test test/lab-design-system-inventory.test.mjs test/lab-storybook-harness.test.mjs test/lab-storybook-molecule-coverage.test.mjs test/lab-storybook-state-coverage.test.mjs test/lab-storybook-state-schema.test.mjs test/model-viewer-lab-media-shell.test.mjs

      - name: Verify Lab artifact and public isolation
        shell: bash
        run: |
          test -f dist-lab/lab/index.html
          grep -q 'noindex,nofollow,noarchive' dist-lab/lab/index.html
          test -f dist-lab/lab/system/index.html
          test -f dist-lab/lab/system/inventory.html
          test -f dist-lab/lab/system-inventory.json
          if test -e dist/lab/index.html; then
            echo "Public production artifact unexpectedly contains Lab" >&2
            exit 1
          fi
