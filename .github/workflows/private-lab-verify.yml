name: Private Lab Verify

on:
  pull_request:
    branches: [lab]
    paths:
      - "lab/**"
      - "src/lab/**"
      - "src/content/contracts/**"
      - "src/components/**"
      - "src/site/renderers/entity/**"
      - "src/templates/**"
      - "tools/lab/**"
      - "vite.lab.config.ts"
      - "test/lab-*.test.mjs"
      - "test/private-admin-github-oauth.test.mjs"
      - "test/private-lab-shell.test.mjs"
      - "tools/ci/run-tests.mjs"
      - ".github/workflows/private-lab-verify.yml"
      - "docs/private-lab.md"
      - "docs/storybook/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Protected Admin/Lab contracts
        run: node --test test/private-lab-shell.test.mjs test/private-admin-github-oauth.test.mjs test/lab-project-component-parity.test.mjs

      - name: Build isolated Lab
        env:
          LAB_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
          LAB_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          LAB_BUILD_TIME: ${{ github.event.pull_request.updated_at || github.event.repository.updated_at }}
        run: npx vite build --config vite.lab.config.ts

      - name: Build Storybook approval surface and project parity inventory
        run: node tools/lab/build-storybook.mjs

      - name: Build design-system inventory
        run: node tools/lab/design-system-inventory.mjs

      - name: Verify Lab artifact and public isolation
        shell: bash
        run: |
          test -f dist-lab/lab/index.html
          grep -q 'noindex,nofollow,noarchive' dist-lab/lab/index.html
          test -f dist/lab/system/index.html
          test -f dist/lab/system/inventory.html
          test -f dist/lab/system/project-surfaces.html
          test -f dist/lab/system/project-surfaces.json
          if test -e dist/lab/index.html; then
            echo "Public production artifact unexpectedly contains Lab" >&2
            exit 1
          fi
