name: Tmp home media deferral 336

on:
  push:
    branches: [agent/home-media-deferral-336]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply managed-media implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          test_path = Path('test/home-media-deferral.test.mjs')
          text = test_path.read_text()
          replacement = r'''test("Homepage defers autoplay video sources across ordinary and managed media lifecycles", () => {
            const html = `
              <section>
                <video autoplay="" preload="auto" src="/plain.mp4"></video>
                <div data-media-deck="">
                  <video autoplay="" preload="metadata"><source src="/deck.mp4" type="video/mp4"></video>
                </div>
                <div data-infinite-reel="">
                  <video autoplay="" preload="metadata" src="/reel.mp4"></video>
                </div>
              </section>
            `;

            const result = deferHomepageAutoplayMedia(html);
            const videos = deferredVideoBlocks(result);

            assert.equal(videos.length, 3);
            assert.match(result, /data-autoplay-src="\/plain\.mp4"/);
            assert.match(result, /data-autoplay-src="\/deck\.mp4"/);
            assert.match(result, /data-autoplay-src="\/reel\.mp4"/);
            for (const video of videos) {
              assert.doesNotMatch(video, /<video\b[^>]*\ssrc="/i);
              assert.doesNotMatch(video, /<source\b[^>]*\ssrc="/i);
            }
          });

          '''
          text, count = re.subn(
              r'test\("Homepage defers ordinary autoplay video sources but preserves managed deck media", \(\) => \{[\s\S]*?\n\}\);\n\n',
              lambda _: replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('managed-media test block not found')
          test_path.write_text(text)

          Path('src/components/deferred-video-source.ts').write_text('''export function hydrateDeferredVideoSource(video: HTMLVideoElement): boolean {
            if (!video.hasAttribute("data-autoplay-deferred")) return false;

            const directSrc = video.dataset.autoplaySrc;
            if (directSrc) {
              video.src = directSrc;
              delete video.dataset.autoplaySrc;
            }

            video.querySelectorAll<HTMLSourceElement>("source[data-autoplay-src]").forEach((source) => {
              const src = source.dataset.autoplaySrc;
              if (!src) return;
              source.src = src;
              delete source.dataset.autoplaySrc;
            });

            const preload = video.dataset.autoplayPreload;
            if (preload === "" || preload === "metadata" || preload === "auto" || preload === "none") {
              video.preload = preload;
            }
            delete video.dataset.autoplayPreload;
            video.removeAttribute("data-autoplay-deferred");
            return true;
          }
          ''')

          main_path = Path('src/main.ts')
          main = main_path.read_text()
          main = main.replace(
              'import { createMediaRuntimeHealth } from "./components/media-runtime-health.ts";\n',
              'import { createMediaRuntimeHealth } from "./components/media-runtime-health.ts";\nimport { hydrateDeferredVideoSource } from "./components/deferred-video-source.ts";\n',
          )
          main, count = re.subn(
              r'function hydrateDeferredAutoplaySource\(video: HTMLVideoElement\): void \{[\s\S]*?\n\}\n\nfunction initViewportAutoplayVideos',
              'function initViewportAutoplayVideos',
              main,
              count=1,
          )
          if count != 1:
              raise SystemExit('main deferred helper block not found')
          main = main.replace('hydrateDeferredAutoplaySource(video);', 'hydrateDeferredVideoSource(video);')
          main_path.write_text(main)

          home_path = Path('src/site/renderers/home/home-media-deferral.ts')
          home = home_path.read_text()
          home = home.replace('  mediaContainer: boolean;\n', '')
          home = home.replace('    const insideManagedMedia = stack.some((entry) => entry.mediaContainer);\n', '')
          home = home.replace(
              '    const isDeferredVideo =\n      tagName === "video" && attributePresent(tag, "autoplay") && !insideManagedMedia;\n',
              '    const isDeferredVideo = tagName === "video" && attributePresent(tag, "autoplay");\n',
          )
          home = home.replace(
              '        mediaContainer:\n          insideManagedMedia ||\n          attributePresent(tag, "data-media-deck") ||\n          attributePresent(tag, "data-infinite-reel"),\n',
              '',
          )
          home_path.write_text(home)

          deck_path = Path('src/components/media-deck.ts')
          deck = deck_path.read_text()
          deck = deck.replace(
              '} from "./embla-deck.ts";\n',
              '} from "./embla-deck.ts";\nimport { hydrateDeferredVideoSource } from "./deferred-video-source.ts";\n',
              1,
          )
          deck = deck.replace(
              '          void video.play().catch(() => {});\n',
              '          hydrateDeferredVideoSource(video);\n          if (video.readyState === HTMLMediaElement.HAVE_NOTHING) video.load();\n          void video.play().catch(() => {});\n',
              1,
          )
          deck = deck.replace(
              '      if (shouldPlay) {\n        if (video.paused) void video.play().catch(() => {});\n',
              '      if (shouldPlay) {\n        hydrateDeferredVideoSource(video);\n        if (video.readyState === HTMLMediaElement.HAVE_NOTHING) video.load();\n        if (video.paused) void video.play().catch(() => {});\n',
              1,
          )
          deck_path.write_text(deck)

          reel_path = Path('src/components/infinite-reel.ts')
          reel = reel_path.read_text()
          reel = reel.replace(
              'import type { createMotionPreference } from "./motion-preference.ts";\n',
              'import type { createMotionPreference } from "./motion-preference.ts";\nimport { hydrateDeferredVideoSource } from "./deferred-video-source.ts";\n',
              1,
          )
          reel = reel.replace(
              '      if (active) { if (video.paused) void video.play().catch(() => {}); return; }\n',
              '      if (active) {\n        hydrateDeferredVideoSource(video);\n        if (video.readyState === HTMLMediaElement.HAVE_NOTHING) video.load();\n        if (video.paused) void video.play().catch(() => {});\n        return;\n      }\n',
              1,
          )
          reel_path.write_text(reel)
          PY

          node --test test/home-media-deferral.test.mjs
      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore exact generated media cache
        id: media-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}
      - name: Verify restored generated media
        if: steps.media-cache.outputs.cache-hit == 'true'
        run: node tools/media-dev-state.mjs --cache-verify
      - name: Install recovery video tooling on cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Recover generated media on cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          npm run media:sync
          node tools/media-dev-state.mjs --cache-verify
          git diff --exit-code
      - run: npm run typecheck
      - run: npm run test:fast
      - run: npm run build:site
      - name: Measure production-like Homepage
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p artifacts/home-perf
          npx lighthouse http://127.0.0.1:4173/ --output=json --output-path=artifacts/home-perf/mobile.json --chrome-flags='--headless --no-sandbox' --quiet
          npx lighthouse http://127.0.0.1:4173/ --preset=desktop --output=json --output-path=artifacts/home-perf/desktop.json --chrome-flags='--headless --no-sandbox' --quiet
          node <<'NODE'
          const fs = require('node:fs');
          const summary = [];
          for (const mode of ['mobile', 'desktop']) {
            const r = JSON.parse(fs.readFileSync(`artifacts/home-perf/${mode}.json`, 'utf8'));
            const a = r.audits;
            const c = r.categories;
            summary.push({
              mode,
              performance: Math.round((c.performance?.score ?? 0) * 100),
              lcpMs: Math.round(a['largest-contentful-paint']?.numericValue ?? 0),
              tbtMs: Math.round(a['total-blocking-time']?.numericValue ?? 0),
              transferMiB: Number(((a['total-byte-weight']?.numericValue ?? 0) / 1024 / 1024).toFixed(2)),
              requests: a['network-requests']?.details?.items?.length ?? 0,
              mainThreadMs: Math.round(a['mainthread-work-breakdown']?.numericValue ?? 0),
            });
          }
          fs.writeFileSync('artifacts/home-perf/summary.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary));
          NODE
      - name: Upload Lighthouse evidence
        uses: actions/upload-artifact@v4
        with:
          name: home-perf-336-managed
          path: artifacts/home-perf
          retention-days: 7
      - name: Commit final implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-home-media-deferral-336.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/components/deferred-video-source.ts src/components/media-deck.ts src/components/infinite-reel.ts src/site/renderers/home/home-media-deferral.ts test/home-media-deferral.test.mjs .github/workflows/tmp-home-media-deferral-336.yml
          git commit -m "perf(home): defer managed autoplay media until eligible"
          git push
