name: Capture production baseline

on:
  push:
    branches:
      - dev
    paths:
      - scripts/capture-prod-baseline.mjs
      - .github/workflows/capture-prod-baseline.yml
  workflow_dispatch:
    inputs:
      url:
        description: Public URL to capture
        required: false
        default: https://www.looksawful.ru/

permissions:
  contents: read
  statuses: write

concurrency:
  group: capture-production-baseline
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark audit pending
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "prod-baseline/capture",
              description: "Capturing public production baseline",
              target_url: runUrl
            });

      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture production
        env:
          BASELINE_URL: ${{ inputs.url || 'https://www.looksawful.ru/' }}
          BASELINE_OUT: prod-baseline-artifact
        run: node scripts/capture-prod-baseline.mjs

      - name: Upload production baseline
        uses: actions/upload-artifact@v4
        with:
          name: looksawful-production-baseline
          path: prod-baseline-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Mark audit result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "prod-baseline/capture",
              description: success ? "Production baseline captured" : "Production baseline capture failed",
              target_url: runUrl
            });
            if (!success) core.setFailed("Production baseline capture failed");
