name: Temporary 636 proof and patch

on:
  push:
    branches:
      - fix/636-awful-cases-orphan-keyframe

permissions:
  contents: write

jobs:
  prove-and-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/636-awful-cases-orphan-keyframe
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Source preflight
        shell: bash
        run: |
          set -euo pipefail
          count="$(grep -R --line-number --fixed-strings 'runner-demo-pulse' src public test tools 2>/dev/null | wc -l)"
          test "$count" -eq 1
          grep -n --fixed-strings '@keyframes runner-demo-pulse' src/styles/components.css
          grep -n --fixed-strings 'animation:awful-cases-demo-pulse' public/pets/awful-cases/awful-cases.css
          grep -n --fixed-strings '@keyframes awful-cases-demo-pulse' public/pets/awful-cases/awful-cases.css
      - run: npm run lint:style
      - run: npm run css:check
      - run: npm run build:vite
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/work/awful-cases/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Pre-delete computed proof
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          await page.goto('http://127.0.0.1:4173/work/awful-cases/', { waitUntil: 'networkidle' });
          await page.waitForSelector('.awful-cases-game');
          const portfolio = await page.locator('.awful-cases-game').evaluate((root) => {
            const nodes = [root, ...root.querySelectorAll('*')];
            const consumers = nodes.map((node) => ({animationName: getComputedStyle(node).animationName})).filter((x) => x.animationName.split(',').map((v) => v.trim()).includes('runner-demo-pulse'));
            return { totalNodes: nodes.length, consumers };
          });
          if (portfolio.consumers.length) throw new Error(JSON.stringify(portfolio));
          console.log('PORTFOLIO_PROOF', JSON.stringify(portfolio));
          await page.goto('http://127.0.0.1:4173/pets/awful-cases/', { waitUntil: 'networkidle' });
          const standalone = await page.locator('.awful-cases .start__label').evaluate((node) => ({ animationName: getComputedStyle(node).animationName, display: getComputedStyle(node).display }));
          if (!standalone.animationName.split(',').map((v) => v.trim()).includes('awful-cases-demo-pulse')) throw new Error(JSON.stringify(standalone));
          console.log('STANDALONE_PROOF', JSON.stringify(standalone));
          await browser.close();
          NODE
      - name: Remove only orphan keyframes and self-clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/styles/components.css'); text=p.read_text(encoding='utf-8'); marker='@keyframes runner-demo-pulse'; start=text.find(marker)
          if start < 0: raise SystemExit('marker missing')
          brace=text.find('{',start); depth=0; end=None
          for i in range(brace,len(text)):
              if text[i]=='{': depth+=1
              elif text[i]=='}':
                  depth-=1
                  if depth==0: end=i+1; break
          if end is None: raise SystemExit('closing brace missing')
          updated=text[:start]+text[end:]
          if marker in updated or '}/* ==================================================' in updated: raise SystemExit('unsafe removal')
          p.write_text(updated,encoding='utf-8')
          PY
          rm .github/workflows/tmp-636-proof-and-patch.yml
          git diff --check
      - name: Commit minimal production diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/components.css .github/workflows/tmp-636-proof-and-patch.yml
          staged="$(git diff --cached --name-only)"
          test "$staged" = $'.github/workflows/tmp-636-proof-and-patch.yml\nsrc/styles/components.css'
          git commit -m 'fix(css): remove orphan Awful Cases runner keyframes (#636)'
          git push origin HEAD:fix/636-awful-cases-orphan-keyframe
