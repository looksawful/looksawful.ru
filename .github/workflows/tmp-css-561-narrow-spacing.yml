name: tmp-css-561-narrow-spacing

on:
  push:
    branches:
      - fix/css-media-group-spacing-contract

permissions:
  contents: write

jobs:
  narrow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/css-media-group-spacing-contract
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Move authored gap input to the logo-wall specialization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/styles/components.css')
          text = path.read_text()
          old_group = '''.portfolio-showcase__group {
            --media-group-gap: var(--portfolio-group-gap);
            --group-max: 100%;
            --strip-height: var(--portfolio-strip-height);
          }'''
          new_group = '''.portfolio-showcase__group {
            --group-max: 100%;
            --strip-height: var(--portfolio-strip-height);
          }'''
          old_logo = '''.portfolio-logo-wall {
            --portfolio-group-gap: clamp(0.5rem, 0.9cqi, 0.8rem);
            --portfolio-strip-height: clamp(2rem, 3.5cqi, 3.25rem);
            --infinite-reel-fade-size: clamp(1.5rem, 4cqi, 4rem);
          }'''
          new_logo = '''.portfolio-logo-wall {
            --portfolio-group-gap: clamp(0.5rem, 0.9cqi, 0.8rem);
            --media-group-gap: var(--portfolio-group-gap);
            --portfolio-strip-height: clamp(2rem, 3.5cqi, 3.25rem);
            --infinite-reel-fade-size: clamp(1.5rem, 4cqi, 4rem);
          }'''
          if text.count(old_group) != 1 or text.count(old_logo) != 1:
              raise SystemExit('Expected spacing source blocks were not unique')
          text = text.replace(old_group, new_group).replace(old_logo, new_logo)
          path.write_text(text)
          PY
          node --test test/css-refactor-wave5b-media-group-foundation.test.mjs
          git diff --check
      - name: Commit minimal GREEN implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/components.css
          git diff --cached --quiet && exit 0
          git commit -m "fix(css): scope authored media-group gap to logo wall"
          git push origin HEAD:fix/css-media-group-spacing-contract
