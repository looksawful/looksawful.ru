name: Finalize editorial audit fixes 3-9

on:
  push:
    branches:
      - fix/editorial-audit-3-9
    paths:
      - .github/workflows/editorial-fix-3-9-final.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editorial-audit-3-9
          fetch-depth: 0

      - name: Fix remaining Sensetique typo variant
        shell: python
        run: |
          from pathlib import Path

          targets = [Path("src/data/media/entries/sensetique.ts")]
          targets += list(Path("src/content/media-catalog/registered").glob("sensetique-*.json"))
          total = 0
          for path in targets:
              text = path.read_text(encoding="utf-8")
              count = text.count("фотсъемка")
              if count:
                  path.write_text(text.replace("фотсъемка", "фотосъёмка"), encoding="utf-8")
                  total += count
                  print(f"{path}: {count} replacement(s)")
          if total == 0:
              raise SystemExit("Expected the remaining фотсъемка typo variant")
          print(f"Total replacements: {total}")

      - name: Verify focused editorial regressions
        run: node --test test/editorial-audit-regressions.test.mjs

      - name: Verify corrected source strings
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path("src/data/media/entries/sensetique.ts"),
              Path("src/data/content/sensetique.ts"),
              Path("src/content/editorial/cv.json"),
          ]
          text = "\n".join(path.read_text(encoding="utf-8") for path in files)
          forbidden = [
              "Young-pioneer — эдиториал-фотосъёмка для Kaltblut Magazine, 2027",
              "АНдрей",
              "фотсъемка",
              "фотосъемка",
              "фотосхемка",
              "Рапуто,стилист",
              "Жукова,продюсер",
              "сократили время производства контента",
          ]
          found = [value for value in forbidden if value in text]
          if found:
              raise SystemExit(f"Forbidden stale strings remain: {found}")

      - name: Commit final correction and clean diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/editorial-fix-3-9-final.yml
          rm -f editorial-regression-output.txt editorial-stale-output.txt
          git add -A
          git commit -m "fix(copy): finish audited Sensetique cleanup"
          git push origin HEAD:fix/editorial-audit-3-9
