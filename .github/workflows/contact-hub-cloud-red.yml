name: Contact Hub Cloud Domain

on:
  push:
    branches:
      - contact-hub-contracts
    paths:
      - .github/workflows/contact-hub-cloud-red.yml
      - test/contact-hub-domain-contract.test.mjs
      - test/contact-hub-persistence.test.mjs
      - test/portfolio-pet-interaction-contract.test.mjs
      - test/portfolio-assistant-prepared-contract.test.mjs
      - tools/e2e/contact-hub-acceptance-v2.mjs
      - src/**

permissions:
  contents: read

concurrency:
  group: contact-hub-cloud-domain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-green:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Contact Hub domain contracts GREEN
        run: >-
          node --test
          test/contact-hub-domain-contract.test.mjs
          test/contact-hub-persistence.test.mjs
          test/portfolio-pet-interaction-contract.test.mjs
          test/portfolio-assistant-prepared-contract.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build current site
        run: npm run build:vite

      - name: Install pinned Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser UI remains intentionally RED
        shell: bash
        run: |
          set +e
          node tools/e2e/contact-hub-acceptance-v2.mjs
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "Browser acceptance unexpectedly passed before Contact Hub UI exists." >&2
            exit 1
          fi
          echo "Domain is GREEN; browser UI is still RED as intended."
