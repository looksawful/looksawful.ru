name: Remove obsolete chat handoff once

on:
  push:
    branches: [contact-hub-frontend-current]
    paths:
      - .github/workflows/remove-chat-handoff-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: contact-hub-frontend-current
          fetch-depth: 1
      - name: Remove AI-to-form handoff implementation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/components/contact-hub.ts")
          text = path.read_text(encoding="utf-8")

          def sub(pattern: str, replacement: str = "") -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"expected exactly one handoff fragment: {pattern[:90]!r}")

          sub(r'import \{ applyExplicitAiDraftHandoff \} from "\.\./features/contact-hub/handoff\.ts";\n')
          sub(
              r'  const handoffDecision = documentRef\.createElement\("div"\);\n.*?'
              r'  handoffDecision\.append\(appendButton, replaceButton, cancelButton\);\n\n'
          )
          sub(
              r'(    createField\("сообщение", messageInput\),\n)    handoffDecision,\n',
              r'\1'
          )
          sub(
              r'  const draft = documentRef\.createElement\("textarea"\);\n.*?'
              r'  aiScreen\.append\(aiLog, draft, handoffButton\);\n',
              '  aiScreen.append(aiLog);\n'
          )
          sub(
              r'    messageInput,\n    draft,\n    handoffButton,\n    handoffDecision,\n'
              r'    appendButton,\n    replaceButton,\n    cancelButton,\n    composer,\n',
              '    messageInput,\n    composer,\n'
          )
          sub(
              r'    formScreen, aiScreen, aiLog, nameInput, emailInput, messageInput, draft, handoffButton,\n'
              r'    handoffDecision, appendButton, replaceButton, cancelButton, composer, composerInput,\n',
              '    formScreen, aiScreen, aiLog, nameInput, emailInput, messageInput, composer, composerInput,\n'
          )
          sub(r'  let pendingDraft = "";\n')
          sub(
              r'  const commitHandoff = .*?\n\n  const scrollAiToEnd =',
              '  const scrollAiToEnd ='
          )
          sub(
              r'      successfulAnswer = true;\n      draft\.value = result\.text;\n      handoffButton\.hidden = false;\n',
              '      successfulAnswer = true;\n'
          )
          sub(
              r'    opener = null;\n    pendingDraft = "";\n    handoffDecision\.hidden = true;\n    resetHubPosition\(\);\n',
              '    opener = null;\n    resetHubPosition();\n'
          )
          sub(
              r'  handoffButton\.addEventListener\("click", onHandoff\);\n'
              r'  appendButton\.addEventListener\("click", onAppend\);\n'
              r'  replaceButton\.addEventListener\("click", onReplace\);\n'
              r'  cancelButton\.addEventListener\("click", onCancel\);\n'
          )
          sub(
              r'    handoffButton\.removeEventListener\("click", onHandoff\);\n'
              r'    appendButton\.removeEventListener\("click", onAppend\);\n'
              r'    replaceButton\.removeEventListener\("click", onReplace\);\n'
              r'    cancelButton\.removeEventListener\("click", onCancel\);\n'
          )

          for token in ("перенести в сообщение", "contactHubHandoff", "applyExplicitAiDraftHandoff"):
              if token in text:
                  raise SystemExit(f"handoff token remains: {token}")

          path.write_text(text, encoding="utf-8")
      - name: Commit focused removal
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/contact-hub.ts
          git commit -m "refactor(chat): remove AI answer handoff"
          git push origin HEAD:contact-hub-frontend-current
