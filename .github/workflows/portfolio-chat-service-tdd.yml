name: Portfolio Chat Service TDD

on:
  push:
    branches:
      - contact-hub-frontend-current
    paths:
      - test/portfolio-assistant-prepared-contract.test.mjs
      - test/portfolio-chat-service-contract.test.mjs
      - test/portfolio-assistant-client-contract.test.mjs
      - test/contact-hub-handoff-contract.test.mjs
      - test/contact-hub-prototype-ui-contract.test.mjs
      - tools/e2e/contact-hub-mobile-contract.mjs
      - src/components/contact-hub.ts
      - src/styles/contact-hub.css
      - src/styles/site-analytics-consent.css
      - src/features/portfolio-pet/knowledge.ts
      - src/features/portfolio-pet/prepared-answers.ts
      - src/features/portfolio-pet/portfolio-chat-service.ts
      - src/features/portfolio-pet/assistant-client.ts
      - src/features/contact-hub/handoff.ts
      - .github/workflows/portfolio-chat-service-tdd.yml

permissions:
  contents: read

concurrency:
  group: portfolio-chat-service-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Focused Contact Hub assistant contracts
        run: >-
          node --test
          test/portfolio-assistant-prepared-contract.test.mjs
          test/portfolio-chat-service-contract.test.mjs
          test/portfolio-assistant-client-contract.test.mjs
          test/contact-hub-handoff-contract.test.mjs
          test/contact-hub-prototype-ui-contract.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build mobile runtime fixture
        run: npm run build:vite

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile Contact Hub viewport contract
        run: node tools/e2e/contact-hub-mobile-contract.mjs
