name: One-shot structure move smoke-site

on:
  push:
    branches: [refactor/364-repository-structure]
    paths:
      - '.github/workflows/structure-move-smoke-site.yml'

permissions:
  contents: write

jobs:
  move:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/364-repository-structure
          fetch-depth: 1
      - name: Move wrapper and update exact consumers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git mv tools/smoke-site.mjs tools/e2e/smoke-site.mjs

          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tools/e2e/smoke-site.mjs'): [
                  ('"./e2e/readiness.mjs"', '"./readiness.mjs"'),
                  ('"./e2e/runtime.mjs"', '"./runtime.mjs"'),
              ],
              Path('package.json'): [
                  ('"test:e2e": "node tools/smoke-site.mjs"', '"test:e2e": "node tools/e2e/smoke-site.mjs"'),
              ],
              Path('tools/e2e/run-all.mjs'): [
                  ('from "../smoke-site.mjs"', 'from "./smoke-site.mjs"'),
              ],
              Path('tools/e2e/run-affected.mjs'): [
                  ('from "../smoke-site.mjs"', 'from "./smoke-site.mjs"'),
              ],
              Path('test/tooling-pipeline.test.mjs'): [
                  ('["smoke-site.mjs", "runSmokeSite"]', '["e2e/smoke-site.mjs", "runSmokeSite"]'),
              ],
              Path('test/e2e-readiness-contract.test.mjs'): [
                  ('read("tools/smoke-site.mjs")', 'read("tools/e2e/smoke-site.mjs")'),
                  ('from "\\.\\/e2e\\/readiness\\.mjs"', 'from "\\.\\/readiness\\.mjs"'),
              ],
              Path('test/e2e-production-pipeline.test.mjs'): [
                  ('"node tools/smoke-site.mjs"', '"node tools/e2e/smoke-site.mjs"'),
              ],
              Path('test/caption-lightbox-contract.test.mjs'): [
                  ('read("tools/smoke-site.mjs")', 'read("tools/e2e/smoke-site.mjs")'),
              ],
              Path('docs/ci-pipeline-report.md'): [
                  ('| tools/smoke-site.mjs |', '| tools/e2e/smoke-site.mjs |'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected consumer in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          if git grep -n -E 'tools/smoke-site\.mjs|from "\.\./smoke-site\.mjs"|\["smoke-site\.mjs", "runSmokeSite"\]' -- ':!docs/superpowers/plans/*'; then
            echo 'stale smoke-site path remains' >&2
            exit 1
          fi

          git rm .github/workflows/structure-move-smoke-site.yml
          git add --all
          git diff --cached --check
          git commit -m 'refactor(e2e): move site smoke wrapper into e2e tooling'
          git push origin HEAD:refactor/364-repository-structure
