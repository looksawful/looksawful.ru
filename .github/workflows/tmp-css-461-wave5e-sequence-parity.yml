name: tmp-css-461-wave5e-sequence-parity

on:
  push:
    branches:
      - refactor/css-461-wave5e-sequence

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare exact base worktree
        env:
          BASE_SHA: 53269feffd80efc2c91bbfe0b33f527d4e2e05a9
        run: |
          git worktree add /tmp/wave5e-base "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/wave5e-base/node_modules
      - name: Start base and candidate Vite servers
        run: |
          (cd /tmp/wave5e-base && npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/wave5e-base.log 2>&1 & echo $! > /tmp/wave5e-base.pid)
          (npm run dev -- --host 127.0.0.1 --port 4174 > /tmp/wave5e-candidate.log 2>&1 & echo $! > /tmp/wave5e-candidate.pid)
          for port in 4173 4174; do
            for i in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done
      - name: Compare live sequence consumers
        run: |
          cat > tools/tmp-wave5e-sequence-parity.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          // Code search proves these are the two production sequence consumers.
          const routes = ["/work/jestei-pool/", "/work/sensetique/"];
          const viewports = [
            { name: "mobile", width: 390, height: 844 },
            { name: "tablet", width: 900, height: 1000 },
            { name: "desktop", width: 1728, height: 1000 },
          ];
          const bases = [
            ["base", "http://127.0.0.1:4173"],
            ["candidate", "http://127.0.0.1:4174"],
          ];

          const browser = await chromium.launch({ headless: true });
          let visibleTotal = 0;

          async function capture(origin, route, viewport) {
            const page = await browser.newPage({ viewport });
            await page.goto(origin + route, { waitUntil: "domcontentloaded", timeout: 20000 });
            await page.evaluate(async () => {
              await document.fonts?.ready;
              await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            });
            const data = await page.evaluate(() => {
              const round = (value) => Math.round(value * 100) / 100;
              const relativeRect = (node, rootRect) => {
                if (!node) return null;
                const rect = node.getBoundingClientRect();
                return {
                  x: round(rect.x - rootRect.x),
                  y: round(rect.y - rootRect.y),
                  width: round(rect.width),
                  height: round(rect.height),
                };
              };
              return [...document.querySelectorAll('.media-group[data-layout="sequence"]')]
                .filter((root) => {
                  const rect = root.getBoundingClientRect();
                  return rect.width > 0 && rect.height > 0;
                })
                .map((root, index) => {
                  const rootRect = root.getBoundingClientRect();
                  const rootStyle = getComputedStyle(root);
                  const items = root.querySelector(':scope > .media-group__items');
                  const middle = root.querySelector('.media-group__middle');
                  const itemsStyle = items ? getComputedStyle(items) : null;
                  const middleStyle = middle ? getComputedStyle(middle) : null;
                  const directMedia = items ? [...items.children].filter((node) => node.matches('.media, .media-group__middle')) : [];
                  const middleMedia = middle ? [...middle.children].filter((node) => node.matches('.media')) : [];
                  const surfaces = [...root.querySelectorAll('.media__surface')];
                  return {
                    index,
                    className: root.className,
                    middleOverflow: root.getAttribute('data-middle-overflow') ?? "",
                    root: { width: round(rootRect.width), height: round(rootRect.height) },
                    vars: {
                      sequenceCell: rootStyle.getPropertyValue('--sequence-cell').trim(),
                      sequenceRatio: rootStyle.getPropertyValue('--sequence-ratio').trim(),
                      sequenceColumns: rootStyle.getPropertyValue('--sequence-columns').trim(),
                      sequenceMobileRows: rootStyle.getPropertyValue('--sequence-mobile-rows').trim(),
                      groupGap: rootStyle.getPropertyValue('--group-gap').trim(),
                      groupRowGap: rootStyle.getPropertyValue('--group-row-gap').trim(),
                    },
                    items: itemsStyle ? {
                      rect: relativeRect(items, rootRect),
                      display: itemsStyle.display,
                      overflowX: itemsStyle.overflowX,
                      overflowY: itemsStyle.overflowY,
                      gridTemplateColumns: itemsStyle.gridTemplateColumns,
                      gridTemplateRows: itemsStyle.gridTemplateRows,
                      gridAutoFlow: itemsStyle.gridAutoFlow,
                      gridAutoColumns: itemsStyle.gridAutoColumns,
                      gap: itemsStyle.gap,
                      reelDisplay: itemsStyle.getPropertyValue('--reel-display').trim(),
                      reelGap: itemsStyle.getPropertyValue('--reel-gap').trim(),
                    } : null,
                    directMedia: directMedia.map((node) => ({
                      role: node.getAttribute('data-role') ?? node.className,
                      rect: relativeRect(node, rootRect),
                    })),
                    middle: middleStyle ? {
                      rect: relativeRect(middle, rootRect),
                      display: middleStyle.display,
                      overflowX: middleStyle.overflowX,
                      overflowY: middleStyle.overflowY,
                      gridTemplateColumns: middleStyle.gridTemplateColumns,
                      gridTemplateRows: middleStyle.gridTemplateRows,
                      gridAutoFlow: middleStyle.gridAutoFlow,
                      gridAutoColumns: middleStyle.gridAutoColumns,
                      gap: middleStyle.gap,
                      reelDisplay: middleStyle.getPropertyValue('--reel-display').trim(),
                      reelAlign: middleStyle.getPropertyValue('--reel-align').trim(),
                    } : null,
                    middleMedia: middleMedia.map((node) => relativeRect(node, rootRect)),
                    surfaces: surfaces.map((node) => {
                      const style = getComputedStyle(node);
                      const media = node.querySelector('img, video');
                      const mediaStyle = media ? getComputedStyle(media) : null;
                      return {
                        rect: relativeRect(node, rootRect),
                        aspectRatio: style.aspectRatio,
                        mediaRatio: style.getPropertyValue('--media-ratio').trim(),
                        mediaBlockSize: style.getPropertyValue('--media-block-size').trim(),
                        objectFit: mediaStyle?.objectFit ?? "",
                        objectPosition: mediaStyle?.objectPosition ?? "",
                      };
                    }),
                  };
                });
            });
            await page.close();
            return data;
          }

          try {
            for (const viewport of viewports) {
              for (const route of routes) {
                const captured = {};
                for (const [name, origin] of bases) captured[name] = await capture(origin, route, viewport);
                visibleTotal += captured.base.length;
                assert.ok(captured.base.length > 0, `${route} must exercise a live sequence at ${viewport.name}`);
                try {
                  assert.deepEqual(captured.candidate, captured.base);
                  console.log(`PASS ${viewport.name} ${route} sequences=${captured.base.length}`);
                } catch (error) {
                  console.error(`FAIL ${viewport.name} ${route}`);
                  console.error(JSON.stringify({ base: captured.base, candidate: captured.candidate }, null, 2));
                  throw error;
                }
              }
            }
            console.log(`SEQUENCE_PARITY_GREEN visible-sequence-cases=${visibleTotal}`);
          } finally {
            await browser.close();
          }
          EOF
          node tools/tmp-wave5e-sequence-parity.mjs
          rm tools/tmp-wave5e-sequence-parity.mjs
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: wave5e-sequence-parity-diagnostics
          path: |
            /tmp/wave5e-base.log
            /tmp/wave5e-candidate.log
          if-no-files-found: ignore
