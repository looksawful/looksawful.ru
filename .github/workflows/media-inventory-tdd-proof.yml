name: Media Inventory TDD Proof

on:
  push:
    branches:
      - feature/media-inventory-ux

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused inventory model contract
        run: node --test test/media-desk-model.test.mjs
