name: Fix blog CMS media placement

on:
  push:
    branches:
      - feat/blog-v1-editorial
    paths:
      - .github/workflows/blog-cms-media-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/blog-v1-editorial
          fetch-depth: 1

      - name: Move blog media source under media
        shell: python
        run: |
          from pathlib import Path

          path = Path('.pages.yml')
          source = path.read_text(encoding='utf-8')
          block = '''  - name: blog-images\n    label: Blog images\n    input: public/media/blog\n    output: /media/blog\n    extensions: [webp]\n    rename: safe\n'''
          occurrences = source.count(block)
          if occurrences != 1:
              raise SystemExit(f'expected exactly one blog-images block, found {occurrences}')
          source = source.replace(block + '\n', '', 1)
          anchor = '\nactions:\n'
          if anchor not in source:
              raise SystemExit('top-level actions anchor not found')
          source = source.replace(anchor, '\n' + block + '\nactions:\n', 1)
          path.write_text(source.rstrip() + '\n', encoding='utf-8')

      - name: Commit scoped CMS fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages.yml
          git diff --cached --check
          git commit -m "fix(blog): register CMS media under media"
          git push origin HEAD:feat/blog-v1-editorial
