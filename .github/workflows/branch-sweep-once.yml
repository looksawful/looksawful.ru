name: Final one-time branch sweep

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/branch-sweep-once.yml'

permissions:
  contents: write

concurrency:
  group: final-one-time-branch-sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: github.actor == 'looksawful'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete temporary refs until stable
        shell: bash
        run: |
          set -euo pipefail

          mkdir cleanup-repo
          cd cleanup-repo
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for round in 1 2 3 4 5; do
            mapfile -t branches < <(
              git ls-remote --heads origin |
                awk '{sub("refs/heads/", "", $2); print $2}' |
                sort
            )

            temp=()
            for branch in "${branches[@]}"; do
              case "$branch" in
                dev|prod) ;;
                *) temp+=("$branch") ;;
              esac
            done

            if (( ${#temp[@]} == 0 )); then
              echo "Stable after round $round: only dev and prod remain."
              break
            fi

            printf 'Round %d deleting %d temporary refs:\n' "$round" "${#temp[@]}"
            printf '  %s\n' "${temp[@]}"
            for branch in "${temp[@]}"; do
              git push origin --delete "$branch" || true
            done
            sleep 2
          done

          mapfile -t remaining < <(
            git ls-remote --heads origin |
              awk '{sub("refs/heads/", "", $2); print $2}' |
              sort
          )

          printf 'Final refs:\n'
          printf '  %s\n' "${remaining[@]}"

          if (( ${#remaining[@]} != 2 )) || [[ "${remaining[0]}" != "dev" ]] || [[ "${remaining[1]}" != "prod" ]]; then
            echo "Branch invariant failed: expected exactly dev and prod." >&2
            exit 1
          fi
