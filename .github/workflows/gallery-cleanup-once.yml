name: One-time safe gallery cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - prod
    paths:
      - ".github/workflows/gallery-cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Load verified duplicate plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin audit/gallery-inventory-20260713
          git show origin/audit/gallery-inventory-20260713:_reports/gallery-inventory/duplicate-reclaim-plan.json > /tmp/duplicate-reclaim-plan.json

      - name: Remove safe exact duplicates and unused placeholders
        run: node scripts/cleanup-gallery-safe.mjs /tmp/duplicate-reclaim-plan.json

      - name: Rebuild and validate
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run check:portfolio

      - name: Remove one-time workflow
        run: rm .github/workflows/gallery-cleanup-once.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "chore(gallery): remove exact duplicates and empty placeholders"
          git push origin HEAD:prod
