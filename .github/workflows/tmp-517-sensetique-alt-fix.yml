name: tmp-517-sensetique-alt-fix

on:
  push:
    branches:
      - fix/517-sensetique-alt-typo-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Inventory exact target state
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/content/media-catalog/registered/sensetique-13-source-50-5x7.json
            src/content/media-catalog/registered/sensetique-13-source-51-5x4.json
            src/data/media/entries/sensetique.ts
          )
          count="$(grep -o 'фотосъъемка' "${files[@]}" | wc -l | tr -d ' ')"
          echo "TARGET_COUNT=$count" >> "$GITHUB_ENV"
          echo "exact target occurrences at checkout: $count"
          test "$count" = "6" || test "$count" = "0"
      - name: RED — prove exact typo inventory
        if: env.TARGET_COUNT == '6'
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/content/media-catalog/registered/sensetique-13-source-50-5x7.json
            src/content/media-catalog/registered/sensetique-13-source-51-5x4.json
            src/data/media/entries/sensetique.ts
          )
          test "$(grep -o 'фотосъъемка' src/content/media-catalog/registered/sensetique-13-source-50-5x7.json | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'фотосъъемка' src/content/media-catalog/registered/sensetique-13-source-51-5x4.json | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'фотосъъемка' src/data/media/entries/sensetique.ts | wc -l | tr -d ' ')" = "4"
          set +e
          npx --yes --package=cspell@10.2.1 --package=@cspell/dict-ru_ru@2.3.2 cspell --config cspell.json --no-progress "${files[@]}" > /tmp/cspell-red.log 2>&1
          cspell_status=$?
          set -e
          cat /tmp/cspell-red.log
          test "$cspell_status" -ne 0
          test "$(grep -o 'фотосъъемка' /tmp/cspell-red.log | wc -l | tr -d ' ')" = "6"
      - name: Apply exact authored-alt typo correction
        if: env.TARGET_COUNT == '6'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/content/media-catalog/registered/sensetique-13-source-50-5x7.json'),
              Path('src/content/media-catalog/registered/sensetique-13-source-51-5x4.json'),
              Path('src/data/media/entries/sensetique.ts'),
          ]
          expected = {paths[0]: 1, paths[1]: 1, paths[2]: 4}
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count('фотосъъемка')
              if count != expected[path]:
                  raise SystemExit(f'{path}: expected {expected[path]} typo occurrences, got {count}')
              path.write_text(text.replace('фотосъъемка', 'фотосъемка'), encoding='utf-8')
          PY
      - name: GREEN — exact search, focused CSpell and content/media contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/content/media-catalog/registered/sensetique-13-source-50-5x7.json
            src/content/media-catalog/registered/sensetique-13-source-51-5x4.json
            src/data/media/entries/sensetique.ts
          )
          if grep -R -n --exclude-dir=.git 'фотосъъемка' src; then
            echo 'target typo remains in source' >&2
            exit 1
          fi
          set +e
          npx --yes --package=cspell@10.2.1 --package=@cspell/dict-ru_ru@2.3.2 cspell --config cspell.json --no-progress "${files[@]}" > /tmp/cspell-green.log 2>&1
          cspell_status=$?
          set -e
          cat /tmp/cspell-green.log
          if grep -Fq 'фотосъъемка' /tmp/cspell-green.log; then
            echo 'target typo still reported by focused CSpell' >&2
            exit 1
          fi
          echo "focused CSpell exit=$cspell_status; target typo absent; unrelated baseline findings preserved"
          npm run media:ensure
          npm run test:media:contract
          npm run test:fast
          git diff --check
      - name: Commit only the three scoped source files
        if: env.TARGET_COUNT == '6'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected=$'src/content/media-catalog/registered/sensetique-13-source-50-5x7.json\nsrc/content/media-catalog/registered/sensetique-13-source-51-5x4.json\nsrc/data/media/entries/sensetique.ts'
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/content/media-catalog/registered/sensetique-13-source-50-5x7.json \
            src/content/media-catalog/registered/sensetique-13-source-51-5x4.json \
            src/data/media/entries/sensetique.ts
          git commit -m 'fix(content): correct Sensetique photo alt typo (#517)'
          git push origin HEAD:fix/517-sensetique-alt-typo-v2
