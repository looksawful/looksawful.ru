name: Temp CSpell Audit 335

on:
  push:
    branches:
      - quality/cspell-scope-335

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Prepare public-scope config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('cspell.json', 'utf8'));
          config.ignorePaths = config.ignorePaths.filter((value) => value !== 'public/**');
          fs.writeFileSync('cspell-public.tmp.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE
      - name: Measure baseline and public slices
        shell: bash
        run: |
          run_probe() {
            label="$1"
            shift
            echo "::group::CSPELL_PROBE ${label}"
            start=$(date +%s%3N)
            set +e
            "$@" 2>&1 | tee "/tmp/cspell-${label}.log"
            status=${PIPESTATUS[0]}
            set -e
            end=$(date +%s%3N)
            elapsed=$((end-start))
            issues=$(grep -cE '^.+:[0-9]+:[0-9]+ - Unknown word ' "/tmp/cspell-${label}.log" || true)
            words=$(grep -E '^.+:[0-9]+:[0-9]+ - Unknown word ' "/tmp/cspell-${label}.log" | sed -E 's/.*Unknown word \(([^)]+)\).*/\1/' | sort -fu | paste -sd ',' - || true)
            echo "CSPELL_RESULT label=${label} status=${status} elapsed_ms=${elapsed} issues=${issues}"
            echo "CSPELL_WORDS label=${label} words=${words}"
            echo "::endgroup::"
          }

          run_probe baseline npm run spell

          CSPELL=(npx --yes --package=cspell@10.2.1 --package=@cspell/dict-ru_ru@2.3.2 cspell --config cspell-public.tmp.json --no-progress)
          run_probe cv "${CSPELL[@]}" "public/cv/**/*.html"
          run_probe privacy "${CSPELL[@]}" "public/privacy/**/*.html"
          run_probe pets "${CSPELL[@]}" "public/pets/**/*.html"
          run_probe docs "${CSPELL[@]}" "public/docs/**/*.html"
          run_probe components "${CSPELL[@]}" "public/components/**/*.html"
      - name: Remove temporary audit workflow
        if: always()
        shell: bash
        run: |
          rm -f cspell-public.tmp.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp-cspell-audit-335.yml
          git commit -m "chore(quality): remove temporary CSpell audit workflow"
          git push origin HEAD:quality/cspell-scope-335
