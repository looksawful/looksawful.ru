name: TEMP Nav 393 Deploy Gate

on:
  push:
    branches:
      - fix/site-nav-393-deploy

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: RED and apply deletion-only fix
        run: node tools/tmp-nav-393.mjs apply

      - name: Targeted navigation contracts
        run: node --test test/site-navigation.test.mjs test/site-navigation-runtime.test.mjs test/site-navigation-style.test.mjs test/navigation-labels-cms.test.mjs

      - name: Affected Vite build
        run: npm run build:vite

      - name: Install Chromium Firefox WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser breakpoint visual gate
        run: node tools/tmp-nav-393.mjs visual

      - name: Existing navigation smoke
        run: npm run test:e2e:navigation

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: nav-393-cross-browser-breakpoints
          path: tmp-nav-393-visuals
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary harness and commit clean fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-nav-393.yml tools/tmp-nav-393.mjs
          rm -rf tmp-nav-393-visuals
          git add src/styles/components.css
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/tmp-nav-393.yml' 'src/styles/components.css' 'tools/tmp-nav-393.mjs' | sort)"
          test "$changed" = "$expected"
          test -z "$(git diff --name-only -- src/styles/site-navigation.css)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): remove legacy site-nav surface (#393)'
          git push origin HEAD:fix/site-nav-393-deploy
