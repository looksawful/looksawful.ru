name: Gallery inventory (temporary)

on:
  push:
    branches: [feature/gallery-media-wall-preview]

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Gallery feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/gallery-media-wall-preview
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate exact Gallery inventory report
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { getGalleryItems } from './src/data/media/gallery.ts';
          import { contextualMediaCatalogItems } from './src/data/media/catalog-view.ts';
          import { mediaEntries } from './src/data/media/entries/index.ts';

          const items = [...getGalleryItems()];
          const itemIds = new Set(items.map((item) => item.id));
          const musicianProjectIds = [
            'shootings-obladaet',
            'shootings-evasha',
            'shootings-igguana',
            'shootings-esmi',
            'shootings-hypression',
            'shootings-ofelia',
            'shootings-behance-offmi',
          ];
          const movesEntryIds = [
            'moves-awful-jestei-landing-animation-01-use-01',
            'moves-awful-jestei-landing-animation-02-use-01',
            'moves-awful-jestei-landing-animation-03-use-01',
          ];
          const brandEntryIds = [
            'jestei-system-logo-source-logo-anatomy-slide-use-01',
            'jestei-system-logo-source-logo-color-slide-use-01',
            'jestei-system-logo-source-logo-type-slide-use-01',
            'jestei-system-logo-source-logo-system-01-use-01',
            'jestei-system-type-source-logo-druk-slide-use-01',
          ];
          const landingEntryIds = ['jestei-13-source-13-1280x588-use-01'];
          const bannerEntryIds = [
            'jestei-05-source-01-701x452-use-01',
            'jestei-05-source-02-1x1-use-01',
            'jestei-05-source-03-1x1-use-01',
            'jestei-05-source-04-1x1-use-01',
            'jestei-05-source-05-1x1-use-01',
            'jestei-05-source-06-1x1-use-01',
            'jestei-05-source-07-1x1-use-01',
            'jestei-05-source-08-1x1-use-01',
            'jestei-05-source-09-1x1-use-01',
            'jestei-05-source-10-1x1-use-01',
            'jestei-05-source-11-3x2-use-01',
          ];

          const assetIdsForEntries = (entryIds) => {
            const wanted = new Set(entryIds);
            return new Set(mediaEntries.filter((entry) => wanted.has(entry.id)).map((entry) => entry.assetId));
          };
          const movesAssetIds = assetIdsForEntries(movesEntryIds);
          const brandAssetIds = assetIdsForEntries(brandEntryIds);
          const landingAssetIds = assetIdsForEntries(landingEntryIds);
          const bannerAssetIds = assetIdsForEntries(bannerEntryIds);

          const posterAssetIds = new Set(mediaEntries.flatMap((entry) => entry.posterAssetId ? [entry.posterAssetId] : []));
          const usageAssetIds = new Set(mediaEntries.map((entry) => entry.assetId));
          const technicalPosterOnly = (id) => posterAssetIds.has(id) && !usageAssetIds.has(id);
          const familyExpected = (prefix) => contextualMediaCatalogItems.filter((item) =>
            item.asset.type === 'image'
            && !item.archived
            && !technicalPosterOnly(item.asset.id)
            && item.projectIds.some((projectId) => projectId.startsWith(prefix))
          );
          const styxExpected = familyExpected('styx-');
          const sensetiqueExpected = familyExpected('sensetique-');

          const duplicates = (values) => {
            const counts = new Map();
            for (const value of values) counts.set(value, (counts.get(value) ?? 0) + 1);
            return [...counts].filter(([, count]) => count > 1).map(([value, count]) => `${value} ×${count}`);
          };
          const idsForSet = (set) => items.filter((item) => set.has(item.id)).map((item) => item.id);
          const idsForProject = (projectId) => items.filter((item) => item.projectIds.includes(projectId)).map((item) => item.id);
          const missingFromOutput = (expected) => expected.map((item) => item.asset.id).filter((id) => !itemIds.has(id));
          const placeholderCredit = /^\/\s*(?:19|20)\d{2}\.?$/;

          const missingGeometry = items.filter((item) => !(item.width > 0 && item.height > 0 && item.aspectRatio > 0)).map((item) => item.id);
          const videosMissingPoster = items.filter((item) => item.kind === 'video' && !item.posterSrc).map((item) => item.id);
          const missingTitleAndAlt = items.filter((item) => !item.title.trim() && !item.alt.trim()).map((item) => item.id);
          const emptyCredits = items.filter((item) => item.credits.filter((credit) => credit.trim()).length === 0).map((item) => item.id);
          const placeholderCredits = items.filter((item) => {
            const credits = item.credits.filter((credit) => credit.trim());
            return credits.length > 0 && credits.every((credit) => placeholderCredit.test(credit.trim()));
          }).map((item) => item.id);

          const lines = [];
          lines.push('# Gallery mixed-media wall inventory');
          lines.push('');
          lines.push(`Generated from branch \`feature/gallery-media-wall-preview\` at source SHA \`${process.env.GITHUB_SHA}\`.`);
          lines.push('');
          lines.push('## Counts');
          lines.push('');
          lines.push(`- Total Gallery items: **${items.length}**`);
          lines.push(`- Images: **${items.filter((item) => item.kind === 'image').length}**`);
          lines.push(`- Videos: **${items.filter((item) => item.kind === 'video').length}**`);
          lines.push(`- STYX images: **${items.filter((item) => item.kind === 'image' && item.projectIds.some((id) => id.startsWith('styx-'))).length} / ${styxExpected.length} expected**`);
          lines.push(`- Sensetique images: **${items.filter((item) => item.kind === 'image' && item.projectIds.some((id) => id.startsWith('sensetique-'))).length} / ${sensetiqueExpected.length} expected**`);
          lines.push(`- Moves Awful approved videos: **${idsForSet(movesAssetIds).length} / ${movesAssetIds.size} expected**`);
          lines.push(`- Jestei brand/logo images: **${idsForSet(brandAssetIds).length} / ${brandAssetIds.size} expected**`);
          lines.push(`- Jestei landings video: **${idsForSet(landingAssetIds).length} / ${landingAssetIds.size} expected**`);
          lines.push(`- Jestei banners: **${idsForSet(bannerAssetIds).length} / ${bannerAssetIds.size} expected**`);
          for (const projectId of musicianProjectIds) {
            lines.push(`- ${projectId}: **${idsForProject(projectId).length}**`);
          }
          lines.push('');
          lines.push('## Required-family completeness');
          lines.push('');
          const missingStyx = missingFromOutput(styxExpected);
          const missingSensetique = missingFromOutput(sensetiqueExpected);
          lines.push(`- Missing STYX images: ${missingStyx.length ? missingStyx.map((id) => `\`${id}\``).join(', ') : 'none'}`);
          lines.push(`- Missing Sensetique images: ${missingSensetique.length ? missingSensetique.map((id) => `\`${id}\``).join(', ') : 'none'}`);
          lines.push('');
          lines.push('## Integrity');
          lines.push('');
          const duplicateIds = duplicates(items.map((item) => item.id));
          const duplicateSources = duplicates(items.map((item) => item.asset.src));
          lines.push(`- Repeated Gallery IDs: ${duplicateIds.length ? duplicateIds.map((value) => `\`${value}\``).join(', ') : 'none'}`);
          lines.push(`- Repeated exact asset.src: ${duplicateSources.length ? duplicateSources.map((value) => `\`${value}\``).join(', ') : 'none'}`);
          lines.push(`- Missing geometry: ${missingGeometry.length ? missingGeometry.map((id) => `\`${id}\``).join(', ') : 'none'}`);
          lines.push(`- Videos missing poster: ${videosMissingPoster.length ? videosMissingPoster.map((id) => `\`${id}\``).join(', ') : 'none'}`);
          lines.push(`- Missing both title and alt: ${missingTitleAndAlt.length ? missingTitleAndAlt.map((id) => `\`${id}\``).join(', ') : 'none'}`);
          lines.push('');
          lines.push('## Editorial metadata gaps');
          lines.push('');
          lines.push(`- Empty credits (${emptyCredits.length}): ${emptyCredits.length ? emptyCredits.map((id) => `\`${id}\``).join(', ') : 'none'}`);
          lines.push(`- Placeholder-only credits (${placeholderCredits.length}): ${placeholderCredits.length ? placeholderCredits.map((id) => `\`${id}\``).join(', ') : 'none'}`);
          lines.push('');
          lines.push('No authorship metadata was inferred or rewritten by this report.');
          lines.push('');
          lines.push('## Verification command');
          lines.push('');
          lines.push('Generated by the temporary GitHub Actions inventory job using `getGalleryItems()`, `contextualMediaCatalogItems` and canonical `mediaEntries`.');
          lines.push('');

          mkdirSync('docs/reports', { recursive: true });
          writeFileSync('docs/reports/2026-09-14-gallery-media-wall-inventory.md', `${lines.join('\n')}\n`);
          console.log(lines.join('\n'));
          NODE
      - name: Commit inventory report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reports/2026-09-14-gallery-media-wall-inventory.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(gallery): record mixed media inventory'
          git push origin HEAD:feature/gallery-media-wall-preview
