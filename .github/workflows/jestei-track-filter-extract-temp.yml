name: Extract Jestei Filter (temporary)

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/jestei-track-filter-extract-temp.yml

permissions:
  contents: write

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Extract exact current Jestei filter section
        shell: bash
        run: |
          node <<'NODE'
          const { mkdirSync, readFileSync, writeFileSync } = require('node:fs');
          const html = readFileSync('index.html', 'utf8');
          const startMarker = '<section class="project__section wrapper stack jestei-filter-section">';
          const nextMarker = '<section class="project__section wrapper stack jestei-before-after-section">';
          const start = html.indexOf(startMarker);
          const next = html.indexOf(nextMarker, start + startMarker.length);
          if (start < 0 || next < 0) throw new Error('Jestei filter boundaries not found');
          const closing = html.lastIndexOf('</section>', next);
          if (closing < start) throw new Error('Jestei filter closing section not found');
          const section = html.slice(start, closing + '</section>'.length);
          if (!section.includes('<playlist-filter-workflow') || !section.includes('jestei-filter-mockup')) {
            throw new Error('Extracted Jestei filter lost required runtime hooks');
          }
          const escaped = section
            .replaceAll('\\', '\\\\')
            .replaceAll('`', '\\`')
            .replaceAll('${', '\\${');
          const source = `import type { JesteiTrackFilterSection } from "../../content/contracts/sections.ts";\n\n` +
            `/** Exact migration of the existing Jestei playlist-filter DOM. */\n` +
            `export function renderJesteiTrackFilter(_section: JesteiTrackFilterSection): string {\n` +
            `  return \`${escaped}\`;\n` +
            `}\n`;
          mkdirSync('src/components/specialized', { recursive: true });
          writeFileSync('src/components/specialized/jestei-track-filter.ts', source);
          NODE

      - name: Commit extracted component once
        shell: bash
        run: |
          START_SHA="$(git rev-parse HEAD)"
          if [[ -z "$(git status --porcelain -- src/components/specialized/jestei-track-filter.ts)" ]]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/specialized/jestei-track-filter.ts
          git commit -m "refactor(content): preserve Jestei track filter renderer"

          git fetch origin "${{ github.event.pull_request.head.ref }}"
          REMOTE_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "$REMOTE_SHA" != "$START_SHA" ]]; then
            echo "PR branch moved during extraction: $START_SHA -> $REMOTE_SHA"
            exit 1
          fi

          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
