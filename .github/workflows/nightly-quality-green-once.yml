name: Nightly Full Quality GREEN Once

on:
  push:
    branches:
      - agent/nightly-quality-fix-clean-20260905
    paths:
      - '.github/workflows/nightly-quality-green-once.yml'

permissions:
  contents: read

jobs:
  full-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Rebuild and verify generated media
        run: |
          npm run media:sync
          node tools/media-dev-state.mjs --cache-verify
          git diff --exit-code
      - run: npm run typecheck
      - name: Hide temporary workflow from canonical workflow-set contract
        run: rm .github/workflows/nightly-quality-green-once.yml
      - run: npm run test:core
      - run: npm run media:dedupe:check
      - run: npm run build:site
      - name: Verify live external links from runner
        run: npm run check:external-links
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full browser regression
        run: npm run test:e2e:full
