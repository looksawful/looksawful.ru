name: Nightly Quality GREEN Once

on:
  push:
    branches:
      - agent/nightly-quality-fix-clean-20260905
    paths:
      - '.github/workflows/nightly-quality-green-once.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Hide temporary workflow from canonical workflow-set contract
        run: rm .github/workflows/nightly-quality-green-once.yml
      - name: Run CI contracts
        run: npm run test:ci
      - name: Run external-link contracts
        run: node --test test/external-links.test.mjs
