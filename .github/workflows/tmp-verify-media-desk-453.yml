name: Temporary Verify Media Desk 453

on:
  push:
    branches:
      - feature/media-desk-transactions

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Media contract
        run: npm run test:media:contract
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Media Desk E2E
        run: npm run test:e2e:media-desk
