name: Media Desk Cloudflare

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/media-desk-cloudflare.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/content/**'
      - 'src/data/catalog/**'
      - 'src/data/media/**'
      - 'src/data/taxonomy/**'
      - 'src/devtools/media-desk/**'
      - 'tools/media-desk/**'
      - 'tools/cloudflare/media-desk/**'
      - 'test/media-desk-cloudflare*.test.mjs'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/media-desk-cloudflare.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/content/**'
      - 'src/data/catalog/**'
      - 'src/data/media/**'
      - 'src/data/taxonomy/**'
      - 'src/devtools/media-desk/**'
      - 'tools/media-desk/**'
      - 'tools/cloudflare/media-desk/**'
      - 'test/media-desk-cloudflare*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-desk-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh generated catalog in runner
        run: npm run media:catalog:sync

      - name: Typecheck
        run: npm run typecheck

      - name: Cloudflare Media Desk tests
        run: node --test test/media-desk-cloudflare*.test.mjs

      - name: Build isolated Media Desk assets
        run: npm run desk:cloudflare:build

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build isolated Media Desk assets
        run: npm run desk:cloudflare:build

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_MEDIA_DESK_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config tools/cloudflare/media-desk/wrangler.jsonc
