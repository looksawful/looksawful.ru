name: Capture dev design audit

on:
  push:
    branches:
      - dev
    paths:
      - scripts/capture-dev-design-audit.mjs
      - .github/workflows/capture-dev-design-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: capture-dev-design-audit
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Mark audit pending
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "dev-design-audit/capture",
              description: "Building and capturing rendered dev branch",
              target_url: runUrl
            });

      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dev
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local production preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/looksawful-dev-preview.log 2>&1 &
          echo $! > /tmp/looksawful-dev-preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/looksawful-dev-preview.log
          exit 1

      - name: Capture baseline-compatible dev snapshot
        env:
          BASELINE_URL: http://127.0.0.1:4173/
          BASELINE_OUT: dev-audit-artifact/baseline
        run: node scripts/capture-prod-baseline.mjs

      - name: Capture exhaustive dev design audit
        env:
          AUDIT_URL: http://127.0.0.1:4173/
          AUDIT_OUT: dev-audit-artifact/design
          CAPTURE_SHA: ${{ github.sha }}
        run: node scripts/capture-dev-design-audit.mjs

      - name: Save build metadata
        shell: bash
        run: |
          mkdir -p dev-audit-artifact
          printf 'branch=dev\n' > dev-audit-artifact/CAPTURE.txt
          printf 'commit=%s\n' "$GITHUB_SHA" >> dev-audit-artifact/CAPTURE.txt
          printf 'captured_at=%s\n' "$(date --utc --iso-8601=seconds)" >> dev-audit-artifact/CAPTURE.txt
          printf '\n--- preview log ---\n' >> dev-audit-artifact/CAPTURE.txt
          cat /tmp/looksawful-dev-preview.log >> dev-audit-artifact/CAPTURE.txt

      - name: Upload dev design audit
        uses: actions/upload-artifact@v4
        with:
          name: looksawful-dev-design-audit
          path: dev-audit-artifact
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Mark audit result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "dev-design-audit/capture",
              description: success ? "Dev design audit captured" : "Dev design audit capture failed",
              target_url: runUrl
            });
            if (!success) core.setFailed("Dev design audit capture failed");
