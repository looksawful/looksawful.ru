name: Temporary Stage A control ownership proof

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused ownership test
        run: node --test test/css-stage-a-late-control-ownership.test.mjs
      - name: CSS architecture check
        run: npm run css:check
      - name: Style lint
        run: npm run lint:style
