name: Verify changes

on:
  pull_request:
    branches: [prod, dev]
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: verify-changes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Analytics contract
        run: node --test test/site-analytics.test.mjs
      - name: Restore generated media
        id: media-cache
        uses: actions/cache@v4
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/responsive-manifest.json
            public/media/generated/video-inventory.json
            src/data/media/responsive-generated.ts
          key: generated-media-v2-${{ runner.os }}-${{ hashFiles('public/media/**/*', '!public/media/generated/**', 'src/data/media/assets/**/*.ts', 'src/data/media/responsive-policy.ts', 'tools/build-responsive-media.mjs', 'tools/build-video-media.mjs', 'package-lock.json') }}
      - name: Install media tooling
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install
        run: npm ci
      - name: Prepare generated media
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: npm run media:prepare
      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Verify
        run: npm run verify:core
