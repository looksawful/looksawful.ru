name: tmp-css-461-wave5k-fade-apply
on:
  push:
    branches: [fix/css-461-wave5k-infinite-reel-fade]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/css-461-wave5k-infinite-reel-fade
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply authored fade input contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/styles/components.css')
          text = path.read_text()
          marker = '/* ==================================================\n   Infinite reel\n   ================================================== */'
          next_marker = '/* ==================================================\n   Slider and magazine — interaction without motion\n   ================================================== */'
          start = text.index(marker)
          end = text.index(next_marker, start)
          block = text[start:end]

          writer = '  --infinite-reel-fade-size: clamp(2rem, 7cqi, 6rem);\n'
          assert block.count(writer) == 1, 'expected exactly one generic fade writer'
          block = block.replace(writer, '', 1)

          old = 'var(--infinite-reel-fade-size)'
          new = 'var(--infinite-reel-fade-size, clamp(2rem, 7cqi, 6rem))'
          assert block.count(old) == 4, f'expected four fade consumers, got {block.count(old)}'
          block = block.replace(old, new)
          assert block.count(new) == 4

          updated = text[:start] + block + text[end:]
          assert updated.count('--infinite-reel-fade-size: clamp(2rem, 7cqi, 6rem);') == 0
          assert updated.count('--infinite-reel-fade-size: clamp(1.5rem, 4cqi, 4rem);') == 1
          path.write_text(updated)
          PY
          git diff --check
          node --test test/css-refactor-wave5k-infinite-reel-fade-contract.test.mjs
          node tools/ci/run-tests.mjs fast
      - name: Commit clean Wave5K tree
        shell: bash
        run: |
          rm .github/workflows/tmp-css-461-wave5k-fade-apply.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/components.css \
            test/css-refactor-wave5k-infinite-reel-fade-contract.test.mjs \
            tools/ci/run-tests.mjs \
            .github/workflows/tmp-css-461-wave5k-fade-apply.yml
          git commit -m 'fix(css): canonicalize Wave5K infinite reel fade input'
          git push origin HEAD:fix/css-461-wave5k-infinite-reel-fade
