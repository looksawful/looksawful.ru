name: Berserk browser diagnostic

on:
  push:
    branches:
      - fix/berserk-showcase-artifacts

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore generated media cache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-d11b7ec1ac405920377e09d1a574ed2014dc7912751fbb5275c42b51ca718c22

      - name: Build site
        run: npm run build:site

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start built site
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/berserk-vite.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/work/berserk-timer/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/berserk-vite.log
          exit 1

      - name: Exercise Berserk deck and audio controls
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const browserErrors = [];
          page.on('console', message => {
            if (message.type() === 'error') browserErrors.push(`console: ${message.text()}`);
          });
          page.on('pageerror', error => browserErrors.push(`pageerror: ${error.message}`));

          try {
            await page.goto('http://127.0.0.1:4173/work/berserk-timer/', { waitUntil: 'domcontentloaded' });
            const deck = page.locator('[data-media-deck]');
            await deck.waitFor({ state: 'visible' });
            await deck.scrollIntoViewIfNeeded();

            const currentIndex = async () => deck.locator('[data-deck-dot][aria-current="true"]').evaluateAll(nodes => nodes.map(node => [...node.parentElement.children].indexOf(node))[0]);
            const initial = await currentIndex();
            console.log(`[berserk-browser] initial dot: ${initial}`);

            await deck.locator('[data-deck-next]').click();
            await page.waitForFunction(() => document.querySelector('[data-media-deck] [data-deck-dot]:nth-child(2)')?.getAttribute('aria-current') === 'true');
            console.log('[berserk-browser] next: OK');

            await deck.locator('[data-deck-prev]').click();
            await page.waitForFunction(() => document.querySelector('[data-media-deck] [data-deck-dot]:first-child')?.getAttribute('aria-current') === 'true');
            console.log('[berserk-browser] prev: OK');

            const grid = deck.locator('[data-deck-toggle-grid]');
            await grid.click();
            if (await deck.getAttribute('data-deck-view') !== 'grid') throw new Error('grid toggle did not enter grid mode');
            if (await grid.getAttribute('aria-pressed') !== 'true') throw new Error('grid toggle aria state is wrong');
            console.log('[berserk-browser] grid on: OK');

            await grid.click();
            if (await deck.getAttribute('data-deck-view') !== 'slider') throw new Error('grid toggle did not return to slider mode');
            console.log('[berserk-browser] grid off: OK');

            const alert2 = page.locator('[data-berserk-audio-player] [data-audio-sound="alert2.wav"]');
            await alert2.click();
            if (await alert2.getAttribute('aria-pressed') !== 'true') throw new Error('audio sound selection did not update');
            const audioSrc = await page.locator('[data-berserk-audio-player] audio').getAttribute('src');
            if (!audioSrc?.includes('alert2.wav')) throw new Error(`audio src did not update: ${audioSrc}`);
            console.log('[berserk-browser] audio selection: OK');

            const visibleGridLabel = (await grid.textContent())?.trim();
            if (visibleGridLabel) throw new Error(`grid implementation label leaked into UI: ${JSON.stringify(visibleGridLabel)}`);

            const injectedIndexes = await page.locator('#project-berserk-timer .media__index').count();
            if (injectedIndexes !== 0) throw new Error(`generic caption numbering leaked into Berserk: ${injectedIndexes} indexes`);

            if (browserErrors.length) throw new Error(`browser errors:\n${browserErrors.join('\n')}`);
            console.log('[berserk-browser] artifact checks: OK');
          } finally {
            await browser.close();
          }
          NODE
