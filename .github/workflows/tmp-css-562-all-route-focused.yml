name: tmp-css-562-all-route-focused

on:
  push:
    branches:
      - test/css-562-all-route-focused

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: 0c581d033f33dcad785b7c5d1e2183cb3f0fb1ad
      CANDIDATE_SHA: bf237a67fbff196e490754e730ac48440fa825f8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start exact base and candidate trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/base /tmp/candidate
          git archive "$BASE_SHA" | tar -x -C /tmp/base
          git archive "$CANDIDATE_SHA" | tar -x -C /tmp/candidate
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/base/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/candidate/node_modules
          (cd /tmp/base && "$GITHUB_WORKSPACE/node_modules/.bin/vite" --host 127.0.0.1 --port 4173 >/tmp/base.log 2>&1) &
          (cd /tmp/candidate && "$GITHUB_WORKSPACE/node_modules/.bin/vite" --host 127.0.0.1 --port 4174 >/tmp/candidate.log 2>&1) &
          for port in 4173 4174; do
            for i in $(seq 1 60); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              test "$i" -lt 60
              sleep 1
            done
          done
      - name: Compare strip contract on all real routes
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/css562-all-route.mjs" <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const routes = [
            '/',
            '/work/jestei-pool/',
            '/work/styx/',
            '/work/sensetique/',
            '/shootings/',
            '/work/awful-cases/',
            '/work/moves/',
          ];
          const viewports = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 900, height: 1000 },
            { name: 'desktop', width: 1728, height: 1000 },
          ];
          const ports = { base: 4173, candidate: 4174 };
          const tolerance = 0.75;
          const round = (n) => Math.round(n * 1000) / 1000;
          const browser = await chromium.launch({ headless: true });
          const report = [];
          const failures = [];

          async function capture(port, route, viewport) {
            const context = await browser.newContext({
              viewport: { width: viewport.width, height: viewport.height },
              reducedMotion: 'reduce',
            });
            const page = await context.newPage();
            await page.goto(`http://127.0.0.1:${port}${route}`, {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });
            await page.addStyleTag({
              content: '*,*::before,*::after{animation-play-state:paused!important;transition-duration:0s!important;transition-delay:0s!important}',
            });
            await page.evaluate(async () => {
              await document.fonts?.ready;
              const visible = (el) => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
              };
              const imgs = [...document.querySelectorAll('.media-group[data-layout="strip"] img')].filter(visible);
              for (const img of imgs) img.loading = 'eager';
              await Promise.race([
                Promise.allSettled(imgs.map((img) => img.decode?.())),
                new Promise((resolve) => setTimeout(resolve, 1800)),
              ]);
              await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            });

            const snap = await page.evaluate(() => {
              const round = (n) => Math.round(n * 1000) / 1000;
              const visible = (el) => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
              };
              return [...document.querySelectorAll('.media-group[data-layout="strip"]')]
                .filter(visible)
                .map((group, index) => {
                  const items = group.querySelector(':scope > .media-group__items');
                  if (!items) return null;
                  const gr = group.getBoundingClientRect();
                  const ir = items.getBoundingClientRect();
                  const first = items.firstElementChild?.getBoundingClientRect();
                  const style = getComputedStyle(items);
                  const media = [...group.querySelectorAll('.media__surface > :is(img,video), .media__surface > picture > img')]
                    .filter(visible)
                    .slice(0, 8)
                    .map((asset) => {
                      const s = getComputedStyle(asset);
                      const r = asset.getBoundingClientRect();
                      return {
                        tag: asset.tagName,
                        objectFit: s.objectFit,
                        objectPosition: s.objectPosition,
                        width: round(r.width),
                        height: round(r.height),
                      };
                    });
                  return {
                    index,
                    className: group.className,
                    portfolio: group.classList.contains('portfolio-showcase__group'),
                    groupWidth: round(gr.width),
                    groupHeight: round(gr.height),
                    itemsWidth: round(ir.width),
                    itemsHeight: round(ir.height),
                    firstOffset: first ? round(first.x - ir.x) : null,
                    clientWidth: items.clientWidth,
                    scrollWidth: items.scrollWidth,
                    reelJustify: style.getPropertyValue('--reel-justify').trim(),
                    stripJustify: style.getPropertyValue('--strip-justify').trim(),
                    justifyContent: style.justifyContent,
                    display: style.display,
                    overflowX: style.overflowX,
                    media,
                  };
                })
                .filter(Boolean);
            });
            await context.close();
            return snap;
          }

          try {
            for (const route of routes) {
              for (const viewport of viewports) {
                const base = await capture(ports.base, route, viewport);
                const candidate = await capture(ports.candidate, route, viewport);
                const caseFailures = [];
                if (base.length !== candidate.length) {
                  caseFailures.push({ type: 'count', base: base.length, candidate: candidate.length });
                }
                for (let i = 0; i < Math.min(base.length, candidate.length); i += 1) {
                  const a = base[i];
                  const b = candidate[i];
                  if (a.className !== b.className || a.portfolio !== b.portfolio) {
                    caseFailures.push({ type: 'identity', i, base: a.className, candidate: b.className });
                    continue;
                  }

                  const widePortfolio = a.portfolio && a.groupWidth > 768;
                  if (widePortfolio) {
                    if (!(a.reelJustify === 'safe center' && b.reelJustify === 'flex-start' && b.stripJustify === 'flex-start' && b.justifyContent === 'flex-start')) {
                      caseFailures.push({
                        type: 'portfolio-computed', i,
                        base: { reel: a.reelJustify, strip: a.stripJustify, justify: a.justifyContent },
                        candidate: { reel: b.reelJustify, strip: b.stripJustify, justify: b.justifyContent },
                      });
                    }
                    for (const field of ['groupWidth','groupHeight','itemsWidth','itemsHeight','firstOffset','clientWidth','scrollWidth']) {
                      if (Math.abs((a[field] ?? 0) - (b[field] ?? 0)) > tolerance) {
                        caseFailures.push({ type: 'portfolio-geometry', i, field, base: a[field], candidate: b[field] });
                      }
                    }
                    if (a.media.length !== b.media.length) caseFailures.push({ type: 'portfolio-media-count', i, base: a.media.length, candidate: b.media.length });
                    for (let m = 0; m < Math.min(a.media.length, b.media.length); m += 1) {
                      const ma = a.media[m];
                      const mb = b.media[m];
                      for (const prop of ['tag','objectFit','objectPosition']) {
                        if (ma[prop] !== mb[prop]) caseFailures.push({ type: 'portfolio-media-prop', i, m, prop, base: ma[prop], candidate: mb[prop] });
                      }
                      for (const prop of ['width','height']) {
                        if (Math.abs(ma[prop] - mb[prop]) > tolerance) caseFailures.push({ type: 'portfolio-media-geometry', i, m, prop, base: ma[prop], candidate: mb[prop] });
                      }
                    }
                  } else {
                    for (const prop of ['reelJustify','justifyContent','display','overflowX']) {
                      if (a[prop] !== b[prop]) caseFailures.push({ type: 'fallback-computed', i, prop, base: a[prop], candidate: b[prop], portfolio: a.portfolio });
                    }
                    if (b.stripJustify !== '') {
                      caseFailures.push({ type: 'unexpected-strip-input', i, value: b.stripJustify, portfolio: b.portfolio });
                    }
                  }
                }
                const entry = {
                  route,
                  viewport: viewport.name,
                  baseGroups: base.length,
                  candidateGroups: candidate.length,
                  portfolioGroups: candidate.filter((group) => group.portfolio).length,
                  failures: caseFailures,
                };
                report.push(entry);
                failures.push(...caseFailures.map((failure) => ({ route, viewport: viewport.name, ...failure })));
                console.log(JSON.stringify(entry));
              }
            }
          } finally {
            await browser.close();
          }

          const summary = {
            cases: report.length,
            stripCases: report.reduce((sum, x) => sum + x.candidateGroups, 0),
            portfolioCases: report.reduce((sum, x) => sum + x.portfolioGroups, 0),
            failedCases: report.filter((x) => x.failures.length).length,
            failureCount: failures.length,
            failures,
          };
          console.log('SUMMARY ' + JSON.stringify(summary, null, 2));
          await writeFile('/tmp/css562-all-route.json', JSON.stringify({ report, summary }, null, 2) + '\n');
          if (failures.length) process.exitCode = 1;
          JS
          node "$GITHUB_WORKSPACE/css562-all-route.mjs"
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: css-562-all-route-${{ github.sha }}
          retention-days: 7
          path: |
            /tmp/css562-all-route.json
            /tmp/base.log
            /tmp/candidate.log
