name: Patch pet Copy GREEN

on:
  push:
    branches:
      - agent/pets-code-primitives-270
    paths:
      - .github/workflows/patch-pet-copy-green.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/pets-code-primitives-270
          fetch-depth: 1
      - name: Replace page-local Copy plumbing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shared = '<script type="module" src="/pets/shared-code-copy.js"></script>'

          awful_path = Path('public/pets/awful-cases/index.html')
          awful = awful_path.read_text(encoding='utf-8')
          for target in ('install-code', 'run-code'):
              old = f'data-copy-target="{target}"'
              new = f'data-copy-target="{target}" data-copy-transform="dos"'
              if awful.count(old) != 1:
                  raise SystemExit(f'Awful expected one {old}, found {awful.count(old)}')
              awful = awful.replace(old, new, 1)
          local_start = "<script>\ndocument.querySelectorAll('[data-copy-target]').forEach((button)=>{"
          if awful.count(local_start) != 1:
              raise SystemExit('Awful local Copy script anchor mismatch')
          start = awful.index(local_start)
          end = awful.index('</script>', start) + len('</script>')
          awful = awful[:start] + shared + awful[end:]
          awful_path.write_text(awful, encoding='utf-8')

          berserk_path = Path('public/pets/berserk-timer/index.html')
          berserk = berserk_path.read_text(encoding='utf-8')
          marker = "document.querySelectorAll('[data-copy-target]').forEach(button=>{"
          if berserk.count(marker) != 1:
              raise SystemExit(f'Berserk local Copy anchor mismatch: {berserk.count(marker)}')
          start = berserk.index(marker)
          script_end = berserk.index('</script>', start)
          berserk = berserk[:start] + berserk[script_end:]
          insertion = '</script>' + shared
          if berserk.count('</script>') < 1:
              raise SystemExit('Berserk script end missing')
          berserk = berserk.replace('</script>', insertion, 1)
          berserk_path.write_text(berserk, encoding='utf-8')
          PY
      - name: Verify targeted contract
        run: node --test test/pet-code-primitives.test.mjs
      - name: Commit GREEN page wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pets/awful-cases/index.html public/pets/berserk-timer/index.html
          git diff --cached --check
          git commit -m "refactor: share Copy enhancer across pet code surfaces"
          git push origin HEAD:agent/pets-code-primitives-270
