name: tmp-css-610-wave6e-media-lightbox-executor

on:
  push:
    branches:
      - refactor/css-462-wave6e-media-lightbox
    paths:
      - .github/workflows/tmp-css-610-wave6e-media-lightbox-executor.yml

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded MediaLightbox branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8

      - name: Verify RED ancestor and unchanged dev base
        shell: bash
        env:
          EXPECTED_RED_HEAD: a7d2009509aad20df12b3a15aa16e5771a52a1b0
          EXPECTED_BASE: 1ef8f8503a14304ef7a01f7639e84678bae3357b
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$EXPECTED_RED_HEAD" "$EXPECTED_BASE" dev
          git merge-base --is-ancestor "$EXPECTED_RED_HEAD" HEAD
          test "$(git rev-parse origin/dev)" = "$EXPECTED_BASE"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply declaration-preserving MediaLightbox ownership move
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          components_path = Path("src/styles/components.css")
          owner_path = Path("src/styles/media-lightbox.css")
          index_path = Path("src/styles/index.css")
          responsive_path = Path("test/css-fixes/responsive-css.test.mjs")
          contract_path = Path("test/caption-lightbox-contract.test.mjs")

          components = components_path.read_text()
          index = index_path.read_text()
          responsive = responsive_path.read_text()
          contract = contract_path.read_text()

          lightbox_marker = "/* --- media-lightbox --- */"
          audio_marker = "/* --- berserk-audio-player --- */"
          if components.count(lightbox_marker) != 1 or components.count(audio_marker) != 1:
              raise SystemExit("MediaLightbox/Berserk markers are not unique")
          if owner_path.exists():
              raise SystemExit("src/styles/media-lightbox.css already exists")

          start = components.index(lightbox_marker)
          end = components.index(audio_marker, start)
          owner_source = components[start:end].rstrip() + "\n"
          for required in [
              "\n[data-lightbox-source] {",
              "\n.media-lightbox__layout {",
              "\n.media-lightbox__figure {",
              "\n.media-lightbox__button {",
              "\n.media-lightbox__close {",
              "\n.media-lightbox--photoswipe {",
              "orientation: portrait",
              "orientation: landscape",
          ]:
              if required not in owner_source:
                  raise SystemExit(f"missing MediaLightbox contract fragment: {required}")
          if "berserk-audio" in owner_source or "!important" in owner_source:
              raise SystemExit("MediaLightbox extraction crossed a forbidden boundary")

          components_path.write_text(components[:start] + components[end:])
          owner_path.write_text(owner_source)

          old_imports = '@import "./media-deck.css" layer(components);\n@import "../components/jestei-theme-organism/jestei-theme-organism.css";'
          new_imports = '@import "./media-deck.css" layer(components);\n@import "./media-lightbox.css" layer(components);\n@import "../components/jestei-theme-organism/jestei-theme-organism.css";'
          if index.count(old_imports) != 1:
              raise SystemExit("MediaDeck/Jestei import boundary is not unique")
          index_path.write_text(index.replace(old_imports, new_imports, 1))

          media_deck_reader = 'const mediaDeckCss = await readFile(new URL("../../src/styles/media-deck.css", import.meta.url), "utf8");'
          if responsive.count(media_deck_reader) != 1:
              raise SystemExit("mediaDeckCss reader is not unique")
          responsive = responsive.replace(
              media_deck_reader,
              media_deck_reader + '\nconst mediaLightboxCss = await readFile(new URL("../../src/styles/media-lightbox.css", import.meta.url), "utf8");',
              1,
          )
          r_start_marker = 'test("lightbox controls and gutters include safe-area insets", () => {'
          r_next_marker = '\n});'
          if responsive.count(r_start_marker) != 1:
              raise SystemExit("responsive Lightbox test marker is not unique")
          r_start = responsive.index(r_start_marker)
          r_end = responsive.index(r_next_marker, r_start) + len(r_next_marker)
          r_block = responsive[r_start:r_end]
          if r_block.count("assert.match(css,") != 4:
              raise SystemExit("expected four Lightbox safe-area assertions on components source")
          r_block = r_block.replace("assert.match(css,", "assert.match(mediaLightboxCss,")
          responsive_path.write_text(responsive[:r_start] + r_block + responsive[r_end:])

          c_start_marker = 'test("lightbox CSS has bounded media and explicit touch portrait/landscape layouts", async () => {'
          c_next_marker = '\ntest("content facade re-exports the single media presentation contract instead of redefining caption types"'
          if contract.count(c_start_marker) != 1:
              raise SystemExit("caption Lightbox test marker is not unique")
          c_start = contract.index(c_start_marker)
          c_end = contract.index(c_next_marker, c_start)
          c_block = contract[c_start:c_end]
          for old, new in [
              ("const [components, captions]", "const [lightboxStyles, captions]"),
              ('read("src/styles/components.css")', 'read("src/styles/media-lightbox.css")'),
          ]:
              if c_block.count(old) != 1:
                  raise SystemExit(f"Lightbox contract token is not unique: {old}")
              c_block = c_block.replace(old, new, 1)
          if c_block.count("assert.match(components,") != 4:
              raise SystemExit("expected four Lightbox structural assertions on components source")
          c_block = c_block.replace("assert.match(components,", "assert.match(lightboxStyles,")
          contract_path.write_text(contract[:c_start] + c_block + contract[c_end:])
          PY

      - name: Focused MediaLightbox architecture and behavior contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test test/css-tooling-check.test.mjs
          node --test --test-name-pattern="lightbox controls and gutters" test/css-fixes/responsive-css.test.mjs
          node --test test/caption-lightbox-contract.test.mjs
          node tools/css/check.mjs

      - name: Stylelint and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          npm run lint:style
          git diff --check
          test "$(grep -c '^\[data-lightbox-source\] {' src/styles/media-lightbox.css)" -eq 1
          test "$(grep -c '^\[data-lightbox-source\] {' src/styles/components.css || true)" -eq 0
          test "$(grep -c '^\.media-lightbox__layout {' src/styles/media-lightbox.css)" -eq 1
          test "$(grep -c '^\.media-lightbox__layout {' src/styles/components.css || true)" -eq 0
          grep -q '^\.media-lightbox {' src/styles/captions.css
          grep -q '^\.media-lightbox__caption {' src/styles/captions.css

      - name: Remove executor and commit durable MediaLightbox tree
        shell: bash
        env:
          BRANCH: refactor/css-462-wave6e-media-lightbox
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-css-610-wave6e-media-lightbox-executor.yml
          git add src/styles/components.css src/styles/media-lightbox.css src/styles/index.css test/css-fixes/responsive-css.test.mjs test/caption-lightbox-contract.test.mjs
          git commit -m "refactor(css): extract MediaLightbox style ownership"
          git push origin "HEAD:$BRANCH"
