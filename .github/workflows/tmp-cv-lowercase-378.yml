name: Temporary CV lowercase patch

on:
  push:
    branches:
      - fix/cv-principles-lowercase-378

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/cv-principles-lowercase-378
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply focused CV patch
        run: node tools/tmp-cv-lowercase-378.mjs
      - name: Verify focused CV suite
        run: npm run test:cv
      - name: Commit production change if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lib/cv-content.mjs
          git diff --cached --exit-code && exit 0
          git commit -m "fix: lowercase CV principle body at render time"
          git push origin HEAD:fix/cv-principles-lowercase-378
