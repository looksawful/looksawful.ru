name: One-time analytics and Yandex SEO maintenance

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[maintenance] analytics-seo-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Patch analytics and production URL hygiene
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Stop production verification URLs from creating crawler/analytics variants.
          pages = Path('.github/workflows/pages.yml')
          s = pages.read_text()
          marker = '?sha=${GITHUB_SHA}'
          assert marker in s, 'expected SHA query markers not found'
          s = s.replace(marker, '')
          pages.write_text(s)

          # Mark only standalone portfolio cases as eligible for semantic completion tracking.
          shell = Path('src/site/renderers/entity/entity-shell.ts')
          s = shell.read_text()
          old = '''  /** Home uses this hook for intra-page project navigation; standalone pages do not require it. */\n  navigationProject?: boolean;\n  introHeadingLevel?: 1 | 2;\n'''
          new = '''  /** Home uses this hook for intra-page project navigation; standalone pages do not require it. */\n  navigationProject?: boolean;\n  /** Marks a standalone case article for semantic completion analytics. */\n  analyticsCaseEnd?: boolean;\n  introHeadingLevel?: 1 | 2;\n'''
          assert old in s, 'entity shell options target not found'
          s = s.replace(old, new, 1)
          old = '''  if (options.navigationProject) {\n    attributes.push("data-navigation-project");\n  }\n\n  if (options.theme) {\n'''
          new = '''  if (options.navigationProject) {\n    attributes.push("data-navigation-project");\n  }\n\n  if (options.analyticsCaseEnd) {\n    attributes.push("data-analytics-case-end");\n  }\n\n  if (options.theme) {\n'''
          assert old in s, 'entity shell attribute target not found'
          shell.write_text(s.replace(old, new, 1))

          page = Path('src/site/renderers/entity-page.ts')
          s = page.read_text()
          old = '''    ...presentation,\n    introHeadingLevel: 1,\n    specialized: {\n'''
          new = '''    ...presentation,\n    introHeadingLevel: 1,\n    analyticsCaseEnd: page.type === "case",\n    specialized: {\n'''
          assert old in s, 'entity page analytics target not found'
          page.write_text(s.replace(old, new, 1))

          analytics = Path('src/components/site-analytics.ts')
          s = analytics.read_text()
          old = '''  | "contact_telegram"\n  | "download";\n'''
          new = '''  | "contact_telegram"\n  | "download"\n  | "case_end";\n'''
          assert old in s, 'analytics goal union target not found'
          s = s.replace(old, new, 1)
          old = '''  root.addEventListener("click", onClick);\n  return () => root.removeEventListener("click", onClick);\n}\n'''
          new = '''  root.addEventListener("click", onClick);\n\n  const caseEndTarget = root.querySelector<HTMLElement>("[data-analytics-case-end]");\n  let caseEndReached = false;\n  const onCaseProgress = (): void => {\n    if (!caseEndTarget || caseEndReached) return;\n    if (caseEndTarget.getBoundingClientRect().bottom > target.innerHeight + 1) return;\n\n    caseEndReached = true;\n    reachSiteAnalyticsGoal(target, config, {\n      goal: "case_end",\n      params: Object.freeze({ page: analyticsPagePath(target) }),\n    });\n  };\n\n  if (caseEndTarget) {\n    target.addEventListener("scroll", onCaseProgress, { passive: true });\n    target.addEventListener("resize", onCaseProgress);\n    onCaseProgress();\n  }\n\n  return () => {\n    root.removeEventListener("click", onClick);\n    target.removeEventListener("scroll", onCaseProgress);\n    target.removeEventListener("resize", onCaseProgress);\n  };\n}\n'''
          assert old in s, 'analytics mount cleanup target not found'
          analytics.write_text(s.replace(old, new, 1))

          test = Path('test/yandex-seo-analytics.test.mjs')
          test.write_text(r'''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const read = (path) => readFile(new URL(`../${path}`, import.meta.url), "utf8");

          test("Yandex query cleanup stays explicit and production probes use canonical URLs", async () => {
            const robots = await read("public/robots.txt");
            const pages = await read(".github/workflows/pages.yml");
            assert.match(robots, /User-agent: Yandex[\s\S]*Allow: \/[\s\S]*Clean-param: sha/);
            assert.doesNotMatch(pages, /\?sha=\$\{GITHUB_SHA\}/);
            assert.match(pages, /Cache-Control: no-cache/);
          });

          test("semantic case completion is limited to standalone case pages", async () => {
            const analytics = await read("src/components/site-analytics.ts");
            const entityPage = await read("src/site/renderers/entity-page.ts");
            const entityShell = await read("src/site/renderers/entity/entity-shell.ts");
            assert.match(analytics, /\| "case_end";/);
            assert.match(analytics, /\[data-analytics-case-end\]/);
            assert.match(analytics, /getBoundingClientRect\(\)\.bottom/);
            assert.match(entityPage, /analyticsCaseEnd: page\.type === "case"/);
            assert.match(entityShell, /data-analytics-case-end/);
          });
          '''.replace(/^          /gm, ''))
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted tests
        run: node --test test/site-analytics.test.mjs test/yandex-seo-analytics.test.mjs test/ci-pipeline.test.mjs
      - name: Fast tests
        run: npm run test:fast
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pages.yml src/site/renderers/entity/entity-shell.ts src/site/renderers/entity-page.ts src/components/site-analytics.ts test/yandex-seo-analytics.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat: tighten Yandex SEO and portfolio analytics'
          git push origin HEAD:dev
      - name: Close maintenance issue
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Analytics/SEO upgrade applied after typecheck and tests passed.' });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });
