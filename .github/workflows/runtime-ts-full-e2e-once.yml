name: Runtime TS Full E2E Once

on:
  push:
    branches:
      - agent/runtime-typescript-clean-20260905
    paths:
      - '.github/workflows/runtime-ts-full-e2e-once.yml'
      - 'src/main.js'
      - 'src/main.ts'
      - 'src/interactive.js'
      - 'src/interactive.ts'
      - 'src/components/**/*.d.ts'
      - 'test/**/*.test.mjs'

permissions:
  contents: read

concurrency:
  group: runtime-ts-full-e2e-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore exact generated media cache
        id: media-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}
      - name: Recover generated media on cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: npm run media:sync
      - name: Verify generated media
        run: node tools/media-dev-state.mjs --cache-verify
      - run: npm run typecheck
      - name: Core tests without verifier-only workflow file
        run: |
          rm .github/workflows/runtime-ts-full-e2e-once.yml
          npm run test:core
      - name: Build production site
        run: npm run build:site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full browser regression
        run: npm run test:e2e:full
