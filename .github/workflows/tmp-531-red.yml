name: tmp-531-regression

on:
  push:
    branches:
      - fix/531-sensetique-equipment-hyphenation

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require classified print line-break corruption to be absent
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('src/content/media-catalog/registered/sensetique-13-source-01-1x1.json'),
              Path('src/content/media-catalog/registered/sensetique-13-source-09-1x1.json'),
              Path('src/content/media-catalog/registered/sensetique-13-source-11-1x1.json'),
              Path('src/content/media-catalog/registered/sensetique-13-source-12-1x1.json'),
              Path('src/content/media-catalog/registered/sensetique-13-source-13-1x1.json'),
              Path('src/data/media/entries/sensetique.ts'),
          ]
          classified = [
              'высококаче- ственных',
              'обеспе- чивается',
              'по- лучения',
              'кото- рый',
              'пре- красно',
              'га- рантируют',
              'де- монтаж',
              'отсоеди- нения',
              'эксперта- ми',
              'рассеивате- ля',
              'поверх- ности',
              'по- казателей',
          ]
          total = 0
          for needle in classified:
              count = sum(p.read_text(encoding='utf-8').count(needle) for p in paths)
              print(f'{needle}: {count}')
              total += count

          rx = re.compile(r'[А-Яа-яЁё]+- [А-Яа-яЁё]+')
          generic = []
          for p in paths:
              for lineno, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                  for match in rx.findall(line):
                      generic.append(f'{p}:{lineno}: {match}')

          print(f'classified_total={total}')
          print(f'generic_total={len(generic)}')
          for match in generic:
              print(match)

          if total != 0 or generic:
              raise SystemExit('Print line-break corruption remains in #531 scope')
          PY
