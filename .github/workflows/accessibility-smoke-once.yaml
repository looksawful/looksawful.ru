name: Accessibility Smoke Once

on:
  push:
    branches:
      - test/basic-accessibility-smoke-20260905
    paths:
      - 'tools/e2e/run-smoke.mjs'
      - '.github/workflows/accessibility-smoke-once.yaml'

permissions:
  contents: read

concurrency:
  group: accessibility-smoke-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore exact generated media cache
        id: media-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}
      - name: Install media tooling on cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Recover generated media on cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: npm run media:sync
      - name: Verify generated media
        run: node tools/media-dev-state.mjs --cache-verify
      - run: npm run build:site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated accessibility smoke
        run: |
          node --input-type=module <<'NODE'
          import { assertBasicAccessibility } from './tools/e2e/run-smoke.mjs';
          import { waitForDocumentReady } from './tools/e2e/readiness.mjs';
          import { withE2ERuntime } from './tools/e2e/runtime.mjs';

          const cases = [
            ['/', { width: 390, height: 844 }],
            ['/', { width: 1440, height: 900 }],
            ['/work/jestei-pool/', { width: 1440, height: 900 }],
            ['/work/moves-awful/', { width: 1440, height: 900 }],
            ['/cv/', { width: 1440, height: 900 }],
          ];

          await withE2ERuntime(async ({ browser, baseUrl }) => {
            for (const [route, viewport] of cases) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();
              try {
                const response = await page.goto(`${baseUrl}${route}`, { waitUntil: 'domcontentloaded' });
                if (!response?.ok()) throw new Error(`${route}: HTTP ${response?.status()}`);
                await waitForDocumentReady(page);
                await assertBasicAccessibility(page, route);
                console.log(`[a11y-smoke] ${route} ${viewport.width}x${viewport.height}: OK`);
              } finally {
                await context.close();
              }
            }
          });
          NODE
