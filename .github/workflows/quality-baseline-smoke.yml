name: Quality baseline smoke

on:
  pull_request:
    branches: [dev]
    paths:
      - 'package.json'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - 'cspell.json'
      - 'cspell-words.txt'
      - 'tools/quality/**'
      - '.github/workflows/quality-baseline-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Oxlint starts with project config
        run: npm run lint
      - name: Oxfmt wrapper and config work
        run: npm run format:check -- tools/quality/format.mjs
      - name: CSpell starts with RU/EN config
        shell: bash
        run: |
          set +e
          npm run spell > /tmp/cspell.log 2>&1
          code=$?
          cat /tmp/cspell.log
          if grep -Eqi 'failed to load|failed to resolve|cannot find|module not found|unknown option|configuration error|syntax error' /tmp/cspell.log; then
            exit 1
          fi
          echo "CSpell baseline exit code: $code (spelling findings are advisory in Stage 1)"
