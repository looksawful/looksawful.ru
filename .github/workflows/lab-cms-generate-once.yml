name: Lab CMS Generate Once

on:
  push:
    branches:
      - lab
    paths:
      - .github/workflows/lab-cms-generate-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lab
        uses: actions/checkout@v4
        with:
          ref: lab
          fetch-depth: 0

      - name: Generate canonical CMS options
        run: node tools/generate-pages-cms-options.mjs

      - name: Commit generated output and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lab-cms-generate-once.yml
          git add .pages.yml src/content/client-logo-visibility.json
          git diff --cached --check
          git commit -m "lab: sync generated CMS options"
          git push origin HEAD:lab
