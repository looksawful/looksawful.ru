name: Temporary Browser Bootstrap 586

on:
  push:
    branches: [ci/browser-bootstrap-586]

permissions:
  contents: read

jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Observe runner browsers
        shell: bash
        run: |
          set -euo pipefail
          for command in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$command" >/dev/null 2>&1; then
              printf '%s=' "$command"
              "$command" --version || true
            fi
          done
      - name: Current full Chromium provisioning
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s%3N)
          npx playwright install --with-deps chromium
          end=$(date +%s%3N)
          echo "CURRENT_INSTALL_MS=$((end-start))"
      - run: node tools/ci/browser-launch-probe.mjs
      - run: npm run build:vite
      - name: Representative responsive E2E
        run: npm run test:ui:responsive

  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Candidate headless-shell provisioning
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s%3N)
          npx playwright install --with-deps --only-shell chromium
          end=$(date +%s%3N)
          echo "CANDIDATE_INSTALL_MS=$((end-start))"
      - run: node tools/ci/browser-launch-probe.mjs
      - run: node --test test/browser-provisioning-contract.test.mjs
      - run: npm run build:vite
      - name: Representative responsive E2E
        run: npm run test:ui:responsive
