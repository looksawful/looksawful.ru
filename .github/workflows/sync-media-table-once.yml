name: Sync media table once
on:
  push:
    branches: [prod]
    paths: [.github/workflows/sync-media-table-once.yml]
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch current media tables
        run: |
          curl -fsSL 'https://docs.google.com/spreadsheets/d/1SV-YemgMxQ9HuDLAEFFyLSY0TZ7WuuUQYgXBvXR3-i4/export?format=csv&gid=427961252' -o /tmp/sens.csv
          curl -fsSL 'https://docs.google.com/spreadsheets/d/1SV-YemgMxQ9HuDLAEFFyLSY0TZ7WuuUQYgXBvXR3-i4/export?format=csv&gid=127838854' -o /tmp/jestei.csv
      - name: Apply approved removals and captions
        run: python3 .github/scripts/sync-media-table-once.py
      - name: Verify production build
        run: npm run build
      - name: Commit verified changes
        run: |
          rm -f .github/workflows/sync-media-table-once.yml
          rm -f .github/scripts/sync-media-table-once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Sync approved media removals and captions'
          git push origin HEAD:prod
