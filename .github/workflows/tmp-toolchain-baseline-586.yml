name: Temporary Toolchain Baseline 586

on:
  pull_request:
    branches: [dev]
    paths:
      - "package.json"
      - "tools/ci/toolchain-doctor.mjs"
      - "test/toolchain-doctor.test.mjs"
      - ".github/workflows/tmp-toolchain-baseline-586.yml"

permissions:
  contents: read

jobs:
  npm-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Measure two cold and two warm npm ci runs
        shell: bash
        run: |
          set -euo pipefail
          measure_ci() {
            label="$1"
            cache="$2"
            rm -rf node_modules
            start=$(date +%s%3N)
            npm_config_cache="$cache" npm ci --no-audit --no-fund >/tmp/"$label".log 2>&1
            end=$(date +%s%3N)
            echo "BENCH ${label}_ms=$((end-start))"
            tail -n 3 /tmp/"$label".log || true
          }
          measure_ci npm_cold_a "$RUNNER_TEMP/npm-a"
          measure_ci npm_warm_a "$RUNNER_TEMP/npm-a"
          measure_ci npm_cold_b "$RUNNER_TEMP/npm-b"
          measure_ci npm_warm_b "$RUNNER_TEMP/npm-b"
      - name: Focused doctor contract
        run: node --test test/toolchain-doctor.test.mjs
      - name: Doctor report before heavy tooling provisioning
        run: npm run toolchain:doctor -- --json

  browser-baseline:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sample: [a, b]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record browser capability before Playwright install
        shell: bash
        run: |
          set -euo pipefail
          echo "CAP google-chrome=$(command -v google-chrome || true)"
          echo "CAP google-chrome-stable=$(command -v google-chrome-stable || true)"
          echo "CAP chromium=$(command -v chromium || true)"
          echo "CAP chromium-browser=$(command -v chromium-browser || true)"
          npm run toolchain:doctor -- --json
      - name: Measure current Playwright Chromium provisioning twice
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-${{ matrix.sample }}
        run: |
          set -euo pipefail
          start=$(date +%s%3N)
          npx playwright install --with-deps chromium
          end=$(date +%s%3N)
          echo "BENCH browser_cold_${{ matrix.sample }}_ms=$((end-start))"
          start=$(date +%s%3N)
          node -e "import('playwright').then(async ({chromium}) => { const b = await chromium.launch({headless:true}); console.log('CAP playwright_launch=ok executable=' + chromium.executablePath()); await b.close(); })"
          end=$(date +%s%3N)
          echo "BENCH browser_first_launch_${{ matrix.sample }}_ms=$((end-start))"
          start=$(date +%s%3N)
          npx playwright install --with-deps chromium
          end=$(date +%s%3N)
          echo "BENCH browser_warm_${{ matrix.sample }}_ms=$((end-start))"
          npm run toolchain:doctor -- --launch-browser --json

  ffmpeg-baseline:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sample: [a, b]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Record media tooling before provisioning
        shell: bash
        run: |
          set -euo pipefail
          echo "CAP ffmpeg=$(command -v ffmpeg || true)"
          echo "CAP ffprobe=$(command -v ffprobe || true)"
          ffmpeg -version | head -n 1 || true
          ffprobe -version | head -n 1 || true
      - name: Measure current FFmpeg apt provisioning twice
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s%3N)
          sudo apt-get update >/tmp/apt-update.log 2>&1
          sudo apt-get install --yes ffmpeg >/tmp/ffmpeg-cold.log 2>&1
          end=$(date +%s%3N)
          echo "BENCH ffmpeg_cold_${{ matrix.sample }}_ms=$((end-start))"
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          start=$(date +%s%3N)
          sudo apt-get install --yes ffmpeg >/tmp/ffmpeg-warm.log 2>&1
          end=$(date +%s%3N)
          echo "BENCH ffmpeg_warm_${{ matrix.sample }}_ms=$((end-start))"
