name: Contact Hub UI TDD Slice

on:
  push:
    branches:
      - contact-hub-frontend-current
    paths:
      - .github/workflows/contact-hub-ui-tdd.yml
      - tools/e2e/contact-hub-shell-contract.mjs
      - tools/e2e/portfolio-pet-launcher-contract.mjs
      - tools/e2e/portfolio-pet-remote-contract.mjs
      - src/components/contact-hub.ts
      - src/components/portfolio-pet.ts
      - src/features/portfolio-pet/**
      - src/styles/contact-hub.css
      - src/styles/portfolio-pet.css
      - src/main.ts
      - public/pets/venus/**
      - docs/venus-animation-source.md

permissions:
  contents: read

concurrency:
  group: contact-hub-ui-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:vite
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Focused Contact Hub shell contract
        run: node tools/e2e/contact-hub-shell-contract.mjs
      - name: Focused Venus launcher contract
        run: node tools/e2e/portfolio-pet-launcher-contract.mjs
      - name: Published Venus preview contract
        env:
          PREVIEW_URL: https://pr-788.looksawful-ru-preview.pages.dev
          PREVIEW_SHA: ${{ github.sha }}
        run: node tools/e2e/portfolio-pet-remote-contract.mjs
      - name: Upload published Venus screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venus-preview-${{ github.sha }}
          path: artifacts/venus-preview-desktop.png
          if-no-files-found: ignore
          retention-days: 3
