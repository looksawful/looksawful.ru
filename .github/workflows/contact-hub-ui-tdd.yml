name: Contact Hub UI TDD Slice

on:
  push:
    branches:
      - contact-hub-frontend-current
    paths:
      - .github/workflows/contact-hub-ui-tdd.yml
      - tools/e2e/contact-hub-shell-contract.mjs
      - src/components/contact-hub.ts
      - src/styles/contact-hub.css
      - src/main.ts

permissions:
  contents: read

concurrency:
  group: contact-hub-ui-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:vite
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Focused Contact Hub shell contract
        run: node tools/e2e/contact-hub-shell-contract.mjs
