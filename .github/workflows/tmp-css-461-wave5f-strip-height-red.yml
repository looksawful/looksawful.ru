name: tmp-css-461-wave5f-strip-height-red

on:
  push:
    branches:
      - fix/css-461-strip-height-input

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require clean Wave5F RED before CSS change
        run: |
          set -euo pipefail
          set +e
          node --test test/css-refactor-wave5f-strip-height-contract.test.mjs > /tmp/wave5f-red.log 2>&1
          status=$?
          set -e
          cat /tmp/wave5f-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Wave5F strip-height contract unexpectedly passed before remediation' >&2
            exit 1
          fi
          grep -F 'strip height remains one optional authored input with a local consumer fallback' /tmp/wave5f-red.log
          grep -F 'portfolio strip height specialization does not depend on a specificity bump' /tmp/wave5f-red.log
          grep -F 'strip height cleanup preserves the existing strip justify contract' /tmp/wave5f-red.log
          grep -F 'Wave5F strip height contract is mandatory in Fast CI' /tmp/wave5f-red.log
