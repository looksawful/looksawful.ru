name: Temporary remove legacy root media

on:
  push:
    branches: [cleanup/remove-legacy-root-media]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-legacy-root-media
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply cleanup
        run: node tools/_temporary-remove-legacy-root-media.mjs
      - name: Verify focused cleanup contracts
        run: |
          git diff --check
          npm run typecheck
          npm run test:fast
          node --test test/media-tools/integrity.test.mjs
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'cleanup(media): remove legacy root media storage'
          git push origin HEAD:cleanup/remove-legacy-root-media
