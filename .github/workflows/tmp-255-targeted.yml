name: Tmp 255 targeted

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test test/page-content-editorial-ownership.test.mjs
