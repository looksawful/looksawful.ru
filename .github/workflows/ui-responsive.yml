name: UI Responsive

on:
  push:
    branches:
      - feat/page-visibility-267-final
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-responsive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-page-visibility-cms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch Pages CMS visibility controls
        run: python tools/tmp-page-visibility-cms-patch.py
