name: UI Responsive

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ui-responsive-${{ github.workflow }}-${{ github.ref }}-${{ matrix.browser }}
  cancel-in-progress: true

jobs:
  responsive:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
          - chrome
          - msedge
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Project navigation contracts
        run: >-
          node --test
          test/project-navigation-back-to-top.test.mjs
          test/project-navigation-fallback.test.mjs
          test/project-navigation-mobile-viewport.test.mjs
      - name: Build site
        run: npm run build:vite
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Responsive UI
        env:
          E2E_BROWSER: ${{ matrix.browser }}
        run: npm run test:ui:responsive
