name: UI Responsive

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    paths:
      - "src/components/site-navigation.ts"
      - "src/styles/site-navigation.css"
      - "test/site-navigation-*.test.mjs"
      - "tools/smoke-site-navigation.mjs"
      - ".github/workflows/ui-responsive.yml"

permissions:
  contents: read

concurrency:
  group: ui-responsive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Awfulface navigation contracts
        run: >-
          node --test
          test/site-navigation-style.test.mjs
          test/site-navigation-runtime.test.mjs
      - name: Build site
        run: npm run build:vite
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Awfulface navigation affected smoke
        run: npm run test:e2e:navigation
