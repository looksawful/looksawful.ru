name: UI Responsive

on:
  pull_request:
    paths:
      - "src/components/project-navigation.ts"
      - "src/interactive.ts"
      - "src/styles/components.css"
      - "src/styles/project-navigation-top.css"
      - "test/project-navigation-mobile-viewport.test.mjs"
      - "tools/e2e/run-responsive-ui.mjs"
      - ".github/workflows/ui-responsive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-responsive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Project navigation contract
        run: node --test test/project-navigation-mobile-viewport.test.mjs
