name: Repository Structure Final Gate

on:
  push:
    branches: [refactor/364-repository-structure]

permissions:
  contents: read

concurrency:
  group: repository-structure-final-gate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore exact generated media cache
        id: media-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}
      - name: Verify restored generated media
        if: steps.media-cache.outputs.cache-hit == 'true'
        run: node tools/media-dev-state.mjs --cache-verify
      - name: Install recovery video tooling on cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Recover generated media on cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          npm run media:sync
          node tools/media-dev-state.mjs --cache-verify
          git diff --exit-code
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check -- src/devtools tools/e2e test package.json vite.config.ts docs/repository-structure.md
      - name: CMS check
        run: npm run cms:check
      - name: Fast tests
        run: npm run test:fast
      - name: CI tests
        run: npm run test:ci
      - name: Media contract
        run: npm run test:media:contract
      - name: Repository structure contract
        run: node --test test/repository-structure.test.mjs test/change-scope.test.mjs
      - name: Production build
        run: npm run build:site
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: npm run test:e2e:smoke
      - name: Production CV browser smoke
        run: npm run test:e2e:cv:production
      - name: Verify production CV artifact
        run: npm run cv:prod:verify
