name: tmp-css-original-fast-acceptance

on:
  push:
    branches:
      - test/css-original-fast-acceptance

permissions:
  contents: read

concurrency:
  group: tmp-css-original-fast-acceptance
  cancel-in-progress: true

env:
  BASELINE_SHA: 113232f654a8f7f79ed9dba64e7b8774487e9099
  CURRENT_SHA: 14e7fe7eb7705bc03191a31186bc85d859c8b6b6

jobs:
  browser-matrix:
    name: original-${{ matrix.viewport }}-${{ matrix.motion }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        viewport: [mobile, tablet, desktop]
        motion: [reduce, no-preference]
    env:
      CSS_AUDIT_VIEWPORT: ${{ matrix.viewport }}
      CSS_AUDIT_MOTION: ${{ matrix.motion }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Fetch exact baseline and current refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=30 origin "$BASELINE_SHA"
          git fetch --no-tags --depth=30 origin "$CURRENT_SHA"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git cat-file -e "$CURRENT_SHA^{commit}"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install browser and media tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          npx playwright install --with-deps chromium

      - name: Build sliced deterministic comparator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("tools/tmp-css-regression-audit.mjs")
          source = source_path.read_text()
          source = source.replace("const viewports = [", "const allViewports = [", 1)
          needle = 'const motionModes = ["reduce", "no-preference"];'
          replacement = '''const viewports = allViewports.filter(
            (item) => item.name === process.env.CSS_AUDIT_VIEWPORT,
          );
          if (viewports.length !== 1) {
            throw new Error(`expected exactly one sliced viewport, got ${viewports.map((item) => item.name).join(", ")}`);
          }

          const allMotionModes = ["reduce", "no-preference"];
          const motionModes = allMotionModes.filter(
            (item) => item === process.env.CSS_AUDIT_MOTION,
          );
          if (motionModes.length !== 1) {
            throw new Error(`expected exactly one sliced motion mode, got ${motionModes.join(", ")}`);
          }'''
          if needle not in source:
            raise SystemExit("motion-mode marker not found")
          source = source.replace(needle, replacement, 1)

          current_page_marker = "      const currentPage = await currentContext.newPage();"
          page_replacement = current_page_marker + r'''

          for (const page of [baselinePage, currentPage]) {
            await page.addInitScript(() => {
              try {
                Object.defineProperty(document, "hidden", {
                  configurable: true,
                  get: () => true,
                });
              } catch {}
              try {
                Object.defineProperty(document, "visibilityState", {
                  configurable: true,
                  get: () => "hidden",
                });
              } catch {}
            });
          }'''
          if current_page_marker not in source:
            raise SystemExit("current page creation marker not found")
          source = source.replace(current_page_marker, page_replacement, 1)

          settle_marker = 'await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60_000 });'
          settle_replacement = r'''await page.route("**/*", async (route) => {
            const request = route.request();
            if (request.resourceType() !== "document") {
              await route.continue();
              return;
            }
            const response = await route.fetch();
            const contentType = response.headers()["content-type"] ?? "";
            if (!contentType.includes("text/html")) {
              await route.fulfill({ response });
              return;
            }
            let body = await response.text();
            body = body
              .replace(/data-deck-autoplay="[^"]*"/g, 'data-deck-autoplay="off"')
              .replace(/\sdata-deck-advance-on-ended(?:="")?/g, "");
            await route.fulfill({ response, body });
          });
          await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60_000 });
          await page.unroute("**/*");'''
          if settle_marker not in source:
            raise SystemExit("settle navigation marker not found")
          source = source.replace(settle_marker, settle_replacement, 1)

          Path("tools/tmp-css-regression-slice.mjs").write_text(source)

          bounded = Path("tools/tmp-css-regression-bounded.mjs").read_text()
          marker = './tmp-css-regression-audit.mjs'
          if marker not in bounded:
            raise SystemExit("bounded import marker not found")
          bounded = bounded.replace(marker, './tmp-css-regression-slice.mjs', 1)
          Path("tools/tmp-css-regression-sliced-bounded.mjs").write_text(bounded)
          PY
          node --check tools/tmp-css-regression-slice.mjs
          node --check tools/tmp-css-regression-sliced-bounded.mjs

      - name: Create exact comparison worktrees
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/css-original /tmp/css-current
          git worktree add --detach /tmp/css-original "$BASELINE_SHA"
          git worktree add --detach /tmp/css-current "$CURRENT_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/css-original/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/css-current/node_modules

      - name: Prepare identical generated media
        shell: bash
        run: |
          set -euo pipefail
          original_fp="$(cd /tmp/css-original && node tools/media-dev-state.mjs --fingerprint)"
          current_fp="$(cd /tmp/css-current && node tools/media-dev-state.mjs --fingerprint)"
          test "$original_fp" = "$current_fp"
          (cd /tmp/css-current && npm run media:sync)
          (cd /tmp/css-current && node tools/media-dev-state.mjs --cache-verify)
          rm -rf /tmp/css-original/public/media/generated
          mkdir -p /tmp/css-original/public/media/generated /tmp/css-original/.cache/media
          cp -a /tmp/css-current/public/media/generated/. /tmp/css-original/public/media/generated/
          cp /tmp/css-current/.cache/media/generated-cache.json /tmp/css-original/.cache/media/generated-cache.json
          (cd /tmp/css-original && node tools/media-dev-state.mjs --cache-verify)

      - name: Build exact trees
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/css-original && npm run build:site)
          (cd /tmp/css-current && npm run build:site)

      - name: Start exact previews
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/css-original && npx vite preview --host 127.0.0.1 --port 4171 > /tmp/css-original-preview.log 2>&1 &)
          (cd /tmp/css-current && npx vite preview --host 127.0.0.1 --port 4172 > /tmp/css-current-preview.log 2>&1 &)
          for port in 4171 4172; do
            for attempt in $(seq 1 60); do
              if curl --fail --silent "http://127.0.0.1:$port/" > /dev/null; then break; fi
              test "$attempt" -lt 60
              sleep 1
            done
          done

      - name: Compare original with current for this matrix slice
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_SHA="$BASELINE_SHA" CURRENT_SHA="$CURRENT_SHA" \
            node tools/tmp-css-regression-sliced-bounded.mjs \
              http://127.0.0.1:4171 http://127.0.0.1:4172 \
              "/tmp/css-regression-original-current-${CSS_AUDIT_VIEWPORT}-${CSS_AUDIT_MOTION}"

      - name: Archive sliced evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: css-original-fast-${{ matrix.viewport }}-${{ matrix.motion }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/css-regression-original-current-*
            /tmp/css-original-preview.log
            /tmp/css-current-preview.log
