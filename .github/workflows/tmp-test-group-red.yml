name: Temporary Test Group Proof

on:
  pull_request:
    branches: [dev]
    paths:
      - "tools/ci/run-tests.mjs"
      - "test/test-groups.test.mjs"
      - ".github/workflows/tmp-test-group-red.yml"

permissions:
  contents: read

jobs:
  test-group-entrypoints:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: node --test test/test-groups.test.mjs
      - run: npm run test:cv
      - run: npm run test:media
      - run: npm run test:media:contract
      - run: npm run test:media:checks
