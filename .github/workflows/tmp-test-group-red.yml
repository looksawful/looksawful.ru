name: Temporary Test Group RED

on:
  pull_request:
    branches: [dev]
    paths:
      - "tools/ci/run-tests.mjs"
      - "test/test-groups.test.mjs"
      - ".github/workflows/tmp-test-group-red.yml"

permissions:
  contents: read

jobs:
  test-group-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test test/test-groups.test.mjs
