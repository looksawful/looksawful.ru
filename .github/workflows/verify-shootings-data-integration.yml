name: Verify shootings data integration

on:
  push:
    branches: [integration/shootings-data-prod]

permissions:
  contents: read

concurrency:
  group: verify-shootings-data-integration
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify presentation isolation first
        run: node --test test/shootings-data-isolation.test.mjs
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install
        run: npm ci
      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Full verification
        run: npm run verify
