name: Verify shootings data integration

on:
  push:
    branches: [integration/shootings-data-prod]

permissions:
  contents: read

concurrency:
  group: verify-shootings-data-integration
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify presentation isolation first
        env:
          SHOOTINGS_ENFORCE_PRESENTATION_ISOLATION: "1"
        run: node --test test/shootings-data-isolation.test.mjs
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Restore generated media
        id: media-cache
        uses: actions/cache@v4
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
          key: generated-media-v3-${{ runner.os }}-${{ hashFiles('public/media/**/*', '!public/media/generated/**', 'src/content/projects.json', 'src/data/media/assets/**/*.ts', 'src/data/media/responsive.ts', 'src/data/media/responsive-policy.ts', 'tools/build-responsive-media.mjs', 'tools/build-video-media.mjs', 'package-lock.json') }}
          restore-keys: |
            generated-media-v3-${{ runner.os }}-
      - name: Ensure media tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Sync generated media
        run: npm run media:sync
      - name: Check tracked media metadata
        run: git diff --exit-code -- public/media/generated/responsive-manifest.json public/media/generated/video-inventory.json src/data/media/responsive-generated.ts
      - name: Core tests
        run: npm run test:core
      - name: Build site
        run: npm run build:site
      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: npm run test:e2e:all
