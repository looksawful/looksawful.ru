name: Temporary Jestei CMS codemod

on:
  push:
    branches:
      - feat/cms-jestei-editorial-copy

permissions:
  contents: write

jobs:
  codemod:
    if: "${{ github.event.head_commit.message == 'chore(cms): run Jestei editorial codemod' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/cms-jestei-editorial-copy
          fetch-depth: 0

      - name: Apply guarded codemod
        run: node tools/tmp-jestei-cms-codemod.mjs

      - name: Verify exact changed scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'.pages.yml\nsrc/data/content/jestei-pool.ts'
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages.yml src/data/content/jestei-pool.ts
          git commit -m "feat(cms): wire Jestei editorial content"
          git push origin HEAD:feat/cms-jestei-editorial-copy
