name: Fast CI

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'src/content/editorial/**'
      - 'docs/**'
      - 'src/content/media-catalog/**'
      - 'public/media/catalog/**'
      - 'public/media/projects/index/**'
      - 'src/content/projects.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-dev
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Fast tests
        run: npm run test:fast
      - name: Build
        run: npm run build:site
