name: Fast CI

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - '.agents/**'
      - 'archive/**'
      - 'src/content/editorial/cv.json'
      - 'src/content/editorial/home-project-cards.json'
      - 'src/content/navigation.json'
      - 'src/content/cases/**'
      - 'src/content/collections/shootings.json'
      - 'src/content/shootings/**'
      - 'src/content/standalone-projects/**'
      - 'src/content/projects.json'
      - 'public/media/catalog/**'
      - 'public/media/projects/index/**'
      - 'src/data/media/catalog-records.generated.ts'
      - 'src/data/media/responsive-generated.ts'
      - 'src/content/media-catalog/registered/**'
      - 'src/content/media-catalog/uploads/**'
      - 'public/media/generated/responsive-manifest.json'
      - 'public/media/generated/video-inventory.json'
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      payload:
        description: Optional Pages CMS action payload; Fast CI never mutates it
        required: false
        type: string
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore exact generated media cache
        id: media-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}
      - name: Verify restored generated media
        if: steps.media-cache.outputs.cache-hit == 'true'
        run: node tools/media-dev-state.mjs --cache-verify
      - name: Validate Sharp media output against released cache
        if: steps.media-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          find public/media/generated/responsive public/media/generated/video -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/media-before.sha256
          sha256sum public/media/generated/video-inventory.json >> /tmp/media-before.sha256
          npm run media:sync
          find public/media/generated/responsive public/media/generated/video -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/media-after.sha256
          sha256sum public/media/generated/video-inventory.json >> /tmp/media-after.sha256
          diff -u /tmp/media-before.sha256 /tmp/media-after.sha256
          node tools/media-dev-state.mjs --cache-verify
          npm run test:media:checks
          git diff --exit-code
      - name: Install recovery video tooling on cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Sharp validation requires the released exact cache as comparison baseline." >&2
          exit 1
      - name: Typecheck
        run: npm run typecheck
      - name: Fast tests
        run: npm run test:fast
      - name: Production build
        run: npm run build:site
