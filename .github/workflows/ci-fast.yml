name: Fast CI

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - '.agents/**'
      - 'archive/**'
      - 'src/content/editorial/cv.json'
      - 'src/content/editorial/home-project-cards.json'
      - 'src/content/navigation.json'
      - 'src/content/cases/**'
      - 'src/content/collections/shootings.json'
      - 'src/content/shootings/**'
      - 'src/content/standalone-projects/**'
      - 'src/content/projects.json'
      - 'public/media/catalog/**'
      - 'public/media/projects/index/**'
      - 'src/data/media/catalog-records.generated.ts'
      - 'src/data/media/responsive-generated.ts'
      - 'src/content/media-catalog/registered/**'
      - 'src/content/media-catalog/uploads/**'
      - 'public/media/generated/responsive-manifest.json'
      - 'public/media/generated/video-inventory.json'
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      payload:
        description: Optional Pages CMS action payload; Fast CI never mutates it
        required: false
        type: string
  workflow_call:

permissions:
  contents: write

concurrency:
  group: fast-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore exact generated media cache
        id: media-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}
      - name: Require exact generated media cache
        if: steps.media-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "Exact generated-media cache is missing for this source tree." >&2
          echo "Run CMS media with rebuild_cache=true before retrying CI." >&2
          exit 1
      - name: Verify generated media cache
        run: node tools/media-dev-state.mjs --cache-verify
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: One-time cleanup media validation
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/minimal-ci-cleanup-20260904'
        run: npm run media:check
      - name: One-time remove retired CMS publication helper
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/minimal-ci-cleanup-20260904'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = ".pages.yml";
          const block = `actions:\n  - name: prepare-publication\n    label: Подготовить публикацию\n    workflow: pages-cms-publish.yml\n    ref: prod\n    cancelable: false\n    confirm:\n      title: Подготовить публикацию?\n      message: Создаст или найдёт pull request из dev в prod. Сайт не будет опубликован автоматически.\n      button: Подготовить\n\n`;
          const source = readFileSync(path, "utf8");
          if (!source.includes(block)) throw new Error("exact prepare-publication block not found");
          writeFileSync(path, source.replace(block, ""));
          NODE
          git rm \
            .github/workflows/pages-cms-publish.yml \
            tools/cms-publication-scope.mjs \
            tools/cms-publication-topology.mjs \
            test/cms-publication-scope.test.mjs \
            test/cms-publication-topology.test.mjs \
            test/cms-publication-workflow.test.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pages.yml
          git commit -m 'chore(cms): remove retired publication helper'
          git push origin HEAD:"$HEAD_BRANCH"
