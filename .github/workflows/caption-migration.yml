name: Static caption migration

on:
  push:
    branches: [prod]
    paths:
      - ".github/workflows/caption-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebase onto latest prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin prod
          git rebase origin/prod

      - name: Migrate captions to HTML
        run: python3 scripts/migrate-static-media-captions.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit migration
        run: |
          rm -f scripts/migrate-static-media-captions.py .github/workflows/caption-migration.yml
          rmdir scripts 2>/dev/null || true
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Refactor media captions to static HTML"
            git push origin HEAD:prod
          fi
