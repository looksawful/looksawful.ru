name: tmp-css-578-infinite-reel-stable-parity
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d4a7a2ae93adac6f187f840abeedf9c1f3104945
      - uses: actions/checkout@v7
        with:
          ref: 3052400b9d8333bf62fe0147244faa4822e97a8b
          path: base
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: |
          npm ci
          (cd base && npm ci)
      - name: Verify identical media input and restore canonical cache
        id: media
        shell: bash
        run: |
          set -euo pipefail
          BASE_FP=$(cd base && node tools/media-dev-state.mjs --fingerprint)
          CAND_FP=$(node tools/media-dev-state.mjs --fingerprint)
          test "$BASE_FP" = "$CAND_FP"
          echo "fingerprint=$CAND_FP" >> "$GITHUB_OUTPUT"
      - id: media-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}
      - name: Require cache hit and mirror to base
        env:
          CACHE_HIT: ${{ steps.media-cache.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = "true" || { echo 'Exact generated-media cache miss; do not regenerate for CSS parity.' >&2; exit 1; }
          node tools/media-dev-state.mjs --cache-verify
          mkdir -p base/public/media/generated base/.cache/media
          cp -a public/media/generated/responsive base/public/media/generated/
          cp -a public/media/generated/video base/public/media/generated/
          cp -a public/media/generated/video-inventory.json base/public/media/generated/
          cp .cache/media/generated-cache.json base/.cache/media/
          (cd base && node tools/media-dev-state.mjs --cache-verify)
      - run: npx playwright install --with-deps chromium
      - name: Build and start exact previews
        shell: bash
        run: |
          (cd base && npm run build:site)
          npm run build:site
          (cd base && npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/base-preview.log 2>&1) &
          (npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/candidate-preview.log 2>&1) &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/base-preview.log || true
          cat /tmp/candidate-preview.log || true
          exit 1
      - name: Compare stabilized live infinite-reel contract
        shell: bash
        run: |
          mkdir -p evidence
          cat > wave5k-stable-parity.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const baseURL='http://127.0.0.1:4173';
          const candidateURL='http://127.0.0.1:4174';
          const routes=['/','/work/jestei-pool/','/shootings/','/work/sensetique/','/work/moves/'];
          const viewports=[['mobile',390,844],['tablet',900,1000],['desktop',1728,1000]];
          const motions=['reduce','no-preference'];
          const browser=await chromium.launch({headless:true});
          const evidence=[];
          let failures=0;
          const round=v=>Math.round(v*1000)/1000;
          const norm=v=>String(v??'').replaceAll(/\s+/g,' ').trim();

          async function stabilize(root,page){
            await root.scrollIntoViewIfNeeded();
            await root.evaluate(async element=>{
              const imgs=[...element.querySelectorAll('img')];
              for(const img of imgs) img.loading='eager';
              await Promise.all(imgs.map(img=>{
                if(img.complete && img.naturalWidth>0) return Promise.resolve();
                return new Promise(resolve=>{
                  const done=()=>resolve();
                  img.addEventListener('load',done,{once:true});
                  img.addEventListener('error',done,{once:true});
                  setTimeout(done,2500);
                });
              }));
              const videos=[...element.querySelectorAll('video')];
              await Promise.all(videos.map(video=>{
                if(video.readyState>=1) return Promise.resolve();
                return new Promise(resolve=>{
                  const done=()=>resolve();
                  video.addEventListener('loadedmetadata',done,{once:true});
                  video.addEventListener('error',done,{once:true});
                  setTimeout(done,2000);
                });
              }));
            });
            let previous=''; let stable=0;
            for(let attempt=0;attempt<20;attempt++){
              const signature=await root.evaluate(element=>{
                const track=element.querySelector(':scope > [data-infinite-reel-track]');
                if(!(track instanceof HTMLElement)) return 'missing';
                return `${track.scrollWidth}:${track.getBoundingClientRect().width}:${element.getBoundingClientRect().height}`;
              });
              stable=signature===previous?stable+1:0;
              if(stable>=2) break;
              previous=signature;
              await page.waitForTimeout(100);
            }
            await page.waitForTimeout(100);
          }

          async function readReel(root,index){
            return root.evaluate((element,index)=>{
              const root=element;
              const track=root.querySelector(':scope > [data-infinite-reel-track]');
              if(!(track instanceof HTMLElement)) throw new Error(`reel ${index} missing track`);
              const before=getComputedStyle(track);
              const live={
                animationName:before.animationName,
                animationDuration:before.animationDuration,
                animationTimingFunction:before.animationTimingFunction,
                animationIterationCount:before.animationIterationCount,
                animationPlayState:before.animationPlayState,
                willChange:before.willChange,
              };
              for(const animation of track.getAnimations()){
                animation.pause();
                try { animation.currentTime=0; } catch {}
              }
              const rs=getComputedStyle(root), ts=getComputedStyle(track);
              const originals=[...track.children].filter(x=>!x.hasAttribute('data-infinite-reel-clone'));
              const clones=[...track.children].filter(x=>x.hasAttribute('data-infinite-reel-clone'));
              const first=originals[0] instanceof HTMLElement?originals[0]:null;
              const surface=first?.querySelector('.media__surface');
              const media=surface?.querySelector('img,video,picture > img');
              const rr=root.getBoundingClientRect(), tr=track.getBoundingClientRect(), fr=first?.getBoundingClientRect(), sr=surface instanceof HTMLElement?surface.getBoundingClientRect():null;
              const ss=surface instanceof HTMLElement?getComputedStyle(surface):null, ms=media instanceof HTMLElement?getComputedStyle(media):null;
              return {
                index,className:root.className,animated:root.getAttribute('data-animated'),active:root.hasAttribute('data-infinite-reel-active'),
                originalCount:originals.length,cloneCount:clones.length,
                durationVar:rs.getPropertyValue('--infinite-reel-duration').trim(),fadeVar:rs.getPropertyValue('--infinite-reel-fade-size').trim(),
                maskImage:rs.maskImage,webkitMaskImage:rs.webkitMaskImage,overflowX:rs.overflowX,overflowY:rs.overflowY,minInlineSize:rs.minInlineSize,
                rootWidth:rr.width,rootHeight:rr.height,rootClientWidth:root.clientWidth,rootScrollWidth:root.scrollWidth,
                trackWidth:tr.width,trackHeight:tr.height,trackScrollWidth:track.scrollWidth,trackDisplay:ts.display,trackFlexWrap:ts.flexWrap,
                trackAlignItems:ts.alignItems,trackJustifyContent:ts.justifyContent,trackGap:ts.columnGap,trackWidthCss:ts.width,
                trackMaxInlineSize:ts.maxInlineSize,trackOverflow:ts.overflow,trackScrollSnapType:ts.scrollSnapType,
                firstWidth:fr?.width??null,firstHeight:fr?.height??null,surfaceWidth:sr?.width??null,surfaceHeight:sr?.height??null,
                surfaceAspectRatio:ss?.aspectRatio??null,objectFit:ms?.objectFit??null,objectPosition:ms?.objectPosition??null,
                live,
              };
            },index);
          }

          async function snap(origin,route,[name,width,height],reducedMotion){
            const context=await browser.newContext({viewport:{width,height},reducedMotion});
            const page=await context.newPage();
            await page.goto(origin+route,{waitUntil:'domcontentloaded'});
            const roots=page.locator('[data-infinite-reel]');
            const count=await roots.count();
            const reels=[];
            for(let i=0;i<count;i++){
              const root=roots.nth(i);
              const box=await root.boundingBox();
              if(!box||box.width<=0||box.height<=0) continue;
              await stabilize(root,page);
              reels.push(await readReel(root,i));
            }
            const doc=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
            await context.close();
            return {name,reducedMotion,reels,doc};
          }

          const normalized=v=>({
            ...v,
            maskImage:norm(v.maskImage),webkitMaskImage:norm(v.webkitMaskImage),
            rootWidth:round(v.rootWidth),rootHeight:round(v.rootHeight),trackWidth:round(v.trackWidth),trackHeight:round(v.trackHeight),
            firstWidth:v.firstWidth==null?null:round(v.firstWidth),firstHeight:v.firstHeight==null?null:round(v.firstHeight),
            surfaceWidth:v.surfaceWidth==null?null:round(v.surfaceWidth),surfaceHeight:v.surfaceHeight==null?null:round(v.surfaceHeight),
          });

          for(const route of routes) for(const viewport of viewports) for(const motion of motions){
            const base=await snap(baseURL,route,viewport,motion);
            const candidate=await snap(candidateURL,route,viewport,motion);
            const errs=[];
            if(base.reels.length!==candidate.reels.length) errs.push(`count ${base.reels.length}->${candidate.reels.length}`);
            for(let i=0;i<Math.min(base.reels.length,candidate.reels.length);i++){
              if(JSON.stringify(normalized(base.reels[i]))!==JSON.stringify(normalized(candidate.reels[i]))) errs.push(`reel ${i} stable state differs`);
            }
            if(JSON.stringify(base.doc)!==JSON.stringify(candidate.doc)) errs.push('document overflow differs');
            failures+=errs.length;
            evidence.push({route,viewport:viewport[0],motion,base,candidate,failures:errs});
            console.log(`${errs.length?'FAIL':'PASS'} ${route} ${viewport[0]} ${motion} reels=${base.reels.length}/${candidate.reels.length}${errs.length?` :: ${errs.join('; ')}`:''}`);
          }
          await writeFile('evidence/summary.json',JSON.stringify({failures,evidence},null,2));
          await browser.close();
          if(failures) process.exitCode=1;
          EOF
          node wave5k-stable-parity.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: css-578-infinite-reel-stable-parity
          path: evidence
          if-no-files-found: warn
