name: Verify project nav fallback

on:
  push:
    branches: [fix/project-nav-fallback]

permissions:
  contents: read

concurrency:
  group: verify-project-nav-fallback
  cancel-in-progress: true

jobs:
  firefox-fallback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install
        run: npm ci
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      - name: Build production site
        run: npm run build
      - name: Firefox project navigation fallback smoke
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4174 --strictPort > /tmp/project-nav-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT

          node --input-type=module <<'NODE'
          import { firefox } from 'playwright';

          const baseUrl = 'http://127.0.0.1:4174';

          for (let attempt = 0; attempt < 80; attempt += 1) {
            try {
              const response = await fetch(baseUrl);
              if (response.ok) break;
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 250));
            if (attempt === 79) throw new Error('Vite preview did not start');
          }

          const browser = await firefox.launch();
          const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });

          await page.route('**/*', async (route) => {
            const url = new URL(route.request().url());
            if (url.origin === baseUrl) await route.continue();
            else await route.abort();
          });

          await page.goto(baseUrl, { waitUntil: 'domcontentloaded' });

          const nativeSupport = await page.evaluate(() =>
            CSS.supports('scroll-target-group: auto')
            && CSS.supports('selector(:target-current)'),
          );
          if (nativeSupport) {
            throw new Error('Firefox unexpectedly uses the native CSS path; fallback was not exercised');
          }

          const targets = await page.evaluate(() =>
            [...document.querySelectorAll('[data-projects-navigation] a[href^="#"]')]
              .map((link) => link.hash.slice(1))
              .filter((id) => {
                const target = document.getElementById(id);
                return target instanceof HTMLElement && !target.hidden;
              }),
          );

          if (targets.length < 2) {
            throw new Error(`Expected at least two visible project navigation targets, got ${targets.length}`);
          }

          for (const id of targets) {
            await page.evaluate((targetId) => {
              document.getElementById(targetId)?.scrollIntoView({ block: 'start' });
            }, id);

            await page.waitForFunction(
              (targetId) =>
                document.querySelector(`[data-projects-navigation] a[href="#${CSS.escape(targetId)}"]`)
                  ?.getAttribute('aria-current') === 'location',
              id,
              { timeout: 3000 },
            );

            const active = await page.evaluate(() =>
              [...document.querySelectorAll('[data-projects-navigation] a[aria-current="location"]')]
                .map((link) => link.hash.slice(1)),
            );

            if (active.length !== 1 || active[0] !== id) {
              throw new Error(`Expected only ${id} to be current, got ${JSON.stringify(active)}`);
            }
          }

          await browser.close();
          console.log(`[firefox] project navigation fallback OK for ${targets.length} projects`);
          NODE
