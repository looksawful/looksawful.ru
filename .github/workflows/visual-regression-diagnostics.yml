name: Homepage Lazy Media Diagnostic

on:
  push:
    branches:
      - audit/home-media-diagnostic-20260910

permissions:
  contents: read

env:
  TARGET_SHA: 8d384eeaeac58f1213fc7bccf81d42786952b625
  BASE_URL: https://www.looksawful.ru

jobs:
  homepage-lazy-media:
    name: Verify visible Ofelia media hydration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require exact deployed production SHA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "$BASE_URL/deploy-version.txt?audit=$GITHUB_RUN_ID" > /tmp/deploy-version.txt
          grep -Fxq "commit=$TARGET_SHA" /tmp/deploy-version.txt
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify visible deferred images hydrate after viewport dwell
        shell: bash
        run: |
          mkdir -p artifacts/home-lazy
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { chromium } from 'playwright';

          const selector = 'img[data-home-src*="/media/projects/shootings/19/"], img[src*="/media/projects/shootings/19/"]';
          const browser = await chromium.launch({ headless: true });
          const report = [];
          const failures = [];

          const inspect = async (locator) => locator.evaluate((node) => {
            const style = getComputedStyle(node);
            const rect = node.getBoundingClientRect();
            let ancestor = node.parentElement;
            let hiddenByAncestor = false;
            while (ancestor) {
              const ancestorStyle = getComputedStyle(ancestor);
              if (ancestor.hidden || ancestorStyle.display === 'none' || ancestorStyle.visibility === 'hidden') {
                hiddenByAncestor = true;
                break;
              }
              ancestor = ancestor.parentElement;
            }
            const visible = !hiddenByAncestor
              && style.display !== 'none'
              && style.visibility !== 'hidden'
              && Number(style.opacity || 1) > 0
              && rect.width > 1
              && rect.height > 1;
            return {
              visible,
              hiddenByAncestor,
              deferred: node.hasAttribute('data-home-image-deferred'),
              dataSrc: node.getAttribute('data-home-src'),
              src: node.getAttribute('src'),
              currentSrc: node.currentSrc,
              complete: node.complete,
              naturalWidth: node.naturalWidth,
              naturalHeight: node.naturalHeight,
              rect: { width: rect.width, height: rect.height, top: rect.top, bottom: rect.bottom },
              display: style.display,
              visibility: style.visibility,
              opacity: style.opacity,
              loading: node.getAttribute('loading'),
            };
          });

          try {
            for (const viewport of [
              { name: 'mobile', width: 390, height: 844 },
              { name: 'desktop', width: 1440, height: 900 },
              { name: 'wide', width: 1920, height: 1080 },
            ]) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                deviceScaleFactor: 1,
              });
              const page = await context.newPage();
              const browserErrors = [];
              page.on('pageerror', (error) => browserErrors.push(`pageerror: ${error.message}`));
              page.on('response', (response) => {
                try {
                  if (
                    response.status() >= 400
                    && new URL(response.url()).origin === process.env.BASE_URL
                    && !response.url().endsWith('/cdn-cgi/trace')
                  ) browserErrors.push(`HTTP ${response.status()} ${response.request().resourceType()} ${response.url()}`);
                } catch {}
              });

              await page.goto(process.env.BASE_URL, { waitUntil: 'domcontentloaded', timeout: 30_000 });
              await page.evaluate(() => document.fonts?.ready);
              await page.waitForTimeout(250);

              const candidates = page.locator(selector);
              const count = await candidates.count();
              const initial = [];
              for (let index = 0; index < count; index += 1) initial.push(await inspect(candidates.nth(index)));
              const visibleIndices = initial
                .map((state, index) => ({ state, index }))
                .filter(({ state }) => state.visible)
                .map(({ index }) => index);

              console.log(`[home-lazy] ${viewport.name}: candidates=${count} visible=${visibleIndices.length} hidden=${count - visibleIndices.length}`);
              if (!visibleIndices.length) failures.push(`${viewport.name}: no visible Ofelia images found`);

              const final = [];
              for (const index of visibleIndices) {
                const image = candidates.nth(index);
                await image.evaluate((node) => node.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'instant' }));
                await page.waitForTimeout(1_800);
                const state = await inspect(image);
                final.push({ index, state });
                console.log(`[home-lazy] ${viewport.name} image ${index}: ${JSON.stringify(state)}`);
                if (state.deferred) failures.push(`${viewport.name} image ${index}: deferred marker remained after dwell`);
                if (!state.src && !state.currentSrc) failures.push(`${viewport.name} image ${index}: src was not hydrated`);
                if (!state.complete || state.naturalWidth < 1 || state.naturalHeight < 1) {
                  failures.push(`${viewport.name} image ${index}: image failed to decode/load ${JSON.stringify(state)}`);
                }
                await page.screenshot({
                  path: `artifacts/home-lazy/ofelia-${viewport.name}-${index}.png`,
                  fullPage: false,
                  animations: 'disabled',
                });
              }

              report.push({ viewport, count, visibleIndices, initial, final, browserErrors });
              if (browserErrors.length) failures.push(`${viewport.name}: browser errors: ${browserErrors.join(' | ')}`);
              await context.close();
              await fs.writeFile('artifacts/home-lazy/report.json', JSON.stringify({ report, failures }, null, 2));
            }
          } finally {
            await browser.close();
          }

          console.log(JSON.stringify({ report, failures }, null, 2));
          if (failures.length) throw new Error(`Homepage lazy-media failures:\n${failures.join('\n')}`);
          NODE
      - name: Upload lazy media evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: homepage-lazy-media-diagnostic-v2
          path: artifacts/home-lazy
          if-no-files-found: error
