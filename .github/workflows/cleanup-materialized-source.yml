name: Cleanup materialized source

on:
  push:
    branches:
      - prod
    paths:
      - tools/cleanup-materialized-source.mjs
      - .github/workflows/cleanup-materialized-source.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prod
        uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install one-time source parser
        run: npm install --no-save --package-lock=false linkedom@0.18.12 postcss@8.5.6

      - name: Cleanup materialized source
        run: node tools/cleanup-materialized-source.mjs

      - name: Test cleaned source
        run: npm test

      - name: Build cleaned source
        run: npm run build

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "Clean materialized CV sheet source"
          git push origin HEAD:prod
