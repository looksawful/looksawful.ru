name: Repair Dedupe Preapply Guard TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-wave1-preapply-20260904

permissions:
  contents: write

jobs:
  repair-and-promote-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch empty-alt migration guard
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';

          const file = 'tools/media/apply-dedupe-migration.mjs';
          let text = await readFile(file, 'utf8');
          const before = `        if (!source || !stableEqual(source[key], old[key])) {
          blockers.push(\`${'${removeId}'}.${'${key}'} differs without usage carrier on ${'${entryId}'}\`);
        }`;
          const after = `        const missingLegacyEmptyAlt =
          key === "alt" && old[key] === "" && source === null;

        if (!missingLegacyEmptyAlt && (!source || !stableEqual(source[key], old[key]))) {
          blockers.push(\`${'${removeId}'}.${'${key}'} differs without usage carrier on ${'${entryId}'}\`);
        }`;

          assert.equal(text.includes(before), true, 'expected metadata blocker source block');
          text = text.replace(before, after);
          assert.equal(text.includes(before), false);
          assert.equal(text.includes(after), true);
          await writeFile(file, text, 'utf8');
          NODE
      - name: Add regression coverage for empty legacy alt
        shell: bash
        run: |
          set -euo pipefail
          cat > test/media-dedupe-metadata-blockers.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";

          import { metadataBlockers } from "../tools/media/apply-dedupe-migration.mjs";

          const component = {
            canonicalAssetId: "canonical",
            removeAssetIds: ["retired"],
            entryIds: ["entry-1"],
          };

          function catalogs(retiredAlt, canonicalAlt) {
            return new Map([
              ["retired", { alt: retiredAlt }],
              ["canonical", { alt: canonicalAlt }],
            ]);
          }

          test("missing usage alt carries legacy empty catalog alt semantics", () => {
            assert.deepEqual(
              metadataBlockers(
                component,
                catalogs("", "Canonical alt"),
                new Map(),
                new Map([["entry-1", { id: "entry-1" }]]),
              ),
              [],
            );
          });

          test("missing usage alt still blocks loss of meaningful legacy alt", () => {
            const blockers = metadataBlockers(
              component,
              catalogs("Meaningful retired alt", "Canonical alt"),
              new Map(),
              new Map([["entry-1", { id: "entry-1" }]]),
            );

            assert.deepEqual(blockers, [
              "retired.alt differs without usage carrier on entry-1",
            ]);
          });

          test("explicit usage carrier still has to equal the retired contextual value", () => {
            assert.deepEqual(
              metadataBlockers(
                component,
                catalogs("", "Canonical alt"),
                new Map([["entry-1", { alt: "" }]]),
                new Map([["entry-1", { id: "entry-1" }]]),
              ),
              [],
            );
          });
          EOF
      - name: Run regression tests
        run: |
          node --test test/media-dedupe-metadata-blockers.test.mjs
          node --test test/media-project-assignment.test.mjs test/media-usage-records.test.mjs test/media-catalog-cms.test.mjs
      - name: Prove guarded dry-run is clean
        run: |
          node tools/media/apply-dedupe-migration.mjs
          git diff --exit-code
      - name: Install final read-only preapply gate
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/dedupe-execution-temp.yml <<'EOF'
          name: Dedupe Preapply Full Gate TEMP

          on:
            push:
              branches:
                - agent/media-normalization-dedupe-wave1-preapply-20260904

          permissions:
            contents: read

          jobs:
            dry-run-and-media:
              runs-on: ubuntu-latest
              timeout-minutes: 40
              steps:
                - uses: actions/checkout@v7
                  with:
                    fetch-depth: 1
                - uses: actions/setup-node@v7
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - name: Install media tooling
                  run: |
                    sudo apt-get update
                    sudo apt-get install --yes ffmpeg
                - name: Pin candidate
                  run: |
                    echo "candidate=$(git rev-parse HEAD)"
                    test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
                - name: Focused semantic regressions
                  run: node --test test/media-dedupe-metadata-blockers.test.mjs test/media-project-assignment.test.mjs test/media-usage-records.test.mjs test/media-catalog-cms.test.mjs
                - name: Deterministic contextual state
                  run: |
                    node tools/media/materialize-entry-context.mjs
                    npm run media:catalog:check
                    git diff --exit-code
                - name: Guarded dedupe dry-run
                  run: |
                    node tools/media/apply-dedupe-migration.mjs
                    git diff --exit-code
                - name: Typecheck
                  run: npm run typecheck
                - name: Media contract
                  run: npm run test:media:contract
                - name: Generate media derivatives
                  run: |
                    npm run media:video:generate
                    npm run media:responsive:generate
                - name: Media checks
                  run: npm run test:media:checks
                - name: Build site
                  run: npm run build:site
                - name: Tracked tree remains deterministic
                  run: git diff --exit-code

            browser-regression:
              runs-on: ubuntu-latest
              timeout-minutes: 45
              steps:
                - uses: actions/checkout@v7
                  with:
                    fetch-depth: 1
                - uses: actions/setup-node@v7
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - name: Install media tooling
                  run: |
                    sudo apt-get update
                    sudo apt-get install --yes ffmpeg
                - name: Generate media derivatives
                  run: |
                    npm run media:video:generate
                    npm run media:responsive:generate
                - name: Build site
                  run: npm run build:site
                - name: Install Chromium
                  run: npx playwright install --with-deps chromium
                - name: Media-affected E2E
                  env:
                    E2E_AFFECTED_SUITES: media
                  run: npm run test:e2e:affected
                - name: Smoke E2E
                  run: npm run test:e2e:smoke

            full-verification:
              runs-on: ubuntu-latest
              timeout-minutes: 60
              steps:
                - uses: actions/checkout@v7
                  with:
                    fetch-depth: 1
                - uses: actions/setup-node@v7
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - name: Install media and browser tooling
                  run: |
                    sudo apt-get update
                    sudo apt-get install --yes ffmpeg
                    npx playwright install --with-deps chromium
                - name: Generate media derivatives
                  run: |
                    npm run media:video:generate
                    npm run media:responsive:generate
                - name: Verify
                  run: npm run verify
                - name: Verify full
                  run: npm run verify:full
                - name: Generated state stays deterministic
                  run: git diff --exit-code
          EOF
      - name: Verify repair mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const raw = execFileSync('git', ['status', '--porcelain=v1', '-z'], { encoding: 'utf8' });
          const changed = raw.split('\0').filter(Boolean).map((row) => row.slice(3)).sort();
          const expected = [
            '.github/workflows/dedupe-execution-temp.yml',
            'test/media-dedupe-metadata-blockers.test.mjs',
            'tools/media/apply-dedupe-migration.mjs',
          ].sort();
          console.log(JSON.stringify({ changed, expected }, null, 2));
          if (JSON.stringify(changed) !== JSON.stringify(expected)) process.exitCode = 1;
          NODE
      - name: Commit guard fix and promote full gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/dedupe-execution-temp.yml tools/media/apply-dedupe-migration.mjs test/media-dedupe-metadata-blockers.test.mjs
          git commit -m 'fix(media): preserve missing alt semantics in dedupe guard'
          git push origin HEAD:agent/media-normalization-dedupe-wave1-preapply-20260904
