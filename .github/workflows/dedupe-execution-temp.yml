name: Media Dedupe Wave 1 Actual Apply FINAL TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-wave1-apply-final-20260904

permissions:
  contents: write

concurrency:
  group: dedupe-apply-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact executor commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Assert exact PRE_APPLY parent and executor-only diff
        shell: bash
        run: |
          set -euo pipefail
          expected="4c308fb57aa05d5b9000b70f3066f17e4471497d"
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$expected"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/dedupe-execution-temp.yml"
          git diff --exit-code

      - name: Final cheap guarded preflight
        run: |
          node tools/media/export-semantic-baseline.mjs --migration --check
          node tools/media/apply-dedupe-migration.mjs
          node tools/media/apply-deferred-physical-dedupe.mjs
          node tools/media/apply-physical-only-dedupe.mjs

      - name: Apply reviewed logical dedupe exactly once
        run: node tools/media/apply-dedupe-migration.mjs --apply

      - name: Apply reviewed deferred cases exactly once
        run: node tools/media/apply-deferred-physical-dedupe.mjs --apply

      - name: Apply reviewed physical-only cleanup exactly once
        run: node tools/media/apply-physical-only-dedupe.mjs --apply

      - name: Install ffmpeg only for actual regeneration
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi

      - name: Regenerate actual post-apply canonical state
        shell: bash
        run: |
          set -euo pipefail
          npm run media:sync
          node tools/media-dev-state.mjs --cache-verify
          node tools/media/export-semantic-baseline.mjs --migration --check
          npm run typecheck
          npm run test:media:checks
          git diff --check

      - name: Commit actual reviewed dedupe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "feat(media): apply reviewed dedupe wave 1"
          git push origin HEAD:agent/media-normalization-dedupe-wave1-apply-final-20260904

      - name: Full post-apply repository verification once
        shell: bash
        run: |
          set -euo pipefail
          temp_workflow="$RUNNER_TEMP/dedupe-execution-temp.yml"
          mv .github/workflows/dedupe-execution-temp.yml "$temp_workflow"
          trap 'mv "$temp_workflow" .github/workflows/dedupe-execution-temp.yml' EXIT
          npm run verify:core

      - name: Final post-apply invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          node tools/media-dev-state.mjs --cache-verify
          node tools/media/export-semantic-baseline.mjs --migration --check
          npm run media:dedupe:check
