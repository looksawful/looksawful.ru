name: Media Dedupe Apply Tool Regression TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-wave1-preapply-fix-20260904

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply minimal AST range fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/media/apply-dedupe-migration.mjs")
          text = path.read_text(encoding="utf-8")

          old_decl = "function removeAssetDeclarations(sourceText, fileName, removeIds) {"
          new_decl = "export function removeAssetDeclarations(sourceText, fileName, removeIds) {"
          if old_decl in text:
              text = text.replace(old_decl, new_decl, 1)
          elif new_decl not in text:
              raise SystemExit("removeAssetDeclarations declaration not found")

          old_start = "        let start = node.getFullStart();"
          new_start = "        const start = node.getStart(sourceFile);"
          if old_start in text:
              text = text.replace(old_start, new_start, 1)
          elif new_start not in text:
              raise SystemExit("asset removal start expression not found")

          path.write_text(text, encoding="utf-8")
          PY
      - name: Dedupe remover regression
        run: node --test test/media-dedupe-apply-tool.test.mjs
      - name: Commit fix when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/media/apply-dedupe-migration.mjs; then
            exit 0
          fi
          git diff --check -- tools/media/apply-dedupe-migration.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/media/apply-dedupe-migration.mjs
          git commit -m "fix(media): preserve syntax when removing adjacent assets"
          git push origin HEAD:agent/media-normalization-dedupe-wave1-preapply-fix-20260904
      - name: Rehearse logical apply and parse-check repository
        shell: bash
        run: |
          set -euo pipefail
          node tools/media/apply-dedupe-migration.mjs --apply
          npm run typecheck
          git reset --hard HEAD
          git clean -fd
