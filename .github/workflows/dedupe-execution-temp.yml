name: Media Dedupe Apply Tool Regression TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-wave1-preapply-fix-20260904

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reproduce adjacent asset removal corruption
        run: node --test test/media-dedupe-apply-tool.test.mjs
