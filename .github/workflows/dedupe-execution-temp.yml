name: Materialize Restored Preapply State TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-wave1-preapply-20260904

permissions:
  contents: write

jobs:
  materialize:
    if: "${{ github.event.head_commit.message == 'fix(media): classify derived media manifest as generated' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Verify physical-only regression contract
        run: node --test test/media-physical-only-dedupe.test.mjs
      - name: Materialize deterministic media state
        run: |
          npm run media:sync
          node tools/media-dev-state.mjs --cache-verify
      - name: Enforce generated-only mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          expected=(
            'public/media/generated/responsive-manifest.json'
            'src/data/media/responsive-generated.ts'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf 'changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done
      - name: Guarded dedupe dry-runs
        run: |
          node tools/media/apply-dedupe-migration.mjs
          node tools/media/apply-deferred-physical-dedupe.mjs
          node tools/media/apply-physical-only-dedupe.mjs
      - name: Verify semantic and media contracts
        run: |
          node tools/media/export-semantic-baseline.mjs --migration --check
          npm run test:media:contract
          npm run test:media:checks
          npm run build:site
      - name: Commit deterministic restored preapply state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/media/generated/responsive-manifest.json src/data/media/responsive-generated.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'chore(media): materialize restored preapply state'
          git push origin HEAD:agent/media-normalization-dedupe-wave1-preapply-20260904
