name: Dedupe Preapply Full Gate TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-wave1-preapply-20260904

permissions:
  contents: read

jobs:
  dry-run-and-media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Pin candidate
        run: |
          echo "candidate=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Focused semantic regressions
        run: node --test test/media-project-assignment.test.mjs test/media-usage-records.test.mjs test/media-catalog-cms.test.mjs
      - name: Deterministic contextual state
        run: |
          node tools/media/materialize-entry-context.mjs
          npm run media:catalog:check
          git diff --exit-code
      - name: Guarded dedupe dry-run
        run: |
          node tools/media/apply-dedupe-migration.mjs
          git diff --exit-code
      - name: Typecheck
        run: npm run typecheck
      - name: Media contract
        run: npm run test:media:contract
      - name: Media checks
        run: npm run test:media:checks
      - name: Build site
        run: npm run build:site
      - name: Tracked tree remains deterministic
        run: git diff --exit-code

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build site
        run: npm run build:site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Affected E2E from frozen execution base
        env:
          CI_DIFF_BASE: 3140c01f001385e2a3e445a5622c08a5c63b1d79
        run: npm run test:e2e:affected
      - name: Smoke E2E
        run: npm run test:e2e:smoke

  full-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media and browser tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          npx playwright install --with-deps chromium
      - name: Verify
        run: npm run verify
      - name: Verify full
        run: npm run verify:full
      - name: Generated state stays deterministic
        run: git diff --exit-code
