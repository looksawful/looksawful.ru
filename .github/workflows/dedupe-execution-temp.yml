# Final exact-candidate gate. Heavy destructive/media/browser rehearsal was already proven on the unchanged migration code; this workflow checks only the remaining repository gates plus final dry-run invariants.
name: Media Dedupe Final Preapply Gate TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-wave1-preapply-20260904

permissions:
  contents: read

concurrency:
  group: dedupe-preapply-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preapply-final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Fast repository tests not already proven by media rehearsal
        shell: bash
        run: |
          set -euo pipefail
          temp_workflow="$RUNNER_TEMP/dedupe-execution-temp.yml"
          mv .github/workflows/dedupe-execution-temp.yml "$temp_workflow"
          trap 'mv "$temp_workflow" .github/workflows/dedupe-execution-temp.yml' EXIT
          npm run test:fast

      - name: Exact candidate type and semantic invariants
        run: |
          npm run typecheck
          node tools/media/export-semantic-baseline.mjs --migration --check

      - name: Exact candidate guarded dry-runs
        run: |
          node tools/media/apply-dedupe-migration.mjs
          node tools/media/apply-deferred-physical-dedupe.mjs
          node tools/media/apply-physical-only-dedupe.mjs
