name: Fix E2E Reveal Wait TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-wave1-preapply-20260904

permissions:
  contents: write

jobs:
  fix:
    if: "${{ github.event.head_commit.message != 'test(e2e): wait for project reveal completion' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Replace fixed reveal sleeps with state waits
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tools/smoke-site.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const oldFirst = `  await page.locator(".project-card[data-reveal=\\"card\\"]").first().scrollIntoViewIfNeeded();\n  await page.waitForTimeout(900);\n\n  const partial = await page.evaluate(() => {`;
          const newFirst = `  await page.locator(".project-card[data-reveal=\\"card\\"]").first().scrollIntoViewIfNeeded();\n  await page.waitForFunction(() => {\n    const first = document.querySelector('.project-card[data-reveal="card"]');\n    if (!(first instanceof HTMLElement)) return false;\n    const style = getComputedStyle(first);\n    return style.visibility !== "hidden" && Number(style.opacity) > 0.95;\n  }, null, { timeout: 2_500 });\n\n  const partial = await page.evaluate(() => {`;
          const oldLast = `  await page.locator(".project-card[data-reveal=\\"card\\"]").last().scrollIntoViewIfNeeded();\n  await page.waitForTimeout(900);\n\n  const final = await page.evaluate(() => {`;
          const newLast = `  await page.locator(".project-card[data-reveal=\\"card\\"]").last().scrollIntoViewIfNeeded();\n  await page.waitForFunction(() => {\n    const card = [...document.querySelectorAll('.project-card[data-reveal="card"]')].at(-1);\n    if (!(card instanceof HTMLElement)) return false;\n    const style = getComputedStyle(card);\n    return style.visibility !== "hidden" && Number(style.opacity) > 0.95;\n  }, null, { timeout: 2_500 });\n\n  const final = await page.evaluate(() => {`;
          if (!source.includes(oldFirst)) throw new Error('first reveal wait target not found');
          if (!source.includes(oldLast)) throw new Error('last reveal wait target not found');
          source = source.replace(oldFirst, newFirst).replace(oldLast, newLast);
          fs.writeFileSync(path, source);
          NODE
          git diff --check
          git diff -- tools/smoke-site.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/smoke-site.mjs
          git commit -m 'test(e2e): wait for project reveal completion'
          git push origin HEAD:agent/media-normalization-dedupe-wave1-preapply-20260904
