name: Materialize Responsive Preapply State TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-wave1-preapply-20260904

permissions:
  contents: write

jobs:
  materialize-responsive:
    if: github.event.head_commit.message != 'chore media materialize responsive preapply state'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Materialize repository media state
        run: |
          npm run media:sync
          node tools/media-dev-state.mjs --cache-verify
      - name: Verify generated mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const changed = execFileSync('git', ['status', '--porcelain=v1', '-z'], { encoding: 'utf8' })
            .split('\0').filter(Boolean).map((row) => row.slice(3)).sort();
          const expected = [
            'public/media/generated/responsive-manifest.json',
            'src/data/media/responsive-generated.ts',
          ].sort();
          console.log(JSON.stringify({ changed, expected }, null, 2));
          if (JSON.stringify(changed) !== JSON.stringify(expected)) process.exitCode = 1;
          NODE
      - name: Verify generated media contracts
        run: |
          npm run test:media:contract
          npm run test:media:checks
          npm run build:site
      - name: Commit deterministic generated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/generated/responsive-manifest.json src/data/media/responsive-generated.ts
          git diff --cached --quiet && { echo 'expected responsive generated state changes'; exit 1; }
          git commit -m 'chore media materialize responsive preapply state'
          git push origin HEAD:agent/media-normalization-dedupe-wave1-preapply-20260904
