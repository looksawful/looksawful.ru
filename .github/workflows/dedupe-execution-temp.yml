name: Dedupe Execution TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-exec-20260904

permissions:
  contents: read

jobs:
  md10-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: MD-02 guarded dry-run
        run: node tools/media/apply-dedupe-migration.mjs
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Semantic baseline gate
        if: always()
        run: node tools/media/export-semantic-baseline.mjs --migration --check
      - name: Media contract before regeneration
        if: always()
        run: npm run test:media:contract
      - name: Media checks before regeneration
        if: always()
        run: npm run test:media:checks
      - name: Production build
        if: always()
        run: npm run build:site
      - name: Install ffmpeg for isolated media regeneration
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Regenerate media in runner only
        if: always()
        run: npm run media:sync
      - name: Show deterministic regeneration diff
        if: always()
        shell: bash
        run: |
          echo '=== generated diff ==='
          git status --short
          git diff --stat
          git diff --name-only
      - name: Media contract after regeneration
        if: always()
        run: npm run test:media:contract
      - name: Media checks after regeneration
        if: always()
        run: npm run test:media:checks
