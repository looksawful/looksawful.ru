name: Restore Premature Physical Deletes TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-wave1-preapply-20260904

permissions:
  contents: write

jobs:
  restore:
    if: "${{ github.event.head_commit.message != 'fix(media): restore premature physical deletions' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Revert premature physical deletion commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit 753045b9c80a2404df5793fd4afb4feaffc738b8
          git commit --amend -m 'fix(media): restore premature physical deletions'
          git push origin HEAD:agent/media-normalization-dedupe-wave1-preapply-20260904
