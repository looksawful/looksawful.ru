name: Diagnose Semantic Baseline Drift TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-wave1-preapply-20260904

permissions:
  contents: read

jobs:
  semantic-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch frozen base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 83ea6cb845528e1976b13687956bdd249ba8def8
          git worktree add /tmp/semantic-base FETCH_HEAD
      - name: Export exact base/current semantic records and diff
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/semantic-diff.mjs <<'NODE'
          import { pathToFileURL } from 'node:url';

          const tracked = (await import(pathToFileURL(`${process.cwd()}/test/fixtures/media-semantic-baseline.json`), { with: { type: 'json' } })).default.trackedCatalogAssetIds;

          function entryRecord(entry, asset, assetId = entry.assetId) {
            return {
              id: entry.id,
              assetId,
              projectIds: entry.projectIds ?? [],
              creditId: entry.creditId ?? null,
              alt: entry.alt ?? null,
              posterAssetId: entry.posterAssetId ?? null,
              caption: entry.caption ?? null,
              purpose: entry.purpose ?? null,
              mediaType: asset?.type ?? null,
              src: asset?.src ?? null,
            };
          }

          function catalogRecord(item, assetId = item.asset.id) {
            return {
              assetId,
              title: item.title,
              alt: item.alt,
              description: item.description,
              date: item.date,
              projectIds: item.projectIds,
              workAreaIds: item.workAreaIds,
              projectTypeIds: item.projectTypeIds,
              deliverableIds: item.deliverableIds,
              tags: item.tags,
              credits: item.credits,
              reusable: item.reusable,
              archived: item.archived,
            };
          }

          async function loadBase(root) {
            const index = await import(pathToFileURL(`${root}/src/data/media/index.ts`));
            const catalog = await import(pathToFileURL(`${root}/src/data/media/catalog.ts`));
            const assets = index.mediaAssets;
            const byId = new Map(assets.map((asset) => [asset.id, asset]));
            const entries = [...index.mediaEntries]
              .sort((a, b) => a.id.localeCompare(b.id))
              .map((entry) => entryRecord(entry, byId.get(entry.assetId)));
            const catalogById = new Map(catalog.mediaCatalogItems.map((item) => [item.asset.id, item]));
            const trackedCatalog = [...tracked]
              .sort((a, b) => a.localeCompare(b))
              .flatMap((id) => catalogById.has(id) ? [catalogRecord(catalogById.get(id), id)] : []);
            return { entries, trackedCatalog };
          }

          async function loadCurrent(root) {
            const index = await import(pathToFileURL(`${root}/src/data/media/index.ts`));
            const catalog = await import(pathToFileURL(`${root}/src/data/media/catalog.ts`));
            const registered = await import(pathToFileURL(`${root}/src/data/media/assets/registered.ts`));
            const usage = await import(pathToFileURL(`${root}/src/data/media/usage-records.ts`));
            const runtimeById = new Map(index.mediaAssets.map((asset) => [asset.id, asset]));
            const legacyById = new Map([...registered.registeredMediaAssets, ...index.mediaAssets].map((asset) => [asset.id, asset]));
            const entries = [...index.mediaEntries]
              .sort((a, b) => a.id.localeCompare(b.id))
              .map((entry) => {
                const migration = usage.dedupeUsageEvidenceByEntryId.get(entry.id);
                const baselineAssetId = migration && entry.assetId === migration.toAssetId ? migration.fromAssetId : entry.assetId;
                return entryRecord(entry, legacyById.get(baselineAssetId) ?? runtimeById.get(entry.assetId), baselineAssetId);
              });
            const catalogById = new Map(catalog.mediaCatalogItems.map((item) => [item.asset.id, item]));
            const trackedCatalog = [...tracked]
              .sort((a, b) => a.localeCompare(b))
              .flatMap((id) => catalogById.has(id) ? [catalogRecord(catalogById.get(id), id)] : []);
            return { entries, trackedCatalog };
          }

          function diffRecords(base, current, key) {
            const left = new Map(base.map((row) => [row[key], row]));
            const right = new Map(current.map((row) => [row[key], row]));
            const ids = [...new Set([...left.keys(), ...right.keys()])].sort();
            const diffs = [];
            for (const id of ids) {
              const a = left.get(id);
              const b = right.get(id);
              if (JSON.stringify(a) === JSON.stringify(b)) continue;
              const fields = [...new Set([...Object.keys(a ?? {}), ...Object.keys(b ?? {})])];
              const changed = {};
              for (const field of fields) {
                if (JSON.stringify(a?.[field]) !== JSON.stringify(b?.[field])) changed[field] = { base: a?.[field], current: b?.[field] };
              }
              diffs.push({ id, changed });
            }
            return diffs;
          }

          const base = await loadBase('/tmp/semantic-base');
          const current = await loadCurrent(process.cwd());
          const entryDiffs = diffRecords(base.entries, current.entries, 'id');
          const catalogDiffs = diffRecords(base.trackedCatalog, current.trackedCatalog, 'assetId');
          console.log(JSON.stringify({
            baseEntryCount: base.entries.length,
            currentEntryCount: current.entries.length,
            entryDiffCount: entryDiffs.length,
            entryDiffs,
            baseTrackedCatalogCount: base.trackedCatalog.length,
            currentTrackedCatalogCount: current.trackedCatalog.length,
            catalogDiffCount: catalogDiffs.length,
            catalogDiffs,
          }, null, 2));
          if (entryDiffs.length || catalogDiffs.length) process.exitCode = 1;
          NODE
          node /tmp/semantic-diff.mjs
