name: Dedupe Execution TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-exec-20260904

permissions:
  contents: write

jobs:
  persist-ts6-compat:
    if: ${{ !contains(github.event.head_commit.message, '[persist-ts6]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Guard execution branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/agent/media-normalization-dedupe-exec-20260904"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Add TypeScript 6 compatibility compiler
        run: npm install --save-dev @typescript/typescript6@6.0.2
      - name: Switch AST tooling to compatibility compiler
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            tools/media/apply-dedupe-migration.mjs \
            tools/media/apply-deferred-physical-dedupe.mjs \
            tools/media/materialize-entry-context.mjs
          do
            sed -i 's/from "typescript";/from "@typescript\/typescript6";/' "$file"
          done
      - name: Verify focused tooling
        run: node --test test/media-dedupe-apply-tool.test.mjs test/media-deferred-physical-tool.test.mjs test/media-materialize-entry-context.test.mjs
      - name: Verify MD-02 dry-run
        run: node tools/media/apply-dedupe-migration.mjs
      - name: Guard changed paths
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            package-lock.json
            package.json
            tools/media/apply-dedupe-migration.mjs
            tools/media/apply-deferred-physical-dedupe.mjs
            tools/media/materialize-entry-context.mjs
          )
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}" | sort)"
      - name: Commit verified compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json \
            tools/media/apply-dedupe-migration.mjs \
            tools/media/apply-deferred-physical-dedupe.mjs \
            tools/media/materialize-entry-context.mjs
          git commit -m "fix(tooling): use TS6 compiler API compatibility [persist-ts6]"
          git push origin HEAD:agent/media-normalization-dedupe-exec-20260904
