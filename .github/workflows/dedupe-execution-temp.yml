name: Dedupe Execution TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-exec-20260904

permissions:
  contents: read

jobs:
  preapply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Materialize TypeScript 6 compatibility dependency
        run: npm install --save-dev @typescript/typescript6@6.0.2
      - name: Patch migration-tool imports in runner only
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            tools/media/apply-dedupe-migration.mjs \
            tools/media/apply-deferred-physical-dedupe.mjs \
            tools/media/materialize-entry-context.mjs
          do
            sed -i 's/from "typescript";/from "@typescript\/typescript6";/' "$file"
          done
      - name: Focused AST tooling tests
        run: node --test test/media-dedupe-apply-tool.test.mjs test/media-deferred-physical-tool.test.mjs test/media-materialize-entry-context.test.mjs
      - name: MD-02 guarded dry-run
        run: node tools/media/apply-dedupe-migration.mjs
      - name: Package compatibility patch artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: dedupe-ts6-compat-patch
          path: |
            package.json
            package-lock.json
            tools/media/apply-dedupe-migration.mjs
            tools/media/apply-deferred-physical-dedupe.mjs
            tools/media/materialize-entry-context.mjs
          if-no-files-found: error
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Media contract
        if: always()
        run: npm run test:media:contract
      - name: Media checks
        if: always()
        run: npm run test:media:checks
      - name: Production build
        if: always()
        run: npm run build:site
