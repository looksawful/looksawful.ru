name: Repair Dedupe Metadata Guard TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-wave1-preapply-20260904

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix media preserve missing alt semantics in dedupe guard'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch empty-alt guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/media/apply-dedupe-migration.mjs')
          text = path.read_text(encoding='utf-8')
          before = '''        if (!source || !stableEqual(source[key], old[key])) {
            blockers.push(`${removeId}.${key} differs without usage carrier on ${entryId}`);
          }'''
          after = '''        const missingLegacyEmptyAlt =
            key === "alt" && old[key] === "" && source === null;

          if (!missingLegacyEmptyAlt && (!source || !stableEqual(source[key], old[key]))) {
            blockers.push(`${removeId}.${key} differs without usage carrier on ${entryId}`);
          }'''
          if before not in text:
              raise SystemExit('expected metadata blocker source block not found')
          path.write_text(text.replace(before, after, 1), encoding='utf-8')
          PY
      - name: Add focused regression test
        shell: bash
        run: |
          set -euo pipefail
          cat > test/media-dedupe-metadata-blockers.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";

          import { metadataBlockers } from "../tools/media/apply-dedupe-migration.mjs";

          const component = {
            canonicalAssetId: "canonical",
            removeAssetIds: ["retired"],
            entryIds: ["entry-1"],
          };

          function catalogs(retiredAlt, canonicalAlt) {
            return new Map([
              ["retired", { alt: retiredAlt }],
              ["canonical", { alt: canonicalAlt }],
            ]);
          }

          test("missing usage alt carries legacy empty catalog alt semantics", () => {
            assert.deepEqual(
              metadataBlockers(
                component,
                catalogs("", "Canonical alt"),
                new Map(),
                new Map([["entry-1", { id: "entry-1" }]]),
              ),
              [],
            );
          });

          test("missing usage alt still blocks loss of meaningful legacy alt", () => {
            assert.deepEqual(
              metadataBlockers(
                component,
                catalogs("Meaningful retired alt", "Canonical alt"),
                new Map(),
                new Map([["entry-1", { id: "entry-1" }]]),
              ),
              ["retired.alt differs without usage carrier on entry-1"],
            );
          });

          test("explicit empty usage carrier remains valid", () => {
            assert.deepEqual(
              metadataBlockers(
                component,
                catalogs("", "Canonical alt"),
                new Map([["entry-1", { alt: "" }]]),
                new Map([["entry-1", { id: "entry-1" }]]),
              ),
              [],
            );
          });
          EOF
      - name: Verify regression and guarded dry-run
        run: |
          node --test test/media-dedupe-metadata-blockers.test.mjs
          node --test test/media-project-assignment.test.mjs test/media-usage-records.test.mjs test/media-catalog-cms.test.mjs
          node tools/media/apply-dedupe-migration.mjs
          git diff --exit-code -- src/content/media-usages src/data/media/entries src/content/media-catalog/registered
      - name: Verify mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const changed = execFileSync('git', ['status', '--porcelain=v1', '-z'], { encoding: 'utf8' })
            .split('\0').filter(Boolean).map((row) => row.slice(3)).sort();
          const expected = [
            'test/media-dedupe-metadata-blockers.test.mjs',
            'tools/media/apply-dedupe-migration.mjs',
          ].sort();
          console.log(JSON.stringify({ changed, expected }, null, 2));
          if (JSON.stringify(changed) !== JSON.stringify(expected)) process.exitCode = 1;
          NODE
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/media/apply-dedupe-migration.mjs test/media-dedupe-metadata-blockers.test.mjs
          git commit -m 'fix media preserve missing alt semantics in dedupe guard'
          git push origin HEAD:agent/media-normalization-dedupe-wave1-preapply-20260904
