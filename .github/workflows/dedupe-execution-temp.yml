name: Verify Baseline And Materialize Responsive State TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-wave1-preapply-20260904

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message != 'chore(media): materialize responsive preapply state'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify ownership-correct semantic baseline
        run: |
          node --test test/media-semantic-baseline.test.mjs test/media-physical-only-dedupe.test.mjs
          node tools/media/export-semantic-baseline.mjs --migration --check
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Materialize generated media state
        run: |
          npm run media:sync
          node tools/media-dev-state.mjs --cache-verify
      - name: Enforce generated-only mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          printf 'changed files:\n%s\n' "${changed[*]}"
          expected=(
            'public/media/generated/responsive-manifest.json'
            'src/data/media/responsive-generated.ts'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${#changed[@]}" -ne "${#expected_sorted[@]}" ]]; then
            echo 'Unexpected generated mutation count'
            git status --short
            exit 1
          fi
          for i in "${!expected_sorted[@]}"; do
            [[ "${changed[$i]}" == "${expected_sorted[$i]}" ]] || {
              echo "Unexpected mutation: ${changed[$i]}"
              git status --short
              exit 1
            }
          done
      - name: Verify media and build
        run: |
          npm run test:media:contract
          npm run test:media:checks
          npm run build:site
      - name: Commit deterministic responsive state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/media/generated/responsive-manifest.json src/data/media/responsive-generated.ts
          git diff --cached --exit-code && exit 0
          git commit -m 'chore(media): materialize responsive preapply state'
          git push origin HEAD:agent/media-normalization-dedupe-wave1-preapply-20260904
