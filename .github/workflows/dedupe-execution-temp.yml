name: Media Dedupe Final Audit TEMP

on:
  push:
    branches:
      - agent/media-normalization-dedupe-wave1-finalize-20260904

permissions:
  contents: read

concurrency:
  group: dedupe-final-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact finalization candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reproduce and verify the formerly stale Behance archive contract
        run: node --test test/shootings-data-isolation.test.mjs
      - name: Verify permanent logical dedupe integrity
        run: npm run media:dedupe:check
      - name: Audit remaining physical exact and decoded-pixel duplicates
        run: npm run media:dedupe:physical
      - name: Verify semantic parity
        run: node tools/media/export-semantic-baseline.mjs --migration --check
      - name: Core repository tests once
        run: npm run test:core
      - name: Typecheck finalization candidate
        run: npm run typecheck
