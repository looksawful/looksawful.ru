name: Tmp media catalog 363

on:
  push:
    branches:
      - agent/home-images-mainthread-363

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/home-images-mainthread-363
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate canonical catalog outputs
        run: npm run media:catalog:sync
      - name: Commit generated catalog outputs
        shell: bash
        run: |
          test -f src/content/media-catalog/registered/hero-portrait.json
          git diff -- src/content/media-catalog/registered/hero-portrait.json src/data/media/catalog-records.generated.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/media-catalog/registered/hero-portrait.json src/data/media/catalog-records.generated.ts
          git commit -m "chore(media): sync hero catalog records"
          git push origin HEAD:agent/home-images-mainthread-363
