name: Awful Preview Visual QA

on:
  pull_request:
    branches: [dev, prod]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: awful-preview-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  visual-qa:
    name: Published Awful visual contract
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.looksawful-ru-preview.pages.dev
      PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PREVIEW_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify published Awful pixels, animation, drag and AI handoff
        run: node tools/e2e/portfolio-pet-remote-contract.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awful-preview-visual-${{ github.event.pull_request.number }}-${{ env.PREVIEW_SHA }}
          path: artifacts/awful-preview-desktop.png
          if-no-files-found: warn
          retention-days: 7
