name: Diagnose affected media classifier

on:
  push:
    branches:
      - fix/editorial-audit-3-9
    paths:
      - .github/workflows/debug-affected-media.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editorial-audit-3-9
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch dev base
        run: git fetch --no-tags --depth=1 origin dev

      - name: Capture classifier
        id: classify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node tools/media/affected-media.mjs --base origin/dev --head HEAD 2>&1 | tee affected-media-diagnostic.txt

      - name: Commit diagnostic and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/debug-affected-media.yml
          git add affected-media-diagnostic.txt
          git commit -m "chore: capture affected-media diagnostic"
          git push origin HEAD:fix/editorial-audit-3-9
