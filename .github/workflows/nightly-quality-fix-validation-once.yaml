name: Nightly Quality Fix Validation Once

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  contracts:
    if: github.head_ref == 'agent/nightly-quality-fix-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run focused nightly regression contracts
        run: >-
          node --test
          test/ci-minimal-pipeline.test.mjs
          test/media-tools/media-dev-state.test.mjs
          test/media-tools/media-fingerprint-sync.test.mjs
          test/external-links.test.mjs

  core-tests:
    if: github.head_ref == 'agent/nightly-quality-fix-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Restore exact generated media
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}
          fail-on-cache-miss: true
      - name: Verify exact generated media
        run: node tools/media-dev-state.mjs --cache-verify
      - name: Run full core suite
        run: npm run test:core

  external-links-live:
    if: github.head_ref == 'agent/nightly-quality-fix-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:vite
      - run: npm run cv:content:apply
      - name: Run live external link validation
        run: npm run check:external-links
