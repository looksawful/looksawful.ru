name: External links

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 4"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build HTML
        run: npm run build:vite

      - name: Apply CV content
        run: npm run cv:content:apply

      - name: Check external links
        run: npm run check:external-links

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-links
          path: artifacts/external-links
          if-no-files-found: warn
