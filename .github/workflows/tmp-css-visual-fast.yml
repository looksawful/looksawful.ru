name: tmp-css-visual-fast

on:
  push:
    branches:
      - test/css-visual-regression-fast-20260908

permissions:
  contents: read

concurrency:
  group: tmp-css-visual-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CURRENT_SHA: a21c3bceec6a8ff8692cf60c83a38c15789d4811
      WAVE5F_SHA: 264696a762722b94e7649f44c6a9d863d8752c8d
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 30

      - name: Fetch exact comparison commits
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=30 origin "$CURRENT_SHA"
          git fetch --no-tags --depth=30 origin "$WAVE5F_SHA"
          git cat-file -e "$CURRENT_SHA^{commit}"
          git cat-file -e "$WAVE5F_SHA^{commit}"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Install browser only
        run: npx playwright install --with-deps chromium

      - name: Create exact worktrees and verify dependency lock
        run: |
          set -euo pipefail
          rm -rf /tmp/css-fast-current /tmp/css-fast-wave5f
          git worktree add --detach /tmp/css-fast-current "$CURRENT_SHA"
          git worktree add --detach /tmp/css-fast-wave5f "$WAVE5F_SHA"
          for tree in /tmp/css-fast-current /tmp/css-fast-wave5f; do
            ln -s "$GITHUB_WORKSPACE/node_modules" "$tree/node_modules"
          done
          lock="$(sha256sum package-lock.json | cut -d' ' -f1)"
          test "$lock" = "$(sha256sum /tmp/css-fast-current/package-lock.json | cut -d' ' -f1)"
          test "$lock" = "$(sha256sum /tmp/css-fast-wave5f/package-lock.json | cut -d' ' -f1)"

      - name: Prove media fingerprints match
        id: media
        run: |
          set -euo pipefail
          current="$(cd /tmp/css-fast-current && node tools/media-dev-state.mjs --fingerprint)"
          wave5f="$(cd /tmp/css-fast-wave5f && node tools/media-dev-state.mjs --fingerprint)"
          test "$current" = "$wave5f"
          echo "fingerprint=$current" >> "$GITHUB_OUTPUT"
          echo "media fingerprint: $current"

      - name: Restore exact generated media cache
        id: media-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}

      - name: Require existing generated media cache
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          echo "Exact generated-media cache is missing. CSS visual audit must not regenerate media."
          exit 1

      - name: Verify and distribute cached media
        if: steps.media-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          node tools/media-dev-state.mjs --cache-verify
          for tree in /tmp/css-fast-current /tmp/css-fast-wave5f; do
            rm -rf "$tree/public/media/generated/responsive" "$tree/public/media/generated/video" "$tree/public/media/generated/video-inventory.json" "$tree/.cache/media"
            mkdir -p "$tree/public/media/generated" "$tree/.cache/media"
            cp -a "$GITHUB_WORKSPACE/public/media/generated/responsive" "$tree/public/media/generated/responsive"
            cp -a "$GITHUB_WORKSPACE/public/media/generated/video" "$tree/public/media/generated/video"
            cp "$GITHUB_WORKSPACE/public/media/generated/video-inventory.json" "$tree/public/media/generated/video-inventory.json"
            cp "$GITHUB_WORKSPACE/.cache/media/generated-cache.json" "$tree/.cache/media/generated-cache.json"
            (cd "$tree" && node tools/media-dev-state.mjs --cache-verify)
          done

      - name: Build exact sites
        run: |
          set -euo pipefail
          (cd /tmp/css-fast-current && npm run build:site)
          (cd /tmp/css-fast-wave5f && npm run build:site)

      - name: Start exact previews
        run: |
          set -euo pipefail
          (cd /tmp/css-fast-current && npx vite preview --host 127.0.0.1 --port 4272 > /tmp/css-fast-current.log 2>&1 &)
          (cd /tmp/css-fast-wave5f && npx vite preview --host 127.0.0.1 --port 4273 > /tmp/css-fast-wave5f.log 2>&1 &)
          for port in 4272 4273; do
            for attempt in $(seq 1 60); do
              if curl --fail --silent "http://127.0.0.1:$port/" >/dev/null; then break; fi
              if [[ "$attempt" -eq 60 ]]; then exit 1; fi
              sleep 1
            done
          done

      - name: Focused live strip visual parity
        env:
          BASELINE_SHA: a21c3bceec6a8ff8692cf60c83a38c15789d4811
          CURRENT_SHA: 264696a762722b94e7649f44c6a9d863d8752c8d
        run: node tools/tmp-css-strip-height-visual.mjs http://127.0.0.1:4272 http://127.0.0.1:4273 /tmp/css-strip-wave5f

      - name: Print summary
        if: always()
        run: cat /tmp/css-strip-wave5f/summary.json || true

      - name: Archive one-time evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: css-strip-wave5f-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            /tmp/css-strip-wave5f
            /tmp/css-fast-current.log
            /tmp/css-fast-wave5f.log
