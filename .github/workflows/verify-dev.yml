name: Verify dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-dev
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install
        run: npm ci
      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Verify
        run: npm run verify
      - name: Capture caption visual QA
        run: node tools/capture-caption-qa.mjs
      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-verification
          path: |
            dist
            artifacts/caption-qa
          if-no-files-found: error
