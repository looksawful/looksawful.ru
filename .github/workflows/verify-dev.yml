name: Verify dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-dev
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Restore generated media
        id: media-cache
        uses: actions/cache@v4
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
          key: generated-media-v3-${{ runner.os }}-${{ hashFiles('public/media/**/*', '!public/media/generated/**', 'src/content/projects.json', 'src/data/media/assets/**/*.ts', 'src/data/media/responsive.ts', 'src/data/media/responsive-policy.ts', 'tools/build-responsive-media.mjs', 'tools/build-video-media.mjs', 'package-lock.json') }}
          restore-keys: |
            generated-media-v3-${{ runner.os }}-
      - name: Ensure media tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Sync generated media
        run: npm run media:sync
      - name: Persist CMS project-cover metadata
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cms_metadata=(
            public/media/generated/responsive-manifest.json
            src/data/media/responsive-generated.ts
          )

          if git diff --quiet -- "${cms_metadata[@]}"; then
            echo "Project-cover metadata is already current."
            exit 0
          fi

          if ! git diff --quiet -- public/media/generated/video-inventory.json; then
            echo "Refusing to persist generated metadata: video metadata changed during a project-cover sync." >&2
            exit 1
          fi

          if [[ -z "$PUSH_BEFORE" || "$PUSH_BEFORE" =~ ^0+$ ]]; then
            echo "Refusing to persist generated metadata: the prior dev commit is unavailable." >&2
            exit 1
          fi

          mapfile -t changed_paths < <(git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA")
          saw_project_cover_change=false
          for changed_path in "${changed_paths[@]}"; do
            case "$changed_path" in
              src/content/projects.json|public/media/projects/index/*)
                saw_project_cover_change=true
                ;;
              *)
                echo "Refusing to persist generated metadata: unexpected source change $changed_path" >&2
                exit 1
                ;;
            esac
          done

          if [[ "$saw_project_cover_change" != "true" ]]; then
            echo "Refusing to persist generated metadata: no CMS project-cover source changed." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${cms_metadata[@]}"
          git commit -m "chore(media): sync CMS project cover metadata"
          git push origin HEAD:dev
      - name: Check tracked media metadata
        run: git diff --exit-code -- public/media/generated/responsive-manifest.json public/media/generated/video-inventory.json src/data/media/responsive-generated.ts
      - name: Core tests
        run: npm run test:core
      - name: Build site
        run: npm run build:site
      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: npm run test:e2e:all
