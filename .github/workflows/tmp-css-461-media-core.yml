name: tmp-css-461-media-core

on:
  push:
    branches:
      - refactor/css-461-media-core-owner

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Detect completed GREEN head
        id: state
        shell: bash
        run: |
          if [[ -f src/styles/media.css ]]; then
            echo "already_green=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_green=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.state.outputs.already_green != 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.state.outputs.already_green != 'true'
        run: npm ci

      - name: Calculate canonical media fingerprint
        if: steps.state.outputs.already_green != 'true'
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore exact generated media cache
        if: steps.state.outputs.already_green != 'true'
        id: media-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}

      - name: Verify restored generated media
        if: steps.state.outputs.already_green != 'true' && steps.media-cache.outputs.cache-hit == 'true'
        run: node tools/media-dev-state.mjs --cache-verify

      - name: Install recovery video tooling on cache miss
        if: steps.state.outputs.already_green != 'true' && steps.media-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Recover generated media on cache miss
        if: steps.state.outputs.already_green != 'true' && steps.media-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run media:sync
          node tools/media-dev-state.mjs --cache-verify
          git diff --exit-code

      - name: Characterize current media core behavior
        if: steps.state.outputs.already_green != 'true'
        shell: bash
        run: |
          node --test \
            test/special-media-renderers.test.mjs \
            test/media-group-renderer-parity.test.mjs \
            test/caption-lightbox-contract.test.mjs \
            test/motion-renderer-contract.test.mjs
          npm run build:vite
          npx playwright install --with-deps chromium
          npm run test:ui:responsive
          npm run test:e2e:smoke
          node tools/tmp-css-461-media-core-browser.mjs capture /tmp/css461a-media-core.json

      - name: Confirm RED media core ownership contract
        if: steps.state.outputs.already_green != 'true'
        shell: bash
        run: |
          set +e
          node --test test/css-refactor-wave5a-media-core.test.mjs > /tmp/css461a-red.log 2>&1
          status=$?
          set -e
          cat /tmp/css461a-red.log
          if [[ "$status" -eq 0 ]]; then
            echo "Expected Wave 5A ownership contract to be RED before extraction."
            exit 1
          fi
          grep -F "✖ media core has one canonical owner in the existing components layer" /tmp/css461a-red.log
          grep -F "✖ components aggregate no longer owns generic media core presentation" /tmp/css461a-red.log
          grep -F "✖ canonical media owner preserves the public sizing and crop API" /tmp/css461a-red.log
          grep -F "✖ Wave 5A owner does not absorb media-group, captions or project integration" /tmp/css461a-red.log

      - name: Apply exact media core extraction
        if: steps.state.outputs.already_green != 'true'
        run: node tools/tmp-css-461-media-core.mjs

      - name: Confirm GREEN static contracts
        if: steps.state.outputs.already_green != 'true'
        shell: bash
        run: |
          node --test \
            test/css-refactor-wave5a-media-core.test.mjs \
            test/special-media-renderers.test.mjs \
            test/media-group-renderer-parity.test.mjs \
            test/caption-lightbox-contract.test.mjs \
            test/motion-renderer-contract.test.mjs \
            test/css-refactor-wave4d-project-shell.test.mjs \
            test/site-navigation-style.test.mjs
          git diff --check

      - name: Confirm GREEN browser and smoke behavior
        if: steps.state.outputs.already_green != 'true'
        shell: bash
        run: |
          npm run build:vite
          npm run test:ui:responsive
          npm run test:e2e:smoke
          node tools/tmp-css-461-media-core-browser.mjs compare /tmp/css461a-media-core.json
          git diff --check

      - name: Commit GREEN extraction
        if: steps.state.outputs.already_green != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/components.css src/styles/index.css src/styles/media.css
          git diff --cached --check
          git commit -m "refactor(css): GREEN extract canonical media core owner (#461)"
          git push

      - name: Completed GREEN head is already committed
        if: steps.state.outputs.already_green == 'true'
        run: echo "Wave 5A GREEN media owner already present; no transform rerun needed."
