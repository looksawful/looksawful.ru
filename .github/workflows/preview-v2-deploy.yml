name: Preview V2 Deploy

on:
  workflow_run:
    workflows: [Preview V2 Build]
    types: [completed]

permissions:
  actions: read
  contents: read

env:
  CLOUDFLARE_PAGES_PROJECT: looksawful-ru-preview

jobs:
  deploy:
    name: Deploy trusted private preview workspace
    if: github.event.workflow_run.conclusion == 'success' && vars.PREVIEW_V2_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview-deploy
    steps:
      - name: Checkout trusted dev runtime only
        uses: actions/checkout@v7
        with:
          ref: dev
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Download candidate artifact from completed build run
        uses: actions/download-artifact@v4
        with:
          name: preview-v2-candidate
          path: candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate candidate metadata as data
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          test -f candidate/preview-metadata.json
          sha="$(jq -er '.sha' candidate/preview-metadata.json)"
          kind="$(jq -er '.kind' candidate/preview-metadata.json)"
          key="$(jq -er '.key' candidate/preview-metadata.json)"
          repository="$(jq -er '.repository' candidate/preview-metadata.json)"

          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid candidate SHA" >&2; exit 1; }
          [[ "$kind" =~ ^(feature|lab|cms|release)$ ]] || { echo "invalid preview kind" >&2; exit 1; }
          [[ "$key" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || { echo "invalid preview key" >&2; exit 1; }
          [[ "$repository" == "$GITHUB_REPOSITORY" ]] || { echo "candidate repository mismatch" >&2; exit 1; }
          [[ "$sha" == "${{ github.event.workflow_run.head_sha }}" ]] || { echo "candidate SHA does not match triggering workflow run" >&2; exit 1; }

          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'kind=%s\n' "$kind" >> "$GITHUB_OUTPUT"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
          printf 'branch=v2-%s\n' "$key" >> "$GITHUB_OUTPUT"

      - name: Validate untrusted candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { validatePreviewArtifact } from "./trusted/tools/preview/validate-candidate-artifact.mjs";
          await validatePreviewArtifact({ distDir: "candidate" });
          NODE

      - name: Assemble trusted Pages runtime
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { assembleTrustedPreviewRuntime } from "./trusted/tools/preview/assemble-trusted-runtime.mjs";
          await assembleTrustedPreviewRuntime({
            distDir: "candidate",
            workspaceDir: "workspace",
            trustedRuntimeDir: "trusted/tools/preview/runtime",
          });
          NODE

      - name: Require Cloudflare preview credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }

      - name: Deploy trusted private preview workspace
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: workspace
          command: pages deploy site --project-name=looksawful-ru-preview --branch=${{ steps.meta.outputs.branch }} --commit-hash=${{ steps.meta.outputs.sha }}

      - name: Record deployment identity
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          PREVIEW_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PREVIEW_URL:-}"
          printf 'Immutable: %s\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'Alias: %s\n' "${PREVIEW_ALIAS_URL:-unavailable}" >> "$GITHUB_STEP_SUMMARY"
