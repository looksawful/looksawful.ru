name: temporary css 601 pageflip executor

on:
  push:
    branches:
      - refactor/css-462-wave6b-page-flip

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: refactor/css-462-wave6b-page-flip
          fetch-depth: 2

      - name: Guard exact RED parent and integration base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "47c8a20af300392ddd93077f6db6ff7c2247ad7a"
          git fetch --no-tags --depth=1 origin dev
          test "$(git rev-parse FETCH_HEAD)" = "c679ab405c803735af9575c1f64ec794d1bf681a"

      - name: Extract PageFlip ownership without rewriting declarations
        shell: python
        run: |
          from pathlib import Path
          import re

          components_path = Path("src/styles/components.css")
          owner_path = Path("src/styles/page-flip.css")
          index_path = Path("src/styles/index.css")

          components = components_path.read_text(encoding="utf-8")
          index = index_path.read_text(encoding="utf-8")

          start = "\n/* --- page-flip --- */\n\n"
          end = "\n/* --- berserk-audio-player --- */\n"
          assert components.count(start) == 1, "expected one PageFlip start marker"
          assert components.count(end) == 1, "expected one Berserk boundary marker"
          assert not owner_path.exists(), "page-flip.css already exists"

          start_at = components.index(start)
          end_at = components.index(end, start_at)
          block = components[start_at + 1:end_at].rstrip() + "\n"
          assert block.startswith("/* --- page-flip --- */\n"), "unexpected PageFlip block start"
          assert ".page-flip {" in block
          assert "@container page-flip (width <= 50rem)" in block
          assert "@media (prefers-reduced-motion: reduce)" in block
          assert "box-shadow: none !important;" in block
          assert "margin-inline: auto !important;" in block
          assert "background: transparent !important;" in block

          components_after = components[:start_at] + components[end_at:]
          assert not re.search(r"(?:^|\n)\.page-flip(?:__[\w-]+)?(?=[\s,{.:#>\[])", components_after)
          components_path.write_text(components_after, encoding="utf-8")
          owner_path.write_text(block, encoding="utf-8")

          anchor = '@import "./before-after.css" layer(components);\n'
          statement = '@import "./page-flip.css" layer(components);\n'
          assert index.count(anchor) == 1, "unexpected before-after import anchor"
          assert statement not in index, "PageFlip import already exists"
          index_path.write_text(index.replace(anchor, anchor + statement, 1), encoding="utf-8")

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify focused PageFlip contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run css:check
          node --test test/page-flip.test.mjs test/page-flip-migration.test.mjs
          npm run typecheck
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' 'src/styles/components.css' 'src/styles/index.css' 'src/styles/page-flip.css' | sort)"

      - name: Commit product slice and remove temporary executor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-css-601-pageflip-executor.yml
          git config user.name "looksawful-css-executor"
          git config user.email "118225585+looksawful@users.noreply.github.com"
          git add src/styles/components.css src/styles/index.css src/styles/page-flip.css .github/workflows/tmp-css-601-pageflip-executor.yml
          git commit -m "refactor(css): extract PageFlip style ownership"
          git push origin HEAD:refactor/css-462-wave6b-page-flip
