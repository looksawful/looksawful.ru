name: Yandex Control

on:
  issues:
    types: [opened]
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/yandex-control.yml"
      - "tools/yandex-control.mjs"
      - "test/yandex-control-workflow.test.mjs"
      - "docs/yandex-control.md"

permissions:
  contents: read

jobs:
  contract:
    name: Verify Yandex control contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Yandex control contract
        run: node --test test/yandex-control-workflow.test.mjs

  control:
    name: Run owner Yandex command
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[yandex-control] ')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    concurrency:
      group: yandex-control-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact default-branch source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Call Yandex API
        id: control
        continue-on-error: true
        env:
          YANDEX_CONTROL_TITLE: ${{ github.event.issue.title }}
          YANDEX_CONTROL_BODY: ${{ github.event.issue.body }}
          YANDEX_CONTROL_RESULT_PATH: ${{ runner.temp }}/yandex-control-result.md
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          YANDEX_METRIKA_COUNTER_ID: ${{ vars.YANDEX_METRIKA_COUNTER_ID }}
          YANDEX_DISK_ROOT: ${{ vars.YANDEX_DISK_ROOT }}
          YANDEX_CLOUD_ID: ${{ vars.YANDEX_CLOUD_ID }}
          YANDEX_CLOUD_FOLDER_ID: ${{ vars.YANDEX_CLOUD_FOLDER_ID }}
        run: node tools/yandex-control.mjs

      - name: Comment sanitized result
        if: always()
        uses: actions/github-script@v8
        env:
          RESULT_PATH: ${{ runner.temp }}/yandex-control-result.md
        with:
          script: |
            const fs = require("node:fs");
            const path = process.env.RESULT_PATH;
            const body = fs.existsSync(path)
              ? fs.readFileSync(path, "utf8").slice(0, 60000)
              : "### Yandex Control: ошибка\n\nБезопасный отчёт не был сформирован.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Close successful command issue
        if: steps.control.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
              state_reason: "completed",
            });

      - name: Preserve failed command as failed workflow
        if: steps.control.outcome == 'failure'
        run: exit 1
