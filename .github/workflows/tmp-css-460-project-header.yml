name: tmp-css-460-project-header

on:
  push:
    branches:
      - refactor/css-460-project-header-owner

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Characterize current project header behavior
        run: |
          node --test test/motion-renderer-contract.test.mjs
          npm run build:vite
          npx playwright install --with-deps chromium
          npm run test:ui:responsive
      - name: Confirm RED canonical header ownership contract
        shell: bash
        run: |
          set +e
          node --test test/css-refactor-wave4c-project-header.test.mjs > /tmp/css460c-red.log 2>&1
          status=$?
          set -e
          cat /tmp/css460c-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected project header ownership contract to be RED before consolidation."
            exit 1
          fi
          grep -F "✖ project header canonical owner contains base, wide, compact and typography contracts" /tmp/css460c-red.log
          grep -F "✖ components aggregate no longer owns project header presentation" /tmp/css460c-red.log
          grep -F "✖ index no longer carries a late project header patch" /tmp/css460c-red.log
          grep -F "✖ project header source order and Design Capture ownership stay explicit" /tmp/css460c-red.log
      - name: Apply exact project header consolidation
        run: node tools/tmp-css-460-project-header.mjs
      - name: Confirm GREEN static and browser behavior
        run: |
          node --test \
            test/css-refactor-wave4c-project-header.test.mjs \
            test/motion-renderer-contract.test.mjs \
            test/css-refactor-wave4b-project-navigation.test.mjs \
            test/site-navigation-style.test.mjs \
            test/repository-structure.test.mjs
          npm run build:vite
          npm run test:ui:responsive
          git diff --check
      - name: Commit GREEN consolidation
        shell: bash
        run: |
          git status --short
          test -n "$(git status --short src/styles/components.css)"
          test -n "$(git status --short src/styles/project-header.css)"
          test -n "$(git status --short src/styles/index.css)"
          test -n "$(git status --short tools/design-capture/config.mjs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/components.css src/styles/project-header.css src/styles/index.css tools/design-capture/config.mjs
          git commit -m "refactor(css): GREEN consolidate project header owner (#460)"
          git push origin HEAD:refactor/css-460-project-header-owner
