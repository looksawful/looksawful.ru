name: tmp-css-461-wave5e-sequence-apply

on:
  push:
    branches:
      - refactor/css-461-wave5e-sequence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Move only sequence ownership into media.css
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          components_path = Path('src/styles/components.css')
          media_path = Path('src/styles/media.css')
          components = components_path.read_text()
          media = media_path.read_text()

          start_marker = '/* Sequence = wide + middle collection + wide. */'
          end_marker = '''/* ==================================================
             Equal-height media strip
             ================================================== */'''

          if components.count(start_marker) != 1:
              raise SystemExit(f'sequence marker count={components.count(start_marker)}')
          if components.count(end_marker) != 1:
              raise SystemExit(f'strip boundary marker count={components.count(end_marker)}')
          if start_marker in media:
              raise SystemExit('sequence family unexpectedly already exists in media.css')

          start = components.index(start_marker)
          end = components.index(end_marker, start)
          block = components[start:end].rstrip() + '\n'

          required = [
              '.media-group[data-layout="sequence"]',
              '.media-group__middle',
              'data-middle-overflow="reel"',
              '@container media-group (width > 48rem)',
          ]
          for token in required:
              if token not in block:
                  raise SystemExit(f'missing sequence token: {token}')
          for forbidden in [
              '.media-group[data-layout="strip"]',
              '.media-group[data-layout="editorial"]',
              '.media-group[data-layout="masonry"]',
              '.media-group[data-layout="bento"]',
              '[data-infinite-reel]',
              '.slider',
          ]:
              if forbidden in block:
                  raise SystemExit(f'sequence slice crossed boundary into {forbidden}')

          components_path.write_text(components[:start] + components[end:])
          media_path.write_text(media.rstrip() + '\n\n' + block)
          PY
      - name: Advance only stale ownership guards and Fast CI registration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          wave5b = Path('test/css-refactor-wave5b-media-group-foundation.test.mjs')
          text = wave5b.read_text()
          removals = [
              '  assert.doesNotMatch(media, /(?:^|\\n)\\.media-group\\[data-layout="sequence"\\]\\s*\\{/);\n',
              '  assert.match(components, /(?:^|\\n)\\.media-group\\[data-layout="sequence"\\]\\s*\\{/);\n',
          ]
          for line in removals:
              if text.count(line) != 1:
                  raise SystemExit(f'Wave5B stale sequence guard count={text.count(line)} for {line!r}')
              text = text.replace(line, '')
          wave5b.write_text(text)

          wave5c = Path('test/css-refactor-wave5c-grid-compact.test.mjs')
          text = wave5c.read_text()
          line = '    /(?:^|\\n)\\.media-group\\[data-layout="sequence"\\]\\s*\\{/,\n'
          if text.count(line) != 1:
              raise SystemExit(f'Wave5C stale sequence guard count={text.count(line)}')
          wave5c.write_text(text.replace(line, ''))

          ci = Path('tools/ci/run-tests.mjs')
          text = ci.read_text()
          anchor = '  "test/css-refactor-wave5d-strip-justify-contract.test.mjs",\n'
          target = '  "test/css-refactor-wave5e-sequence.test.mjs",\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'Wave5D Fast CI anchor count={text.count(anchor)}')
          if target in text:
              raise SystemExit('Wave5E sequence unexpectedly already registered')
          ci.write_text(text.replace(anchor, anchor + target))
          PY
      - name: Verify focused contracts and fast suite
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/css-refactor-wave5b-media-group-foundation.test.mjs \
            test/css-refactor-wave5c-grid-compact.test.mjs \
            test/css-refactor-wave5d-strip-justify-contract.test.mjs \
            test/css-refactor-wave5e-sequence.test.mjs \
            test/test-groups.test.mjs
          node tools/ci/run-tests.mjs fast
          git diff --check
      - name: Commit durable sequence slice only
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/tmp-css-461-wave5e-sequence-red.yml \
            .github/workflows/tmp-css-461-wave5e-sequence-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/styles/components.css \
            src/styles/media.css \
            tools/ci/run-tests.mjs \
            test/css-refactor-wave5b-media-group-foundation.test.mjs \
            test/css-refactor-wave5c-grid-compact.test.mjs \
            test/css-refactor-wave5e-sequence.test.mjs \
            .github/workflows/tmp-css-461-wave5e-sequence-red.yml \
            .github/workflows/tmp-css-461-wave5e-sequence-apply.yml
          git commit -m 'refactor(css): extract Wave5E sequence layout ownership'
          git push origin HEAD:refactor/css-461-wave5e-sequence
