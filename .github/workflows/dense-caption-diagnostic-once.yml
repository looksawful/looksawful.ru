name: Dense Caption Diagnostic Once

on:
  push:
    branches: [contact-hub-frontend-current]
    paths:
      - .github/workflows/dense-caption-diagnostic-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e5cf4e630b290e549e4eca4d081b02fde2b8416a
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Inspect dense lightbox candidates
        env:
          PREVIEW_URL: https://d2c9f335.looksawful-ru-preview.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            for (const viewport of [{ width: 390, height: 844 }, { width: 770, height: 900 }]) {
              const context = await browser.newContext({
                viewport,
                isMobile: viewport.width === 390,
                hasTouch: true,
              });
              const page = await context.newPage();
              await page.goto(`${process.env.PREVIEW_URL}/work/jestei-pool/`, { waitUntil: 'domcontentloaded' });
              await page.waitForLoadState('networkidle').catch(() => {});
              const broad = page.locator([
                '.media-group[data-layout="sequence"] figure.media[data-caption-view="overlay"]:has([data-lightbox-source])',
                '.media-group[data-layout="bento"] figure.media[data-caption-view="overlay"]:has([data-lightbox-source])',
                '.media-group[data-compact-layout="reel"] figure.media[data-caption-view="overlay"]:has([data-lightbox-source])',
              ].join(', ')).first();
              const visible = page.locator([
                '.media-group[data-layout="sequence"] figure.media[data-caption-view="overlay"]:visible:has([data-lightbox-source]:visible)',
                '.media-group[data-layout="bento"] figure.media[data-caption-view="overlay"]:visible:has([data-lightbox-source]:visible)',
                '.media-group[data-compact-layout="reel"] figure.media[data-caption-view="overlay"]:visible:has([data-lightbox-source]:visible)',
              ].join(', ')).first();
              const inspect = async (locator) => locator.count() ? locator.evaluate((figure) => {
                const source = figure.querySelector('[data-lightbox-source]');
                const rect = source?.getBoundingClientRect();
                const style = source ? getComputedStyle(source) : null;
                return {
                  figureDisplay: getComputedStyle(figure).display,
                  figureRect: figure.getBoundingClientRect().toJSON(),
                  sourceTag: source?.tagName ?? null,
                  sourceDisplay: style?.display ?? null,
                  sourceVisibility: style?.visibility ?? null,
                  sourcePointerEvents: style?.pointerEvents ?? null,
                  sourceRect: rect?.toJSON() ?? null,
                  sourceHref: source?.getAttribute('href') ?? null,
                };
              }) : null;
              console.log(`VIEWPORT ${viewport.width}`, JSON.stringify({ broad: await inspect(broad), visible: await inspect(visible) }, null, 2));

              if (await broad.count()) {
                const source = broad.locator('[data-lightbox-source]').first();
                await source.scrollIntoViewIfNeeded().catch(() => {});
                console.log(`BROAD_SOURCE_VISIBLE_${viewport.width}=`, await source.isVisible());
                if (viewport.width === 390) await source.tap({ force: true }).catch((error) => console.log('BROAD_TAP_ERROR', error.message));
                else await source.click({ force: true }).catch((error) => console.log('BROAD_CLICK_ERROR', error.message));
                await page.waitForTimeout(250);
                console.log(`BROAD_OPEN_${viewport.width}=`, await page.evaluate(() => Boolean(window.pswp?.opener?.isOpen || document.querySelector('[data-media-lightbox][open]'))));
              }

              await context.close();
            }
          } finally {
            await browser.close();
          }
          NODE
