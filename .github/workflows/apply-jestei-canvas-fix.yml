name: Apply WebGL canvas retry fix

on:
  push:
    branches:
      - prod
    paths:
      - ".github/jestei-canvas-fix/**"
      - ".github/workflows/apply-jestei-canvas-fix.yml"

permissions:
  contents: write

concurrency:
  group: apply-jestei-canvas-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and verify patch
        shell: bash
        run: |
          set -euo pipefail

          git apply --check .github/jestei-canvas-fix/fresh-canvas.patch
          git apply .github/jestei-canvas-fix/fresh-canvas.patch

          target="src/components/jestei-theme-organism/jestei-theme-organism.js"
          test "$(sha256sum "$target" | cut -d' ' -f1)" = "06de72ba46bbc2e3f25f53d8e8b7083c050916ac239ccd83183ad9cc001221f2"
          test "$(git hash-object "$target")" = "36d675f35413cdcfe8780bd73a6beb0be0eeec98"

          node --check "$target"
          npm ci
          npm run build

      - name: Commit verified production source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- src/components/jestei-theme-organism/jestei-theme-organism.js
          git commit -m "fix: renew WebGL canvas before retry"
          git pull --rebase origin prod
          git push origin HEAD:prod
