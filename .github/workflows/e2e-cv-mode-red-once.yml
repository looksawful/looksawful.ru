name: E2E CV Mode Contract Once

on:
  push:
    branches:
      - fix/full-e2e-production-cv-mode-20260905

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run focused tooling contract
        run: node --test test/tooling-pipeline.test.mjs
