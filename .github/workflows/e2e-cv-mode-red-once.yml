name: E2E CV Mode Contract Once

on:
  push:
    branches:
      - fix/full-e2e-production-cv-mode-20260905

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Rebuild generated media
        run: npm run media:sync
      - name: Verify generated media is deterministic
        run: git diff --exit-code
      - name: Build production site
        run: npm run build:site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full browser regression
        run: npm run test:e2e:full
