name: TDD CV Contract

on:
  push:
    branches:
      - fix/720-cv-production-smoke

permissions:
  contents: read

env:
  TARGET_SHA: 8d384eeaeac58f1213fc7bccf81d42786952b625
  BASE_URL: https://www.looksawful.ru

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run focused CV production contract test
        run: node --test test/e2e-production-pipeline.test.mjs
      - name: Require exact deployed production SHA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "$BASE_URL/deploy-version.txt?audit=$GITHUB_RUN_ID" > /tmp/deploy-version.txt
          grep -Fxq "commit=$TARGET_SHA" /tmp/deploy-version.txt
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run fixed production CV smoke with only issue 719 isolated
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { runSmokeCv } from './tools/e2e/smoke-cv.mjs';

          const rawBrowser = await chromium.launch({ headless: true });
          const browser = new Proxy(rawBrowser, {
            get(target, prop) {
              if (prop === 'newContext') return async (...args) => {
                const context = await target.newContext(...args);
                await context.route('**/cdn-cgi/trace', (route) => route.fulfill({
                  status: 200,
                  contentType: 'text/plain; charset=utf-8',
                  body: 'loc=DE\n',
                }));
                return context;
              };
              const value = Reflect.get(target, prop, target);
              return typeof value === 'function' ? value.bind(target) : value;
            },
          });

          try {
            await runSmokeCv({ browser, baseUrl: process.env.BASE_URL, mode: 'production' });
          } finally {
            await rawBrowser.close();
          }
          NODE
