name: tmp-css-461-wave5f-strip-height-apply

on:
  push:
    branches:
      - fix/css-461-strip-height-input

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply minimal strip-height input cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/styles/components.css')
          text = path.read_text()

          old_portfolio = '''.portfolio-showcase__group {
            --group-max: 100%;
            --strip-height: var(--portfolio-strip-height);
          }

          .media-group.portfolio-showcase__group[data-layout="strip"] {
            --strip-height: var(--portfolio-strip-height);
          }
          '''
          new_portfolio = '''.portfolio-showcase__group {
            --group-max: 100%;
          }

          .portfolio-showcase__group[data-layout="strip"] {
            --strip-height: var(--portfolio-strip-height);
          }
          '''
          if text.count(old_portfolio) != 1:
              raise SystemExit(f'portfolio strip-height block count={text.count(old_portfolio)}')
          text = text.replace(old_portfolio, new_portfolio)

          old_default = '''.media-group[data-layout="strip"] {
            --strip-height: clamp(12rem, 34cqi, 20rem);

          '''
          new_default = '''.media-group[data-layout="strip"] {
          '''
          if text.count(old_default) != 1:
              raise SystemExit(f'generic strip-height default count={text.count(old_default)}')
          text = text.replace(old_default, new_default)

          old_reader = '    block-size: var(--strip-height);'
          new_reader = '    block-size: var(--strip-height, clamp(12rem, 34cqi, 20rem));'
          if text.count(old_reader) != 1:
              raise SystemExit(f'strip-height reader count={text.count(old_reader)}')
          text = text.replace(old_reader, new_reader)
          path.write_text(text)

          # Wave5B's integration guard used to pin the old high-specificity
          # selector shape. Preserve its real invariant instead: portfolio
          # strip integration stays in components.css, regardless of the
          # specificity hack that Wave5F intentionally removes.
          wave5b_path = Path('test/css-refactor-wave5b-media-group-foundation.test.mjs')
          wave5b = wave5b_path.read_text()
          old_guard = '  assert.match(components, /\\.media-group\\.portfolio-showcase__group\\[data-layout="strip"\\]/);'
          new_guard = '  assert.match(components, /\\.portfolio-showcase__group\\[data-layout="strip"\\]/);'
          if wave5b.count(old_guard) != 1:
              raise SystemExit(f'Wave5B stale portfolio selector guard count={wave5b.count(old_guard)}')
          wave5b = wave5b.replace(old_guard, new_guard)
          wave5b_path.write_text(wave5b)

          fast_path = Path('tools/ci/run-tests.mjs')
          fast = fast_path.read_text()
          anchor = '  "test/css-refactor-wave5e-sequence.test.mjs",\n'
          target = '  "test/css-refactor-wave5f-strip-height-contract.test.mjs",\n'
          if fast.count(anchor) != 1:
              raise SystemExit(f'Wave5E Fast CI anchor count={fast.count(anchor)}')
          if target in fast:
              raise SystemExit('Wave5F unexpectedly already registered')
          fast = fast.replace(anchor, anchor + target)
          fast_path.write_text(fast)
          PY
      - name: Verify Wave5F and neighboring contracts
        run: |
          set -euo pipefail
          node --test \
            test/css-refactor-wave5b-media-group-foundation.test.mjs \
            test/css-refactor-wave5d-strip-justify-contract.test.mjs \
            test/css-refactor-wave5e-sequence.test.mjs \
            test/css-refactor-wave5f-strip-height-contract.test.mjs
          node tools/ci/run-tests.mjs fast
          git diff --check
      - name: Remove temporary workflows and commit durable remediation
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/tmp-css-461-wave5f-strip-height-red.yml \
            .github/workflows/tmp-css-461-wave5f-strip-height-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/components.css tools/ci/run-tests.mjs \
            test/css-refactor-wave5b-media-group-foundation.test.mjs \
            test/css-refactor-wave5f-strip-height-contract.test.mjs \
            .github/workflows/tmp-css-461-wave5f-strip-height-red.yml \
            .github/workflows/tmp-css-461-wave5f-strip-height-apply.yml
          git commit -m 'fix(css): resolve strip height at its consumer'
          git push origin HEAD:fix/css-461-strip-height-input
