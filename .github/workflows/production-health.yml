name: Production Health

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact prod head
        uses: actions/checkout@v7
        with:
          ref: prod
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Pin expected production SHA
        shell: bash
        run: echo "EXPECTED_PROD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check production contract
        run: node tools/check-production.mjs

      - name: Check representative routes
        shell: bash
        run: |
          set -euo pipefail
          for path in /cv/ /work/jestei-pool/; do
            curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "https://www.looksawful.ru${path}" > /dev/null
          done

      - name: Check homepage built assets
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --location --max-time 20 \
            -H 'Cache-Control: no-cache' \
            https://www.looksawful.ru/)"
          assets="$(grep -Eo '/assets/[^\" ]+\.(css|js)' <<< "$html" | sort -u)"
          test -n "$assets"
          while IFS= read -r asset; do
            test -z "$asset" && continue
            curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "https://www.looksawful.ru${asset}" > /dev/null
          done <<< "$assets"
