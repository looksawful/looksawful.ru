name: tmp-css-wave5b-execute

on:
  push:
    branches:
      - refactor/css-461-wave5b-media-owner

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prove structural RED before transform
        shell: bash
        run: |
          set -euo pipefail
          if node --test test/css-refactor-wave5b-media-groups.test.mjs; then
            echo 'Wave5B ownership contract unexpectedly GREEN before transform' >&2
            exit 1
          fi
      - name: Guarded dry-run and write
        shell: bash
        run: |
          set -euo pipefail
          node tools/tmp-css-461-media-groups.mjs
          node tools/tmp-css-461-media-groups.mjs --write
      - name: Focused GREEN contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test test/css-refactor-wave5a-media-core.test.mjs
          node --test test/css-refactor-wave5b-media-groups.test.mjs
          node --test test/media-group-renderer-parity.test.mjs
          node --test test/caption-lightbox-contract.test.mjs
          node --test test/jestei-event-migration.test.mjs
      - name: Recreate generated-media prerequisite used by Fast CI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          npm run media:sync
      - name: Repository gates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:fast
          node --test test/repository-structure.test.mjs
          npm run build:site
      - name: Remove execution-only tooling and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          rm tools/tmp-css-461-media-groups.mjs .github/workflows/tmp-css-wave5b-execute.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/styles/components.css \
            src/styles/media.css \
            test/css-refactor-wave5a-media-core.test.mjs \
            test/css-refactor-wave5b-media-groups.test.mjs \
            test/caption-lightbox-contract.test.mjs \
            tools/tmp-css-461-media-groups.mjs \
            .github/workflows/tmp-css-wave5b-execute.yml
          git diff --cached --check
          git commit -m 'refactor(css): move Wave5B media ownership'
          git push
