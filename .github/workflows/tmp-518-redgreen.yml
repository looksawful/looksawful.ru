name: tmp-518-redgreen

on:
  push:
    branches:
      - fix/518-canvas-wrapper-a11y

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test test/animated-canvas-gallery-migration.test.mjs
