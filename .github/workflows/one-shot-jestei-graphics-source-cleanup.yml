name: One-shot Jestei graphics source cleanup

on:
  push:
    branches:
      - prod

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Jestei graphics source markup
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          graphics_section = '''      <section aria-label="графический дизайн" class="section section-component jestei-graphics" id="jestei-graphics" data-section-component="" data-section-family="jestei" data-section-chapter="" data-chapter-title="графический дизайн">
            <div class="jestei-graphics__screen" data-section-screen="">
              <header data-chapter-head="" class="jestei-graphics__head">
                <h2 class="title jestei-graphics__title" data-section-title="" data-content-title=""><span data-section-title-main="">графический</span><span data-section-title-accent="">дизайн</span></h2>
              </header>
              <div data-section-body="" class="jestei-graphics__body">
                <section data-section-block="">
                  <header data-content-head="">
                    <p class="jestei-graphics__lead" data-section-lead="">Оживили графический дизайн и креативы бренда: добавили иллюстрации, коллажи, градиенты и геометрические паттерны.</p>
                    <ul aria-label="факты графической системы" class="fact-grid fact-grid--chapter">
                      <li><strong>10+ / 11+</strong><span>10+ регулярных рубрик и 11+ баннерных цепочек сделали коммуникацию повторяемой: обновления, подборки, конкурсы, коллаборации и сезонные материалы получили узнаваемые форматы.</span></li>
                      <li><strong>10 → 2</strong><span>типовой баннерный сценарий сократился с 10 форматов до 2, а 6 типов материалов перешли в шаблонный Figma-процесс: баннеры, посты, обложки, рассылки, промо и виджеты.</span></li>
                      <li><strong>4 / 7</strong><span>AI использовался в 4 направлениях — фото, иллюстрации, видео и 3d — и закрывал 7 типов задач: обложки, баннеры, персонажи, inpaint, upscale, видеофоны и промо-графику.</span></li>
                    </ul>
                  </header>
                  <aside aria-label="графический дизайн и микс-медиа" data-media-layout="grid" data-media-ratio="square" data-media-mobile="rail" data-media-size="compact" data-media-cluster="">
                    <a data-lightbox-item="" data-section-media-item="" href="/assets/media/cases/jesteipool/06-graphic/01/51.webp" rel="noopener noreferrer" target="_blank"><img alt="" decoding="async" loading="lazy" src="/assets/media/cases/jesteipool/06-graphic/01/51.webp" /></a>
                    <a data-lightbox-item="" data-section-media-item="" href="/assets/media/cases/jesteipool/06-graphic/02/43.webp" rel="noopener noreferrer" target="_blank"><img alt="" decoding="async" loading="lazy" src="/assets/media/cases/jesteipool/06-graphic/02/43.webp" /></a>
                    <a data-lightbox-item="" data-section-media-item="" href="/assets/media/cases/jesteipool/03-form/02/02.webp" rel="noopener noreferrer" target="_blank"><img alt="" decoding="async" loading="lazy" src="/assets/media/cases/jesteipool/03-form/02/02.webp" /></a>
                    <a data-lightbox-item="" data-section-media-item="" href="/assets/media/cases/jesteipool/03-form/05/02.webp" rel="noopener noreferrer" target="_blank"><img alt="" decoding="async" loading="lazy" src="/assets/media/cases/jesteipool/03-form/05/02.webp" /></a>
                    <a data-lightbox-item="" data-section-media-item="" href="/assets/media/cases/jesteipool/03-form/07/15.webp" rel="noopener noreferrer" target="_blank"><img alt="" decoding="async" loading="lazy" src="/assets/media/cases/jesteipool/03-form/07/15.webp" /></a>
                    <a data-lightbox-item="" data-section-media-item="" href="/assets/media/cases/jesteipool/03-form/07/16.webp" rel="noopener noreferrer" target="_blank"><img alt="" decoding="async" loading="lazy" src="/assets/media/cases/jesteipool/03-form/07/16.webp" /></a>
                    <a data-lightbox-item="" data-section-media-item="" href="/assets/media/cases/jesteipool/03-form/07/08.webp" rel="noopener noreferrer" target="_blank"><img alt="" decoding="async" loading="lazy" src="/assets/media/cases/jesteipool/03-form/07/08.webp" /></a>
                    <a data-lightbox-item="" data-section-media-item="" href="/assets/media/cases/jesteipool/06-graphic/01/39.webp" rel="noopener noreferrer" target="_blank"><img alt="" decoding="async" loading="lazy" src="/assets/media/cases/jesteipool/06-graphic/01/39.webp" /></a>
                    <a data-lightbox-item="" data-section-media-item="" href="/assets/media/cases/jesteipool/06-graphic/01/45.webp" rel="noopener noreferrer" target="_blank"><img alt="" decoding="async" loading="lazy" src="/assets/media/cases/jesteipool/06-graphic/01/45.webp" /></a>
                    <a data-lightbox-item="" data-section-media-item="" href="/assets/media/cases/jesteipool/06-graphic/02/49.webp" rel="noopener noreferrer" target="_blank"><img alt="" decoding="async" loading="lazy" src="/assets/media/cases/jesteipool/06-graphic/02/49.webp" /></a>
                    <a data-lightbox-item="" data-section-media-item="" href="/assets/media/cases/jesteipool/06-graphic/02/51.webp" rel="noopener noreferrer" target="_blank"><img alt="" decoding="async" loading="lazy" src="/assets/media/cases/jesteipool/06-graphic/02/51.webp" /></a>
                  </aside>
                </section>
              </div>
            </div>
          </section>'''

          index_path = Path("index.html")
          index_html = index_path.read_text(encoding="utf-8")
          section_pattern = re.compile(
              r'\n\s*<section\b(?=[^>]*\bid="jestei-graphics")[^>]*>.*?(?=\n\s*<section\b(?=[^>]*\bid="styx-cover"))',
              re.DOTALL,
          )
          index_html, replacements = section_pattern.subn("\n" + graphics_section + "\n", index_html, count=1)
          if replacements != 1:
              raise SystemExit(f"Expected one Jestei graphics section, replaced {replacements}")
          forbidden = [
              "Перевёл графику из набора отдельных креативов",
              "1500+ Креативов",
              "Графика стала production-системой",
              "Быстрый скетчинг:",
              "/assets/media/cases/jesteipool/06-graphic/01/34.webp",
          ]
          graphics_slice = index_html[index_html.index('id="jestei-graphics"'):index_html.index('id="styx-cover"')]
          remaining = [fragment for fragment in forbidden if fragment in graphics_slice]
          if remaining:
              raise SystemExit(f"Obsolete graphics content remains: {remaining}")
          index_path.write_text(index_html, encoding="utf-8")

          runtime_path = Path("src/runtime/remove-obsolete-copy.js")
          runtime_path.write_text('''const SELECTORS = [
            "#jestei-tariffs .jestei-tariffs__screen > p:last-child",
            "#resume-title",
          ];

          const COLOR_LEAD_SELECTOR = "#jestei-color .jestei-color-bento__lead";
          const COLOR_LEAD_VISIBLE =
            "Сегментировали конфликтующие аудитории при помощи 4 цветовых профилей. Теперь цвет направляет пользователя к нужным продуктам.";
          const COLOR_LEAD_COMMENTED =
            "Создали отдельные визуальные зоны для ивент диджеев, клубных диджеев и саунд-продюсеров. Цветовые профили связали продукты и подписки, разделили конфликтующие аудитории и снизили количество конфликтов между ними. Раньше сервис держался на серо-оранжевой палитре. Теперь в системе 4 продуктовые темы: оранжевая для клуба, грушевая для ивента, синяя для эксклюзивов и лавандовая для экспериментальных инструментов.";

          const COLOR_PROFILE_HEX = [
            ["#jestei-color .jestei-color-bento__theme--orange .jestei-color-bento__theme-head > span", "#f18200"],
            ["#jestei-color .jestei-color-bento__theme--blue .jestei-color-bento__theme-head > span", "#157aff"],
            ["#jestei-color .jestei-color-bento__theme--pear .jestei-color-bento__theme-head > span", "#d1e231"],
            ["#jestei-color .jestei-color-bento__theme--biloba .jestei-color-bento__theme-head > span", "#b2a1ea"],
          ];

          function updateJesteiColorCopy(root) {
            const lead = root.querySelector(COLOR_LEAD_SELECTOR);

            if (lead) {
              lead.replaceChildren(
                root.createTextNode(COLOR_LEAD_VISIBLE),
                root.createComment(` ${COLOR_LEAD_COMMENTED} `),
              );
            }

            COLOR_PROFILE_HEX.forEach(([selector, hex]) => {
              const label = root.querySelector(selector);
              if (label) label.textContent = hex;
            });
          }

          export function removeObsoleteCopy(root = document) {
            SELECTORS.forEach((selector) => {
              root.querySelector(selector)?.remove();
            });

            updateJesteiColorCopy(root);
          }
          ''', encoding="utf-8")

          css_path = Path("src/styles/sections/jestei-graphics-final.css")
          css_path.write_text('''/* Final source-driven contract for the Jestei graphic-design chapter. */
          main[data-showcase] #jestei-graphics [data-section-screen] {
            row-gap: 0;
          }

          main[data-showcase] #jestei-graphics .jestei-graphics__head {
            display: grid;
            gap: clamp(1rem, 2vw, 1.5rem);
            align-content: start;
            inline-size: 100%;
            max-inline-size: 100%;
            padding-block: clamp(2.75rem, 6vw, 5.5rem) clamp(1.5rem, 3vw, 2.75rem);
            overflow: visible;
          }

          main[data-showcase] #jestei-graphics .jestei-graphics__title {
            display: flex;
            flex-wrap: nowrap;
            align-items: baseline;
            column-gap: 0.16em;
            inline-size: max-content;
            max-inline-size: 100%;
            margin: 0;
            overflow: visible;
            color: var(--black);
            font-size: clamp(2.8rem, 6.6vw, 6.8rem);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.045em;
            text-wrap: nowrap;
            white-space: nowrap;
            word-break: normal;
            hyphens: none;
          }

          main[data-showcase] #jestei-graphics .jestei-graphics__title > * {
            display: inline !important;
            flex: 0 0 auto;
            white-space: nowrap;
          }

          main[data-showcase] #jestei-graphics .jestei-graphics__title [data-section-title-main] {
            color: var(--black);
          }

          main[data-showcase] #jestei-graphics .jestei-graphics__title [data-section-title-accent] {
            color: color-mix(in srgb, var(--black) 52%, transparent);
            letter-spacing: 0;
          }

          main[data-showcase] #jestei-graphics .jestei-graphics__title::before,
          main[data-showcase] #jestei-graphics .jestei-graphics__title::after,
          main[data-showcase] #jestei-graphics [data-content-head]::before {
            content: none !important;
            display: none !important;
          }

          main[data-showcase] #jestei-graphics .jestei-graphics__body,
          main[data-showcase] #jestei-graphics .jestei-graphics__body > [data-section-block] {
            display: grid;
            align-content: start;
            min-block-size: 0;
            padding-block: 0;
          }

          main[data-showcase] #jestei-graphics .jestei-graphics__body > [data-section-block] {
            gap: clamp(1.35rem, 2.8vw, 2.5rem);
          }

          main[data-showcase] #jestei-graphics [data-content-head] {
            display: grid !important;
            grid-template-columns: minmax(15rem, 0.7fr) minmax(0, 1.55fr);
            gap: clamp(1rem, 2vw, 1.75rem);
            align-items: stretch;
            inline-size: 100%;
            max-inline-size: none;
            margin: 0;
          }

          main[data-showcase] #jestei-graphics .jestei-graphics__lead {
            display: block !important;
            align-self: start;
            max-inline-size: 30rem;
            margin: 0;
            color: color-mix(in srgb, var(--black) 72%, transparent);
            font-size: clamp(0.98rem, 1vw, 1.16rem);
            font-weight: 400;
            line-height: 1.38;
            letter-spacing: 0;
            text-wrap: pretty;
          }

          main[data-showcase] #jestei-graphics .fact-grid--chapter {
            display: grid !important;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: clamp(0.55rem, 0.8vw, 0.75rem);
            align-items: stretch;
            inline-size: 100%;
            max-inline-size: none;
            margin: 0;
            padding: 0;
            overflow: visible;
            list-style: none;
          }

          main[data-showcase] #jestei-graphics .fact-grid--chapter li {
            display: grid !important;
            grid-template-rows: auto 1fr;
            gap: clamp(0.45rem, 0.65vw, 0.65rem);
            align-content: start;
            min-inline-size: 0;
            min-block-size: clamp(8.25rem, 10vw, 10.75rem);
            margin: 0;
            padding: clamp(0.7rem, 0.9vw, 0.9rem);
            overflow: hidden;
            border: 1px solid color-mix(in srgb, var(--black) 11%, transparent);
            border-radius: clamp(12px, 1vw, 16px);
            background: var(--white);
          }

          main[data-showcase] #jestei-graphics .fact-grid--chapter li::before {
            content: none !important;
          }

          main[data-showcase] #jestei-graphics .fact-grid--chapter strong {
            color: color-mix(in srgb, var(--black) 94%, var(--white));
            font-size: clamp(1.65rem, 2.25vw, 2.65rem);
            font-weight: 820;
            line-height: 0.9;
            letter-spacing: -0.025em;
            white-space: nowrap;
          }

          main[data-showcase] #jestei-graphics .fact-grid--chapter span {
            max-inline-size: 24rem;
            color: color-mix(in srgb, var(--black) 66%, var(--white));
            font-size: clamp(0.72rem, 0.18vw + 0.69rem, 0.86rem);
            line-height: 1.24;
            text-wrap: pretty;
          }

          main[data-showcase] #jestei-graphics [data-media-cluster][data-media-layout="grid"] {
            display: grid !important;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-flow: row;
            gap: clamp(0.5rem, 0.8vw, 0.75rem);
            inline-size: 100%;
            max-inline-size: none;
            margin: 0;
            padding: 0;
            overflow: visible;
          }

          main[data-showcase] #jestei-graphics [data-media-cluster][data-media-layout="grid"] > [data-section-media-item] {
            position: relative;
            display: block !important;
            grid-column: auto;
            grid-row: auto;
            inline-size: 100%;
            min-inline-size: 0;
            aspect-ratio: 1 / 1;
            margin: 0;
            overflow: hidden;
            border: 0;
            border-radius: 0;
            background: color-mix(in srgb, var(--black) 4%, var(--white));
          }

          main[data-showcase] #jestei-graphics [data-media-cluster][data-media-layout="grid"] > [data-section-media-item] > :is(img, video) {
            display: block;
            inline-size: 100%;
            block-size: 100%;
            margin: 0;
            object-fit: cover;
            object-position: center;
          }

          @media (max-width: 72rem) {
            main[data-showcase] #jestei-graphics [data-media-cluster][data-media-layout="grid"] {
              grid-template-columns: repeat(3, minmax(0, 1fr));
            }
          }

          @media (max-width: 58rem) {
            main[data-showcase] #jestei-graphics [data-content-head] {
              grid-template-columns: minmax(0, 1fr);
            }

            main[data-showcase] #jestei-graphics .jestei-graphics__lead {
              max-inline-size: 42rem;
            }
          }

          @media (max-width: 48rem) {
            main[data-showcase] #jestei-graphics .jestei-graphics__head {
              gap: clamp(0.85rem, 4vw, 1.2rem);
              padding-block: clamp(2.25rem, 10vw, 3.5rem) clamp(1.25rem, 6vw, 2rem);
            }

            main[data-showcase] #jestei-graphics .jestei-graphics__title {
              justify-self: start;
              font-size: clamp(1.65rem, 8vw, 2.75rem);
              letter-spacing: -0.04em;
            }

            main[data-showcase] #jestei-graphics [data-content-head] {
              gap: clamp(0.9rem, 4vw, 1.25rem);
            }

            main[data-showcase] #jestei-graphics .jestei-graphics__lead {
              font-size: clamp(0.98rem, 4.2vw, 1.12rem);
              line-height: 1.42;
            }

            main[data-showcase] #jestei-graphics .fact-grid--chapter {
              grid-template-columns: minmax(0, 1fr);
              gap: clamp(0.55rem, 2.5vw, 0.75rem);
            }

            main[data-showcase] #jestei-graphics .fact-grid--chapter li {
              min-block-size: 0;
            }

            main[data-showcase] #jestei-graphics [data-media-cluster][data-media-layout="grid"] {
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: clamp(0.45rem, 2vw, 0.65rem);
            }
          }
          ''', encoding="utf-8")
          PY

      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/runtime/remove-obsolete-copy.js src/styles/sections/jestei-graphics-final.css
          git diff --cached --check
          git commit -m "Fix Jestei graphics source markup"
          git push origin HEAD:prod
