name: tmp-css-461-wave5i-parity-v2
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  parity:
    if: github.head_ref == 'refactor/css-461-wave5i-masonry'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refactor/css-461-wave5i-masonry
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare exact base to masonry candidate
        shell: bash
        run: |
          git worktree add --detach /tmp/wave5i-base 8d73b4660565de68ea02233afa4a2e60df5f4e18
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/wave5i-base/node_modules
          ./node_modules/.bin/vite . --host 127.0.0.1 --port 4173 >/tmp/wave5i-candidate.log 2>&1 & CANDIDATE_PID=$!
          ./node_modules/.bin/vite /tmp/wave5i-base --host 127.0.0.1 --port 4174 >/tmp/wave5i-base.log 2>&1 & BASE_PID=$!
          trap 'kill $CANDIDATE_PID $BASE_PID 2>/dev/null || true' EXIT
          for PORT in 4173 4174; do
            for i in {1..30}; do curl -fsS "http://127.0.0.1:$PORT/work/styx/" >/dev/null && break; sleep 1; done
            curl -fsS "http://127.0.0.1:$PORT/work/styx/" >/dev/null
          done
          cat > .tmp-wave5i-parity-v2.mjs <<'NODE'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const cases=[['/work/styx/',390],['/work/styx/',900],['/work/styx/',1728],['/shootings/',390],['/shootings/',900],['/shootings/',1728]];
          const tolerance=.25;
          const browser=await chromium.launch({headless:true});
          const rel=(r,o)=>({x:r.x-o.x,y:r.y-o.y,width:r.width,height:r.height});
          async function capture(port){
            const page=await browser.newPage({reducedMotion:'reduce'});
            const out=[];
            for(const [route,width] of cases){
              await page.setViewportSize({width,height:1000});
              await page.goto(`http://127.0.0.1:${port}${route}`,{waitUntil:'domcontentloaded'});
              await page.evaluate(()=>document.fonts?.ready);
              const groups=page.locator('.media-group[data-layout="masonry"]');
              const count=await groups.count();
              if(!count) throw new Error(`no masonry groups ${route} ${width}`);
              for(let index=0;index<count;index++){
                const group=groups.nth(index);
                const box=await group.boundingBox();
                if(!box||box.width===0) continue;
                await group.scrollIntoViewIfNeeded();
                await page.evaluate(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))));
                out.push(await group.evaluate((node,meta)=>{
                  const items=node.querySelector(':scope > .media-group__items');
                  if(!items) throw new Error('missing masonry items');
                  const ir=items.getBoundingClientRect(), is=getComputedStyle(items), gs=getComputedStyle(node);
                  return {...meta,groupClass:node.className,groupColumnsInput:gs.getPropertyValue('--masonry-columns').trim(),groupMobileColumnsInput:gs.getPropertyValue('--masonry-mobile-columns').trim(),columnCount:is.columnCount,columnWidth:is.columnWidth,columnGap:is.columnGap,itemsRect:{x:ir.x,y:ir.y,width:ir.width,height:ir.height},children:[...items.children].map(child=>{const r=child.getBoundingClientRect(),cs=getComputedStyle(child),surface=child.querySelector('.media__surface'),sr=surface?.getBoundingClientRect()??null,ss=surface?getComputedStyle(surface):null,media=surface?.querySelector(':scope > img, :scope > video, :scope > picture > img')??null,ms=media?getComputedStyle(media):null;return {rect:{x:r.x,y:r.y,width:r.width,height:r.height},surfaceRect:sr?{x:sr.x,y:sr.y,width:sr.width,height:sr.height}:null,breakInside:cs.breakInside,marginBlockEnd:cs.marginBlockEnd,transform:cs.transform,aspectRatio:ss?.aspectRatio??null,mediaRatio:ss?.getPropertyValue('--media-ratio').trim()??null,mediaFit:ss?.getPropertyValue('--media-fit').trim()??null,objectFit:ms?.objectFit??null,objectPosition:ms?.objectPosition??null};})};
                },{route,width,index}));
              }
            }
            await page.close();return out;
          }
          const base=await capture(4174),candidate=await capture(4173),failures=[];
          const gs=['route','width','index','groupClass','groupColumnsInput','groupMobileColumnsInput','columnCount','columnWidth','columnGap'];
          const cs=['breakInside','marginBlockEnd','transform','aspectRatio','mediaRatio','mediaFit','objectFit','objectPosition'];
          if(base.length!==candidate.length) failures.push(`group count ${base.length} != ${candidate.length}`);
          for(let i=0;i<Math.min(base.length,candidate.length);i++){const a=base[i],b=candidate[i];for(const k of gs)if(a[k]!==b[k])failures.push(`g${i} ${k}: ${a[k]} != ${b[k]}`);if(a.children.length!==b.children.length)failures.push(`g${i} child count`);for(let j=0;j<Math.min(a.children.length,b.children.length);j++){const ac=a.children[j],bc=b.children[j];for(const k of cs)if(ac[k]!==bc[k])failures.push(`g${i} c${j} ${k}: ${ac[k]} != ${bc[k]}`);for(const n of ['rect','surfaceRect']){if(Boolean(ac[n])!==Boolean(bc[n])){failures.push(`g${i} c${j} ${n} presence`);continue}if(!ac[n])continue;const ar=rel(ac[n],a.itemsRect),br=rel(bc[n],b.itemsRect);for(const k of ['x','y','width','height'])if(Math.abs(ar[k]-br[k])>tolerance)failures.push(`g${i} c${j} ${n}.${k}: ${ar[k]} != ${br[k]}`);}}}
          writeFileSync('wave5i-masonry-parity-v2.json',JSON.stringify({baseSha:'8d73b4660565de68ea02233afa4a2e60df5f4e18',candidateSha:process.env.GITHUB_SHA,tolerance,base,candidate,failures},null,2));
          console.log(`Wave5I masonry stable parity: groups=${base.length}, failures=${failures.length}`);if(failures.length){console.error(failures.join('\n'));process.exitCode=1}await browser.close();
          NODE
          node .tmp-wave5i-parity-v2.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wave5i-masonry-parity-v2
          path: wave5i-masonry-parity-v2.json
