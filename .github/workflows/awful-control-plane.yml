name: AWFUL Control Plane

on:
  pull_request:
    branches: [dev, prod]
    paths:
      - 'cloud/awful-control-plane/**'
      - '.github/workflows/awful-control-plane.yml'
  push:
    branches: [dev]
    paths:
      - 'cloud/awful-control-plane/**'
      - '.github/workflows/awful-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awful-control-plane-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud/awful-control-plane
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax check
        run: npm run check
      - name: Smoke tests
        run: npm test
      - name: Build container image
        run: docker build --tag awful-control-plane:ci .

  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Parse provisioning scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'cloud/awful-control-plane/scripts/bootstrap-yandex.ps1',
            'cloud/awful-control-plane/scripts/configure-secrets.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file: $($_.Message)" }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $file"
          }
