name: tmp-css-560-wave5c-parity

on:
  push:
    branches:
      - test/css-560-wave5c-parity-diagnostic

permissions:
  contents: read

env:
  BASE_SHA: dc03e52be8351521b1605e70b546493491bfb06d
  CANDIDATE_SHA: 0f00179bc8b1d534cfa458561829f087bfd68d21

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare exact refs and servers
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=30 origin "$BASE_SHA"
          git fetch --no-tags --depth=30 origin "$CANDIDATE_SHA"
          git worktree add --detach /tmp/base "$BASE_SHA"
          git worktree add --detach /tmp/candidate "$CANDIDATE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/base/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/candidate/node_modules
          (cd /tmp/base && npx vite --host 127.0.0.1 --port 4172 > /tmp/base.log 2>&1 &)
          (cd /tmp/candidate && npx vite --host 127.0.0.1 --port 4173 > /tmp/candidate.log 2>&1 &)
          for port in 4172 4173; do
            for i in $(seq 1 60); do
              curl --fail --silent "http://127.0.0.1:$port/" >/dev/null && break
              test "$i" -lt 60
              sleep 1
            done
          done
      - name: Prove Sensetique settles identically after responsive image selection
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/sensetique-stability.mjs" <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const route = '/work/sensetique/';
          const viewports = [
            { name:'mobile', width:390, height:844 },
            { name:'tablet', width:900, height:1000 },
          ];
          const browser = await chromium.launch({headless:true});
          const report = {base:process.env.BASE_SHA,candidate:process.env.CANDIDATE_SHA,cases:[],failures:[]};
          const round=n=>Math.round(n*1000)/1000;

          const diff=(a,b,path='root',out=[])=>{
            if(typeof a==='number'&&typeof b==='number'){if(Math.abs(a-b)>0.75)out.push({path,a,b});return out;}
            if(Array.isArray(a)||Array.isArray(b)){if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length){out.push({path,a,b});return out;}for(let i=0;i<a.length;i++)diff(a[i],b[i],`${path}[${i}]`,out);return out;}
            if(a&&b&&typeof a==='object'&&typeof b==='object'){for(const k of [...new Set([...Object.keys(a),...Object.keys(b)])].sort())diff(a[k],b[k],`${path}.${k}`,out);return out;}
            if(a!==b)out.push({path,a,b});return out;
          };

          const settle=async(page,url)=>{
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.evaluate(()=>{for(const img of document.querySelectorAll('.media-group img')) img.loading='eager';});
            await page.waitForLoadState('networkidle',{timeout:15000}).catch(()=>{});
            await page.evaluate(async()=>{
              await document.fonts?.ready;
              const imgs=[...document.querySelectorAll('.media-group img')];
              const deadline=Date.now()+10000;
              while(Date.now()<deadline && imgs.some(img=>!img.complete)) await new Promise(r=>setTimeout(r,100));
              await Promise.all(imgs.filter(img=>img.complete&&img.naturalWidth>0).map(img=>img.decode?.().catch(()=>{}) ?? Promise.resolve()));
              for(const v of document.querySelectorAll('video')){v.pause();try{v.currentTime=0;}catch{}}
              window.scrollTo(0,0);
            });
          };

          const snap=page=>page.evaluate(()=>{
            const round=n=>Math.round(n*1000)/1000;
            const rect=el=>{const r=el.getBoundingClientRect();return {x:round(r.x),y:round(r.y),width:round(r.width),height:round(r.height)};};
            return [...document.querySelectorAll('.media-group')].map((group,groupIndex)=>({
              groupIndex,
              className:typeof group.className==='string'?group.className:'',
              data:Object.fromEntries([...group.attributes].filter(a=>a.name.startsWith('data-')).map(a=>[a.name,a.value])),
              rect:rect(group),
              media:[...group.querySelectorAll('.media')].map((item,mediaIndex)=>{
                const surface=item.querySelector('.media__surface');
                const asset=surface?.querySelector(':scope > img, :scope > video, :scope > picture > img')??null;
                const s=asset?getComputedStyle(asset):null;
                let currentSrc='';
                if(asset?.currentSrc){try{const u=new URL(asset.currentSrc,location.href);currentSrc=u.pathname+u.search;}catch{currentSrc=asset.currentSrc;}}
                return {mediaIndex,rect:rect(item),surface:surface?rect(surface):null,asset:asset?{
                  tag:asset.tagName,
                  rect:rect(asset),
                  currentSrc,
                  complete:asset.tagName!=='IMG'||asset.complete,
                  naturalWidth:asset.naturalWidth??asset.videoWidth??0,
                  naturalHeight:asset.naturalHeight??asset.videoHeight??0,
                  objectFit:s.objectFit,
                  objectPosition:s.objectPosition,
                  aspectRatio:s.aspectRatio,
                }:null};
              }),
            }));
          });

          const stableSnap=async page=>{
            let previous=await snap(page);
            for(let attempt=1;attempt<=20;attempt++){
              await page.waitForTimeout(500);
              const current=await snap(page);
              const changes=diff(previous,current,'stability');
              if(!changes.length) return {snapshot:current,attempts:attempt,changes:[]};
              previous=current;
            }
            return {snapshot:previous,attempts:20,changes:[{path:'stability-timeout'}]};
          };

          try{
            for(const vp of viewports){
              const bc=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'});
              const cc=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'});
              const bp=await bc.newPage(),cp=await cc.newPage();
              await Promise.all([settle(bp,'http://127.0.0.1:4172'+route),settle(cp,'http://127.0.0.1:4173'+route)]);
              const [base,candidate]=await Promise.all([stableSnap(bp),stableSnap(cp)]);
              const parity=diff(base.snapshot,candidate.snapshot,'parity');
              const key=`${vp.name}:${route}`;
              const result={key,baseAttempts:base.attempts,candidateAttempts:candidate.attempts,baseStable:!base.changes.length,candidateStable:!candidate.changes.length,parity};
              report.cases.push(result);
              if(!result.baseStable||!result.candidateStable||parity.length)report.failures.push(result);
              console.log(`${report.failures.at(-1)===result?'FAIL':'PASS'} ${key} base-attempts=${base.attempts} candidate-attempts=${candidate.attempts} parity=${parity.length}`);
              if(parity.length) console.log(JSON.stringify(parity.slice(0,40),null,2));
              await bc.close();await cc.close();
            }
          }finally{await browser.close();}

          await writeFile('/tmp/sensetique-stability.json',JSON.stringify(report,null,2)+'\n');
          if(report.failures.length)throw new Error(`Sensetique stability/parity failed ${report.failures.length}/${report.cases.length}`);
          console.log(`Sensetique stability/parity passed ${report.cases.length}/${report.cases.length} cases.`);
          JS
          node "$GITHUB_WORKSPACE/sensetique-stability.mjs"
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wave5c-sensetique-${{ github.sha }}
          retention-days: 7
          path: |
            /tmp/sensetique-stability.json
            /tmp/base.log
            /tmp/candidate.log
