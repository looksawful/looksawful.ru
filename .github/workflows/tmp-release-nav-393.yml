name: TEMP Release Nav 393

on:
  push:
    branches:
      - release/site-nav-css-owner-393

permissions:
  contents: write

jobs:
  migrate-verify-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact verified navigation slice
        run: |
          git fetch origin f90b68cc294c1ad89fa27800ce1ffeea86cfbbef --depth=1
          git show f90b68cc294c1ad89fa27800ce1ffeea86cfbbef:src/styles/components.css > src/styles/components.css
          git show f90b68cc294c1ad89fa27800ce1ffeea86cfbbef:test/site-navigation-style.test.mjs > test/site-navigation-style.test.mjs
          git show f90b68cc294c1ad89fa27800ce1ffeea86cfbbef:tools/smoke-site-navigation.mjs > tools/smoke-site-navigation.mjs
          rm src/styles/site-navigation.css
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.ts')
          s = p.read_text(encoding='utf-8')
          line = 'import "./styles/site-navigation.css";\n'
          assert s.count(line) == 1, 'expected exactly one navigation CSS import'
          p.write_text(s.replace(line, '', 1), encoding='utf-8')
          PY
      - name: Focused navigation contracts
        run: >-
          node --test
          test/site-navigation.test.mjs
          test/site-navigation-runtime.test.mjs
          test/site-navigation-style.test.mjs
          test/navigation-labels-cms.test.mjs
      - name: Production build
        run: npm run build:vite
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Affected navigation smoke
        run: node tools/smoke-site-navigation.mjs
      - name: Cleanup and commit release slice
        run: |
          rm -f .github/workflows/tmp-release-nav-393.yml
          git diff --check
          git status --short
          git config user.name "looksawful"
          git config user.email "118225585+looksawful@users.noreply.github.com"
          git add src/styles/components.css src/styles/site-navigation.css src/main.ts test/site-navigation-style.test.mjs tools/smoke-site-navigation.mjs .github/workflows/tmp-release-nav-393.yml
          git commit -m "release(ui): remove global navigation separator"
          git push origin HEAD:release/site-nav-css-owner-393
