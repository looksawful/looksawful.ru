name: tmp-css-461-strip-justify-characterization

on:
  push:
    branches:
      - test/css-461-strip-justify-characterization

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Record source history for both writers
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== flex-start history ==='
            git log --oneline --all -S'--reel-justify: flex-start' -- src/styles/components.css | head -20
            echo '=== safe-center history ==='
            git log --oneline --all -S'--reel-justify: safe center' -- src/styles/components.css | head -20
          } | tee /tmp/strip-history.txt
      - name: Start exact dev-equivalent tree
        shell: bash
        run: |
          set -euo pipefail
          (npx vite --host 127.0.0.1 --port 4173 > /tmp/dev.log 2>&1 &)
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            test "$i" -lt 60
            sleep 1
          done
      - name: Characterize strip justify across real routes
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/strip-characterize.mjs" <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const routes = [
            '/',
            '/work/jestei-pool/',
            '/work/styx/',
            '/work/sensetique/',
            '/shootings/',
            '/work/awful-cases/',
            '/work/moves/',
          ];
          const viewports = [
            { name: 'tablet', width: 900, height: 1000 },
            { name: 'desktop', width: 1728, height: 1000 },
          ];
          const round = (value) => Math.round(value * 1000) / 1000;
          const browser = await chromium.launch({ headless: true });
          const report = [];

          try {
            for (const route of routes) {
              for (const viewport of viewports) {
                const context = await browser.newContext({
                  viewport: { width: viewport.width, height: viewport.height },
                  reducedMotion: 'reduce',
                });
                const page = await context.newPage();
                await page.goto(`http://127.0.0.1:4173${route}`, {
                  waitUntil: 'networkidle',
                  timeout: 60000,
                });
                await page.evaluate(async () => {
                  await document.fonts?.ready;
                  const imgs = [...document.querySelectorAll('.portfolio-showcase__group[data-layout="strip"] img')];
                  for (const img of imgs) img.loading = 'eager';
                  await Promise.allSettled(imgs.map((img) => img.decode?.()));
                  await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                });

                const groups = await page.evaluate(async () => {
                  const round = (value) => Math.round(value * 1000) / 1000;
                  const raf2 = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                  const nodes = [...document.querySelectorAll('.portfolio-showcase__group[data-layout="strip"]')];
                  const results = [];

                  for (let index = 0; index < nodes.length; index += 1) {
                    const group = nodes[index];
                    const items = group.querySelector(':scope > .media-group__items');
                    if (!items) continue;
                    const groupRect = group.getBoundingClientRect();
                    const visible = groupRect.width > 0 && groupRect.height > 0 && getComputedStyle(group).display !== 'none';
                    if (!visible) continue;

                    const measure = () => {
                      const rect = items.getBoundingClientRect();
                      const first = items.firstElementChild?.getBoundingClientRect();
                      const last = items.lastElementChild?.getBoundingClientRect();
                      const style = getComputedStyle(items);
                      return {
                        reelJustify: style.getPropertyValue('--reel-justify').trim(),
                        justifyContent: style.justifyContent,
                        clientWidth: items.clientWidth,
                        scrollWidth: items.scrollWidth,
                        itemsX: round(rect.x),
                        firstX: first ? round(first.x) : null,
                        lastRight: last ? round(last.right) : null,
                      };
                    };

                    const originalInline = items.style.getPropertyValue('--reel-justify');
                    const originalPriority = items.style.getPropertyPriority('--reel-justify');
                    const current = measure();

                    items.style.setProperty('--reel-justify', 'flex-start', 'important');
                    await raf2();
                    const flexStart = measure();

                    items.style.setProperty('--reel-justify', 'safe center', 'important');
                    await raf2();
                    const safeCenter = measure();

                    const childStates = [...items.children].map((child) => ({
                      child,
                      display: child.style.display,
                    }));
                    for (let i = 1; i < childStates.length; i += 1) childStates[i].child.style.display = 'none';
                    items.style.setProperty('--reel-justify', 'flex-start', 'important');
                    await raf2();
                    const shortFlexStart = measure();
                    items.style.setProperty('--reel-justify', 'safe center', 'important');
                    await raf2();
                    const shortSafeCenter = measure();
                    for (const state of childStates) state.child.style.display = state.display;

                    if (originalInline) items.style.setProperty('--reel-justify', originalInline, originalPriority);
                    else items.style.removeProperty('--reel-justify');
                    await raf2();

                    results.push({
                      index,
                      className: group.className,
                      current,
                      flexStart,
                      safeCenter,
                      currentOverflowing: current.scrollWidth > current.clientWidth + 1,
                      liveGeometryDelta: {
                        firstX: flexStart.firstX === null || safeCenter.firstX === null ? null : round(safeCenter.firstX - flexStart.firstX),
                        lastRight: flexStart.lastRight === null || safeCenter.lastRight === null ? null : round(safeCenter.lastRight - flexStart.lastRight),
                      },
                      shortProbe: {
                        flexStart: shortFlexStart,
                        safeCenter: shortSafeCenter,
                        firstXDelta: shortFlexStart.firstX === null || shortSafeCenter.firstX === null ? null : round(shortSafeCenter.firstX - shortFlexStart.firstX),
                      },
                    });
                  }
                  return results;
                });

                const entry = { route, viewport, groups };
                report.push(entry);
                console.log(JSON.stringify(entry));
                await context.close();
              }
            }
          } finally {
            await browser.close();
          }

          const visibleCount = report.reduce((sum, entry) => sum + entry.groups.length, 0);
          const liveDeltas = report.flatMap((entry) => entry.groups.map((group) => ({ route: entry.route, viewport: entry.viewport.name, ...group })))
            .filter((group) => Math.abs(group.liveGeometryDelta.firstX ?? 0) > 0.5 || Math.abs(group.liveGeometryDelta.lastRight ?? 0) > 0.5);
          const shortDeltas = report.flatMap((entry) => entry.groups.map((group) => ({ route: entry.route, viewport: entry.viewport.name, ...group })))
            .filter((group) => Math.abs(group.shortProbe.firstXDelta ?? 0) > 0.5);

          const summary = { visibleCount, liveDeltaCount: liveDeltas.length, shortDeltaCount: shortDeltas.length, liveDeltas, shortDeltas };
          console.log('SUMMARY ' + JSON.stringify(summary, null, 2));
          await writeFile('/tmp/strip-characterization.json', JSON.stringify({ report, summary }, null, 2) + '\n');
          if (!visibleCount) throw new Error('No visible portfolio strip groups found across real routes');
          if (!shortDeltas.length) throw new Error('Short-strip probe did not demonstrate semantic difference between flex-start and safe center');
          JS
          node "$GITHUB_WORKSPACE/strip-characterize.mjs"
      - name: Upload characterization
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: css-461-strip-justify-${{ github.sha }}
          retention-days: 7
          path: |
            /tmp/strip-characterization.json
            /tmp/strip-history.txt
            /tmp/dev.log
