name: CMS media

on:
  push:
    branches: [dev]
    paths:
      - 'src/content/projects.json'
      - 'public/media/projects/index/**'
      - 'public/media/catalog/**'
      - 'src/content/media-catalog/registered/**'
      - 'src/content/media-catalog/uploads/**'
  workflow_dispatch:
    inputs:
      rebuild_cache:
        description: Rebuild the complete generated-media cache explicitly
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: cms-media-dev
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Classify media mutation
        id: scope
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REBUILD: ${{ inputs.rebuild_cache }}
        run: |
          set -euo pipefail
          has_image_source=false
          has_video_source=false
          has_media_reference_or_metadata=false
          has_image=false
          has_video=false
          has_source=false
          has_media_change=false
          rebuild=false
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' && "$REBUILD" == 'true' ]]; then
            has_image_source=true
            has_video_source=true
            has_image=true
            has_video=true
            has_source=true
            has_media_change=true
            rebuild=true
          elif [[ "${{ github.event_name }}" == 'push' ]]; then
            while IFS= read -r file; do
              case "${file,,}" in
                src/content/projects.json|src/content/media-catalog/registered/*|src/content/media-catalog/uploads/*)
                  has_media_reference_or_metadata=true
                  has_media_change=true
                  ;;
                *.jpg|*.jpeg|*.png|*.webp|*.avif|*.gif)
                  has_image_source=true
                  has_image=true
                  has_source=true
                  has_media_change=true
                  ;;
                *.mov|*.mp4|*.m4v|*.webm)
                  has_video_source=true
                  has_video=true
                  has_source=true
                  has_media_change=true
                  ;;
              esac
            done < <(git diff --name-only "$BEFORE" "$HEAD_SHA")
          fi
          printf 'has_image_source=%s\nhas_video_source=%s\nhas_media_reference_or_metadata=%s\nhas_image=%s\nhas_video=%s\nhas_source=%s\nhas_media_change=%s\nrebuild=%s\n' \
            "$has_image_source" "$has_video_source" "$has_media_reference_or_metadata" "$has_image" "$has_video" "$has_source" "$has_media_change" "$rebuild" >> "$GITHUB_OUTPUT"
      - name: Calculate previous media fingerprint
        if: github.event_name == 'push' && steps.scope.outputs.has_media_change == 'true'
        id: previous-media
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/media-before "$BEFORE"
          previous="$(cd /tmp/media-before && node tools/media-dev-state.mjs --fingerprint)"
          git worktree remove --force /tmp/media-before
          echo "fingerprint=$previous" >> "$GITHUB_OUTPUT"
      - name: Restore exact previous generated media cache
        if: github.event_name == 'push' && steps.scope.outputs.has_media_change == 'true'
        id: previous-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.previous-media.outputs.fingerprint }}
      - name: Require exact base cache for non-video media mutation
        if: github.event_name == 'push' && steps.scope.outputs.has_media_change == 'true' && steps.scope.outputs.has_video != 'true' && steps.previous-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "Exact previous generated-media cache is missing for a reference/metadata or image-only media update." >&2
          echo "Run CMS media with rebuild_cache=true, then retry. ffmpeg and heavy video generation are intentionally not used for this path." >&2
          exit 1
      - name: Verify previous cache before incremental generation or targeted validation
        if: github.event_name == 'push' && steps.scope.outputs.has_media_change == 'true' && steps.previous-cache.outputs.cache-hit == 'true'
        run: node tools/media-dev-state.mjs --cache-verify
      - name: Synchronize catalog metadata
        if: steps.scope.outputs.has_media_change == 'true'
        run: npm run media:catalog:sync
      - name: Install video tooling
        if: steps.scope.outputs.has_video == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Full explicit media cache rebuild
        if: steps.scope.outputs.rebuild == 'true' || (steps.scope.outputs.has_video == 'true' && steps.previous-cache.outputs.cache-hit != 'true')
        run: npm run media:sync
      - name: Build video derivatives incrementally
        if: steps.scope.outputs.rebuild != 'true' && steps.scope.outputs.has_video == 'true' && steps.previous-cache.outputs.cache-hit == 'true'
        run: npm run media:video:build
      - name: Build image derivatives incrementally
        if: steps.scope.outputs.rebuild != 'true' && steps.scope.outputs.has_image == 'true' && steps.previous-cache.outputs.cache-hit == 'true'
        run: npm run media:build
      - name: Validate media references
        if: steps.scope.outputs.has_media_change == 'true'
        run: npm run test:media:contract
      - name: Validate generated media
        if: steps.scope.outputs.has_media_change == 'true'
        run: npm run test:media:checks
      - name: Confirm normalized media catalog is stable
        if: steps.scope.outputs.has_media_change == 'true'
        run: npm run media:catalog:check
      - name: Write canonical generated-media cache marker
        if: steps.scope.outputs.has_media_change == 'true'
        run: node tools/media-dev-state.mjs --cache-write
      - name: Calculate final media fingerprint
        if: steps.scope.outputs.has_media_change == 'true'
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Verify complete final generated media state
        if: steps.scope.outputs.has_media_change == 'true'
        run: node tools/media-dev-state.mjs --cache-verify
      - name: Save exact generated media cache
        if: steps.scope.outputs.has_media_change == 'true' && (github.event_name != 'push' || steps.previous-cache.outputs.cache-hit != 'true' || steps.media.outputs.fingerprint != steps.previous-media.outputs.fingerprint)
        uses: actions/cache/save@v4
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}
      - name: Final Fast validation for source mutation
        if: steps.scope.outputs.has_image == 'true' || steps.scope.outputs.has_video == 'true' || steps.scope.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:fast
          npm run build:site
      - name: Persist normalized tracked metadata only
        if: github.event_name == 'push' && steps.scope.outputs.has_media_change == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          allowed=(
            src/data/media/catalog-records.generated.ts
            public/media/generated/responsive-manifest.json
            public/media/generated/video-inventory.json
            src/data/media/responsive-generated.ts
            src/content/media-catalog/registered
            src/content/media-catalog/uploads
          )
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //' | sed -E 's/.* -> //')
          if (( ${#changed[@]} == 0 )); then
            exit 0
          fi
          for file in "${changed[@]}"; do
            allowed_match=false
            for root in "${allowed[@]}"; do
              if [[ "$file" == "$root" || "$file" == "$root/"* ]]; then
                allowed_match=true
                break
              fi
            done
            if [[ "$allowed_match" != true ]]; then
              echo "CMS media attempted unexpected tracked mutation: $file" >&2
              exit 1
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${allowed[@]}"
          git diff --cached --quiet && exit 0
          git commit -m 'chore(media): sync CMS media metadata'
          git fetch origin dev
          if [[ "$(git rev-parse origin/dev)" != "$SOURCE_SHA" ]]; then
            echo 'dev advanced during media normalization; refusing non-fast-forward source mutation' >&2
            exit 1
          fi
          git push origin HEAD:dev
