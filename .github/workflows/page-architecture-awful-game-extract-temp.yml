name: Temporary Awful Cases Game Extractor

on:
  push:
    branches:
      - agent/page-architecture-wave2-render-pipeline-20260904
    paths:
      - .github/workflows/page-architecture-awful-game-extract-temp.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/page-architecture-wave2-render-pipeline-20260904
          fetch-depth: 1
      - name: Extract exact legacy game DOM into specialized renderer
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const source = readFileSync('index.html', 'utf8');
          const openingPattern = /<figure\b[^>]*class="[^"]*\bawful-cases-game\b[^"]*"[^>]*>/g;
          const openings = [...source.matchAll(openingPattern)];
          if (openings.length !== 1) {
            throw new Error(`Expected exactly one awful-cases-game figure, found ${openings.length}`);
          }

          const opening = openings[0];
          const start = opening.index;
          if (typeof start !== 'number') throw new Error('Missing figure start offset');

          const tags = /<figure\b[^>]*>|<\/figure>/gi;
          tags.lastIndex = start;
          let depth = 0;
          let end = -1;
          for (let match = tags.exec(source); match; match = tags.exec(source)) {
            if (/^<\/figure/i.test(match[0])) {
              depth -= 1;
              if (depth === 0) {
                end = match.index + match[0].length;
                break;
              }
            } else {
              depth += 1;
            }
          }
          if (end < 0) throw new Error('Could not find matching awful-cases-game closing figure');

          const fragment = source.slice(start, end);
          for (const required of [
            'class="media mockup awful-cases-game"',
            'id="runnerGameShell"',
            'id="game"',
            'id="startButton"',
            'id="restartPanel"',
          ]) {
            if (!fragment.includes(required)) throw new Error(`Missing required game hook: ${required}`);
          }

          const escaped = fragment.replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
          const output = `/** Exact canonical DOM contract for the interactive Awful Cases game. */\nexport function renderAwfulCasesGame(): string {\n  return String.raw\`${escaped}\`;\n}\n`;
          writeFileSync('src/components/specialized/awful-cases-game.ts', output);
          console.log(`[awful-game] extracted ${fragment.length} chars`);
          NODE
      - name: Verify extracted source
        shell: bash
        run: |
          grep -F 'class="media mockup awful-cases-game"' src/components/specialized/awful-cases-game.ts
          grep -F 'id="runnerGameShell"' src/components/specialized/awful-cases-game.ts
          grep -F 'id="game"' src/components/specialized/awful-cases-game.ts
          git diff --check
          test -n "$(git status --porcelain -- src/components/specialized/awful-cases-game.ts)"
      - name: Commit exact extracted renderer
        shell: bash
        run: |
          remote_head="$(git ls-remote origin refs/heads/agent/page-architecture-wave2-render-pipeline-20260904 | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Feature head moved: expected $GITHUB_SHA, got $remote_head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/specialized/awful-cases-game.ts
          git commit -m "refactor(page-architecture): extract Awful Cases game renderer"
          git push origin HEAD:agent/page-architecture-wave2-render-pipeline-20260904
