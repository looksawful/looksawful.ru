name: tmp-css-583-wave5l-browser

on:
  push:
    branches:
      - refactor/css-461-wave5l-media-group-base
    paths:
      - .github/workflows/tmp-css-583-wave5l-browser.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Calculate canonical media fingerprint
        id: media
        shell: bash
        run: echo "fingerprint=$(node tools/media-dev-state.mjs --fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore exact generated media cache
        id: media-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            public/media/generated/responsive
            public/media/generated/video
            public/media/generated/video-inventory.json
            .cache/media/generated-cache.json
          key: generated-media-v3-${{ runner.os }}-${{ steps.media.outputs.fingerprint }}

      - name: Recover generated media on cache miss
        if: steps.media-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          npm run media:sync
          node tools/media-dev-state.mjs --cache-verify
          git diff --exit-code

      - name: Verify restored generated media
        if: steps.media-cache.outputs.cache-hit == 'true'
        run: node tools/media-dev-state.mjs --cache-verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build:site

      - name: Existing quick browser smoke
        run: npm run test:e2e:smoke

      - name: Start exact production preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/wave5l-preview.log 2>&1 &
          echo $! > /tmp/wave5l-preview.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/wave5l-preview.log
          exit 1

      - name: Computed media-group and media-fit gate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const cases = [
            {
              route: '/',
              width: 1440,
              height: 900,
              selector: '.media-group[data-layout="grid"]:not([data-overflow]):not([data-compact-layout])',
              label: 'home plain grid',
            },
            {
              route: '/',
              width: 390,
              height: 844,
              selector: '.media-group[data-layout="grid"]:not([data-overflow]):not([data-compact-layout])',
              label: 'home plain grid',
            },
            {
              route: '/work/jestei-pool/',
              width: 1440,
              height: 900,
              selector: '.media-group.brand-system',
              label: 'Jestei brand specialization',
            },
            {
              route: '/work/jestei-pool/',
              width: 390,
              height: 844,
              selector: '.media-group.brand-system',
              label: 'Jestei brand specialization',
            },
          ];

          try {
            for (const entry of cases) {
              const context = await browser.newContext({
                viewport: { width: entry.width, height: entry.height },
                isMobile: entry.width === 390,
                hasTouch: entry.width === 390,
                deviceScaleFactor: 1,
              });
              const page = await context.newPage();
              const response = await page.goto(`http://127.0.0.1:4173${entry.route}`, { waitUntil: 'networkidle' });
              assert.ok(response?.ok(), `${entry.route} ${entry.width}: HTTP ${response?.status()}`);

              const state = await page.evaluate((selector) => {
                const groups = [...document.querySelectorAll(selector)]
                  .filter((node) => {
                    const rect = node.getBoundingClientRect();
                    const style = getComputedStyle(node);
                    return rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden';
                  });
                const group = groups[0];
                if (!group) return { missing: true };

                const style = getComputedStyle(group);
                const rect = group.getBoundingClientRect();
                const parentRect = group.parentElement?.getBoundingClientRect();
                const media = group.querySelector('.media__surface img, .media__surface video');
                const surface = media?.closest('.media__surface');
                const mediaStyle = media ? getComputedStyle(media) : null;
                const mediaRect = media?.getBoundingClientRect();
                const surfaceRect = surface?.getBoundingClientRect();
                const maxSource = style.getPropertyValue('--group-max').trim() || style.getPropertyValue('--project-media-max').trim();

                return {
                  missing: false,
                  display: style.display,
                  containerName: style.containerName,
                  containerType: style.containerType,
                  columnGap: style.columnGap,
                  rowGap: style.rowGap,
                  groupColumns: style.getPropertyValue('--group-columns').trim(),
                  mobileColumns: style.getPropertyValue('--group-mobile-columns').trim(),
                  maxSource,
                  width: rect.width,
                  parentWidth: parentRect?.width ?? 0,
                  documentOverflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                  media: media && surface ? {
                    objectFit: mediaStyle?.objectFit ?? '',
                    width: mediaRect?.width ?? 0,
                    height: mediaRect?.height ?? 0,
                    surfaceWidth: surfaceRect?.width ?? 0,
                    surfaceHeight: surfaceRect?.height ?? 0,
                  } : null,
                };
              }, entry.selector);

              assert.equal(state.missing, false, `${entry.route} ${entry.width}: ${entry.label} missing`);
              assert.equal(state.display, 'grid', `${entry.route} ${entry.width}: media-group root must remain grid`);
              assert.match(state.containerName, /(?:^|\s)media-group(?:\s|$)/, `${entry.route} ${entry.width}: named container lost`);
              assert.equal(state.containerType, 'inline-size', `${entry.route} ${entry.width}: container type drift`);
              assert.ok(Number.parseFloat(state.columnGap) > 0, `${entry.route} ${entry.width}: column gap must resolve positive`);
              assert.ok(Number.parseFloat(state.rowGap) > 0, `${entry.route} ${entry.width}: row gap must resolve positive`);
              assert.match(state.groupColumns, /^\d+(?:\.\d+)?$/, `${entry.route} ${entry.width}: --group-columns must resolve numeric`);
              assert.match(state.mobileColumns, /^\d+(?:\.\d+)?$/, `${entry.route} ${entry.width}: --group-mobile-columns must resolve numeric`);
              assert.ok(state.maxSource, `${entry.route} ${entry.width}: group max-width source must resolve`);
              assert.ok(state.width > 0 && state.width <= state.parentWidth + 1, `${entry.route} ${entry.width}: group width escaped parent`);
              assert.ok(state.documentOverflow <= 1, `${entry.route} ${entry.width}: document overflow ${state.documentOverflow}px`);
              assert.ok(state.media, `${entry.route} ${entry.width}: representative media missing`);
              assert.match(state.media.objectFit, /^(cover|contain)$/, `${entry.route} ${entry.width}: media fit drift`);
              assert.ok(state.media.width <= state.media.surfaceWidth + 1, `${entry.route} ${entry.width}: media width escaped surface`);
              assert.ok(state.media.height <= state.media.surfaceHeight + 1, `${entry.route} ${entry.width}: media height escaped surface`);

              console.log('[wave5l-browser]', entry.label, entry.route, `${entry.width}x${entry.height}`, JSON.stringify(state));
              await context.close();
            }
          } finally {
            await browser.close();
          }
          NODE

      - name: Stop preview
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/wave5l-preview.pid ]]; then
            kill "$(cat /tmp/wave5l-preview.pid)" 2>/dev/null || true
          fi
