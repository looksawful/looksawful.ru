name: Temporary generate Jestei inventory

on:
  push:
    branches: [fix/jestei-landings-trim-final]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jestei-landings-trim-final
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate and persist tracked inventory
        shell: bash
        run: |
          set -euo pipefail
          npm run media:video:build
          changed="$(git status --porcelain | awk '{print $2}')"
          printf 'Generated changes:\n%s\n' "$changed"
          if [ "$changed" != "public/media/generated/video-inventory.json" ]; then
            echo 'Unexpected generated changes; refusing to persist.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/generated/video-inventory.json
          git commit -m 'chore(media): sync Jestei video inventory'
          git push origin HEAD:fix/jestei-landings-trim-final
