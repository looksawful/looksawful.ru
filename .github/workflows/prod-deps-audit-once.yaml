name: Production Dependency Audit Once

on:
  push:
    branches:
      - test/basic-accessibility-smoke-20260905
    paths:
      - '.github/workflows/prod-deps-audit-once.yaml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Audit production dependencies only
        run: npm audit --omit=dev --audit-level=high
