name: Public Storybook

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/public-storybook.yml"
      - "tools/lab/storybook/**"
      - "tools/lab/build-storybook.mjs"
      - "src/lab/**"
      - "src/site/**"
      - "src/components/**"
      - "src/templates/**"
      - "src/content/**"
      - "src/data/**"
      - "src/styles/**"
      - "package.json"
      - "package-lock.json"
      - "test/public-storybook-boundary.test.mjs"
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/public-storybook.yml"
      - "tools/lab/storybook/**"
      - "tools/lab/build-storybook.mjs"
      - "src/lab/**"
      - "src/site/**"
      - "src/components/**"
      - "src/templates/**"
      - "src/content/**"
      - "src/data/**"
      - "src/styles/**"
      - "package.json"
      - "package-lock.json"
      - "test/public-storybook-boundary.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-storybook-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGES_PROJECT: looksawful-storybook
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify Storybook build inputs
        run: node --test test/public-storybook-boundary.test.mjs
      - name: Build Storybook catalog
        run: npm run storybook:public
      - name: Ensure no media inventory was copied into public artifact
        run: |
          test -f dist-storybook/index.json
          test ! -e dist-storybook/media
          test ! -e dist-storybook/projects
          test ! -e dist-storybook/lab
      - name: Smoke Storybook preview
        if: github.event_name == 'pull_request'
        run: |
          npx --no-install playwright install chromium
          node tools/lab/smoke-storybook.mjs
      - name: Ensure separate public Cloudflare Pages project
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing Cloudflare token}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing Cloudflare account}"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          status="$(curl --silent --show-error --output /tmp/storybook-pages-project.json --write-out '%{http_code}' --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${endpoint}")"
          if [[ "${status}" == 404 ]]; then
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"name":"looksawful-storybook","production_branch":"dev"}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" > /tmp/storybook-pages-created.json
          elif [[ ! "${status}" =~ ^2 ]]; then
            echo "Cloudflare Pages lookup failed: ${status}" >&2
            exit 1
          fi
      - name: Deploy public-only Storybook
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy dist-storybook
          --project-name looksawful-storybook
          --branch dev
          --commit-hash "${GITHUB_SHA}"
          --commit-dirty=false
