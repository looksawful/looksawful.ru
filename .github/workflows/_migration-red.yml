name: Migration apply

on:
  push:
    branches:
      - agent/minimal-ci-migration-20260902

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: node tools/_apply-minimal-ci.mjs
