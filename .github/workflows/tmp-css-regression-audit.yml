name: tmp-css-regression-audit

on:
  push:
    branches:
      - test/css-refactor-regression-audit
  workflow_dispatch:

concurrency:
  group: tmp-css-regression-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BASELINE_SHA: 113232f654a8f7f79ed9dba64e7b8774487e9099
      CURRENT_SHA: dc45129e08389107a05aa3a960bd94d6a3a7d511
      WAVE5_SHA: 5ca5b931fa9c344df1581a0bf8e7e43d84fac284
    steps:
      - name: Checkout bounded audit history
        uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Fetch refreshed current and frozen Wave 5A history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=30 origin "$CURRENT_SHA"
          git fetch --no-tags --depth=30 origin "$WAVE5_SHA"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git cat-file -e "$CURRENT_SHA^{commit}"
          git cat-file -e "$WAVE5_SHA^{commit}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install audit dependencies
        run: npm ci

      - name: Install canonical browser and media tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          npx playwright install --with-deps chromium

      - name: Validate audit harness syntax
        run: |
          node --check tools/tmp-css-source-audit.mjs
          node --check tools/tmp-css-regression-audit.mjs
          node --check tools/tmp-css-media-fit-audit.mjs
          node --check tools/tmp-css-canvas-diagnostics.mjs

      - name: Run cumulative source and cascade audit
        run: node tools/tmp-css-source-audit.mjs

      - name: Check refactor diffs for whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASELINE_SHA" "$CURRENT_SHA" -- src/styles test tools/design-capture/config.mjs
          git diff --check "$CURRENT_SHA" "$WAVE5_SHA" -- src/styles test tools

      - name: Create exact comparison worktrees
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/css-original /tmp/css-current /tmp/css-wave5
          git worktree add --detach /tmp/css-original "$BASELINE_SHA"
          git worktree add --detach /tmp/css-current "$CURRENT_SHA"
          git worktree add --detach /tmp/css-wave5 "$WAVE5_SHA"
          for tree in /tmp/css-original /tmp/css-current /tmp/css-wave5; do
            ln -s "$GITHUB_WORKSPACE/node_modules" "$tree/node_modules"
          done
          sha256sum package-lock.json /tmp/css-original/package-lock.json /tmp/css-current/package-lock.json /tmp/css-wave5/package-lock.json
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "$(sha256sum /tmp/css-original/package-lock.json | cut -d' ' -f1)"
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "$(sha256sum /tmp/css-current/package-lock.json | cut -d' ' -f1)"
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "$(sha256sum /tmp/css-wave5/package-lock.json | cut -d' ' -f1)"

      - name: Prove media inputs match and prepare one canonical generated set
        shell: bash
        run: |
          set -euo pipefail
          original_fp="$(cd /tmp/css-original && node tools/media-dev-state.mjs --fingerprint)"
          current_fp="$(cd /tmp/css-current && node tools/media-dev-state.mjs --fingerprint)"
          wave5_fp="$(cd /tmp/css-wave5 && node tools/media-dev-state.mjs --fingerprint)"
          printf 'original=%s\ncurrent=%s\nwave5=%s\n' "$original_fp" "$current_fp" "$wave5_fp"
          test "$original_fp" = "$current_fp"
          test "$current_fp" = "$wave5_fp"

          (cd /tmp/css-current && npm run media:sync)
          (cd /tmp/css-current && node tools/media-dev-state.mjs --cache-verify)
          (cd /tmp/css-current && git diff --exit-code)

          for tree in /tmp/css-original /tmp/css-wave5; do
            rm -rf "$tree/public/media/generated"
            mkdir -p "$tree/public/media/generated" "$tree/.cache/media"
            cp -a /tmp/css-current/public/media/generated/. "$tree/public/media/generated/"
            cp /tmp/css-current/.cache/media/generated-cache.json "$tree/.cache/media/generated-cache.json"
            (cd "$tree" && node tools/media-dev-state.mjs --cache-verify)
            (cd "$tree" && git diff --exit-code)
          done

      - name: Run original baseline historically supported gates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/css-original
          npm run typecheck
          npm run test:fast
          npm run build:site
          npm run test:ui:responsive

      - name: Classify original baseline known smoke debt
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/css-original
          expected='Jestei route must contain a sequence middle-overflow reel caption'

          expect_known_failure() {
            label="$1"
            shift
            log="/tmp/${label}.log"
            set +e
            "$@" >"$log" 2>&1
            status=$?
            set -e
            cat "$log"
            test "$status" -ne 0
            grep -Fq "$expected" "$log"
          }

          expect_known_failure css-original-smoke npm run test:e2e:smoke
          expect_known_failure css-original-full npm run test:e2e:full

      - name: Probe original homepage canvas health directly
        shell: bash
        run: |
          set -euo pipefail
          log="/tmp/css-original-homepage-smoke.log"
          status_file="/tmp/css-original-homepage-smoke.status"
          set +e
          (cd /tmp/css-original && node tools/smoke-site.mjs) >"$log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" >"$status_file"
          printf '\n===== css-original-homepage-smoke (exit %s) =====\n' "$status"
          cat "$log"

      - name: Run merged current pre-full gates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/css-current
          npm run lint
          npm run verify
          npm run test:ui:responsive

      - name: Collect structured current canvas diagnostics
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_path=/tmp/css-current/tools/tmp-css-canvas-diagnostics.mjs
          log=/tmp/css-current-canvas-diagnostics.log
          status_file=/tmp/css-current-canvas-diagnostics.status

          cp "$GITHUB_WORKSPACE/tools/tmp-css-canvas-diagnostics.mjs" "$diagnostic_path"
          set +e
          (cd /tmp/css-current && node tools/tmp-css-canvas-diagnostics.mjs) >"$log" 2>&1
          status=$?
          set -e
          rm -f "$diagnostic_path"

          printf '%s\n' "$status" >"$status_file"
          printf '\n===== css-current-canvas-diagnostics (exit %s) =====\n' "$status"
          cat "$log"
          (cd /tmp/css-current && git diff --exit-code)

      - name: Run merged current full E2E
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/css-current
          npm run test:e2e:full

      - name: Run frozen Wave 5A repository gates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/css-wave5
          npm run lint
          npm run verify
          npm run test:ui:responsive
          npm run test:e2e:full

      - name: Start exact static previews
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/css-original && npx vite preview --host 127.0.0.1 --port 4171 > /tmp/css-original-preview.log 2>&1 & echo $! > /tmp/css-original-preview.pid)
          (cd /tmp/css-current && npx vite preview --host 127.0.0.1 --port 4172 > /tmp/css-current-preview.log 2>&1 & echo $! > /tmp/css-current-preview.pid)
          (cd /tmp/css-wave5 && npx vite preview --host 127.0.0.1 --port 4173 > /tmp/css-wave5-preview.log 2>&1 & echo $! > /tmp/css-wave5-preview.pid)
          for port in 4171 4172 4173; do
            for attempt in $(seq 1 60); do
              if curl --fail --silent "http://127.0.0.1:$port/" > /dev/null; then break; fi
              if [[ "$attempt" -eq 60 ]]; then exit 1; fi
              sleep 1
            done
          done

      - name: Compare media fit original baseline with merged current site
        shell: bash
        env:
          BASELINE_SHA: 113232f654a8f7f79ed9dba64e7b8774487e9099
          CURRENT_SHA: dc45129e08389107a05aa3a960bd94d6a3a7d511
        run: node tools/tmp-css-media-fit-audit.mjs http://127.0.0.1:4171 http://127.0.0.1:4172 /tmp/css-media-fit-original-current

      - name: Compare media fit merged current site with frozen Wave 5A
        shell: bash
        env:
          BASELINE_SHA: dc45129e08389107a05aa3a960bd94d6a3a7d511
          CURRENT_SHA: 5ca5b931fa9c344df1581a0bf8e7e43d84fac284
        run: node tools/tmp-css-media-fit-audit.mjs http://127.0.0.1:4172 http://127.0.0.1:4173 /tmp/css-media-fit-current-wave5

      - name: Compare original baseline with merged current site
        shell: bash
        env:
          BASELINE_SHA: 113232f654a8f7f79ed9dba64e7b8774487e9099
          CURRENT_SHA: dc45129e08389107a05aa3a960bd94d6a3a7d511
        run: node tools/tmp-css-regression-audit.mjs http://127.0.0.1:4171 http://127.0.0.1:4172 /tmp/css-regression-original-current

      - name: Compare merged current site with frozen Wave 5A
        shell: bash
        env:
          BASELINE_SHA: dc45129e08389107a05aa3a960bd94d6a3a7d511
          CURRENT_SHA: 5ca5b931fa9c344df1581a0bf8e7e43d84fac284
        run: node tools/tmp-css-regression-audit.mjs http://127.0.0.1:4172 http://127.0.0.1:4173 /tmp/css-regression-current-wave5

      - name: Archive regression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: css-regression-audit-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/css-media-fit-original-current
            /tmp/css-media-fit-current-wave5
            /tmp/css-regression-original-current
            /tmp/css-regression-current-wave5
            /tmp/css-original-smoke.log
            /tmp/css-original-full.log
            /tmp/css-original-homepage-smoke.log
            /tmp/css-original-homepage-smoke.status
            /tmp/css-current-canvas-diagnostics.log
            /tmp/css-current-canvas-diagnostics.status
            /tmp/css-original-preview.log
            /tmp/css-current-preview.log
            /tmp/css-wave5-preview.log