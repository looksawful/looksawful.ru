name: One-shot structure move smoke-navigation

on:
  push:
    branches: [refactor/364-repository-structure]
    paths:
      - '.github/workflows/structure-move-smoke-navigation.yml'

permissions:
  contents: write

jobs:
  move:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/364-repository-structure
          fetch-depth: 1
      - name: Move wrapper and update exact consumers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git mv tools/smoke-site-navigation.mjs tools/e2e/smoke-site-navigation.mjs

          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tools/e2e/smoke-site-navigation.mjs'): [
                  ('"../src/content/navigation.json"', '"../../src/content/navigation.json"'),
                  ('"./e2e/runtime.mjs"', '"./runtime.mjs"'),
              ],
              Path('package.json'): [
                  ('"test:e2e:navigation": "node tools/smoke-site-navigation.mjs"', '"test:e2e:navigation": "node tools/e2e/smoke-site-navigation.mjs"'),
              ],
              Path('tools/e2e/run-all.mjs'): [
                  ('from "../smoke-site-navigation.mjs"', 'from "./smoke-site-navigation.mjs"'),
              ],
              Path('tools/e2e/run-affected.mjs'): [
                  ('from "../smoke-site-navigation.mjs"', 'from "./smoke-site-navigation.mjs"'),
              ],
              Path('test/tooling-pipeline.test.mjs'): [
                  ('["smoke-site-navigation.mjs", "runSmokeNavigation"]', '["e2e/smoke-site-navigation.mjs", "runSmokeNavigation"]'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected consumer in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          if git grep -n -E 'tools/smoke-site-navigation\.mjs|from "\.\./smoke-site-navigation\.mjs"|\["smoke-site-navigation\.mjs", "runSmokeNavigation"\]' -- ':!docs/superpowers/plans/*' ':!test/repository-structure.test.mjs' ':!.github/workflows/structure-move-smoke-navigation.yml'; then
            echo 'stale smoke-navigation path remains' >&2
            exit 1
          fi

          git rm .github/workflows/structure-move-smoke-navigation.yml
          git add --all
          git diff --cached --check
          git commit -m 'refactor(e2e): move navigation smoke wrapper into e2e tooling'
          git push origin HEAD:refactor/364-repository-structure
