name: Temporary Media Semantic Baseline

on:
  pull_request:
    branches: [dev]
    paths:
      - "test/fixtures/media-semantic-baseline.json"
      - "tools/media/export-semantic-baseline.mjs"
      - ".github/workflows/tmp-media-semantic-baseline.yml"

permissions:
  contents: read

jobs:
  verify-current:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify refreshed migration semantic baseline
        run: node tools/media/export-semantic-baseline.mjs --migration --check
      - name: Run semantic baseline contract
        run: node --test test/media-semantic-baseline.test.mjs
