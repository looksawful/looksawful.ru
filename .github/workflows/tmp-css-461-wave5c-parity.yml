name: tmp-css-461-wave5c-parity

on:
  push:
    branches:
      - test/css-461-wave5c-parity-diagnostic

permissions:
  contents: read

env:
  BASE_SHA: b65325afe36b8e78f9d2a7108024ff17dd5b55f1
  CANDIDATE_SHA: e77689618682d6b7cb47d08bfbe17e4fa01ad7d3

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare exact refs and servers
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=30 origin "$BASE_SHA"
          git fetch --no-tags --depth=30 origin "$CANDIDATE_SHA"
          git worktree add --detach /tmp/base "$BASE_SHA"
          git worktree add --detach /tmp/candidate "$CANDIDATE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/base/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/candidate/node_modules
          (cd /tmp/base && npx vite --host 127.0.0.1 --port 4172 > /tmp/base.log 2>&1 &)
          (cd /tmp/candidate && npx vite --host 127.0.0.1 --port 4173 > /tmp/candidate.log 2>&1 &)
          for port in 4172 4173; do
            for i in $(seq 1 60); do
              curl --fail --silent "http://127.0.0.1:$port/" >/dev/null && break
              test "$i" -lt 60
              sleep 1
            done
          done
      - name: Compare layout and media-fit parity
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/wave5c-parity.mjs" <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const routes = ['/', '/work/jestei-pool/', '/work/styx/', '/work/sensetique/', '/shootings/', '/work/awful-cases/', '/work/moves/'];
          const viewports = [
            { name:'mobile', width:390, height:844 },
            { name:'tablet', width:900, height:1000 },
            { name:'desktop', width:1728, height:1000 },
          ];
          const groupSelectors = [
            '.media-group',
            '.media-group__head',
            '.media-group__items',
            '.media-group[data-layout="grid"]',
            '.media-group[data-layout="grid"][data-overflow="reel"]',
            '.media-group[data-compact-layout="reel"]',
          ];
          const mediaSelectors = [
            '.media-group .media__surface',
            '.media-group .media__surface > img',
            '.media-group .media__surface > video',
            '.media-group .media__surface > picture > img',
          ];
          const groupProps = ['display','position','width','height','minWidth','maxWidth','marginLeft','marginRight','paddingLeft','paddingRight','gap','rowGap','columnGap','gridTemplateColumns','gridTemplateRows','gridAutoFlow','gridAutoColumns','flexDirection','justifyContent','alignItems','overflowX','overflowY','containerName','containerType','visibility','opacity','transform','translate'];
          const mediaProps = ['display','width','height','minWidth','maxWidth','minHeight','maxHeight','aspectRatio','objectFit','objectPosition','overflowX','overflowY','visibility','opacity','transform','translate'];
          const groupVars = ['--group-gap','--group-row-gap','--group-columns','--group-mobile-columns','--group-max','--group-reel-height','--group-compact-align','--group-compact-item-size','--reel-gap','--reel-display','--reel-justify','--reel-align','--reel-item-size'];
          const mediaVars = ['--media-fit','--media-position','--media-ratio','--media-block-size','--object-fit','--object-position'];
          const browser = await chromium.launch({headless:true});
          const report = {base:process.env.BASE_SHA,candidate:process.env.CANDIDATE_SHA,cases:[],failures:[]};

          const settle = async (page,url) => {
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForLoadState('networkidle',{timeout:10000}).catch(()=>{});
            await page.evaluate(async()=>{
              await document.fonts?.ready;
              const activeDecodes = [...document.images]
                .filter((img) => img.currentSrc && img.complete)
                .map((img) => img.decode().catch(() => {}));
              await Promise.race([
                Promise.all(activeDecodes),
                new Promise((resolve) => setTimeout(resolve, 2000)),
              ]);
              for (const v of document.querySelectorAll('video')) { v.pause(); try { v.currentTime=0; } catch {} }
              window.scrollTo(0,0);
            });
            await page.waitForTimeout(300);
          };
          const snap = page => page.evaluate(({groupSelectors,mediaSelectors,groupProps,mediaProps,groupVars,mediaVars}) => {
            const round=n=>Math.round(n*1000)/1000;
            const attrs=el=>Object.fromEntries([...el.attributes].filter(a=>a.name.startsWith('data-')).map(a=>[a.name,a.value]));
            const one=(el,index,props,vars)=>{
              const s=getComputedStyle(el),r=el.getBoundingClientRect();
              const computed={}; for(const p of props) computed[p]=s[p];
              const variables={}; for(const v of vars) variables[v]=s.getPropertyValue(v).trim();
              const intrinsic = el instanceof HTMLImageElement ? {naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight,complete:el.complete,currentSrc:el.currentSrc} : el instanceof HTMLVideoElement ? {videoWidth:el.videoWidth,videoHeight:el.videoHeight,currentSrc:el.currentSrc} : null;
              return {index,tag:el.tagName,id:el.id,className:typeof el.className==='string'?el.className:'',data:attrs(el),rect:{x:round(r.x),y:round(r.y),width:round(r.width),height:round(r.height)},computed,variables,intrinsic};
            };
            const groups={}, media={};
            for(const selector of groupSelectors) groups[selector]=[...document.querySelectorAll(selector)].map((el,i)=>one(el,i,groupProps,groupVars));
            for(const selector of mediaSelectors) media[selector]=[...document.querySelectorAll(selector)].map((el,i)=>one(el,i,mediaProps,mediaVars));
            return {scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight,groups,media};
          },{groupSelectors,mediaSelectors,groupProps,mediaProps,groupVars,mediaVars});
          const diff=(a,b,path='root',out=[])=>{
            if(typeof a==='number'&&typeof b==='number'){if(Math.abs(a-b)>0.75)out.push({path,base:a,candidate:b});return out;}
            if(Array.isArray(a)||Array.isArray(b)){if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length){out.push({path,base:a,candidate:b});return out;} for(let i=0;i<a.length;i++)diff(a[i],b[i],`${path}[${i}]`,out);return out;}
            if(a&&b&&typeof a==='object'&&typeof b==='object'){for(const k of [...new Set([...Object.keys(a),...Object.keys(b)])].sort())diff(a[k],b[k],`${path}.${k}`,out);return out;}
            if(a!==b)out.push({path,base:a,candidate:b}); return out;
          };
          try {
            for(const vp of viewports){
              const bc=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'});
              const cc=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'});
              const bp=await bc.newPage(), cp=await cc.newPage();
              for(const route of routes){
                await Promise.all([settle(bp,'http://127.0.0.1:4172'+route),settle(cp,'http://127.0.0.1:4173'+route)]);
                const [base,candidate]=await Promise.all([snap(bp),snap(cp)]);
                const differences=diff(base,candidate);
                const key=`${vp.name}:${route}`;
                report.cases.push({key,differences});
                if(differences.length) report.failures.push({key,differences});
                console.log(`${differences.length?'FAIL':'PASS'} ${key} differences=${differences.length}`);
                if(differences.length) console.log(JSON.stringify(differences.slice(0,60),null,2));
              }
              await bc.close(); await cc.close();
            }
          } finally { await browser.close(); }
          await writeFile('/tmp/wave5c-parity.json',JSON.stringify(report,null,2)+'\n');
          if(report.failures.length) throw new Error(`Wave5C parity found ${report.failures.length} failing route/viewport case(s)`);
          console.log(`Wave5C parity passed ${report.cases.length}/${report.cases.length} cases.`);
          JS
          node "$GITHUB_WORKSPACE/wave5c-parity.mjs"
      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wave5c-parity-${{ github.sha }}
          retention-days: 7
          path: |
            /tmp/wave5c-parity.json
            /tmp/base.log
            /tmp/candidate.log
