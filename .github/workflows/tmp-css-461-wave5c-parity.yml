name: tmp-css-461-wave5c-parity

on:
  push:
    branches:
      - test/css-461-wave5c-parity-evidence

permissions:
  contents: read

env:
  BASE_SHA: b65325afe36b8e78f9d2a7108024ff17dd5b55f1
  CANDIDATE_SHA: e77689618682d6b7cb47d08bfbe17e4fa01ad7d3

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare exact refs and servers
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=30 origin "$BASE_SHA"
          git fetch --no-tags --depth=30 origin "$CANDIDATE_SHA"
          git worktree add --detach /tmp/base "$BASE_SHA"
          git worktree add --detach /tmp/candidate "$CANDIDATE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/base/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/candidate/node_modules
          (cd /tmp/base && npx vite --host 127.0.0.1 --port 4172 > /tmp/base.log 2>&1 &)
          (cd /tmp/candidate && npx vite --host 127.0.0.1 --port 4173 > /tmp/candidate.log 2>&1 &)
          for port in 4172 4173; do
            for i in $(seq 1 60); do
              curl --fail --silent "http://127.0.0.1:$port/" >/dev/null && break
              test "$i" -lt 60
              sleep 1
            done
          done
      - name: Diagnose authored reel height propagation
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/wave5c-diagnostic.mjs" <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const cases = [
            {name:'shootings-tablet', route:'/shootings/', width:900, height:1000},
            {name:'shootings-desktop', route:'/shootings/', width:1728, height:1000},
            {name:'styx-desktop', route:'/work/styx/', width:1728, height:1000},
          ];
          const browser = await chromium.launch({headless:true});
          const report = {base:process.env.BASE_SHA,candidate:process.env.CANDIDATE_SHA,cases:{}};

          async function inspect(port, spec) {
            const context = await browser.newContext({viewport:{width:spec.width,height:spec.height}, reducedMotion:'reduce'});
            const page = await context.newPage();
            await page.goto(`http://127.0.0.1:${port}${spec.route}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForLoadState('networkidle',{timeout:10000}).catch(()=>{});
            await page.evaluate(async()=>{ await document.fonts?.ready; for(const img of document.images){if(img.loading==='lazy')img.loading='eager';} });
            await page.waitForTimeout(350);
            const value = await page.evaluate(() => [...document.querySelectorAll('.media-group[data-layout="grid"][data-overflow="reel"]')].map((group,groupIndex)=>{
              const gs=getComputedStyle(group);
              return {
                groupIndex,
                className:group.className,
                style:group.getAttribute('style'),
                data:Object.fromEntries([...group.attributes].filter(a=>a.name.startsWith('data-')).map(a=>[a.name,a.value])),
                reelHeightInline:group.style.getPropertyValue('--group-reel-height'),
                reelHeightComputed:gs.getPropertyValue('--group-reel-height').trim(),
                groupWidth:group.getBoundingClientRect().width,
                surfaces:[...group.querySelectorAll('.media__surface')].map((surface,surfaceIndex)=>{
                  const ss=getComputedStyle(surface), rect=surface.getBoundingClientRect();
                  const media=surface.querySelector(':scope > img, :scope > video, :scope > picture > img');
                  const ms=media?getComputedStyle(media):null;
                  return {
                    surfaceIndex,
                    reelHeightComputed:ss.getPropertyValue('--group-reel-height').trim(),
                    blockSize:ss.blockSize,
                    inlineSize:ss.inlineSize,
                    aspectRatio:ss.aspectRatio,
                    mediaRatio:ss.getPropertyValue('--media-ratio').trim(),
                    objectFitVar:ss.getPropertyValue('--object-fit').trim(),
                    mediaFit:ss.getPropertyValue('--media-fit').trim(),
                    rect:{width:rect.width,height:rect.height},
                    src:media?.getAttribute('src')||'',
                    objectFit:ms?.objectFit||'',
                    objectPosition:ms?.objectPosition||'',
                    natural:media?{width:media.naturalWidth||media.videoWidth||0,height:media.naturalHeight||media.videoHeight||0}:null,
                  };
                }),
              };
            }));
            await context.close();
            return value;
          }

          try {
            for(const spec of cases){
              report.cases[spec.name]={
                base:await inspect(4172,spec),
                candidate:await inspect(4173,spec),
              };
              console.log(`CASE ${spec.name}`);
              console.log(JSON.stringify(report.cases[spec.name],null,2));
            }
          } finally { await browser.close(); }
          await writeFile('/tmp/wave5c-diagnostic.json',JSON.stringify(report,null,2)+'\n');
          JS
          node "$GITHUB_WORKSPACE/wave5c-diagnostic.mjs"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wave5c-root-cause-${{ github.sha }}
          retention-days: 7
          path: |
            /tmp/wave5c-diagnostic.json
            /tmp/base.log
            /tmp/candidate.log
