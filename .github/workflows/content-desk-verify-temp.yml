name: Content Desk temporary browser verification

on:
  push:
    branches:
      - agent/content-desk-20260903

permissions:
  contents: read

jobs:
  verify-content-desk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Content Desk desktop and mobile smoke
        run: npm run test:e2e:media-desk
