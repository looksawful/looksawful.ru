name: Setup pinned headless browser
description: Install the repository's pinned Playwright Chromium headless shell and verify it launches.

runs:
  using: composite
  steps:
    - name: Install pinned Chromium headless shell
      shell: bash
      run: npx playwright install --with-deps --only-shell chromium
    - name: Verify pinned browser launch
      shell: bash
      run: node tools/ci/browser-launch-probe.mjs
