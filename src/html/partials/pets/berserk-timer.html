<article class="pet-preview pet-preview--berserk" data-pet-preview="berserk-timer">
        <div class="pet-preview__inner">
          <div class="pet-preview__copy">
            <p class="pet-preview__eyebrow">pet project</p>
            <h2 class="pet-preview__title">berserk timer</h2>
            <p class="pet-preview__text">таймер и аудио-интерактив для жёсткой фокусировки: крупный заголовок, управление интенсивностью, внутренний слайдер состояний и быстрый переход к полной странице.</p>
          </div>
          <div class="berserk-widget" data-berserk-widget>
            <div class="berserk-widget__panel">
              <button class="berserk-widget__play" type="button" data-berserk-play aria-pressed="false">play</button>
              <label class="berserk-widget__range">
                <span>intensity</span>
                <input data-berserk-intensity type="range" min="0" max="100" value="62" />
              </label>
            </div>
            <div class="berserk-widget__meter" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="berserk-slider" data-berserk-slider>
              <button class="berserk-slide is-active" type="button" data-berserk-slide="0">
                <span class="berserk-slide__index">01</span>
                <span class="berserk-slide__title">focus</span>
                <span class="berserk-slide__text">собрать внимание в один короткий цикл</span>
              </button>
              <button class="berserk-slide" type="button" data-berserk-slide="1">
                <span class="berserk-slide__index">02</span>
                <span class="berserk-slide__title">pressure</span>
                <span class="berserk-slide__text">поднять темп без лишней интерфейсной обвязки</span>
              </button>
              <button class="berserk-slide" type="button" data-berserk-slide="2">
                <span class="berserk-slide__index">03</span>
                <span class="berserk-slide__title">finish</span>
                <span class="berserk-slide__text">довести сессию до конца и не потерять ритм</span>
              </button>
            </div>
          </div>
          <a class="pet-preview__link" href="/pets/berserk-timer/">открыть полностью</a>
        </div>
      </article>
