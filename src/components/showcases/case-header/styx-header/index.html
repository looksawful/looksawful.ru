<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Автономная секция Project Header для Jestei Pool и Styx." />
    <title>Styx Jewels — Project Header Preview</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" crossorigin href="./assets/index-DC1Qg0DW.css">
  </head>

  <body>
    <main class="project-headers" data-project-headers>
      <section class="project-header project-header--styx" data-project-header data-motion="ready">
        <article class="project-header__card ds-card ds-card--timeline">
          <figure
            class="project-header__logo ds-logo-stage"
            data-logo-stage
            data-logo-kind="styx"
            data-model-placeholder="true"
            aria-label="Styx Jewels logo"
          >
            <span class="project-header__logo-placeholder" data-logo-placeholder aria-hidden="true"></span>
            <img
              class="project-header__logo-fallback"
              data-logo-fallback
              src="./assets/styx-logo-Cd81Fp4W.svg"
              alt=""
              decoding="async"
            />
          </figure>

          <h1 class="project-header__wordmark project-header__wordmark--styx ds-wordmark" data-wordmark data-wordmark-state="loaded" aria-label="styx jewels">
            <img
              class="project-header__wordmark-image"
              data-wordmark-image
              src="./assets/styx-wordmark-DZR9b17e.svg"
              alt=""
              decoding="async"
            />
          </h1>

          <a class="project-header__action ds-pill ds-pill--action" href="#" aria-label="Перейти к Styx Jewels">
            Перейти ↗
          </a>

          <ul class="project-header__roles" aria-label="моя позиция в Styx Jewels">
            <li class="ds-pill ds-pill--chip">дизайнер</li>
            <li class="ds-pill ds-pill--chip">продюсер</li>
            <li class="ds-pill ds-pill--chip">фотограф</li>
          </ul>

          <div class="project-header__dates" aria-label="период работы">
            <time class="ds-timeline-date" datetime="2021">2021</time>
            <time class="ds-timeline-date" datetime="2025">2025</time>
          </div>

          <p class="project-header__summary">
            нишевый московский бренд украшений, аксессуаров и одежды, вдохновленный
            готической романтикой и лавкрафтовским ужасом.
          </p>
        </article>
      </section>


    </main>
  </body>
</html>
