media:
  - name: project-covers
    label: Обложки карточек проектов
    input: public/media/projects/index
    output: /media/projects/index
    rename: safe
    extensions: [webp]
    categories: [image]
    commit:
      templates:
        create: "media(cms): add project cover {filename}"
        update: "media(cms): update project cover {filename}"
        delete: "media(cms): delete project cover {filename}"
        rename: "media(cms): rename project cover {oldFilename} -> {newFilename}"

  - name: media-catalog
    label: Медиакаталог — фото и видео
    input: public/media/catalog
    output: /media/catalog
    rename: safe
    extensions: [avif, gif, jpeg, jpg, png, webp, m4v, mov, mp4, webm]
    categories: [image, video]
    commit:
      templates:
        create: "media(cms): upload catalog asset {filename}"
        update: "media(cms): update catalog asset {filename}"
        delete: "media(cms): delete catalog asset {filename}"
        rename: "media(cms): rename catalog asset {oldFilename} -> {newFilename}"

actions:
  - name: prepare-publication
    label: Подготовить публикацию
    workflow: pages-cms-publish.yml
    ref: prod
    cancelable: false
    confirm:
      title: Подготовить публикацию?
      message: Создаст или найдёт pull request из dev в prod. Сайт не будет опубликован автоматически.
      button: Подготовить

content:
  - name: navigation-labels
    label: Навигация
    type: file
    path: src/content/navigation.json
    format: json
    list: true
    operations:
      create: false
      rename: false
      delete: false
    commit:
      templates:
        update: "content(cms): update navigation labels"
    actions:
      - name: verify-navigation
        label: Проверить сайт
        workflow: verify-pr.yml
        ref: current
        confirm:
          title: Запустить полную проверку сайта?
          message: Будут проверены подписи навигации, TypeScript, сборка, локальные ссылки и browser smoke tests. Эта кнопка ничего не публикует.
          button: Проверить
    fields:
      - name: id
        label: ID
        type: string
        required: true
        readonly: true
        description: Стабильный технический ID пункта. Маршрут и положение в меню остаются в коде.
      - name: label
        label: Подпись
        type: string
        required: true
        description: Текст пункта в глобальном меню и связанных хлебных крошках.

  - name: project-cards
    label: Карточки проектов
    type: file
    path: src/content/projects.json
    format: json
    list: true
    operations:
      create: false
      rename: false
      delete: false
    commit:
      templates:
        update: "content(cms): update homepage project cards"
    actions:
      - name: verify-project-cards
        label: Проверить сайт
        workflow: verify-pr.yml
        ref: current
        confirm:
          title: Запустить полную проверку сайта?
          message: Будут проверены данные, TypeScript, сборка, локальные ссылки и browser smoke tests. Эта кнопка ничего не публикует.
          button: Проверить
    fields:
      - name: id
        label: ID
        type: string
        required: true
        readonly: true
        description: Служебный идентификатор карточки и часть стабильного routing-контракта. Не изменяется через CMS.
      - name: visible
        label: Показывать на главной
        type: boolean
        required: true
        description: Управляет только наличием карточки на главной. Маршрут и отдельная страница проекта остаются доступными.
      - name: title
        label: Название
        type: string
        description: Название проекта, которое показывается на карточке.
      - name: focus
        label: Описание
        type: text
        description: Короткое описание проекта на карточке. Это обычный текст без Markdown и HTML.
      - name: role
        label: Роль
        type: string
        description: Роль в проекте. Оставляй пустым только если карточка действительно не должна показывать роль.
      - name: period
        label: Период
        type: string
        description: Период работы в том виде, в котором он должен отображаться на сайте, например 2024–2026.
      - name: ariaLabel
        label: ARIA label
        type: string
        description: Необязательная доступная подпись ссылки карточки. Если поле пустое, сайт использует обычный текст карточки.
      - name: cover
        label: Обложка
        type: object
        required: true
        fields:
          - name: src
            label: Обложка проекта
            type: image
            required: true
            description: Выбери существующий WebP или загрузи новый. CMS имеет доступ только к папке обложек карточек проектов. После сохранения dev-проверка зарегистрирует файл и обновит responsive-варианты.
            options:
              media: project-covers
              extensions: [webp]
              categories: [image]
              rename: safe
          - name: alt
            label: Alt
            type: text
            description: Описывает содержание изображения для accessibility. Не дублируй название проекта без необходимости.
          - name: width
            label: Ширина
            type: number
            required: true
            description: Фактическая ширина исходного WebP в пикселях. После замены обложки обязательно проверь значение.
            options:
              min: 1
          - name: height
            label: Высота
            type: number
            required: true
            description: Фактическая высота исходного WebP в пикселях. После замены обложки обязательно проверь значение.
            options:
              min: 1

  - name: media-library
    label: Медиакаталог
    type: group
    items:
      - name: registered-media-catalog
        label: Существующие медиа
        type: collection
        path: src/content/media-catalog/registered
        format: json
        filename: "{id}.json"
        operations:
          create: false
          rename: false
          delete: false
        view:
          fields: [title, mediaType, date, id]
          primary: title
          sort: [title, date, mediaType]
          search: [title, id, date, tags, credits]
          default:
            sort: title
            order: asc
        commit:
          templates:
            update: "content(cms): update registered media metadata {path}"
        actions:
          - name: verify-registered-media-catalog
            label: Проверить медиакаталог
            scope: collection
            workflow: verify-pr.yml
            ref: current
            confirm:
              title: Проверить медиакаталог?
              message: Будут проверены все свойства, категории, теги, TypeScript, сборка и browser smoke tests. Эта кнопка ничего не публикует.
              button: Проверить
        fields:
          - name: id
            label: ID ассета
            type: string
            required: true
            readonly: true
            description: Стабильный ID общего media registry. Не изменяется через CMS.
          - name: mediaType
            label: Тип файла
            type: select
            required: true
            readonly: true
            options:
              values:
                - { name: image, label: Фото / изображение }
                - { name: video, label: Видео }
                - { name: model, label: 3D-модель }
          - name: src
            label: Файл
            type: string
            required: true
            readonly: true
            description: Текущий физический источник уже используемого ассета.
          - name: sourceSrc
            label: Исходный мастер видео
            type: string
            readonly: true
          - name: width
            label: Ширина, px
            type: number
            required: true
            readonly: true
          - name: height
            label: Высота, px
            type: number
            required: true
            readonly: true
          - name: durationSeconds
            label: Длительность, сек.
            type: number
            required: true
            readonly: true
          - name: mimeType
            label: MIME type
            type: string
            readonly: true
          - name: byteLength
            label: Размер, байт
            type: number
            required: true
            readonly: true
          - name: title
            label: Название в каталоге
            type: string
            required: true
            description: Короткое название самого ассета. Оно не заменяет текущие подписи на страницах проектов.
          - name: alt
            label: Alt по умолчанию
            type: text
            description: Базовое описание для будущего переиспользования. Текущие usage-specific alt остаются у MediaEntry.
          - name: description
            label: Описание
            type: text
          - name: date
            label: Год / период
            type: string
          - name: projectIds
            label: Проекты
            component: media-catalog-project-ids
            description: Один файл может относиться к нескольким проектам.
          - name: workAreaIds
            label: Направления
            component: media-catalog-work-area-ids
            description: Фото, продакшен, иллюстрации, графический дизайн, айдентика, моушен, 3D и смежные направления.
          - name: projectTypeIds
            label: Типы работы и съёмки
            component: media-catalog-project-type-ids
            description: Для съёмок доступны музыка, лукбук, каталог, кампейн и эдиториал.
          - name: deliverableIds
            label: Форматы и носители
            component: media-catalog-deliverable-ids
          - name: tags
            label: Свободные теги
            type: string
            list: true
            description: Произвольные поисковые теги. Каждый тег добавляется отдельной строкой.
          - name: credits
            label: Авторы и кредиты
            type: string
            list: true
          - name: reusable
            label: Можно переиспользовать
            type: boolean
            required: true
          - name: archived
            label: В архиве
            type: boolean
            required: true

      - name: uploaded-media-catalog
        label: Новые загрузки
        type: collection
        path: src/content/media-catalog/uploads
        format: json
        filename: "{id}.json"
        operations:
          create: true
          rename: false
          delete: true
        view:
          fields: [title, mediaType, date, id]
          primary: title
          sort: [title, date, mediaType]
          search: [title, id, date, tags, credits]
          default:
            sort: title
            order: asc
        commit:
          templates:
            create: "content(cms): register uploaded media {path}"
            update: "content(cms): update uploaded media metadata {path}"
            delete: "content(cms): remove uploaded media record {path}"
        actions:
          - name: verify-uploaded-media-catalog
            label: Проверить медиакаталог
            scope: collection
            workflow: verify-pr.yml
            ref: current
            confirm:
              title: Проверить новые медиа?
              message: Система сверит файлы, технические свойства, категории и теги, затем проверит сборку сайта. Эта кнопка ничего не публикует.
              button: Проверить
        fields:
          - name: id
            label: ID записи
            type: uuid
            required: true
            options:
              editable: false
            description: Генерируется автоматически. Общий asset ID получит безопасный префикс cms-.
          - name: mediaType
            label: Тип файла
            type: select
