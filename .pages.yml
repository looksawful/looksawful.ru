            label: Alt обложки
            type: text

  - name: project-card-media
    label: Карточки проектов — видимость и обложки
    type: file
    path: src/content/projects.json
    format: json
    list: true
    operations:
      create: false
      rename: false
      delete: false
    commit:
      templates:
        update: "content(cms): update homepage project card media"
    actions:
      - name: verify-project-card-media
        label: Проверить сайт
        workflow: ci-fast.yml
        ref: dev
        confirm:
          title: Запустить быструю проверку сайта?
          message: Будут проверены TypeScript, быстрые тесты и production build. Эта кнопка ничего не публикует.
          button: Проверить
    fields:
      - name: id
        label: ID
        type: string
        required: true
        hidden: true
        readonly: true
      - name: visible
        label: Показывать на главной
        type: boolean
        required: true
      - name: cover
        label: Обложка
        type: object
        required: true
        fields:
          - name: src
            label: Обложка проекта
            type: image
            required: true
            options:
              media: project-covers
              extensions: [webp]
              categories: [image]
              rename: safe
          - name: width
            label: Ширина
            type: number
            required: true
            options:
              min: 1
          - name: height
            label: Высота
            type: number
            required: true
            options:
              min: 1

  - name: media-library
    label: Медиакаталог
    type: group
    items:
      - name: registered-media-catalog
        label: Существующие медиа
        type: collection
        path: src/content/media-catalog/registered
        format: json
        filename: "{id}.json"
        operations:
          create: false
          rename: false
          delete: false
        view:
          fields: [title, date]
          primary: title
          sort: [title, date]
          search: [title, id, date, tags, credits]
          default:
            sort: title
            order: asc
        commit:
          templates:
            update: "content(cms): update registered media metadata {path}"
        actions:
          - name: verify-registered-media-catalog
            label: Проверить медиакаталог
            scope: collection
            workflow: ci-fast.yml
            ref: dev
            confirm:
              title: Проверить медиакаталог?
              message: Будут проверены свойства, категории, теги, TypeScript, сборка и быстрые тесты и production build. Эта кнопка ничего не публикует.
              button: Проверить
        fields:
          - name: id
            label: ID ассета
            type: string
            required: true
            hidden: true
            readonly: true
          - name: title
            label: Название в каталоге
            type: string
            required: true
            description: Короткое библиотечное название ассета.
          - name: alt
            label: Alt по умолчанию
            type: text
            description: Базовое описание для переиспользования. Usage-specific alt остаётся у MediaEntry.
          - name: description
            label: Описание
            type: text
          - name: date
            label: Год / период по умолчанию
            type: string
          - name: workAreaIds
            label: Направления
            component: media-catalog-work-area-ids
            description: Библиотечная классификация. Контекст конкретного использования может быть уточнён на MediaEntry.
          - name: projectTypeIds
            label: Типы работы и съёмки
            component: media-catalog-project-type-ids
          - name: deliverableIds
            label: Форматы и носители
            component: media-catalog-deliverable-ids
          - name: tags
            label: Свободные теги
            type: string
            list: true
            description: Библиотечные поисковые теги.
          - name: credits
            label: Авторы и кредиты по умолчанию
            type: string
            list: true
          - name: showInCatalog
            label: Показывать в галерее
            type: boolean
            default: false
          - name: reusable
            label: Можно переиспользовать
            type: boolean
            required: true
          - name: archived
            label: В архиве
            type: boolean
            required: true

      - name: uploaded-media-catalog
        label: Новые загрузки
        type: collection
        path: src/content/media-catalog/uploads
        format: json
        filename: "{id}.json"
        operations:
          create: true
          rename: false
          delete: true
        view:
          fields: [title, mediaType, date]
          primary: title
          sort: [title, date, mediaType]
          search: [title, id, date, tags, credits]
          default:
            sort: title
            order: asc
        commit:
          templates:
            create: "content(cms): register uploaded media {path}"
            update: "content(cms): update uploaded media metadata {path}"
            delete: "content(cms): remove uploaded media record {path}"
        actions:
          - name: verify-uploaded-media-catalog
            label: Проверить медиакаталог
            scope: collection
            workflow: ci-fast.yml
            ref: dev
            confirm:
              title: Проверить новые медиа?
              message: Система сверит файлы, технические свойства, категории и теги, затем проверит сборку сайта. Эта кнопка ничего не публикует.
              button: Проверить
        fields:
          - name: id
            label: ID записи
            type: uuid
            required: true
            hidden: true
            options:
              editable: false
          - name: mediaType
            label: Тип файла
            type: select
            required: true
            default: image
            options:
              values:
                - { name: image, label: Фото / изображение }
                - { name: video, label: Видео }
          - name: src
            label: Фото или видео
            type: file
            required: true
            options:
              media: media-catalog
              categories: [image, video]
              extensions: [avif, gif, jpeg, jpg, png, webp, m4v, mov, mp4, webm]
              rename: safe
            description: Выбери загруженный файл или загрузи новый. После сохранения dev-проверка сама определит технические свойства.
          - name: deliverySrc
            label: Оптимизированный видеофайл
            type: string
            hidden: true
            readonly: true
            default: ""
          - name: posterSrc
            label: Постер видео
            type: image
            default: ""
            options:
              media: media-catalog
              categories: [image]
              extensions: [avif, gif, jpeg, jpg, png, webp]
              rename: safe
          - name: width
