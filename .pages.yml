settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "content(cms): create {path}"
      update: "content(cms): update {path}"
      delete: "content(cms): delete {path}"
      rename: "content(cms): rename {oldPath} -> {newPath}"

media:
  - name: project-covers
    label: Обложки карточек проектов
    input: public/media/projects/index
    output: /media/projects/index
    rename: safe
    extensions: [webp]
    categories: [image]
    commit:
      templates:
        create: "media(cms): add project cover {filename}"
        update: "media(cms): update project cover {filename}"
        delete: "media(cms): delete project cover {filename}"
        rename: "media(cms): rename project cover {oldFilename} -> {newFilename}"

actions:
  - name: prepare-publication
    label: Подготовить публикацию
    workflow: pages-cms-publish.yml
    ref: current
    cancelable: false
    confirm:
      title: Подготовить публикацию?
      message: Создаст или найдёт pull request из dev в prod. Сайт не будет опубликован автоматически.
      button: Подготовить

content:
  - name: navigation-labels
    label: Навигация
    type: file
    path: src/content/navigation.json
    format: json
    list: true
    operations:
      create: false
      rename: false
      delete: false
    commit:
      templates:
        update: "content(cms): update navigation labels"
    actions:
      - name: verify-navigation
        label: Проверить сайт
        workflow: verify-pr.yml
        ref: current
        confirm:
          title: Запустить полную проверку сайта?
          message: Будут проверены подписи навигации, TypeScript, сборка, локальные ссылки и browser smoke tests. Эта кнопка ничего не публикует.
          button: Проверить
    fields:
      - name: id
        label: ID
        type: string
        required: true
        readonly: true
        description: Стабильный технический ID пункта. Маршрут и положение в меню остаются в коде.
      - name: label
        label: Подпись
        type: string
        required: true
        description: Текст пункта в глобальном меню и связанных хлебных крошках.

  - name: project-cards
    label: Карточки проектов
    type: file
    path: src/content/projects.json
    format: json
    list: true
    operations:
      create: false
      rename: false
      delete: false
    commit:
      templates:
        update: "content(cms): update homepage project cards"
    actions:
      - name: verify-project-cards
        label: Проверить сайт
        workflow: verify-pr.yml
        ref: current
        confirm:
          title: Запустить полную проверку сайта?
          message: Будут проверены данные, TypeScript, сборка, локальные ссылки и browser smoke tests. Эта кнопка ничего не публикует.
          button: Проверить
    fields:
      - name: id
        label: ID
        type: string
        required: true
        readonly: true
        description: Служебный идентификатор карточки и часть стабильного routing-контракта. Не изменяется через CMS.
      - name: visible
        label: Показывать на главной
        type: boolean
        required: true
        description: Управляет только наличием карточки на главной. Маршрут и отдельная страница проекта остаются доступными.
      - name: title
        label: Название
        type: string
        required: true
        description: Название проекта, которое показывается на карточке.
      - name: focus
        label: Описание
        type: text
        required: true
        description: Короткое описание проекта на карточке. Это обычный текст без Markdown и HTML.
      - name: role
        label: Роль
        type: string
        description: Роль в проекте. Оставляй пустым только если карточка действительно не должна показывать роль.
      - name: period
        label: Период
        type: string
        description: Период работы в том виде, в котором он должен отображаться на сайте, например 2024–2026.
      - name: ariaLabel
        label: ARIA label
        type: string
        description: Необязательная доступная подпись ссылки карточки. Если поле пустое, сайт использует обычный текст карточки.
      - name: cover
        label: Обложка
        type: object
        required: true
        fields:
          - name: src
            label: Обложка проекта
            type: image
            required: true
            description: Выбери существующий WebP или загрузи новый. CMS имеет доступ только к папке обложек карточек проектов. После сохранения dev-проверка зарегистрирует файл и обновит responsive-варианты.
            options:
              media: project-covers
              extensions: [webp]
              categories: [image]
              rename: safe
          - name: alt
            label: Alt
            type: text
            required: true
            description: Описывает содержание изображения для accessibility. Не дублируй название проекта без необходимости.
          - name: width
            label: Ширина
            type: number
            required: true
            description: Фактическая ширина исходного WebP в пикселях. После замены обложки обязательно проверь значение.
            options:
              min: 1
          - name: height
            label: Высота
            type: number
            required: true
            description: Фактическая высота исходного WebP в пикселях. После замены обложки обязательно проверь значение.
            options:
              min: 1

  - name: cases
    label: Кейсы
    type: group
    items:
      - name: jestei-case
        label: Jestei Pool
        type: file
        path: src/content/cases/jestei-pool.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        commit:
          templates:
            update: "content(cms): update Jestei editorial copy"
        actions:
          - name: verify-jestei-case
            label: Проверить сайт
            workflow: verify-pr.yml
            ref: current
            confirm:
              title: Запустить полную проверку сайта?
              message: Будут проверены Jestei-данные, TypeScript, сборка и browser smoke tests. Эта кнопка ничего не публикует.
              button: Проверить
        fields:
          - name: role
            label: Роль
            type: string
            required: true
            description: Отображаемая роль в шапке Jestei Pool. Логотипы и техническая идентичность проекта остаются в коде.
          - name: period
            label: Период
            type: string
            required: true
            description: Период работы в том виде, в котором он отображается в шапке проекта.
          - name: lead
            label: Вводный текст
            type: text
            required: true
            description: Вводный текст Jestei Pool. Логотипы, маршрут и композиция остаются в коде.
          - name: sections
            label: Тексты разделов
            type: object
            required: true
            list:
              min: 7
              max: 7
              collapsible:
                collapsed: true
                summary: "{title}"
            description: Семь фиксированных текстовых разделов. Их порядок определяется кодом; layout и runtime через CMS не редактируются.
            fields:
              - name: id
                label: ID
                type: string
                required: true
                readonly: true
              - name: title
                label: Заголовок
                type: string
                required: true
              - name: paragraphs
                label: Абзацы
                type: text
                required: true
                list:
                  min: 1
          - name: overlays
            label: Тексты карточек бренд-системы
            type: object
            required: true
            list:
              min: 6
              max: 6
              collapsible:
                collapsed: true
                summary: "{id}"
            description: Только текст шести существующих hover-карточек. Media, surface, caption, layout и hover-механика остаются в TypeScript.
            fields:
              - name: id
                label: ID
                type: string
                required: true
                readonly: true
              - name: text
                label: Текст
                type: text
                required: true

      - name: styx-case
        label: Styx
        type: file
        path: src/content/cases/styx.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        commit:
          templates:
            update: "content(cms): update Styx editorial copy"
        actions:
          - name: verify-styx-case
            label: Проверить сайт
            workflow: verify-pr.yml
            ref: current
            confirm:
              title: Запустить полную проверку сайта?
              message: Будут проверены Styx-данные, TypeScript, сборка и browser smoke tests. Эта кнопка ничего не публикует.
              button: Проверить
        fields:
          - name: role
            label: Роль
            type: string
            required: true
            description: Отображаемая роль в шапке Styx. Логотип и техническая идентичность проекта остаются в коде.
          - name: period
            label: Период
            type: string
            required: true
            description: Период работы в том виде, в котором он отображается в шапке проекта.
          - name: lead
            label: Вводный текст
            type: text
            required: true
            description: Текст вводного абзаца Styx. Логотип, маршрут и композиция остаются в коде.
          - name: sections
            label: Тексты разделов
            type: object
            required: true
            list:
              min: 5
              max: 5
              collapsible:
                collapsed: true
                summary: "{title}"
            description: Пять фиксированных текстовых разделов. Их порядок на сайте определяется кодом, а не порядком в CMS.
            fields:
              - name: id
                label: ID
                type: string
                required: true
                readonly: true
                description: Стабильный ID раздела. Не изменяется через CMS.
              - name: title
                label: Заголовок
                type: string
                required: true
              - name: paragraphs
                label: Абзацы
                type: text
                required: true
                list:
                  min: 1
                description: Обычный текст. Media, layout, классы и runtime остаются в TypeScript.
          - name: credits
            label: Подписи серий
            type: object
            required: true
            list:
              min: 3
              max: 3
              collapsible:
                collapsed: true
                summary: "{title}"
            description: Редактируемые заголовки трёх существующих серий; media и порядок остаются в коде.
            fields:
              - name: id
                label: ID
                type: string
                required: true
                readonly: true
                description: Стабильный ID подписи. Не изменяется через CMS.
              - name: title
                label: Подпись
                type: string
                required: true

      - name: sensetique-case
        label: Sensetique
        type: file
        path: src/content/cases/sensetique.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        commit:
          templates:
            update: "content(cms): update Sensetique editorial copy"
        actions:
          - name: verify-sensetique-case
            label: Проверить сайт
            workflow: verify-pr.yml
            ref: current
            confirm:
              title: Запустить полную проверку сайта?
              message: Будут проверены Sensetique-данные, TypeScript, сборка и browser smoke tests. Эта кнопка ничего не публикует.
              button: Проверить
        fields:
          - name: intro
            label: Вводные данные
            type: object
            required: true
            fields:
              - name: role
                label: Роль
                type: string
                required: true
              - name: period
                label: Период
                type: string
                required: true
              - name: lead
                label: Вводный текст
                type: text
                required: true
          - name: sections
            label: Тексты разделов
            type: object
            required: true
            list:
              min: 2
              max: 2
              collapsible:
                collapsed: true
                summary: "{title}"
            description: Два фиксированных текстовых раздела. Их порядок на сайте определяется кодом.
            fields:
              - name: id
                label: ID
                type: string
                required: true
                readonly: true
              - name: title
                label: Заголовок
                type: string
                required: true
              - name: paragraphs
                label: Абзацы
                type: text
                required: true
                list:
                  min: 1
          - name: credits
            label: Кредиты и подписи серий
            type: object
            required: true
            list:
              min: 22
              max: 22
              collapsible:
                collapsed: true
                summary: "{id}"
            description: Фиксированные подписи существующих серий. Хотя бы title или lines должны оставаться заполненными; media и порядок остаются в коде.
            fields:
              - name: id
                label: ID
                type: string
                required: true
                readonly: true
              - name: title
                label: Заголовок
                type: string
              - name: lines
                label: Строки кредитов
                type: string
                list: true
          - name: notes
            label: Редакторские примечания
            type: object
            required: true
            list:
              min: 2
              max: 2
              collapsible:
                collapsed: true
                summary: "{id}"
            fields:
              - name: id
                label: ID
                type: string
                required: true
                readonly: true
              - name: text
                label: Текст
                type: text
                required: true

  - name: shootings
    label: Съёмки
    type: group
    items:
