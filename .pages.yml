        type: object
        required: true
        fields:
          - name: title
            label: Название
            type: string
          - name: focus
            label: Описание
            type: text
          - name: role
            label: Роль
            type: string
          - name: period
            label: Период
            type: string
          - name: ariaLabel
            label: ARIA label
            type: string
          - name: coverAlt
            label: Alt обложки
            type: text
      - name: sensetique
        label: sensetique
        type: object
        required: true
        fields:
          - name: title
            label: Название
            type: string
          - name: focus
            label: Описание
            type: text
          - name: role
            label: Роль
            type: string
          - name: period
            label: Период
            type: string
          - name: ariaLabel
            label: ARIA label
            type: string
          - name: coverAlt
            label: Alt обложки
            type: text
      - name: shootings
        label: shootings
