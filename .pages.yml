media:
  - name: project-covers
    label: Обложки карточек проектов
    input: public/media/projects/index
    output: /media/projects/index
    rename: safe
    extensions: [webp]
    categories: [image]
    commit:
      templates:
        create: "media(cms): add project cover {filename}"
        update: "media(cms): update project cover {filename}"
        delete: "media(cms): delete project cover {filename}"
        rename: "media(cms): rename project cover {oldFilename} -> {newFilename}"

  - name: media-catalog
    label: Медиакаталог — фото и видео
    input: public/media/catalog
    output: /media/catalog
    rename: safe
    extensions: [avif, gif, jpeg, jpg, png, webp, m4v, mov, mp4, webm]
    categories: [image, video]
    commit:
      templates:
        create: "media(cms): upload catalog asset {filename}"
        update: "media(cms): update catalog asset {filename}"
        delete: "media(cms): delete catalog asset {filename}"
        rename: "media(cms): rename catalog asset {oldFilename} -> {newFilename}"

actions:
  - name: prepare-publication
    label: Подготовить публикацию
    workflow: pages-cms-publish.yml
    ref: prod
    cancelable: false
    confirm:
      title: Подготовить публикацию?
      message: Создаст или найдёт pull request из dev в prod. Сайт не будет опубликован автоматически.
      button: Подготовить

content:
  - name: navigation-labels
    label: Навигация
    type: file
    path: src/content/navigation.json
    format: json
    list: true
    operations:
      create: false
      rename: false
      delete: false
    commit:
      templates:
        update: "content(cms): update navigation labels"
    actions:
      - name: verify-navigation
        label: Проверить сайт
        workflow: ci-fast.yml
        ref: dev
        confirm:
          title: Запустить быструю проверку сайта?
          message: Будут проверены подписи навигации, TypeScript, сборка, локальные ссылки и быстрые тесты и production build. Эта кнопка ничего не публикует.
          button: Проверить
    fields:
      - name: id
        label: ID
        type: string
        required: true
        hidden: true
        readonly: true
      - name: label
        label: Подпись
        type: string
        required: true
        description: Текст пункта в глобальном меню и связанных хлебных крошках.

  - name: project-cards
    label: Карточки проектов — тексты
    type: file
    path: src/content/editorial/home-project-cards.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    commit:
      templates:
        update: "content(cms): update homepage project card copy"
    actions:
      - name: verify-project-card-copy
        label: Проверить сайт
        workflow: ci-fast.yml
        ref: dev
        confirm:
          title: Запустить быструю проверку сайта?
          message: Будут проверены TypeScript, быстрые тесты и production build. Эта кнопка ничего не публикует.
          button: Проверить
    fields:
      - name: jestei
        label: jestei
        type: object
