<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Text Review · Round 2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f4f1;color:#111}
button,input,textarea{font:inherit}button{cursor:pointer}
main{max-width:980px;margin:auto;padding:18px 14px 110px}
.login{max-width:420px;margin:16vh auto 0;background:#fff;border:1px solid #d6d6d0;border-radius:16px;padding:22px}
.login h1{font-size:22px;margin:0 0 8px}.login p{margin:0 0 16px;color:#666}
.login input{width:100%;padding:13px 14px;border:1px solid #ccc;border-radius:11px;outline:none}
.login input:focus{border-color:#111;box-shadow:0 0 0 1px #111}
.login button{width:100%;margin-top:9px;padding:13px;border:0;border-radius:11px;background:#111;color:#fff}
.error{min-height:20px;margin-top:9px;color:#a00;font-size:13px}
.top{position:sticky;top:0;z-index:5;background:#f4f4f1ee;backdrop-filter:blur(12px);display:grid;grid-template-columns:1fr auto;gap:6px 18px;padding:12px 0}
.meta{min-width:0}.meta strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta span,.count{font-size:12px;color:#666}
.progress{grid-column:1/-1;height:2px;background:#d8d8d3}.progress i{display:block;height:100%;background:#111}
.sheet{margin-top:14px;background:#fff;border:1px solid #d6d6d0;border-radius:18px;padding:20px}
.kicker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.badge{display:inline-flex;align-items:center;min-height:24px;padding:3px 8px;border:1px solid #d8d8d2;border-radius:999px;font-size:11px;color:#666}
.badge.dark{border-color:#111;color:#111}.badge.warn{border-color:#a86b00;color:#7a4d00;background:#fff8e7}
h1{font-size:clamp(22px,4vw,34px);line-height:1.12;margin:0 0 18px}
.block{border-top:1px solid #e4e4df;padding-top:16px;margin-top:16px}
.block:first-of-type{border-top:0;padding-top:0;margin-top:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#777;margin-bottom:8px}
.copy{font-size:clamp(17px,2.5vw,24px);line-height:1.38;white-space:pre-wrap;overflow-wrap:anywhere}
.provenance{margin-top:8px;font-size:12px;color:#777;overflow-wrap:anywhere}
.compare-source{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.source-box,.evidence{padding:14px;border:1px solid #ddd;border-radius:12px;background:#fafaf8}
.evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.options{display:grid;gap:10px;margin-top:20px}
.option{width:100%;text-align:left;padding:15px;border:1px solid #d6d6d0;border-radius:14px;background:#fff;color:#111}
.option:hover{border-color:#999}.option.selected{border-color:#111;box-shadow:0 0 0 1px #111}.option:disabled{cursor:default;opacity:.55}
.option-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.option-title{font-weight:650}.option-id{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.05em}
.option-copy{margin-top:8px;font-size:17px;line-height:1.4;white-space:pre-wrap}
.reasons{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.reason{font-size:11px;border:1px solid #ddd;border-radius:999px;padding:2px 7px;color:#666}
.explain{margin-top:8px;font-size:12px;color:#666}
.blocked{margin-top:8px;font-size:12px;color:#7a4d00}
.custom-toggle{border:0;background:transparent;padding:14px 0 4px;color:#666;text-decoration:underline;text-underline-offset:4px}
.custom-panel{display:none;margin-top:10px}.custom-panel.open{display:block}
textarea{width:100%;min-height:140px;padding:14px;border:1px solid #ccc;border-radius:12px;resize:vertical;background:#fff;outline:none}
textarea:focus{border-color:#111;box-shadow:0 0 0 1px #111}
.save-custom{margin-top:8px;padding:12px 14px;border:0;border-radius:10px;background:#111;color:#fff}
.footer{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:grid;grid-template-columns:44px minmax(190px,auto) 44px;gap:8px;align-items:center;background:#fff;border:1px solid #d6d6d0;border-radius:15px;padding:7px;box-shadow:0 8px 30px #0001}
.nav{width:44px;height:40px;border:0;border-radius:9px;background:#efefec;font-size:20px}.nav:disabled{opacity:.3}
.status{text-align:center;font-size:12px;color:#666;padding:0 8px}
@media(max-width:700px){main{padding:10px 10px 100px}.sheet{padding:16px;border-radius:14px}.compare-source,.evidence-grid{grid-template-columns:1fr}.footer{width:calc(100% - 20px);grid-template-columns:44px 1fr 44px}.login{margin-top:10vh}.option-copy{font-size:16px}}
</style>
</head>
<body>
<main id="root"></main>
<script>
const API='https://japsjwgnoeaeetlhshje.supabase.co/functions/v1/text-review-v2';
const root=document.getElementById('root');
let key=localStorage.getItem('looksawful-text-review-key')||'';
let state={items:[],answers:{},progress:{answered:0,total:0},round:null};
let index=0,customOpen=false,saving=false;

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function call(method,body){
  const r=await fetch(API,{method,headers:{'content-type':'application/json','x-review-key':key},body:body?JSON.stringify(body):undefined});
  if(r.status===401)throw new Error('auth');
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}

function login(msg=''){
  root.innerHTML='<section class="login"><h1>Тексты looksawful.ru · Round 2</h1><p>Введи код доступа.</p><input id="pin" type="password" autocomplete="current-password" placeholder="Код доступа"><button id="go">Открыть</button><div class="error">'+esc(msg)+'</div></section>';
  const go=async()=>{
    key=document.getElementById('pin').value.trim();
    try{
      state=await call('GET');
      localStorage.setItem('looksawful-text-review-key',key);
      const first=state.items.findIndex(x=>!state.answers[x.id]);
      index=first>=0?first:Math.max(0,state.items.length-1);
      render();
    }catch(e){
      key='';localStorage.removeItem('looksawful-text-review-key');
      login(e.message==='auth'?'Неверный код.':'Ошибка соединения.');
    }
  };
  document.getElementById('go').onclick=go;
  document.getElementById('pin').onkeydown=e=>{if(e.key==='Enter')go()};
}

function nextUnanswered(from){
  const items=state.items;
  for(let n=1;n<=items.length;n++){
    const i=(from+n)%items.length;
    if(!state.answers[items[i].id])return i;
  }
  return Math.min(from+1,items.length-1);
}

function renderCurrent(item){
  if(item.kind==='fact'){
    const evidence=(item.evidence||[]).map(x=>'<div class="evidence"><div class="label">'+esc(x.label)+'</div><div class="copy">'+esc(x.text)+'</div><div class="provenance">'+esc(x.provenance)+'</div></div>').join('');
    return '<div class="block"><div class="label">Проверка факта</div><div class="evidence-grid">'+evidence+'</div></div>';
  }
  const current=item.current||{};
  if(current.sourceMismatch){
    return '<div class="block"><div class="label">Текущий текст · расхождение</div><div class="compare-source">'+
      '<div class="source-box"><div class="label">На сайте</div><div class="copy">'+esc(current.production)+'</div><div class="provenance">'+esc(current.productionProvenance)+'</div></div>'+
      '<div class="source-box"><div class="label">В исходнике</div><div class="copy">'+esc(current.source)+'</div><div class="provenance">'+esc(current.sourceProvenance)+'</div></div>'+
    '</div></div>';
  }
  return '<div class="block"><div class="label">Сейчас</div><div class="copy">'+esc(current.production)+'</div>'+
    '<div class="provenance">'+esc(current.productionProvenance)+' · '+esc(current.sourceProvenance)+'</div></div>';
}

function renderOption(item,option,answer){
  const selected=answer?.option_id===option.id;
  const reasons=(option.reasons||[]).map(x=>'<span class="reason">'+esc(x)+'</span>').join('');
  const blocked=selected&&answer?.application_blocked?'<div class="blocked">'+esc(answer.blocked_reason||'Нужно подтвердить факт.')+'</div>':'';
  return '<button class="option '+(selected?'selected':'')+'" data-option="'+esc(option.id)+'">'+
    '<div class="option-head"><span class="option-title">'+esc(option.label)+'</span><span class="option-id">'+esc(option.id)+'</span></div>'+
    '<div class="option-copy">'+esc(option.text)+'</div>'+
    (reasons?'<div class="reasons">'+reasons+'</div>':'')+
    (option.explanation?'<div class="explain">'+esc(option.explanation)+'</div>':'')+
    blocked+
  '</button>';
}

function render(){
  const items=state.items||[];
  if(!items.length){root.textContent='Нет пунктов.';return}
  const item=items[index],answer=state.answers[item.id]||null;
  const done=state.progress?.answered||Object.keys(state.answers||{}).length;
  const total=state.progress?.total||items.length;
  const pct=total?Math.round(done/total*100):0;
  const badges=[
    '<span class="badge dark">'+esc(item.pageLabel)+'</span>',
    '<span class="badge">'+esc(item.kind==='fact'?'Проверка факта':item.role)+'</span>',
    answer?.inherited?'<span class="badge">Решено в Round 1</span>':'',
    answer?.application_blocked?'<span class="badge warn">Нужно подтвердить</span>':''
  ].join('');
  const options=(item.options||[]).map(o=>renderOption(item,o,answer)).join('');
  const customText=answer?.option_id==='custom'?(answer.custom_text||''):'';

  root.innerHTML='<header class="top"><div class="meta"><strong>'+esc(item.label)+'</strong><span>'+esc(state.round?.label||'Round 2')+'</span></div><div class="count">'+(index+1)+' / '+items.length+'</div><div class="progress"><i style="width:'+pct+'%"></i></div></header>'+
  '<section class="sheet"><div class="kicker">'+badges+'</div><h1>'+esc(item.section)+'</h1>'+
  renderCurrent(item)+
  '<div class="options">'+options+'</div>'+
  (item.allowCustom?'<button class="custom-toggle" id="custom-toggle">Свой вариант</button><div class="custom-panel '+(customOpen||answer?.option_id==='custom'?'open':'')+'"><textarea id="custom-text" placeholder="Напиши свой вариант…">'+esc(customText)+'</textarea><button class="save-custom" id="save-custom">Сохранить свой вариант</button></div>':'')+
  '</section>'+
  '<footer class="footer"><button class="nav" id="prev" '+(index===0?'disabled':'')+'>←</button><div class="status" id="status">'+(answer?'Сохранено':'Не решено')+' · '+done+'/'+total+'</div><button class="nav" id="next" '+(index===items.length-1?'disabled':'')+'>→</button></footer>';

  document.querySelectorAll('.option').forEach(b=>b.onclick=()=>saveOption(b.dataset.option));
  const toggle=document.getElementById('custom-toggle');
  if(toggle)toggle.onclick=()=>{customOpen=!customOpen;render();if(customOpen)setTimeout(()=>document.getElementById('custom-text')?.focus(),0)};
  const custom=document.getElementById('save-custom');
  if(custom)custom.onclick=saveCustom;
  document.getElementById('prev').onclick=()=>{if(index>0){index--;customOpen=false;render()}};
  document.getElementById('next').onclick=()=>{if(index<items.length-1){index++;customOpen=false;render()}};
}

async function reloadAfterSave(currentIndex){
  state=await call('GET');
  if(state.progress.answered<state.progress.total)index=nextUnanswered(currentIndex);
  customOpen=false;
  render();
}

async function saveOption(optionId){
  if(saving)return;saving=true;
  const item=state.items[index],status=document.getElementById('status');
  if(status)status.textContent='Сохраняю…';
  try{
    await call('POST',{item_id:item.id,option_id:optionId,custom_text:''});
    await reloadAfterSave(index);
  }catch(e){
    if(e.message==='auth')return login('Код устарел.');
    if(status)status.textContent='Ошибка сохранения';
  }finally{saving=false}
}

async function saveCustom(){
  const ta=document.getElementById('custom-text'),text=ta?.value.trim()||'';
  if(!text)return ta?.focus();
  if(saving)return;saving=true;
  const item=state.items[index],status=document.getElementById('status');
  if(status)status.textContent='Сохраняю…';
  try{
    await call('POST',{item_id:item.id,option_id:'custom',custom_text:text});
    await reloadAfterSave(index);
  }catch(e){
    if(e.message==='auth')return login('Код устарел.');
    if(status)status.textContent='Ошибка сохранения';
  }finally{saving=false}
}

document.addEventListener('keydown',e=>{
  if(!key||['TEXTAREA','INPUT'].includes(e.target?.tagName))return;
  const item=state.items[index];
  if(e.key>='1'&&e.key<='9'){
    const option=item?.options?.[Number(e.key)-1];
    if(option)saveOption(option.id);
  }
  if(e.key.toLowerCase()==='c'){customOpen=true;render();setTimeout(()=>document.getElementById('custom-text')?.focus(),0)}
  if(e.key==='ArrowLeft'&&index>0){index--;customOpen=false;render()}
  if(e.key==='ArrowRight'&&index<state.items.length-1){index++;customOpen=false;render()}
});

(async()=>{
  if(!key)return login();
  try{
    state=await call('GET');
    const first=state.items.findIndex(x=>!state.answers[x.id]);
    index=first>=0?first:Math.max(0,state.items.length-1);
    render();
  }catch{login()}
})();
</script>
</body>
</html>
