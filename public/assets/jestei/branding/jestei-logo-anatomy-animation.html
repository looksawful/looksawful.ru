<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jestei Pool — logo anatomy animation</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
  body{display:grid;place-items:center}
  .stage{position:relative;width:100%;height:100%;overflow:hidden;background:#fff}
  .art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;transform-origin:center center;will-change:transform;animation:camera 31s cubic-bezier(.65,0,.35,1) infinite}
  .veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 46%,rgba(255,255,255,0) 0 34%,rgba(255,255,255,.13) 62%,rgba(255,255,255,.28) 100%);opacity:.24}
  @keyframes camera{
    0%,8%{transform:scale(.985) translate3d(0,0,0)}
    12%,20%{transform:scale(1.34) translate3d(-1.5%,6%,0)}
    24%,32%{transform:scale(1.62) translate3d(13%,7%,0)}
    36%,44%{transform:scale(1.64) translate3d(17%,-4%,0)}
    48%,56%{transform:scale(1.66) translate3d(-17%,-1%,0)}
    60%,68%{transform:scale(1.66) translate3d(-18%,11%,0)}
    72%,80%{transform:scale(1.58) translate3d(15%,11%,0)}
    84%,92%{transform:scale(1.38) translate3d(0,-15%,0)}
    96%,100%{transform:scale(.985) translate3d(0,0,0)}
  }
  @media (max-width:700px){
    .art{animation-duration:34s}
    @keyframes camera{
      0%,8%{transform:scale(.96) translate3d(0,0,0)}
      12%,20%{transform:scale(1.28) translate3d(-1%,6%,0)}
      24%,32%{transform:scale(1.48) translate3d(11%,7%,0)}
      36%,44%{transform:scale(1.50) translate3d(13%,-3%,0)}
      48%,56%{transform:scale(1.50) translate3d(-13%,-1%,0)}
      60%,68%{transform:scale(1.50) translate3d(-14%,10%,0)}
      72%,80%{transform:scale(1.44) translate3d(12%,10%,0)}
      84%,92%{transform:scale(1.28) translate3d(0,-13%,0)}
      96%,100%{transform:scale(.96) translate3d(0,0,0)}
    }
  }
  @media (prefers-reduced-motion:reduce){.art{animation:none;transform:none}}
</style>
</head>
<body>
  <div class="stage">
    <img class="art" src="/assets/media/cases/jesteipool/01-logo/02/01.webp" alt="" decoding="async">
    <div class="veil" aria-hidden="true"></div>
  </div>
<script>
  const signal=()=>parent.postMessage({type:'jestei-logo-animation-ready'},location.origin);
  const image=document.querySelector('.art');
  if(image.complete)requestAnimationFrame(signal);else image.addEventListener('load',()=>requestAnimationFrame(signal),{once:true});
</script>
</body>
</html>
