.variant-tabs {
  display: flex;

[data-media-marquee-track],

@media (width > 50rem) {

  }

<script>
(() => {
  "use strict";

  const gallery = document.getElementById("real-gallery");
  const canvas = gallery?.querySelector("canvas");
  const tabs = [...document.querySelectorAll(".variant-tab")];
  const overlayTitle = document.getElementById("gallery-overlay-title");
  const stage = document.querySelector(".moves-awful-stage");
  const stageScale = document.querySelector(".moves-awful-stage__scale");
  const mobileStageQuery = matchMedia("(max-width: 50rem)");
  const TAB_AUTOPLAY_MS = 5000;
  let tabAutoplayTimer = null;

  if (!(gallery instanceof HTMLElement) || !(canvas instanceof HTMLCanvasElement)) {
    return;
  }

  const ctx = canvas.getContext("2d");
  if (!ctx) return;

  const aspectRatios = {
    arc: "1280 / 860",
    spiral: "1",
    horizontal: "1280 / 670",
    diagonal: "1280 / 700",
    "showcase-diagonal": "1280 / 700",
    masonry: "1280 / 660",
  };

  const titles = {
    arc: "Arc",
    spiral: "Spiral",
    horizontal: "Horizontal",
    diagonal: "Diagonal",
    "showcase-diagonal": "Showcase",
    masonry: "Masonry",
  };

  const settings = {
    arc: {
      slots: 10,
      speed: 0.00005,
      radiusScale: 0.7,
      cardBaseScale: 0.17,
      cardMinScale: 0.25,
      cardMaxBonus: 1.3,
      cardFocusPower: 1.5,
      cardRadiusScale: 0.1,
    },
    spiral: {
      speed: 0.00004,
      turns: 1.5,
      cardScale: 0.25,
      cardGrowthScale: 1.5,
      radiusScale: 0.4,
      alphaScale: 2,
      cardRadiusScale: 0.1,
      direction: -1,
    },
    horizontal: {
      rows: 4,
      gap: 8,
      speed: 0.04,
      angle: 0,
      radius: 8,
      minRatio: 0.55,
      maxRatio: 2.4,
      overscan: 0,
    },
    diagonal: {
      rows: 6,
      gap: 8,
      speed: 0.035,
      angle: -15,
      radius: 8,
      minRatio: 0.55,
      maxRatio: 2.4,
      overscan: 120,
    },
    "showcase-diagonal": {
      rows: 5,
      gap: 8,
      speed: 0.026,
      angle: 18,
      radius: 8,
      minRatio: 0.55,
      maxRatio: 2.4,
      overscan: 160,
    },
    masonry: {
      columnCount: "auto",
      preferredColumnWidth: 165,
      minColumnWidth: 96,
      maxColumnWidth: 260,
      maxColumnCount: 9,
      gap: 8,
      radius: 8,
      speed: 0.032,
      direction: "up",
      minTileHeight: 72,
      maxTileHeight: 560,
      minLandscapeScale: 0.54,
      maxLandscapeScale: 0.82,
      minPortraitScale: 1.1,
      maxPortraitScale: 2.2,
      squareScale: 1,
    },
  };

  const state = {
    variant: "arc",
    elapsed: 0,
    lastTime: performance.now(),
    images: [],
    raf: 0,
    disposed: false,
    masonryLanes: null,
    layoutKey: "",
  };

  const clamp = (value, min, max) =>
    Math.min(max, Math.max(min, value));

  const mod = (value, divisor) =>
    ((value % divisor) + divisor) % divisor;

  function readItems() {
    const payload = gallery.querySelector(
      ":scope > script[type='application/json'][data-gallery-items]",
    );

    try {
      return JSON.parse(payload?.textContent || "[]")
        .filter((item) => item?.src);
    } catch {
      return [];
    }
  }

  function loadImage(item, index) {
    return new Promise((resolve) => {
      const image = new Image();
      image.decoding = "async";
      image.onload = () =>
        resolve({ ...item, sourceIndex: index, image });
      image.onerror = () => resolve(null);
      image.src = item.src;
    });
  }

  async function loadItems() {
    gallery.dataset.galleryState = "loading";

    const loaded = (
      await Promise.all(readItems().map(loadImage))
    ).filter(Boolean);

    if (!loaded.length) {
      throw new Error("Canvas media failed to load.");
    }

    state.images = loaded;
    gallery.dataset.galleryState = "ready";
  }

  function roundedRect(x, y, width, height, radius) {
    const r = Math.min(
      Math.max(0, radius),
      width * 0.5,
      height * 0.5,
    );

    ctx.beginPath();

    if (ctx.roundRect) {
      ctx.roundRect(x, y, width, height, r);
      return;
    }

    ctx.moveTo(x + r, y);
    ctx.lineTo(x + width - r, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + r);
    ctx.lineTo(x + width, y + height - r);
    ctx.quadraticCurveTo(
      x + width,
      y + height,
      x + width - r,
      y + height,
    );
    ctx.lineTo(x + r, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawCover(image, x, y, width, height, radius = 0) {
    if (
      !image?.naturalWidth ||
      !image?.naturalHeight ||
      width <= 0 ||
      height <= 0
    ) {
      return;
    }

    const sourceRatio = image.naturalWidth / image.naturalHeight;
    const targetRatio = width / height;
    let sw = image.naturalWidth;
    let sh = image.naturalHeight;
    let sx = 0;
    let sy = 0;

    if (sourceRatio > targetRatio) {
      sw = sh * targetRatio;
      sx = (image.naturalWidth - sw) * 0.5;
    } else {
      sh = sw / targetRatio;
      sy = (image.naturalHeight - sh) * 0.5;
    }

    ctx.save();
    roundedRect(x, y, width, height, radius);
    ctx.clip();
    ctx.drawImage(image, sx, sy, sw, sh, x, y, width, height);
    ctx.restore();
  }


  function syncStageScale() {
    if (
      !(stage instanceof HTMLElement) ||
      !(stageScale instanceof HTMLElement)
    ) {
      return;
    }

    if (!mobileStageQuery.matches) {
      stage.style.removeProperty("--moves-awful-stage-scale");
      return;
    }

    const width = stage.clientWidth;
    if (width <= 0) return;

    stage.style.setProperty(
      "--moves-awful-stage-scale",
      String(width / 1280),
    );
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    const pixelWidth = Math.max(1, Math.round(rect.width * dpr));
    const pixelHeight = Math.max(1, Math.round(rect.height * dpr));

    if (
      canvas.width !== pixelWidth ||
      canvas.height !== pixelHeight
    ) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
      state.layoutKey = "";
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    return {
      width: Math.max(1, rect.width),
      height: Math.max(1, rect.height),
    };
  }

  function motionTime(now) {
    const dt = Math.min(64, Math.max(0, now - state.lastTime));
    state.lastTime = now;
    state.elapsed += dt * 0.65;
    return state.elapsed;
  }

  function renderArc(t, width, height) {
    const o = settings.arc;
    const slots = Math.max(1, Math.round(o.slots));
    const minSide = Math.min(width, height);
    const centerX = width * 0.5;
    const centerY = height;
    const phase = t * o.speed;
    const arcRadius = minSide * o.radiusScale;
    const cardBaseSize = minSide * o.cardBaseScale;

    for (let index = 0; index < slots; index += 1) {
      const raw = index / slots + phase;
      const normalized = mod(raw, 1);
      const angle = normalized * Math.PI * 2;
      const item =
        state.images[
          mod(index + Math.floor(raw), state.images.length)
        ];
      const x = centerX + Math.cos(angle) * arcRadius;
      const y = centerY + Math.sin(angle) * arcRadius;
      const topZone = Math.max(
        0,
        Math.cos(angle - Math.PI * 1.5),
      );
      const focus = Math.pow(topZone, o.cardFocusPower);
      const size =
        cardBaseSize *
        (o.cardMinScale + focus * o.cardMaxBonus);
      const edge = centerX
        ? Math.abs(x - centerX) / centerX
        : 0;
      const alpha = clamp(1 - (edge - 0.68) * 6, 0, 1);
      const rotation = angle + Math.PI / 2;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.rotate(rotation);
      drawCover(
        item.image,
        -size * 0.5,
        -size * 0.5,
        size,
        size,
        size * o.cardRadiusScale,
      );
      ctx.restore();
    }

    ctx.globalAlpha = 1;
  }

  function renderSpiral(t, width, height) {
    const o = settings.spiral;
    const centerX = width * 0.5;
    const centerY = height * 0.5;
    const minSide = Math.min(width, height);
    const maxSide = Math.max(width, height);
    const phase = t * o.speed;

    state.images.forEach((item, index) => {
      const p = mod(index / state.images.length + phase, 1);
      const angle =
        o.direction * p * Math.PI * 2 * o.turns +
        Math.PI / 2;
      const size = Math.max(
        1,
        minSide * o.cardScale * p * o.cardGrowthScale,
      );
      const radius =
        size + p * maxSide * o.radiusScale;
      const x = centerX + Math.cos(angle) * radius;
      const y = centerY + Math.sin(angle) * radius;

      ctx.save();
      ctx.globalAlpha = Math.min(1, p * o.alphaScale);
      ctx.translate(x, y);
      ctx.rotate(angle + Math.PI / 2);
      drawCover(
        item.image,
        -size * 0.5,
        -size * 0.5,
        size,
        size,
        size * o.cardRadiusScale,
      );
      ctx.restore();
    });

    ctx.globalAlpha = 1;
  }

  function planeSize(width, height, angle, overscan) {
    if (!angle) return { width, height };

    return {
      width:
        Math.abs(width * Math.cos(angle)) +
        Math.abs(height * Math.sin(angle)) +
        overscan * 2,
      height:
        Math.abs(height * Math.cos(angle)) +
        Math.abs(width * Math.sin(angle)) +
        overscan * 2,
    };
  }

  function renderRows(variant, t, width, height) {
    const o = settings[variant];
    const rows = Math.max(1, Math.round(o.rows));
    const angle = o.angle * Math.PI / 180;
    const plane = planeSize(
      width,
      height,
      angle,
      o.overscan,
    );
    const rowHeight = Math.max(
      1,
      (plane.height - o.gap * (rows - 1)) / rows,
    );
    const cursorMult =
      variant === "horizontal"
        ? 5
        : variant === "diagonal"
          ? 7
          : 9;
    const offsetMult =
      variant === "horizontal"
        ? 137
        : variant === "diagonal"
          ? 173
          : 191;

    ctx.save();

    if (angle) {
      ctx.translate(width * 0.5, height * 0.5);
      ctx.rotate(angle);
      ctx.translate(
        -plane.width * 0.5,
        -plane.height * 0.5,
      );
    }

    for (let rowIndex = 0; rowIndex < rows; rowIndex += 1) {
      const tiles = [];
      let length = 0;
      let cursor = rowIndex * cursorMult;
      const required = plane.width * 1.35;

      while (
        length < required ||
        tiles.length < state.images.length
      ) {
        const item =
          state.images[cursor % state.images.length];
        const ratio = clamp(
          item.image.naturalWidth / item.image.naturalHeight,
          o.minRatio,
          o.maxRatio,
        );
        const tileWidth = rowHeight * ratio;
        tiles.push({ item, width: tileWidth });
        length += tileWidth + o.gap;
        cursor += 1;
      }

      const cycle = Math.max(1, length);
      const speed =
        o.speed * (0.82 + (rowIndex % 4) * 0.11);
      const direction = rowIndex % 2 ? 1 : -1;
      const offset =
        rowIndex * offsetMult + t * speed;
      const normalized = mod(offset, cycle);
      let start =
        direction < 0
          ? -normalized
          : normalized - cycle;

      while (start > -cycle) start -= cycle;

      for (
        let cycleStart = start;
        cycleStart < plane.width + cycle;
        cycleStart += cycle
      ) {
        let x = cycleStart;

        for (const tile of tiles) {
          if (
            x < plane.width &&
            x + tile.width > 0
          ) {
            const y = rowIndex * (rowHeight + o.gap);

            drawCover(
              tile.item.image,
              x,
              y,
              tile.width,
              rowHeight,
              o.radius,
            );
          }

          x += tile.width + o.gap;
        }
      }
    }

    ctx.restore();
  }

  function buildMasonry(width, height) {
    const o = settings.masonry;
    const gap = o.gap;
    let count;

    if (
      o.columnCount &&
      o.columnCount !== "auto"
    ) {
      count = clamp(
        Math.floor(Number(o.columnCount) || 1),
        1,
        Math.min(o.maxColumnCount, state.images.length),
      );
    } else {
      const preferred = clamp(
        o.preferredColumnWidth,
        o.minColumnWidth,
        o.maxColumnWidth,
      );

      count = clamp(
        Math.floor(
          (width + gap) / (preferred + gap),
        ) || 1,
        1,
        Math.min(o.maxColumnCount, state.images.length),
      );
    }

    const weights = [
      0.82,
      1.02,
      0.9,
      1.22,
      0.84,
      1.08,
      0.94,
      1.16,
      0.88,
    ].slice(0, count);
    const sum = weights.reduce((a, b) => a + b, 0);
    const available =
      Math.max(1, width - gap * (count - 1));
    let x = 0;

    const lanes = weights.map((weight, index) => {
      const laneWidth =
        available * (weight / sum);
      const lane = {
        index,
        x,
        width: laneWidth,
        tiles: [],
        speed:
          o.speed * (0.86 + (index % 5) * 0.08),
      };

      x += laneWidth + gap;
      return lane;
    });

    const heights = lanes.map(() => 0);

    function tileHeight(item, laneWidth) {
      const ratio =
        item.image.naturalWidth / item.image.naturalHeight;
      let scale = o.squareScale;

      if (ratio > 1.08) {
        scale = clamp(
          1 / ratio,
          o.minLandscapeScale,
          o.maxLandscapeScale,
        );
      } else if (ratio < 0.92) {
        scale = clamp(
          1 / ratio,
          o.minPortraitScale,
          o.maxPortraitScale,
        );
      }

      return clamp(
        laneWidth * scale,
        o.minTileHeight,
        o.maxTileHeight,
      );
    }

    state.images.forEach((item) => {
      let laneIndex = 0;

      for (let index = 1; index < lanes.length; index += 1) {
        if (heights[index] < heights[laneIndex]) {
          laneIndex = index;
        }
      }

      const lane = lanes[laneIndex];
      const height = tileHeight(item, lane.width);

      lane.tiles.push({
        item,
        height,
        y: heights[laneIndex],
      });

      heights[laneIndex] += height + gap;
    });

    lanes.forEach((lane) => {
      let cursor = lane.index * 11 + lane.tiles.length;

      while (
        (lane.tiles.at(-1)?.y || 0) +
          (lane.tiles.at(-1)?.height || 0) <
        height * 2.4
      ) {
        const item =
          state.images[cursor % state.images.length];
        const tileHeightValue =
          tileHeight(item, lane.width);
        const last = lane.tiles.at(-1);

        lane.tiles.push({
          item,
          height: tileHeightValue,
          y: last
            ? last.y + last.height + gap
            : 0,
        });

        cursor += 1;
      }

      const last = lane.tiles.at(-1);

      lane.cycle = Math.max(
        height,
        (last?.y || 0) +
          (last?.height || 0) +
          gap,
      );
    });

    return lanes;
  }

  function renderMasonry(t, width, height) {
    const o = settings.masonry;
    const key = [
      Math.round(width),
      Math.round(height),
      state.images.length,
    ].join(":");

    if (state.layoutKey !== key) {
      state.masonryLanes = buildMasonry(width, height);
      state.layoutKey = key;
    }

    const direction =
      o.direction === "down" ? -1 : 1;

    for (const lane of state.masonryLanes) {
      const move = mod(
        t * lane.speed * direction,
        lane.cycle,
      );

      for (const tile of lane.tiles) {
        let y = tile.y - move;

        while (y + tile.height < 0) {
          y += lane.cycle;
        }

        while (y > height) {
          y -= lane.cycle;
        }

        if (
          y < height &&
          y + tile.height > 0
        ) {
          drawCover(
            tile.item.image,
            lane.x,
            y,
            lane.width,
            tile.height,
            o.radius,
          );
        }
      }
    }
  }

  function render(now) {
    if (state.disposed) return;

    const { width, height } = resize();
    ctx.clearRect(0, 0, width, height);

    const t = motionTime(now);

    if (state.images.length) {
      if (state.variant === "arc") {
        renderArc(t, width, height);
      } else if (state.variant === "spiral") {
        renderSpiral(t, width, height);
      } else if (state.variant === "masonry") {
        renderMasonry(t, width, height);
      } else {
        renderRows(state.variant, t, width, height);
      }
    }

    state.raf = requestAnimationFrame(render);
  }

  function setVariant(variant, index) {
    state.variant = variant;
    state.layoutKey = "";
    gallery.dataset.galleryVariant = variant;
    gallery.style.setProperty(
      "--animated-canvas-gallery-aspect-ratio",
      aspectRatios[variant] || "16 / 9",
    );

    tabs.forEach((tab, tabIndex) => {
      const active = tabIndex === index;
      tab.setAttribute(
        "aria-selected",
        String(active),
      );
      tab.tabIndex = active ? 0 : -1;
    });

    if (overlayTitle) {
      overlayTitle.textContent =
        titles[variant] || variant;
    }
  }

  function clearTabAutoplay() {
    if (tabAutoplayTimer !== null) {
      clearTimeout(tabAutoplayTimer);
      tabAutoplayTimer = null;
    }
  }

  function scheduleTabAutoplay() {
    clearTabAutoplay();
    if (document.hidden || !tabs.length) return;

    tabAutoplayTimer = setTimeout(() => {
      const currentIndex = tabs.findIndex(
        (tab) => tab.getAttribute("aria-selected") === "true",
      );
      const next = (Math.max(0, currentIndex) + 1) % tabs.length;
      setVariant(tabs[next].dataset.variant, next);
      scheduleTabAutoplay();
    }, TAB_AUTOPLAY_MS);
  }

  function handleVisibilityChange() {
    if (document.hidden) {
      clearTabAutoplay();
      return;
    }
    scheduleTabAutoplay();
  }

  document.addEventListener("visibilitychange", handleVisibilityChange);

  tabs.forEach((tab, index) => {
    tab.addEventListener(
      "click",
      () => {
        setVariant(tab.dataset.variant, index);
        scheduleTabAutoplay();
      },
    );

    tab.addEventListener("keydown", (event) => {
      if (
        event.key !== "ArrowLeft" &&
        event.key !== "ArrowRight"
      ) {
        return;
      }

      event.preventDefault();

      const step =
        event.key === "ArrowRight" ? 1 : -1;
      const next =
        (index + step + tabs.length) %
        tabs.length;

      setVariant(
        tabs[next].dataset.variant,
        next,
      );
      tabs[next].focus();
      scheduleTabAutoplay();
    });
  });

  const observer = new ResizeObserver(() => {
    state.layoutKey = "";
    syncStageScale();
  });

  observer.observe(canvas);
  if (stage instanceof HTMLElement) observer.observe(stage);
  mobileStageQuery.addEventListener?.("change", syncStageScale);
  syncStageScale();
  setVariant("arc", 0);
  scheduleTabAutoplay();

  loadItems()
    .then(() => {
      state.lastTime = performance.now();
      state.raf = requestAnimationFrame(render);
    })
    .catch((error) => {
      console.error(error);
      gallery.dataset.galleryState = "error";
    });

  window.addEventListener(
    "beforeunload",
    () => {
      state.disposed = true;
      cancelAnimationFrame(state.raf);
      clearTabAutoplay();
      document.removeEventListener("visibilitychange", handleVisibilityChange);
      observer.disconnect();
      mobileStageQuery.removeEventListener?.("change", syncStageScale);
    },
    { once: true },
  );
})();

(() => {
  const DEFAULT_SPEED = 72;
  const REDUCED_MOTION_QUERY =
    "(prefers-reduced-motion: reduce)";

  function createClone(source) {
    const clone = source.cloneNode(true);
    clone.dataset.mediaMarqueeClone = "";
    clone.inert = true;

    for (const element of [clone, ...clone.querySelectorAll("*")]) {
      element.removeAttribute("id");
      element.removeAttribute("data-media-id");
      element.removeAttribute("data-media-item");
      element.removeAttribute("data-media-caption-for");
      element.removeAttribute("data-ref");
    }

    clone.querySelectorAll("img").forEach((image) => {
      image.alt = "";
    });

    clone.querySelectorAll("video").forEach((video) => {
      video.muted = true;
      video.setAttribute("muted", "");
      video.setAttribute("playsinline", "");
    });

    return clone;
  }

  function readGap(element) {
    const styles = getComputedStyle(element);
    const value = Number.parseFloat(
      styles.columnGap || styles.gap,
    );
    return Number.isFinite(value) ? value : 0;
  }

  function readSpeed(element) {
    const value = Number.parseFloat(
      element.dataset.mediaMarqueeSpeed,
    );

    return Number.isFinite(value) && value > 0
      ? value
      : DEFAULT_SPEED;
  }

  function mountMarquee(element) {
    const track = element.querySelector(
      ":scope > [data-media-marquee-track]",
    );
    const source = track?.querySelector(
      ":scope > [data-media-marquee-group]:not([data-media-marquee-clone])",
    );

    if (
      !(track instanceof HTMLElement) ||
      !(source instanceof HTMLElement)
    ) {
      return;
    }

    const motion = matchMedia(
      REDUCED_MOTION_QUERY,
    );
    let frame = 0;
    let lastViewportWidth = -1;
    let lastSourceWidth = -1;

    function reset() {
      track
        .querySelectorAll("[data-media-marquee-clone]")
        .forEach((clone) => clone.remove());

      element.removeAttribute("data-animated");
      element.removeAttribute("data-measuring");
      element.style.removeProperty(
        "--media-marquee-distance",
      );
      element.style.removeProperty(
        "--media-marquee-duration",
      );
      element.scrollLeft = 0;
    }

    function refresh() {
      frame = 0;

      if (motion.matches) {
        reset();
        return;
      }

      const viewportWidth =
        element.getBoundingClientRect().width;
      const sourceWidth =
        source.getBoundingClientRect().width;

      if (
        viewportWidth <= 0 ||
        sourceWidth <= 0
      ) {
        return;
      }

      const unchanged =
        element.dataset.animated === "true" &&
        Math.abs(
          viewportWidth - lastViewportWidth,
        ) < 0.5 &&
        Math.abs(
          sourceWidth - lastSourceWidth,
        ) < 0.5;

      if (unchanged) return;

      lastViewportWidth = viewportWidth;
      lastSourceWidth = sourceWidth;

      reset();
      element.dataset.measuring = "true";

      const distance =
        sourceWidth + readGap(track);
      const groupCount = Math.max(
        2,
        Math.ceil(
          (viewportWidth + distance) / distance,
        ),
      );
      const fragment =
        document.createDocumentFragment();

      for (
        let index = 1;
        index < groupCount;
        index += 1
      ) {
        fragment.append(createClone(source));
      }

      track.append(fragment);
      element.removeAttribute("data-measuring");
      element.style.setProperty(
        "--media-marquee-distance",
        `${distance}px`,
      );
      element.style.setProperty(
        "--media-marquee-duration",
        `${distance / readSpeed(element)}s`,
      );
      element.dataset.animated = "true";
    }

    function scheduleRefresh() {
      if (!frame) {
        frame = requestAnimationFrame(refresh);
      }
    }

    const observer = new ResizeObserver(
      scheduleRefresh,
    );

    observer.observe(element);
    observer.observe(source);
    motion.addEventListener(
      "change",
      scheduleRefresh,
    );

    scheduleRefresh();
  }

  document
    .querySelectorAll("[data-media-marquee]")
    .forEach(mountMarquee);
})();
</script><script>const SOURCE_SELECTOR = "[data-media-lightbox-source]";
const INSTANCE = Symbol.for("looksawful.mediaLightbox.instance");

const noop = () => {};

function videoFromSource(source) {
  return source?.querySelector?.("video") ?? null;
}

function sourceAtPoint(scope, x, y) {
  const candidates = [
    ...scope.querySelectorAll(SOURCE_SELECTOR),
  ];

  for (let index = candidates.length - 1; index >= 0; index -= 1) {
    const candidate = candidates[index];
    const rect = candidate.getBoundingClientRect();

    if (
      x >= rect.left &&
      x <= rect.right &&
      y >= rect.top &&
      y <= rect.bottom
    ) {
      return candidate;
    }
  }

  return null;
}

function resolvePointerSource(root, event) {
  const direct =
    event.target instanceof Element
      ? event.target.closest(SOURCE_SELECTOR)
      : null;

  if (direct instanceof HTMLElement) return direct;

  const marquee =
    event.target instanceof Element
      ? event.target.closest("[data-media-marquee]")
      : null;

  if (!(marquee instanceof HTMLElement)) return null;

  return sourceAtPoint(
    marquee,
    event.clientX,
    event.clientY,
  );
}

function createShell() {
  const shell = document.createElement("div");
  shell.className = "media-lightbox";
  shell.setAttribute("role", "dialog");
  shell.setAttribute("aria-modal", "true");
  shell.setAttribute("aria-label", "Просмотр видео");

  shell.innerHTML = `
    <button
      class="media-lightbox__close"
      type="button"
      aria-label="Закрыть"
    >×</button>
    <figure class="media-lightbox__figure">
      <video
        class="media-lightbox__video"
        controls
        playsinline
        preload="metadata"
      ></video>
    </figure>
  `;

  return shell;
}

function createMediaLightbox({
  root = document,
} = {}) {
  if (
    !root ||
    typeof root.addEventListener !== "function"
  ) {
    return noop;
  }

  if (root[INSTANCE]) {
    return root[INSTANCE].destroy;
  }

  let shell = null;
  let video = null;
  let lastFocused = null;

  function close() {
    if (!shell) return;

    video?.pause();
    shell.remove();

    shell = null;
    video = null;

    document.removeEventListener(
      "keydown",
      handleDocumentKeydown,
    );

    lastFocused?.focus?.();
    lastFocused = null;

    if (root instanceof HTMLElement) {
      root.removeAttribute(
        "data-media-lightbox-open",
      );
    }
  }

  function handleDocumentKeydown(event) {
    if (event.key === "Escape") close();
  }

  function open(source) {
    const sourceVideo = videoFromSource(source);

    if (!(sourceVideo instanceof HTMLVideoElement)) {
      return;
    }

    close();

    lastFocused =
      document.activeElement instanceof HTMLElement
        ? document.activeElement
        : null;

    shell = createShell();
    video = shell.querySelector(
      ".media-lightbox__video",
    );

    if (!(video instanceof HTMLVideoElement)) {
      shell = null;
      video = null;
      return;
    }

    video.src =
      sourceVideo.currentSrc || sourceVideo.src;

    const poster =
      sourceVideo.getAttribute("poster");

    if (poster) {
      video.poster = poster;
    }

    shell.addEventListener(
      "pointerdown",
      (event) => {
        const target = event.target;

        if (
          target === shell ||
          (
            target instanceof Element &&
            target.closest(
              ".media-lightbox__close",
            )
          )
        ) {
          close();
        }
      },
    );

    document.body.append(shell);

    document.addEventListener(
      "keydown",
      handleDocumentKeydown,
    );

    if (root instanceof HTMLElement) {
      root.setAttribute(
        "data-media-lightbox-open",
        "",
      );
    }

    shell
      .querySelector(".media-lightbox__close")
      ?.focus();

    const play = video.play();

    play?.catch?.(() => {

      // with sound is blocked by browser policy.

    if (
      event.button !== undefined &&
      event.button !== 0
    ) {
      return;
    }

    if (
      event.target instanceof Element &&
      event.target.closest(
        "a, button:not(.media-lightbox__close)",
      )

      return;

    const source =
      resolvePointerSource(root, event);

    if (!(source instanceof HTMLElement)) {
      return;

    event.preventDefault();
    open(source);
  }

  function handleKeydown(event) {
    if (
      event.key !== "Enter" &&
      event.key !== " "

      return;
    }

    const source =
      event.target instanceof Element
        ? event.target.closest(SOURCE_SELECTOR)
        : null;

    if (!(source instanceof HTMLElement)) {
      return;
    }

    event.preventDefault();
    open(source);

  root.addEventListener(
    "keydown",
    handleKeydown,
  );

  const destroy = () => {
    close();

    root.removeEventListener(
      "click",
      handleClick,
    );
    root.removeEventListener(
      "keydown",
      handleKeydown,
    );

    if (root[INSTANCE]?.destroy === destroy) {
      delete root[INSTANCE];
    }
  };

  root[INSTANCE] = { destroy };

  return destroy;
}


const standaloneMovesScene =
  document.querySelector(
    ".cv-item--moves-awful",
  );

const destroyStandaloneMediaLightbox =
  createMediaLightbox({
    root:
      standaloneMovesScene instanceof HTMLElement
        ? standaloneMovesScene
        : document,
  });

window.addEventListener(
  "beforeunload",
  destroyStandaloneMediaLightbox,
  { once: true },
);
</script></body>
