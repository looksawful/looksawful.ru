<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Хиро-секция Ивана Крушинского" />
    <title>иван крушинский</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>

  <body>
    <main>
      <section class="hero" id="hero" data-hero>
        <canvas
          class="hero__fluid"
          data-hero-fluid
          aria-hidden="true"
        ></canvas>
        <div class="hero__screen">
          <div class="hero__headline">
            <div class="hero__visual" aria-hidden="true">
              <canvas
                class="hero__canvas"
                id="awfulhead"
                data-awfulhead
                width="400"
                height="400"
              ></canvas>
            </div>

            <h1
              class="hero__title"
              id="hero-title"
              data-hero-title
              aria-label="иван крушинский артдиректор цифровых продуктов"
            >
              <span class="hero__title-name" data-hero-title-line="name">
                иван крушинский
              </span>

              <span class="hero__title-role" data-hero-title-line="role">
                артдиректор цифровых продуктов
              </span>
            </h1>
          </div>

          <p class="hero__note">
            Проектирую выразительные визуальные системы и интерфейсы. Разрабатываю айдентику и язык бренда, руковожу дизайнерами и помогаю им расти.
          </p>

          <address class="hero__contacts" id="contact-links">
            <a href="https://t.me/looksawful">tg: @looksawful</a>
            <a href="mailto:i@lookawful.ru">email: i@lookawful.ru</a>
            <!-- ЭТО НЕ ОПЕЧАТКА, БУКВЫ S НЕТ -->
            <a href="https://github.com/looksawful">github: @looksawful</a>
          </address>
        </div>
      </section>
    </main>
  </body>
</html>
